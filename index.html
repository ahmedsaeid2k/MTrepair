<style>
:root{
  --ink:#33383d;
  --slate:#585f66;
  --paper:#f2f4f1;
  --paper2:#ffffff;
  --line:#d7dbd3;
  --copper:#5b9c3c;
  --copper-dark:#457a2c;
  --blue:#2f6690;
  --amber:#c98a1a;
  --red:#a8352f;
  --green:#5b9c3c;
  --grey:#7a8088;
  --radius:10px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Tajawal',sans-serif;background:var(--paper);color:var(--ink);}
.mono{font-family:'IBM Plex Mono',monospace;letter-spacing:0.02em;}
#app{display:flex;min-height:100vh;}

/* Sidebar */
.sidebar{width:220px;background:var(--ink);color:#e9e4d8;flex-shrink:0;display:flex;flex-direction:column;padding:20px 0;}
.brand{padding:0 20px 20px;border-bottom:1px solid #33404f;margin-bottom:12px;}
.brand h1{font-size:17px;margin:0;font-weight:900;}
.brand span{font-size:11px;color:var(--copper);display:block;margin-top:4px;font-weight:500;}
.nav-item{padding:12px 20px;cursor:pointer;font-size:14px;font-weight:500;color:#c7c0af;border-right:3px solid transparent;transition:.15s;}
.nav-item:hover{background:#28323f;color:#fff;}
.nav-item.active{background:#28323f;color:#fff;border-right-color:var(--copper);}
.sidebar-foot{margin-top:auto;padding:14px 20px;font-size:11px;color:#7a8393;border-top:1px solid #33404f;}
.role-tag{display:inline-block;background:var(--copper);color:#fff;font-size:10px;padding:2px 8px;border-radius:20px;margin-top:6px;}

/* Main */
main{flex:1;padding:26px 30px;max-width:1180px;}
h2.page-title{font-size:22px;margin:0 0 4px;font-weight:900;}
.subtitle{color:var(--grey);font-size:13px;margin-bottom:22px;}

/* Cards / dashboard */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:26px;}
.stat-card{background:var(--paper2);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
.stat-card .num{font-size:26px;font-weight:900;font-family:'IBM Plex Mono',monospace;}
.stat-card .lbl{font-size:12px;color:var(--grey);margin-top:2px;}
.stat-card.copper{border-top:3px solid var(--copper);}
.stat-card.blue{border-top:3px solid var(--blue);}
.stat-card.green{border-top:3px solid var(--green);}
.stat-card.red{border-top:3px solid var(--red);}

/* Form */
.stepper{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap;}
.step-dot{flex:1;min-width:90px;text-align:center;padding:9px 6px;background:#eee7d6;border-radius:6px;font-size:12px;font-weight:700;color:var(--grey);cursor:pointer;}
.step-dot.active{background:var(--copper);color:#fff;}
.step-dot.done{background:#e0d3b8;color:var(--ink);}

.card{background:var(--paper2);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px;}
.card h3{margin:0 0 14px;font-size:15px;font-weight:700;color:var(--copper-dark);border-bottom:1px solid var(--line);padding-bottom:8px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
@media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr;} main{padding:16px;} .sidebar{width:100%;position:sticky;top:0;z-index:5;flex-direction:row;overflow-x:auto;padding:0;} .sidebar .brand{display:none;} .nav-item{white-space:nowrap;border-right:none;border-bottom:3px solid transparent;} .nav-item.active{border-bottom-color:var(--copper);} #app{flex-direction:column;} .sidebar-foot{display:none;}}

label{display:block;font-size:12px;font-weight:700;color:var(--slate);margin-bottom:5px;}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font-family:inherit;font-size:13.5px;background:#fdfcf8;color:var(--ink);}
input:focus,select:focus,textarea:focus{outline:2px solid var(--copper);outline-offset:0;border-color:var(--copper);}
.field{margin-bottom:12px;}
textarea{min-height:70px;resize:vertical;}

.chip-group{display:flex;flex-wrap:wrap;gap:8px;}
.chip{padding:8px 14px;border:1px solid var(--line);border-radius:20px;font-size:12.5px;cursor:pointer;background:#fdfcf8;font-weight:500;user-select:none;}
.chip.sel{background:var(--copper);color:#fff;border-color:var(--copper);}

.btn{display:inline-block;padding:10px 20px;border-radius:8px;border:none;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer;}
.btn-primary{background:var(--copper);color:#fff;}
.btn-primary:hover{background:var(--copper-dark);}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
.btn-ghost:hover{background:#eee7d6;}
.btn-green{background:var(--green);color:#fff;}
.btn-blue{background:var(--blue);color:#fff;}
.btn-whatsapp{background:#25D366;color:#fff;display:inline-flex;align-items:center;gap:6px;}
.btn-whatsapp:hover{background:#1ebe57;}
.wa-icon{width:14px;height:14px;flex-shrink:0;}
.btn-red{background:var(--red);color:#fff;}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:6px;}
.actions-row{display:flex;gap:10px;justify-content:space-between;margin-top:8px;}

/* Archive */
.filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.filters input,.filters select{width:auto;min-width:160px;}
table{width:100%;border-collapse:collapse;background:var(--paper2);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);}
th,td{padding:10px 12px;text-align:right;font-size:13px;border-bottom:1px solid var(--line);}
th{background:#eee7d6;font-weight:700;color:var(--slate);font-size:11.5px;}
tr:last-child td{border-bottom:none;}
.status-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;color:#fff;display:inline-block;}
.st-check{background:var(--blue);}
.st-repair{background:var(--amber);}
.st-failed{background:var(--red);}
.st-rejected{background:#8a8a8a;}
.st-done{background:var(--green);}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;}

/* Receipt preview A5 */
.receipt-wrap{display:flex;justify-content:center;background:#e5ded0;padding:22px;border-radius:var(--radius);}
#receiptPaper{width:559px;min-height:396px;background:#fff;padding:14px 18px;font-size:10.5px;color:#111;position:relative;box-shadow:0 2px 10px rgba(0,0,0,.15);font-family:'Tajawal',sans-serif;box-sizing:border-box;}
#receiptPaper .r-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #33383d;padding-bottom:6px;margin-bottom:6px;}
#receiptPaper h4{margin:0;font-size:16px;font-weight:900;}
#receiptPaper .r-sub{font-size:9.5px;color:#666;margin-top:2px;}
#receiptPaper .r-badge{font-size:14px;font-weight:900;background:#5b9c3c;color:#fff;padding:4px 14px;border-radius:5px;display:inline-block;}
#receiptPaper .r-meta{font-size:9.5px;color:#555;text-align:left;margin-top:3px;}
#receiptPaper .section-title{font-size:9.5px;font-weight:700;color:#457a2c;margin:6px 0 2px;text-transform:uppercase;letter-spacing:.03em;}
#receiptPaper table{width:100%;border-collapse:collapse;font-size:10px;margin-bottom:2px;}
#receiptPaper td{padding:2px 6px;vertical-align:top;}
#receiptPaper td.k{color:#666;width:20%;font-weight:700;}
#receiptPaper .fin-box{display:flex;gap:0;border:1px solid #ccc;border-radius:6px;overflow:hidden;margin-top:4px;}
#receiptPaper .fin-cell{flex:1;padding:4px 6px;border-left:1px solid #ccc;text-align:center;}
#receiptPaper .fin-cell:last-child{border-left:none;}
#receiptPaper .fin-cell .l{font-size:8px;color:#777;}
#receiptPaper .fin-cell .v{font-size:12px;font-weight:900;}
#receiptPaper .fin-cell.hi .v{color:#a8352f;}
#receiptPaper .terms{font-size:6.8px;color:#555;margin-top:5px;border-top:1px dashed #999;padding-top:3px;line-height:1.35;}
#receiptPaper .sign-row{display:flex;justify-content:space-between;margin-top:10px;font-size:9px;}
#receiptPaper .sign-row div{width:45%;border-top:1px solid #999;padding-top:3px;text-align:center;color:#666;}

@media print{
  html, body{margin:0;padding:0;}
  #app{display:none !important;}
  #receiptPaper{position:static;width:210mm;height:148mm;box-shadow:none;padding:10mm 14mm;overflow:hidden;}
  @page{size:A5 landscape;margin:0;}
}

.empty{padding:40px;text-align:center;color:var(--grey);font-size:13px;}
.login-screen{max-width:360px;margin:80px auto;background:var(--paper2);padding:28px;border-radius:var(--radius);border:1px solid var(--line);}
.login-screen h2{margin-top:0;}
.hint{font-size:11px;color:var(--grey);margin-top:14px;line-height:1.6;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------------- Google Sheets API (Apps Script Web App) ---------------- */
const API_URL = 'https://script.google.com/macros/s/AKfycbzpi81aPJwwsvHCqUKCkUxEhT0l4NnLgcCBPab1xjvx0B3vhzamCVkwiohrOCfWkKcm/exec';

async function apiGet(action, params){
  const q = new URLSearchParams({action, ...(params||{})});
  const res = await fetch(`${API_URL}?${q.toString()}`);
  const json = await res.json();
  if(json && json.error) throw new Error(json.error);
  return json;
}
// text/plain avoids a CORS preflight (Apps Script has no doOptions handler)
async function apiPost(action, data){
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({action, ...data})
  });
  const json = await res.json();
  if(json && json.error) throw new Error(json.error);
  return json;
}

/* ---- Mapping between the app's internal shape and the flat sheet rows ---- */
function receiptToRow(d){
  return {
    ID: d.id, ReceiptNumber: d.receiptNumber, Date: d.date,
    CustomerName: d.customer.name, CustomerPhone: d.customer.phone, CustomerEmail: d.customer.email,
    Category: d.device.category, Brand: d.device.brand==='أخرى' ? d.device.brandOther : d.device.brand,
    Model: d.device.model, Accessories: d.device.accessories,
    Faults: (d.faults||[]).join('، '), FaultNotes: d.faultNotes,
    Technician: d.technician, Cost: d.cost, Deposit: d.deposit, Refunded: d.refunded || 0, PartsCost: d.partsCost || 0, PartsUsed: d.partsUsed || '',
    DeliveryDate: d.deliveryDate, Status: d.status, Paid: d.paid ? 'TRUE' : 'FALSE',
    Bonus: d.bonus || '', CreatedBy: d.createdBy, UpdatedBy: d.updatedBy, UpdatedAt: d.updatedAt
  };
}
function rowToReceipt(row){
  return {
    id: row.ID, receiptNumber: row.ReceiptNumber, date: row.Date,
    customer: {name: row.CustomerName, phone: String(row.CustomerPhone||''), email: row.CustomerEmail||''},
    device: {category: row.Category, brand: row.Brand, brandOther: '', model: row.Model, accessories: row.Accessories||''},
    faults: row.Faults ? String(row.Faults).split('، ').filter(Boolean) : [],
    faultNotes: row.FaultNotes||'', technician: row.Technician||'',
    cost: row.Cost, deposit: row.Deposit, refunded: Number(row.Refunded||0), partsCost: Number(row.PartsCost||0), partsUsed: row.PartsUsed||'', deliveryDate: row.DeliveryDate,
    status: row.Status||'قيد الفحص', paid: String(row.Paid)==='TRUE', bonus: row.Bonus,
    createdBy: row.CreatedBy||'', updatedBy: row.UpdatedBy||'', updatedAt: row.UpdatedAt||''
  };
}

async function loadSettings(){ try{ const s = await apiGet('getSettings'); return {shopName: s.shopName || 'صيانة ميكروتك', logoUrl: s.logoUrl || ''}; }catch(e){ console.error(e); return {shopName:'صيانة ميكروتك', logoUrl:''}; } }
async function saveSettingRemote(key, value){ return apiPost('saveSetting', {key, value}); }
async function loadPayments(receiptId){ try{ return await apiGet('getPayments', receiptId ? {receiptId} : {}); }catch(e){ console.error(e); return []; } }
async function savePaymentRemote(receiptId, amount, note){ return apiPost('savePayment', {receiptId, amount, note, date: new Date().toISOString().slice(0,10), user: state.user.name}); }

/* ---- Inventory ---- */
async function loadInventory(){ try{ return await apiGet('getInventory'); }catch(e){ console.error(e); return []; } }
async function saveInventoryItemRemote(item){ return apiPost('saveInventoryItem', {data:item}); }
async function deleteInventoryItemRemote(id){ return apiPost('deleteInventoryItem', {id, role: state.user.role}); }
async function adjustInventoryQtyRemote(id, delta){ return apiPost('adjustInventoryQty', {id, delta}); }
async function refreshInventory(){ state.inventory = await loadInventory(); }

/* ---- Sales (POS) ---- */
async function loadSales(){ try{ return await apiGet('getSales'); }catch(e){ console.error(e); return []; } }
async function saveSaleRemote(itemsSummary, itemsJson, total, customerName, customerPhone, paymentMethod, amountPaid){
  return apiPost('saveSale', {itemsSummary, itemsJson, total, customerName, customerPhone, paymentMethod, amountPaid, date: new Date().toISOString().slice(0,10), user: state.user.name});
}
async function settleSaleDebtRemote(saleId, amount){ return apiPost('settleSaleDebt', {saleId, amount}); }

/* ---- Returns ---- */
async function loadReturns(){ try{ return await apiGet('getReturns'); }catch(e){ console.error(e); return []; } }
async function saveReturnRemote(saleId, itemsSummary, refundAmount){
  return apiPost('saveReturn', {saleId, itemsSummary, refundAmount, date: new Date().toISOString().slice(0,10), user: state.user.name});
}

/* ---- Quotations ---- */
async function loadQuotations(){ try{ return await apiGet('getQuotations'); }catch(e){ console.error(e); return []; } }
async function saveQuotationRemote(q){ return apiPost('saveQuotation', {data:q}); }

/* ---- Services catalog ---- */
async function loadServices(){ try{ return await apiGet('getServices'); }catch(e){ console.error(e); return []; } }
async function saveServiceRemote(s){ return apiPost('saveService', {data:s}); }

/* ---- Purchases ---- */
async function loadPurchases(){ try{ return await apiGet('getPurchases'); }catch(e){ console.error(e); return []; } }
async function savePurchaseRemote(supplier, supplierId, itemsSummary, total, warrantyMonths, amountPaid){
  return apiPost('savePurchase', {supplier, supplierId, itemsSummary, total, warrantyMonths, amountPaid, date: new Date().toISOString().slice(0,10), user: state.user.name});
}
async function settlePurchaseDebtRemote(purchaseId, supplierId, amount, note){
  return apiPost('settlePurchaseDebt', {purchaseId, supplierId, amount, note, date: new Date().toISOString().slice(0,10), user: state.user.name});
}

/* ---- Suppliers ---- */
async function loadSuppliers(){ try{ return await apiGet('getSuppliers'); }catch(e){ console.error(e); return []; } }
async function saveSupplierRemote(s){ return apiPost('saveSupplier', {data:s}); }
async function loadSupplierPayments(){ try{ return await apiGet('getSupplierPayments'); }catch(e){ console.error(e); return []; } }

/* ---- Serial numbers (optional per-unit tracking for warranty) ---- */
async function loadSerials(itemId, status){ try{ const p={}; if(itemId) p.itemId=itemId; if(status) p.status=status; return await apiGet('getSerials', p); }catch(e){ console.error(e); return []; } }
async function saveSerialRemote(itemId, itemName, serial, purchaseId, supplierId, warrantyMonths){
  return apiPost('saveSerial', {itemId, itemName, serial, purchaseId, supplierId, warrantyMonths});
}
async function markSerialSoldRemote(serialId, soldRef){
  return apiPost('markSerialSold', {serialId, soldRef, soldDate: new Date().toISOString().slice(0,10)});
}

async function loadReceipts(){ try{ return (await apiGet('getReceipts')).map(rowToReceipt); }catch(e){ console.error(e); alert('تعذر تحميل الإيصالات من قاعدة البيانات: '+e.message); return []; } }
async function loadCustomers(){ try{ return (await apiGet('getCustomers')).map(r=>({name:r.Name, phone:String(r.Phone||''), email:r.Email||''})); }catch(e){ console.error(e); return []; } }
async function loadTechnicians(){ try{ const rows = await apiGet('getTechnicians'); const names = rows.map(r=>r.Name).filter(Boolean); return names.length ? names : ['أحمد فتحي','محمود سيد','كريم عادل']; }catch(e){ console.error(e); return ['أحمد فتحي','محمود سيد','كريم عادل']; } }

async function saveReceiptRemote(d){ return apiPost('saveReceipt', {data: receiptToRow(d)}); }
async function deleteReceiptRemote(id){ return apiPost('deleteReceipt', {id, role: state.user.role, user: state.user.name}); }
async function saveCustomerRemote(c){ return apiPost('saveCustomer', {data: {Name:c.name, Phone:c.phone, Email:c.email}}); }
async function saveTechnicianRemote(name){ return apiPost('saveTechnician', {name}); }
async function loginRemote(name, password){ return apiGet('login', {name, password}); }

/* ---------------- Static config ---------------- */
const BRANDS = {
  'لابتوب': ['Apple','HP','Dell','Lenovo','Toshiba','Asus','Acer','أخرى'],
  'موبايل': ['iPhone','Samsung','Oppo','Xiaomi','Redmi','Infinix','أخرى'],
  'تابلت': ['Apple','Samsung','Lenovo','Huawei','أخرى'],
  'كاميرات مراقبة': ['Hikvision','Dahua','EZVIZ','أخرى'],
  'اكسسوار': ['أخرى'],
  'أخرى': ['أخرى']
};
const COMMON_FAULTS = ['باور / لا يعمل','شاشة / كسر','شحن / سوكت','ماء / سوائل','سوفتوير','كاميرا / عدسة','بطارية','سماعة / مايك','لوحة مفاتيح','فيروسات','بطء في الأداء','أخرى'];
const STATUSES = [
  {v:'قيد الفحص', cls:'st-check'},
  {v:'الصيانة', cls:'st-repair'},
  {v:'تعذرت الصيانة', cls:'st-failed'},
  {v:'رفض العميل', cls:'st-rejected'},
  {v:'مكتمل', cls:'st-done'}
];
const TERMS = `1) فترة الفحص: يتم فحص الجهاز وتسعير التكلفة خلال مدة أقصاها 48 ساعة من الاستلام، ولا يتم الإصلاح النهائي إلا بعد موافقة العميل.  2) استلام الأجهزة: الشركة غير مسؤولة عن أي جهاز متروك أكثر من 30 يوماً من إشعار العميل بالانتهاء.  3) الضمان: يسري على قطع الغيار المبدلة والخدمة لمدة محددة حسب نوع الإصلاح، ولا يشمل سوء الاستخدام أو السوائل أو الكسر.  4) البيانات: الشركة غير مسؤولة عن فقدان البيانات، يرجى أخذ نسخة احتياطية مسبقاً.  5) لا يُسلم الجهاز إلا بموجب هذا الإيصال الأصلي أو إثبات الهوية.`;
function cleanDate(x){ return x ? String(x).slice(0,10) : ''; }
const WA_ICON = `<svg class="wa-icon" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.35 5.07L2 22l5.07-1.35C8.55 21.5 10.27 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm0 18c-1.5 0-2.9-.41-4.1-1.13l-.29-.17-3.02.8.8-3.02-.17-.29A7.94 7.94 0 0 1 4 12c0-4.41 3.59-8 8-8s8 3.59 8 8-3.59 8-8 8z"/></svg>`;

/* ---------------- State ---------------- */
let state = {
  user: null, // {name, role}
  tab: 'dashboard',
  receipts: [],
  customers: [],
  technicians: [],
  formStep: 0,
  draft: null,
  archiveFilter: {q:'', status:'', tech:'', group:'all'},
  bonusFilter: {tech:'', from:'', to:''},
  bonusValues: {}, // receiptId -> amount
  settings: {shopName: 'صيانة ميكروتك'},
  payments: [],
  inventory: [],
  sales: [],
  returns: [],
  quotations: [],
  services: [],
  purchases: [],
  suppliers: [],
  supplierPayments: [],
  serials: [],
  serials: [],
  currentSection: null,
  lastCompletedSale: null,
  cart: [],
  quoCart: []
};

function newDraft(){
  const today = new Date();
  return {
    id: 'r_'+Date.now(),
    receiptNumber: '',
    date: today.toISOString().slice(0,10),
    customer: {name:'', phone:'', email:''},
    device: {category:'لابتوب', brand:'Apple', brandOther:'', model:'', accessories:''},
    faults: [],
    faultNotes: '',
    technician: '',
    cost: '',
    deposit: '',
    refunded: 0,
    partsCost: 0,
    partsUsed: '',
    deliveryDate: today.toISOString().slice(0,10),
    status: 'قيد الفحص',
    paid: false,
    createdBy: state.user ? state.user.name : '',
    updatedBy: '',
    updatedAt: ''
  };
}

async function nextReceiptNumber(){
  const list = state.receipts || [];
  const y = new Date().getFullYear();
  const countThisYear = list.filter(r => r.receiptNumber && r.receiptNumber.startsWith('MT-'+y)).length;
  return 'MT-'+y+'-'+String(countThisYear+1).padStart(4,'0');
}

/* ---------------- Init ---------------- */
async function init(){
  const main = document.getElementById('app');
  if(main) main.innerHTML = '<div class="empty">جارٍ تحميل البيانات من قاعدة البيانات...</div>';
  [state.receipts, state.customers, state.technicians, state.settings, state.payments, state.inventory, state.sales, state.returns, state.quotations, state.services, state.purchases, state.suppliers, state.supplierPayments] = await Promise.all([
    loadReceipts(), loadCustomers(), loadTechnicians(), loadSettings(), loadPayments(), loadInventory(), loadSales(), loadReturns(), loadQuotations(), loadServices(), loadPurchases(), loadSuppliers(), loadSupplierPayments()
  ]);
  render();
}
async function refreshPayments(){ state.payments = await loadPayments(); }

/* ---------------- Render root ---------------- */
function render(){
  const app = document.getElementById('app');
  if(!state.user){ app.innerHTML = loginScreen(); attachLogin(); return; }
  const availableSections = state.user.sections || [];
  if(!state.currentSection){
    if(availableSections.length===1){ state.currentSection = availableSections[0]; }
    else { return renderSectionPicker(app); }
  }
  if(state.currentSection==='maintenance') return renderMaintenanceApp(app);
  if(state.currentSection==='cameras') return renderCamerasApp(app);
  if(state.currentSection==='pos') return renderPosApp(app);
  if(state.currentSection==='inventory') return renderInventoryHubApp(app);
  if(state.currentSection==='finance') return renderFinanceSectionApp(app);
  renderSectionPicker(app);
}

const SECTION_INFO = {
  maintenance: {label:'الصيانة', icon:'🛠️', desc:'إيصالات وأرشيف الصيانة'},
  cameras: {label:'كاميرات المراقبة', icon:'📷', desc:'كتالوج المنتجات وعروض أسعار التركيب'},
  pos: {label:'نقطة البيع', icon:'🧾', desc:'بيع سريع من المخزون'},
  inventory: {label:'المخزن العام', icon:'📦', desc:'كل أصناف الشركة والمشتريات من الموردين'},
  finance: {label:'المالي', icon:'💰', desc:'كل الحسابات: عملاء، موردين، مكافآت، تقارير'}
};
const INVENTORY_CATEGORIES = ['صيانة','كاميرات','كمبيوتر','إكسسوار'];

function renderSectionPicker(app){
  const sections = state.user.sections || [];
  const logoUrl = state.settings.logoUrl;
  app.innerHTML = `
    <div style="max-width:640px;margin:60px auto;padding:0 20px;">
      <div style="text-align:center;margin-bottom:18px;">
        ${logoUrl ? `<img src="${logoUrl}" alt="logo" style="max-height:64px;max-width:220px;object-fit:contain;margin-bottom:10px;">` : ''}
        <div style="font-weight:900;font-size:26px;color:var(--copper-dark);letter-spacing:.03em;">ميكروERP</div>
      </div>
      <h2 class="page-title">اختر القسم</h2>
      <div class="subtitle">مرحبًا ${state.user.name} — اختر القسم اللي عايز تشتغل عليه</div>
      <div class="stat-grid" id="sectionCards">
        ${sections.length===0 ? '<div class="empty">لا توجد أقسام متاحة لحسابك. تواصل مع المدير.</div>' : sections.map(s=>`
          <div class="stat-card" data-sec="${s}" style="cursor:pointer;text-align:center;padding:26px 16px;">
            <div style="font-size:34px;margin-bottom:8px;">${SECTION_INFO[s].icon}</div>
            <div style="font-weight:900;font-size:15px;">${SECTION_INFO[s].label}</div>
            <div class="lbl" style="margin-top:4px;">${SECTION_INFO[s].desc}</div>
          </div>`).join('')}
      </div>
    </div>
  `;
  document.querySelectorAll('[data-sec]').forEach(el=>{
    el.onclick = ()=>{ state.currentSection = el.dataset.sec; render(); };
  });
}

function brandHtml(subtitle){
  const logoUrl = state.settings.logoUrl;
  return `<div class="brand">
    ${logoUrl ? `<img src="${logoUrl}" alt="logo" style="max-height:32px;max-width:150px;object-fit:contain;margin-bottom:6px;display:block;">` : ''}
    <h1>${state.settings.shopName}</h1><span>${subtitle}</span>
  </div>`;
}

function sectionSwitcherHtml(){
  const sections = state.user.sections || [];
  if(sections.length<=1) return '';
  return `<div class="nav-item" id="switchSectionBtn" style="color:var(--copper);border-bottom:1px solid #33404f;">↩ الأقسام</div>`;
}

function sidebarFootHtml(){
  return `<div class="sidebar-foot">
    مسجل الدخول: <b>${state.user.name}</b>
    <div class="role-tag">${state.user.role === 'admin' ? 'مدير (Admin)' : 'مستخدم (User)'}</div>
    <div style="margin-top:8px;"><span id="logoutBtn" style="cursor:pointer;color:#e08a8a;text-decoration:underline;">تسجيل الخروج</span></div>
  </div>`;
}

function attachLogoutHandler(){
  const btn = document.getElementById('logoutBtn');
  if(btn) btn.onclick = logout;
}

function logout(){
  try{ localStorage.removeItem('microerp_session'); }catch(e){ console.warn('localStorage unavailable', e); }
  state.user = null;
  state.currentSection = null;
  render();
}

function renderMaintenanceApp(app){
  app.innerHTML = `
    <div class="sidebar">
      ${brandHtml("نظام إدارة الإيصالات")}
      ${sectionSwitcherHtml()}
      ${navItem('dashboard','لوحة التحكم')}
      ${navItem('new','إيصال جديد')}
      ${navItem('archive','الأرشيف')}
      ${state.user.role==='admin' ? navItem('inventory','المخزن') : ''}
      ${state.user.role==='admin' ? navItem('settings','الإعدادات') : ''}
      ${sidebarFootHtml()}
    </div>
    <main id="main"></main>
  `;
  const sw = document.getElementById('switchSectionBtn');
  if(sw) sw.onclick = ()=>{ state.currentSection = null; render(); };
  attachLogoutHandler();
  document.querySelectorAll('.nav-item[data-tab]').forEach(el=>{
    el.onclick = ()=>{ state.tab = el.dataset.tab; if(state.tab==='new' && !state.draft){ startNewDraft(); } else { renderMain(); } };
  });
  renderMain();
}

function navItem(tab,label){
  return `<div class="nav-item ${state.tab===tab?'active':''}" data-tab="${tab}">${label}</div>`;
}

/* ---------------- Cameras Section ---------------- */
function renderCamerasApp(app){
  if(!state.camTab) state.camTab = 'catalog';
  app.innerHTML = `
    <div class="sidebar">
      ${brandHtml("قسم الكاميرات")}
      ${sectionSwitcherHtml()}
      <div class="nav-item ${state.camTab==='catalog'?'active':''}" data-camtab="catalog">كتالوج المنتجات</div>
      <div class="nav-item ${state.camTab==='quote'?'active':''}" data-camtab="quote">عرض سعر جديد</div>
      <div class="nav-item ${state.camTab==='quotes'?'active':''}" data-camtab="quotes">عروض الأسعار السابقة</div>
      ${sidebarFootHtml()}
    </div>
    <main id="main"></main>
  `;
  const sw = document.getElementById('switchSectionBtn');
  if(sw) sw.onclick = ()=>{ state.currentSection = null; render(); };
  attachLogoutHandler();
  document.querySelectorAll('[data-camtab]').forEach(el=>{
    el.onclick = ()=>{ state.camTab = el.dataset.camtab; renderCamerasApp(app); };
  });
  const main = document.getElementById('main');
  if(state.camTab==='catalog') renderInventory(main, 'كاميرات', 'كتالوج الكاميرات ومعدات المراقبة');
  else if(state.camTab==='quote') renderQuotationBuilder(main);
  else renderQuotationsList(main);
}

function renderQuotationBuilder(main){
  if(!state.quoCart) state.quoCart = [];
  const cart = state.quoCart;
  const itemsTotal = cart.reduce((s,c)=>s+c.qty*c.price,0);
  main.innerHTML = `
    <h2 class="page-title">عرض سعر جديد — مشروع تركيب كاميرات</h2>
    <div class="subtitle">اختر المنتجات والخدمات، وهيتولّد عرض سعر قابل للطباعة</div>
    <div class="card">
      <div class="grid2">
        <div class="field"><label>اسم العميل / الشركة</label><input id="quoClientName"></div>
        <div class="field"><label>رقم الهاتف</label><input id="quoClientPhone"></div>
      </div>
    </div>
    <div class="card">
      <h3>إضافة منتج (من كتالوج الكاميرات)</h3>
      <div style="display:flex;gap:8px;align-items:flex-end;">
        <div class="field" style="flex:2;margin-bottom:0;"><label>المنتج</label>
          <select id="quoPickItem">
            <option value="">-- اختر منتج --</option>
            ${state.inventory.filter(it=>(it.Category||'صيانة')==='كاميرات').map(it=>`<option value="${it.ID}">${it.Name} (متاح: ${it.Quantity})</option>`).join('')}
          </select>
        </div>
        <div class="field" style="flex:1;margin-bottom:0;"><label>الكمية</label><input id="quoPickQty" type="number" value="1" min="1"></div>
        <button class="btn btn-primary btn-sm" id="quoAddItemBtn">إضافة</button>
      </div>
    </div>
    <div class="card">
      <h3>إضافة خدمة (تركيب، تمديد كابلات...)</h3>
      <div style="display:flex;gap:8px;align-items:flex-end;">
        <div class="field" style="flex:2;margin-bottom:0;"><label>الخدمة</label>
          <select id="quoPickService">
            <option value="">-- اختر خدمة أو اكتب واحدة يدوي تحت --</option>
            ${state.services.map(s=>`<option value="${s.Name}" data-price="${s.DefaultPrice}">${s.Name} (${s.DefaultPrice} ج.م)</option>`).join('')}
          </select>
        </div>
        <div class="field" style="flex:2;margin-bottom:0;"><label>أو اسم خدمة يدوي</label><input id="quoManualService" placeholder="مثال: تركيب 8 كاميرات + تمديد"></div>
        <div class="field" style="flex:1;margin-bottom:0;"><label>السعر</label><input id="quoServicePrice" type="number" value="0"></div>
        <button class="btn btn-primary btn-sm" id="quoAddServiceBtn">إضافة</button>
      </div>
    </div>
    <div class="card">
      <h3>بنود عرض السعر</h3>
      ${cart.length===0 ? '<div class="empty">لسه ماضفتش أي بنود.</div>' : `
      <table><thead><tr><th>البند</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th><th></th></tr></thead><tbody>
        ${cart.map((c,i)=>`<tr><td>${c.name}${c.type==='service'?' <span style="color:#999;font-size:11px;">(خدمة)</span>':''}</td><td class="mono">${c.qty}</td><td class="mono">${c.price}</td><td class="mono">${c.qty*c.price}</td>
        <td><button class="btn btn-sm btn-red" data-quocartidx="${i}">إزالة</button></td></tr>`).join('')}
      </tbody></table>`}
      <div style="text-align:left;font-size:20px;font-weight:900;margin-top:10px;">الإجمالي: <span class="mono">${itemsTotal}</span> ج.م</div>
      <button class="btn btn-green" id="saveQuoteBtn" ${cart.length===0?'disabled':''}>حفظ وطباعة عرض السعر</button>
    </div>
  `;
  document.getElementById('quoAddItemBtn').onclick = ()=>{
    const itemId = document.getElementById('quoPickItem').value;
    const qty = Number(document.getElementById('quoPickQty').value);
    if(!itemId){ alert('اختر منتج'); return; }
    if(!qty || qty<=0){ alert('كمية غير صحيحة'); return; }
    const item = state.inventory.find(x=>x.ID===itemId);
    cart.push({type:'product', itemId, name:item.Name, qty, price:Number(item.SellPrice||item.PurchasePrice||0)});
    renderQuotationBuilder(main);
  };
  document.getElementById('quoAddServiceBtn').onclick = ()=>{
    const sel = document.getElementById('quoPickService');
    const manual = document.getElementById('quoManualService').value.trim();
    const name = manual || sel.options[sel.selectedIndex].text.split(' (')[0];
    const price = Number(document.getElementById('quoServicePrice').value) || Number(sel.options[sel.selectedIndex]?.dataset?.price || 0);
    if(!name || name.startsWith('--')){ alert('اختر خدمة أو اكتب اسمها'); return; }
    cart.push({type:'service', name, qty:1, price});
    renderQuotationBuilder(main);
  };
  document.getElementById('quoPickService').onchange = (e)=>{
    const opt = e.target.options[e.target.selectedIndex];
    if(opt && opt.dataset.price) document.getElementById('quoServicePrice').value = opt.dataset.price;
  };
  main.querySelectorAll('[data-quocartidx]').forEach(btn=>{
    btn.onclick = ()=>{ cart.splice(Number(btn.dataset.quocartidx),1); renderQuotationBuilder(main); };
  });
  const saveBtn = document.getElementById('saveQuoteBtn');
  if(saveBtn) saveBtn.onclick = async ()=>{
    const clientName = document.getElementById('quoClientName').value.trim();
    const clientPhone = document.getElementById('quoClientPhone').value.trim();
    if(!clientName){ alert('اكتب اسم العميل / الشركة'); return; }
    saveBtn.disabled = true; saveBtn.textContent = 'جارٍ الحفظ...';
    const itemsSummary = cart.map(c=>`${c.name} × ${c.qty} (${c.qty*c.price} ج.م)`).join('، ');
    const q = {
      ID:'', Date: new Date().toISOString().slice(0,10), ClientName: clientName, ClientPhone: clientPhone,
      ItemsSummary: itemsSummary, LaborCost: cart.filter(c=>c.type==='service').reduce((s,c)=>s+c.qty*c.price,0),
      Total: itemsTotal, Status:'معلق', By: state.user.name
    };
    try{
      const res = await saveQuotationRemote(q);
      state.quotations = await loadQuotations();
      openQuotationPrint(res.quotation, cart);
      state.quoCart = [];
      renderQuotationBuilder(main);
    }catch(e){ alert('تعذر حفظ عرض السعر: '+e.message); }
    saveBtn.disabled = false; saveBtn.textContent = 'حفظ وطباعة عرض السعر';
  };
}

    <h2 class="page-title">عروض الأسعار السابقة</h2>
    <div class="subtitle">${state.quotations.length} عرض سعر</div>
    ${state.quotations.length===0 ? '<div class="empty">لا توجد عروض أسعار بعد.</div>' : `
    <table><thead><tr><th>رقم</th><th>التاريخ</th><th>العميل</th><th>البنود</th><th>الإجمالي</th><th>الحالة</th></tr></thead><tbody>
      ${state.quotations.slice().reverse().map(q=>`<tr>
        <td class="mono" style="font-weight:900;color:var(--copper-dark);">${String(q.ID).slice(-8)}</td>
        <td>${cleanDate(q.Date)}</td><td>${q.ClientName}</td><td>${q.ItemsSummary}</td>
        <td class="mono">${q.Total}</td><td>${q.Status}</td>
      </tr>`).join('')}
    </tbody></table>`}
  `;
}

function openQuotationPrint(q, cartItems){
  const old = document.getElementById('printMount');
  if(old) old.remove();
  const mount = document.createElement('div');
  mount.id='printMount';
  mount.innerHTML = `
  <div id="receiptPaper">
    <div class="r-head">
      <div>${state.settings.logoUrl ? `<img src="${state.settings.logoUrl}" style="max-height:28px;max-width:120px;object-fit:contain;margin-bottom:2px;">` : ''}<h4>${state.settings.shopName}</h4><div class="r-sub">عرض سعر - مشروع تركيب كاميرات مراقبة</div></div>
      <div style="text-align:left;">
        <div class="r-badge mono" style="font-size:14px;padding:6px 16px;">${String(q.ID).slice(-8)}</div>
        <div class="r-meta">التاريخ: ${cleanDate(q.Date)}</div>
      </div>
    </div>
    <div class="section-title">بيانات العميل</div>
    <table><tr><td class="k">الاسم</td><td>${q.ClientName}</td><td class="k">الهاتف</td><td>${q.ClientPhone||'-'}</td></tr></table>
    <div class="section-title">البنود</div>
    <table>
      <thead><tr><td class="k">البند</td><td class="k">الكمية</td><td class="k">السعر</td><td class="k">الإجمالي</td></tr></thead>
      ${cartItems.map(c=>`<tr><td>${c.name}</td><td>${c.qty}</td><td>${c.price}</td><td>${c.qty*c.price}</td></tr>`).join('')}
    </table>
    <div class="fin-box"><div class="fin-cell hi"><div class="l">الإجمالي</div><div class="v">${q.Total}</div></div></div>
    <div class="terms">هذا عرض سعر غير ملزم وقابل للتغيير حسب المعاينة الفعلية للموقع. صالح لمدة 14 يوم من تاريخ الإصدار.</div>
    <div class="sign-row"><div>توقيع العميل بالموافقة</div><div>بواسطة (${state.user.name})</div></div>
  </div>`;
  document.body.appendChild(mount);
  setTimeout(()=>{ window.print(); mount.remove(); }, 200);
}

/* ---------------- Inventory Hub (all company categories + purchases) ---------------- */
function renderInventoryHubApp(app){
  if(!state.invHubTab) state.invHubTab = 'صيانة';
  app.innerHTML = `
    <div class="sidebar">
      ${brandHtml("المخزن العام")}
      ${sectionSwitcherHtml()}
      ${['صيانة','كاميرات','كمبيوتر','إكسسوار','all','purchases','suppliers','warranty'].map(t=>{
        const labels = {all:'كل الأصناف', purchases:'المشتريات من الموردين', suppliers:'الموردون', warranty:'تتبع الضمان'};
        const label = labels[t] || t;
        return `<div class="nav-item ${state.invHubTab===t?'active':''}" data-invhubtab="${t}">${label}</div>`;
      }).join('')}
      ${sidebarFootHtml()}
    </div>
    <main id="main"></main>
  `;
  const sw = document.getElementById('switchSectionBtn');
  if(sw) sw.onclick = ()=>{ state.currentSection = null; render(); };
  attachLogoutHandler();
  document.querySelectorAll('[data-invhubtab]').forEach(el=>{
    el.onclick = ()=>{ state.invHubTab = el.dataset.invhubtab; renderInventoryHubApp(app); };
  });
  const main = document.getElementById('main');
  if(state.invHubTab==='purchases') renderPurchases(main);
  else if(state.invHubTab==='suppliers') renderSuppliers(main);
  else if(state.invHubTab==='warranty') renderWarrantyTracking(main);
  else renderInventory(main, state.invHubTab, state.invHubTab==='all' ? 'كل أصناف الشركة' : `مخزون: ${state.invHubTab}`);
}

function renderSuppliers(main){
  main.innerHTML = `
    <h2 class="page-title">الموردون</h2>
    <div class="subtitle">قائمة الموردين المستخدمة في فواتير الشراء وتتبع الضمان</div>
    <div class="card">
      <h3>إضافة مورد جديد</h3>
      <div class="grid3">
        <div class="field"><label>اسم المورد</label><input id="newSupName"></div>
        <div class="field"><label>رقم الهاتف</label><input id="newSupPhone"></div>
        <div class="field"><label>ملاحظات</label><input id="newSupNotes"></div>
      </div>
      <button class="btn btn-primary btn-sm" id="addSupBtn">إضافة</button>
    </div>
    <div class="card">
      <h3>الموردون (${state.suppliers.length})</h3>
      ${state.suppliers.length===0 ? '<div class="empty">لا يوجد موردون بعد.</div>' : `
      <table><thead><tr><th>الاسم</th><th>الهاتف</th><th>ملاحظات</th></tr></thead><tbody>
        ${state.suppliers.map(s=>`<tr><td>${s.Name}</td><td>${s.Phone||'-'}</td><td>${s.Notes||'-'}</td></tr>`).join('')}
      </tbody></table>`}
    </div>
  `;
  document.getElementById('addSupBtn').onclick = async ()=>{
    const name = document.getElementById('newSupName').value.trim();
    const phone = document.getElementById('newSupPhone').value.trim();
    const notes = document.getElementById('newSupNotes').value.trim();
    if(!name){ alert('اكتب اسم المورد'); return; }
    const btn = document.getElementById('addSupBtn'); btn.disabled = true;
    try{
      const res = await saveSupplierRemote({ID:'', Name:name, Phone:phone, Notes:notes});
      state.suppliers.push(res.supplier);
      renderSuppliers(main);
    }catch(e){ alert('تعذر إضافة المورد: '+e.message); }
    btn.disabled = false;
  };
}

function renderSupplierAccounts(main){
  const bySupplier = {};
  state.purchases.forEach(p=>{
    const key = p.SupplierID || p.Supplier || 'غير محدد';
    if(!bySupplier[key]) bySupplier[key] = {name: p.Supplier, purchases: [], totalDebt: 0};
    const debt = Number(p.Total||0) - Number(p.AmountPaid!=null?p.AmountPaid:p.Total);
    bySupplier[key].purchases.push(p);
    bySupplier[key].totalDebt += debt;
  });
  const rows = Object.entries(bySupplier);
  const grandTotalDebt = rows.reduce((s,[,v])=>s+v.totalDebt,0);
  main.innerHTML = `
    <h2 class="page-title">حسابات الموردين</h2>
    <div class="subtitle">متابعة مديونيات الشركة تجاه كل مورد</div>
    <div class="stat-grid">
      <div class="stat-card red"><div class="num mono">${grandTotalDebt.toLocaleString()}</div><div class="lbl">إجمالي المديونية على الشركة (ج.م)</div></div>
      <div class="stat-card"><div class="num mono">${rows.length}</div><div class="lbl">عدد الموردين اللي تعاملنا معاهم</div></div>
    </div>
    ${rows.length===0 ? '<div class="empty">لا توجد فواتير شراء بعد.</div>' : rows.map(([key,v])=>`
      <div class="card">
        <h3>${v.name} — <span style="${v.totalDebt>0?'color:var(--red);':'color:var(--green);'}">${v.totalDebt>0 ? 'مديونية: '+v.totalDebt+' ج.م' : 'الحساب متزن'}</span></h3>
        <table><thead><tr><th>التاريخ</th><th>الأصناف</th><th>الإجمالي</th><th>المدفوع</th><th>المتبقي</th></tr></thead><tbody>
          ${v.purchases.slice().reverse().map(p=>{
            const debt = Number(p.Total||0) - Number(p.AmountPaid!=null?p.AmountPaid:p.Total);
            return `<tr><td>${cleanDate(p.Date)}</td><td>${p.ItemsSummary}</td><td class="mono">${p.Total}</td><td class="mono">${p.AmountPaid!=null?p.AmountPaid:p.Total}</td>
            <td class="mono" style="${debt>0?'color:var(--red);font-weight:900;':''}">${debt>0?debt:'-'}</td></tr>`;
          }).join('')}
        </tbody></table>
      </div>
    `).join('')}
  `;
}

function renderWarrantyTracking(main){
  if(!state.warrantyFilter) state.warrantyFilter = {q:'', status:''};
  const f = state.warrantyFilter;
  let list = [...state.serials];
  if(f.q) list = list.filter(s=>String(s.Serial).includes(f.q) || String(s.ItemName).includes(f.q));
  if(f.status) list = list.filter(s=>s.Status===f.status);

  main.innerHTML = `
    <h2 class="page-title">تتبع الضمان</h2>
    <div class="subtitle">كل القطع المسجّلة برقم تسلسلي، وحالة ضمانها مع المورد والعميل</div>
    <div class="filters">
      <input id="warQ" placeholder="بحث بالرقم التسلسلي أو اسم الصنف" value="${f.q}">
      <select id="warStatus"><option value="">كل الحالات</option><option ${f.status==='In Stock'?'selected':''}>In Stock</option><option ${f.status==='Sold'?'selected':''}>Sold</option></select>
      <button class="btn btn-primary btn-sm" id="loadAllSerialsBtn">تحميل / تحديث القائمة</button>
    </div>
    <div id="warrantyList">${state.serials.length===0 ? '<div class="empty">اضغط "تحميل / تحديث القائمة" لعرض كل الأرقام التسلسلية المسجّلة.</div>' : ''}</div>
  `;
  document.getElementById('warQ').oninput = e=>{ f.q=e.target.value; renderWarrantyList(); };
  document.getElementById('warStatus').onchange = e=>{ f.status=e.target.value; renderWarrantyList(); };
  document.getElementById('loadAllSerialsBtn').onclick = async ()=>{
    const btn = document.getElementById('loadAllSerialsBtn'); btn.disabled = true; btn.textContent = 'جارٍ التحميل...';
    state.serials = await loadSerials();
    renderWarrantyList();
    btn.disabled = false; btn.textContent = 'تحميل / تحديث القائمة';
  };
  function renderWarrantyList(){
    let l = [...state.serials];
    if(f.q) l = l.filter(s=>String(s.Serial).includes(f.q) || String(s.ItemName).includes(f.q));
    if(f.status) l = l.filter(s=>s.Status===f.status);
    const box = document.getElementById('warrantyList');
    if(l.length===0){ box.innerHTML = '<div class="empty">لا توجد نتائج.</div>'; return; }
    box.innerHTML = `<table><thead><tr><th>الصنف</th><th>السيريال</th><th>المورد</th><th>الحالة</th><th>ضمان المورد ينتهي</th><th>تاريخ البيع</th><th>ضمان العميل ينتهي</th><th></th></tr></thead><tbody>
      ${l.map(s=>{
        const purchase = state.purchases.find(p=>p.ID===s.PurchaseID);
        const supplier = state.suppliers.find(sup=>sup.ID===s.SupplierID);
        const months = Number(s.WarrantyMonths||0);
        let supplierEnd = '-', customerEnd = '-', supplierExpired = false, customerExpired = false;
        if(purchase && months){
          const d = new Date(purchase.Date); d.setMonth(d.getMonth()+months);
          supplierEnd = d.toISOString().slice(0,10);
          supplierExpired = d.getTime() < Date.now();
        }
        if(s.SoldDate && months){
          const d = new Date(s.SoldDate); d.setMonth(d.getMonth()+months);
          customerEnd = d.toISOString().slice(0,10);
          customerExpired = d.getTime() < Date.now();
        }
        return `<tr>
          <td>${s.ItemName}</td><td class="mono" style="font-weight:900;">${s.Serial}</td>
          <td>${supplier ? supplier.Name+(supplier.Phone?' - '+supplier.Phone:'') : '-'}</td>
          <td><span class="status-badge ${s.Status==='Sold'?'st-done':'st-check'}">${s.Status==='Sold'?'مباع':'بالمخزن'}</span></td>
          <td style="${supplierExpired?'color:var(--red);':''}">${supplierEnd}</td>
          <td>${s.SoldDate?cleanDate(s.SoldDate):'-'}</td>
          <td style="${customerExpired?'color:var(--red);':''}">${customerEnd}</td>
          <td>${purchase?`<button class="btn btn-sm btn-ghost" data-viewpurchase="${purchase.ID}">فاتورة الشراء</button>`:''}</td>
        </tr>`;
      }).join('')}
    </tbody></table>`;
    box.querySelectorAll('[data-viewpurchase]').forEach(btn=>{
      btn.onclick = ()=>{
        const p = state.purchases.find(x=>x.ID===btn.dataset.viewpurchase);
        alert(`فاتورة شراء رقم: ${p.ID}\nالتاريخ: ${cleanDate(p.Date)}\nالمورد: ${p.Supplier}\nالأصناف: ${p.ItemsSummary}\nالإجمالي: ${p.Total} ج.م\nالمدفوع: ${p.AmountPaid!=null?p.AmountPaid:p.Total} ج.م`);
      };
    });
  }
}

function renderPurchases(main){
  if(!state.purchaseCart) state.purchaseCart = [];
  const cart = state.purchaseCart;
  const total = cart.reduce((s,c)=>s+c.qty*c.cost,0);
  main.innerHTML = `
    <h2 class="page-title">فاتورة شراء من مورد</h2>
    <div class="subtitle">تسجيل توريد بضاعة جديدة — بيزوّد المخزون تلقائيًا ويربط الضمان بالمورد</div>
    <div class="card">
      <div class="grid2">
        <div class="field"><label>المورد</label>
          <select id="purSupplierSelect">
            <option value="">-- اختر مورد --</option>
            ${state.suppliers.map(s=>`<option value="${s.ID}">${s.Name}</option>`).join('')}
            <option value="__new__">+ إضافة مورد جديد</option>
          </select>
        </div>
        <div class="field" id="newSupplierWrap" style="display:none;"><label>اسم المورد الجديد</label><input id="newSupplierName" placeholder="اسم الشركة الموردة"></div>
      </div>
      <div class="field"><label>مدة الضمان مع المورد (بالشهور، اختياري)</label><input id="purWarranty" type="number" value="0" style="max-width:160px;"></div>
      <div class="field"><label>حالة السداد لهذه الفاتورة</label>
        <div class="chip-group" id="purPayChips">
          <div class="chip sel" data-pp="full">مدفوعة بالكامل</div>
          <div class="chip" data-pp="partial">دفعة جزئية</div>
          <div class="chip" data-pp="none">غير مدفوعة (دين كامل)</div>
        </div>
      </div>
      <div class="field" id="purAmountPaidWrap" style="display:none;max-width:220px;"><label>المبلغ المدفوع الآن</label><input id="purAmountPaid" type="number" value="0"></div>
    </div>
    <div class="card">
      <h3>إضافة صنف للفاتورة</h3>
      <div style="display:flex;gap:8px;align-items:flex-end;">
        <div class="field" style="flex:2;margin-bottom:0;"><label>الصنف</label>
          <select id="purPickItem">
            <option value="">-- اختر صنف --</option>
            ${state.inventory.map(it=>`<option value="${it.ID}">${it.Name} (${it.Category||'صيانة'})</option>`).join('')}
          </select>
        </div>
        <div class="field" style="flex:1;margin-bottom:0;"><label>الكمية</label><input id="purQty" type="number" value="1" min="1"></div>
        <div class="field" style="flex:1;margin-bottom:0;"><label>سعر الوحدة</label><input id="purCost" type="number" value="0"></div>
        <button class="btn btn-primary btn-sm" id="purAddBtn">إضافة</button>
      </div>
      <div class="field" style="margin-top:10px;"><label>الأرقام التسلسلية (اختياري — رقم لكل قطعة، مفصولة بفاصلة، بنفس عدد الكمية)</label>
        <input id="purSerials" placeholder="مثال: SN001, SN002, SN003">
      </div>
      <div class="hint">الصنف لازم يكون مضاف مسبقًا في المخزن (حتى بكمية صفر) عشان تقدر تسجّل عليه فاتورة شراء. الأرقام التسلسلية اختيارية وبتفيد في تتبع الضمان والبيع لاحقًا.</div>
    </div>
    <div class="card">
      <h3>أصناف الفاتورة</h3>
      ${cart.length===0 ? '<div class="empty">لسه ماضفتش أصناف.</div>' : `
      <table><thead><tr><th>الصنف</th><th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th><th>سيريالات</th><th></th></tr></thead><tbody>
        ${cart.map((c,i)=>`<tr><td>${c.name}</td><td class="mono">${c.qty}</td><td class="mono">${c.cost}</td><td class="mono">${c.qty*c.cost}</td>
        <td style="font-size:11px;color:#888;">${c.serials && c.serials.length ? c.serials.join('، ') : '-'}</td>
        <td><button class="btn btn-sm btn-red" data-purcartidx="${i}">إزالة</button></td></tr>`).join('')}
      </tbody></table>`}
      <div style="text-align:left;font-size:20px;font-weight:900;margin-top:10px;">الإجمالي: <span class="mono">${total}</span> ج.م</div>
      <button class="btn btn-green" id="completePurchaseBtn" ${cart.length===0?'disabled':''}>تسجيل الفاتورة وتحديث المخزون</button>
    </div>
    <div class="card">
      <h3>آخر فواتير الشراء (${state.purchases.length})</h3>
      ${state.purchases.length===0 ? '<div class="empty">لا توجد فواتير شراء بعد.</div>' : `
      <table><thead><tr><th>التاريخ</th><th>المورد</th><th>الأصناف</th><th>الإجمالي</th><th>المدفوع</th><th>المتبقي (دين)</th><th>الضمان</th><th></th></tr></thead><tbody>
        ${state.purchases.slice().reverse().map(p=>{
          const debt = Number(p.Total||0) - Number(p.AmountPaid!=null?p.AmountPaid:p.Total);
          return `<tr><td>${cleanDate(p.Date)}</td><td>${p.Supplier}</td><td>${p.ItemsSummary}</td><td class="mono">${p.Total}</td>
          <td class="mono">${p.AmountPaid!=null?p.AmountPaid:p.Total}</td>
          <td class="mono" style="${debt>0?'color:var(--red);font-weight:900;':''}">${debt>0?debt:'-'}</td>
          <td>${p.WarrantyMonths?p.WarrantyMonths+' شهر':'-'}</td>
          <td>${debt>0?`<button class="btn btn-sm btn-green" data-settlepurchase="${p.ID}" data-supplierid="${p.SupplierID||''}">تسجيل سداد</button>`:''}</td>
        </tr>`;}).join('')}
      </tbody></table>`}
    </div>
  `;
  document.getElementById('purSupplierSelect').onchange = (e)=>{
    document.getElementById('newSupplierWrap').style.display = e.target.value==='__new__' ? '' : 'none';
  };
  let payStatus = 'full';
  document.querySelectorAll('#purPayChips .chip').forEach(c=>{
    c.onclick = ()=>{
      document.querySelectorAll('#purPayChips .chip').forEach(x=>x.classList.remove('sel'));
      c.classList.add('sel');
      payStatus = c.dataset.pp;
      document.getElementById('purAmountPaidWrap').style.display = payStatus==='partial' ? '' : 'none';
    };
  });
  document.getElementById('purAddBtn').onclick = ()=>{
    const itemId = document.getElementById('purPickItem').value;
    const qty = Number(document.getElementById('purQty').value);
    const cost = Number(document.getElementById('purCost').value);
    const serialsRaw = document.getElementById('purSerials').value.trim();
    if(!itemId){ alert('اختر صنف'); return; }
    if(!qty || qty<=0){ alert('أدخل كمية صحيحة'); return; }
    let serials = [];
    if(serialsRaw){
      serials = serialsRaw.split(',').map(s=>s.trim()).filter(Boolean);
      if(serials.length !== qty){ alert('عدد الأرقام التسلسلية لازم يساوي الكمية بالظبط ('+qty+')، أو سيبها فاضية.'); return; }
    }
    const item = state.inventory.find(x=>x.ID===itemId);
    cart.push({itemId, name:item.Name, qty, cost, serials});
    renderPurchases(main);
  };
  main.querySelectorAll('[data-purcartidx]').forEach(btn=>{
    btn.onclick = ()=>{ cart.splice(Number(btn.dataset.purcartidx),1); renderPurchases(main); };
  });
  const completeBtn = document.getElementById('completePurchaseBtn');
  if(completeBtn) completeBtn.onclick = async ()=>{
    const supplierSelect = document.getElementById('purSupplierSelect').value;
    const newSupplierName = document.getElementById('newSupplierName').value.trim();
    const warrantyMonths = Number(document.getElementById('purWarranty').value)||0;
    if(!supplierSelect){ alert('اختر مورد أو أضف مورد جديد'); return; }
    if(supplierSelect==='__new__' && !newSupplierName){ alert('اكتب اسم المورد الجديد'); return; }
    completeBtn.disabled = true; completeBtn.textContent = 'جارٍ التسجيل...';
    try{
      let supplierId = supplierSelect, supplierName;
      if(supplierSelect==='__new__'){
        const res = await saveSupplierRemote({ID:'', Name:newSupplierName, Phone:'', Notes:''});
        supplierId = res.supplier.ID; supplierName = res.supplier.Name;
        state.suppliers.push(res.supplier);
      } else {
        supplierName = (state.suppliers.find(s=>s.ID===supplierId)||{}).Name || '';
      }
      const itemsSummary = cart.map(c=>`${c.name} × ${c.qty} (${c.cost} ج.م/وحدة)`).join('، ');
      const amountPaid = payStatus==='full' ? total : (payStatus==='none' ? 0 : Number(document.getElementById('purAmountPaid').value)||0);
      const purRes = await savePurchaseRemote(supplierName, supplierId, itemsSummary, total, warrantyMonths, amountPaid);
      for(const c of cart){
        await adjustInventoryQtyRemote(c.itemId, c.qty);
        const invItem = state.inventory.find(x=>x.ID===c.itemId)||{};
        await saveInventoryItemRemote({ID:c.itemId, Name:c.name, Category:invItem.Category||'صيانة', Quantity:invItem.Quantity, PurchasePrice:c.cost, SellPrice:invItem.SellPrice});
        if(c.serials && c.serials.length){
          for(const sn of c.serials){
            await saveSerialRemote(c.itemId, c.name, sn, purRes.purchase.ID, supplierId, warrantyMonths);
          }
        }
      }
      await refreshInventory();
      state.purchases = await loadPurchases();
      state.purchaseCart = [];
      renderPurchases(main);
      alert('تم تسجيل فاتورة الشراء وتحديث المخزون بنجاح.');
    }catch(e){ alert('تعذر تسجيل الفاتورة: '+e.message); completeBtn.disabled=false; completeBtn.textContent='تسجيل الفاتورة وتحديث المخزون'; }
  };
  main.querySelectorAll('[data-settlepurchase]').forEach(btn=>{
    btn.onclick = async ()=>{
      const purchase = state.purchases.find(p=>p.ID===btn.dataset.settlepurchase);
      const debt = Number(purchase.Total||0) - Number(purchase.AmountPaid||0);
      const amt = prompt(`الدين المتبقي للمورد: ${debt} ج.م\nأدخل المبلغ المسدد الآن:`, debt);
      if(amt===null) return;
      const n = Number(amt);
      if(!n || n<=0){ alert('مبلغ غير صحيح'); return; }
      try{
        await settlePurchaseDebtRemote(purchase.ID, btn.dataset.supplierid, n, '');
        state.purchases = await loadPurchases();
        state.supplierPayments = await loadSupplierPayments();
        renderPurchases(main);
      }catch(e){ alert('تعذر تسجيل السداد: '+e.message); }
    };
  });
}

      ${sidebarFootHtml()}
    </div>
    <main id="main"></main>
  `;
  const sw = document.getElementById('switchSectionBtn');
  if(sw) sw.onclick = ()=>{ state.currentSection = null; render(); };

        ${cart.map((c,i)=>`<tr><td>${c.name}</td><td><input type="number" min="1" value="${c.qty}" data-cartqtyidx="${i}" style="width:70px;"></td>

      <div class="field" id="amountPaidWrap" style="display:none;"><label>المبلغ المدفوع الآن (والباقي هيسجّل كدين على العميل)</label><input id="posAmountPaid" type="number" value="0"></div>

    if(!q){ box.style.display='none'; box.innerHTML=''; return; }
    const matches = state.inventory.filter(it=>it.Name.includes(q) || String(it.Barcode||'').includes(q)).slice(0,20);
    if(matches.length===0){ box.style.display=''; box.innerHTML = '<div style="padding:8px;color:#999;font-size:12px;">لا توجد نتائج</div>'; return; }

    e.target.value = '';
    await addItemToCart(it.ID, 1, main);
  };

  document.getElementById('posAddCartBtn').onclick = async ()=>{
    const qty = Number(document.getElementById('posPickQty').value);
    if(!selectedItemId){ alert('اختر صنف بالبحث أو الباركود أولاً'); return; }
    if(!qty || qty<=0){ alert('أدخل كمية صحيحة'); return; }
    await addItemToCart(selectedItemId, qty, main);
  };

  main.querySelectorAll('[data-cartqtyidx]').forEach(inp=>{
    inp.onchange = ()=>{
      const idx = Number(inp.dataset.cartqtyidx);
      const newQty = Number(inp.value);
      const item = state.inventory.find(x=>x.ID===cart[idx].itemId);
      const otherQty = cart.filter((c,i)=>i!==idx && c.itemId===cart[idx].itemId).reduce((s,c)=>s+c.qty,0);
      if(!newQty || newQty<=0){ alert('كمية غير صحيحة'); renderPosSell(main); return; }
      if(item && newQty+otherQty > Number(item.Quantity)){ alert('الكمية أكبر من المتاح في المخزون ('+item.Quantity+')'); renderPosSell(main); return; }
      cart[idx].qty = newQty;
      renderPosSell(main);
    };
  });
  main.querySelectorAll('[data-cartpriceidx]').forEach(inp=>{
    inp.onchange = ()=>{
      const idx = Number(inp.dataset.cartpriceidx);
      const newPrice = Number(inp.value);
      const line = cart[idx];
      if(newPrice < line.cost){
        const ok = confirm(`تنبيه: السعر ${newPrice} ج.م أقل من تكلفة الشراء (${line.cost} ج.م) — هيبقى في خسارة على هذا الصنف.\nهل تريد المتابعة فعلاً؟`);
        if(!ok){ renderPosSell(main); return; }
      }
      line.price = newPrice;
      renderPosSell(main);
    };
  });
  main.querySelectorAll('[data-cartidx]').forEach(btn=>{
    btn.onclick = ()=>{ cart.splice(Number(btn.dataset.cartidx),1); renderPosSell(main); };
  });

  let paymentMethod = 'نقدي';
  document.querySelectorAll('#payMethodChips .chip').forEach(c=>{
    c.onclick = ()=>{
      document.querySelectorAll('#payMethodChips .chip').forEach(x=>x.classList.remove('sel'));
      c.classList.add('sel');
      paymentMethod = c.dataset.pm;
      const isCredit = paymentMethod==='آجل';
      document.getElementById('amountPaidWrap').style.display = isCredit ? '' : 'none';
      document.getElementById('custRequiredMark').style.display = isCredit ? '' : 'none';
      if(isCredit) document.getElementById('posAmountPaid').value = 0;
    };
  });

  const completeBtn = document.getElementById('completeSaleBtn');
  if(completeBtn) completeBtn.onclick = async ()=>{
    const customerName = document.getElementById('posCustName').value.trim();
    const customerPhone = document.getElementById('posCustPhone').value.trim();
    if(paymentMethod==='آجل' && !customerName){ alert('البيع الآجل لازم اسم عميل على الأقل لتسجيل الدين'); return; }
    const amountPaid = paymentMethod==='آجل' ? Number(document.getElementById('posAmountPaid').value)||0 : total;
    completeBtn.disabled = true; completeBtn.textContent = 'جارٍ إتمام البيع...';
    try{
      for(const c of cart){ await adjustInventoryQtyRemote(c.itemId, -c.qty); }
      await refreshInventory();
      const itemsSummary = cart.map(c=>`${c.name} × ${c.qty} (${c.qty*c.price} ج.م)${c.serials&&c.serials.length?' [SN: '+c.serials.map(s=>s.Serial).join(',')+']':''}`).join('، ');
      const itemsJson = JSON.stringify(cart.map(c=>({name:c.name, qty:c.qty, price:c.price})));
      const saleRes = await saveSaleRemote(itemsSummary, itemsJson, total, customerName, customerPhone, paymentMethod, amountPaid);
      for(const c of cart){
        if(c.serials && c.serials.length){
          for(const sn of c.serials){ await markSerialSoldRemote(sn.ID, saleRes.sale.ID).catch(()=>{}); }
        }
      }
      await refreshSales();
      const hasWarranty = cart.some(c=>c.serials && c.serials.some(s=>Number(s.WarrantyMonths)>0));
      state.lastCompletedSale = {sale: saleRes.sale, cartSnapshot: cart.slice(), hasWarranty, customerName, customerPhone};
      state.cart = [];
      renderPosSell(main);
    }catch(e){ alert('تعذر إتمام البيع: '+e.message); completeBtn.disabled=false; completeBtn.textContent='إتمام البيع'; }
  };
}

async function addItemToCart(itemId, qty, main){
  const item = state.inventory.find(x=>x.ID===itemId);
  if(!item){ alert('الصنف غير موجود'); return; }
  const alreadyInCart = state.cart.filter(c=>c.itemId===itemId).reduce((s,c)=>s+c.qty,0);
  if(qty + alreadyInCart > Number(item.Quantity)){ alert('الكمية أكبر من المتاح في المخزون ('+item.Quantity+')'); return; }
  const availSerials = await loadSerials(itemId, 'In Stock');
  const line = {itemId, name:item.Name, qty, price:Number(item.SellPrice||item.PurchasePrice||0), cost:Number(item.PurchasePrice||0), serials:[], serialsAvailable: availSerials.length>0};
  state.cart.push(line);
  renderPosSell(main);
  if(availSerials.length>0) openSerialPickerForCartLine(state.cart.length-1, availSerials, main);
}

    ${state.sales.length===0 ? '<div class="empty">لا توجد مبيعات بعد.</div>' : `

      ${state.sales.slice().reverse().map(s=>{
        const debt = Number(s.Total||0) - Number(s.AmountPaid!=null?s.AmountPaid:s.Total);
        return `<tr>
        <td class="mono" style="font-weight:900;color:var(--copper-dark);">${s.ID.slice(-8)}</td>
        <td>${cleanDate(s.Date)}</td><td>${s.ItemsSummary}</td>
        <td class="mono">${s.Total}</td><td>${s.PaymentMethod||'نقدي'}</td>

          <button class="btn btn-sm btn-ghost" data-reprint="${s.ID}">إعادة طباعة</button>
          ${debt>0?`<button class="btn btn-sm btn-green" data-settle="${s.ID}">تحصيل دين</button>`:''}
          ${daysSince(s.Date) > RETURN_WINDOW_DAYS
            ? `<button class="btn btn-sm btn-ghost" disabled title="انتهت مهلة الإرجاع (${RETURN_WINDOW_DAYS} يوم)" style="opacity:.5;cursor:not-allowed;">إرجاع (منتهي)</button>`
            : `<button class="btn btn-sm btn-red" data-return-sale="${s.ID}">إرجاع</button>`}
        </td>
      </tr>`;}).join('')}
    </tbody></table>`}
  `;
  main.querySelectorAll('[data-settle]').forEach(btn=>{
    btn.onclick = async ()=>{
      const sale = state.sales.find(s=>s.ID===btn.dataset.settle);
      const debt = Number(sale.Total||0) - Number(sale.AmountPaid||0);
      const amt = prompt(`الدين المتبقي: ${debt} ج.م\nأدخل المبلغ المحصّل الآن:`, debt);
      if(amt===null) return;
      const n = Number(amt);
      if(!n || n<=0){ alert('مبلغ غير صحيح'); return; }
      try{
        await settleSaleDebtRemote(sale.ID, n);
        await refreshSales();
        renderPosSalesLog(main);
      }catch(e){ alert('تعذر تسجيل التحصيل: '+e.message); }
    };
  });
  main.querySelectorAll('[data-reprint]').forEach(btn=>{
    btn.onclick = ()=>{
      const sale = state.sales.find(s=>s.ID===btn.dataset.reprint);
      let items = [];
      try{ items = JSON.parse(sale.ItemsJSON||'[]'); }catch(e){ items = []; }
      if(items.length===0){
        alert('لا تتوفر تفاصيل دقيقة لإعادة طباعة هذه الفاتورة (عملية بيع قديمة قبل إضافة هذه الميزة). سيتم طباعة ملخص فقط.');
        items = [{name: sale.ItemsSummary, qty:1, price:Number(sale.Total||0)}];
      }
      openSalePrint(sale, items);
    };
  });
  main.querySelectorAll('[data-return-sale]').forEach(btn=>{
    btn.onclick = ()=>openReturnModal(btn.dataset.returnSale, main);
  });
}

const RETURN_WINDOW_DAYS = 14;
function daysSince(dateStr){
  const d = new Date(cleanDate(dateStr));
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}
function openReturnModal(saleId, main){
  const sale = state.sales.find(s=>s.ID===saleId);
  const age = daysSince(sale.Date);
  if(age > RETURN_WINDOW_DAYS){
    alert(`عذرًا، لا يمكن إرجاع أصناف هذه العملية — مرّ عليها ${age} يوم، وسياسة الإرجاع محدودة بـ ${RETURN_WINDOW_DAYS} يوم من تاريخ الشراء.`);
    return;
  }
  const win = document.createElement('div');
  win.style = 'position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px;';
  win.innerHTML = `<div style="background:#fff;padding:22px;border-radius:10px;max-width:420px;width:100%;">
    <h3 style="margin-top:0;">إرجاع من عملية بيع</h3>
    <p style="font-size:12.5px;color:#666;">الأصناف الأصلية: ${sale.ItemsSummary}</p>
    <p style="font-size:11.5px;color:var(--amber);">متبقي ${RETURN_WINDOW_DAYS - age} يوم على انتهاء مهلة الإرجاع لهذه العملية.</p>
    <div class="field"><label>الصنف المرتجع</label>
      <select id="retItem">${state.inventory.map(it=>`<option value="${it.ID}">${it.Name}</option>`).join('')}</select>
    </div>
    <div class="field"><label>الكمية المرتجعة</label><input id="retQty" type="number" value="1" min="1"></div>
    <div class="field"><label>المبلغ المسترجع للعميل (ج.م)</label><input id="retAmount" type="number" value="0"></div>
    <div class="actions-row">
      <button class="btn btn-ghost btn-sm" id="retCancel">إلغاء</button>
      <button class="btn btn-red btn-sm" id="retConfirm">تأكيد الإرجاع</button>
    </div>
  </div>`;
  document.body.appendChild(win);
  win.querySelector('#retCancel').onclick = ()=>win.remove();
  win.querySelector('#retConfirm').onclick = async ()=>{
    const itemId = document.getElementById('retItem').value;
    const qty = Number(document.getElementById('retQty').value);
    const amount = Number(document.getElementById('retAmount').value);
    if(!qty || qty<=0){ alert('كمية غير صحيحة'); return; }
    const item = state.inventory.find(x=>x.ID===itemId);
    const btn = win.querySelector('#retConfirm'); btn.disabled = true;
    try{
      await adjustInventoryQtyRemote(itemId, qty); // restock
      await refreshInventory();
      await saveReturnRemote(saleId, `${item.Name} × ${qty}`, amount);
      state.returns = await loadReturns();
      win.remove();
      renderPosSalesLog(main);
      alert('تم تسجيل الإرجاع وإعادة الكمية للمخزون.');
    }catch(e){ alert('تعذر تسجيل الإرجاع: '+e.message); btn.disabled=false; }
  };
}

function attachLogin(){
  document.getElementById('loginBtn').onclick = async ()=>{
    const btn = document.getElementById('loginBtn');
    const name = document.getElementById('loginName').value.trim();
    const pass = document.getElementById('loginPass').value;
    const err = document.getElementById('loginErr');
    err.textContent = '';
    if(!name || !pass){ err.textContent = 'من فضلك أدخل الاسم وكلمة المرور'; return; }
    btn.textContent = 'جارٍ التحقق...'; btn.disabled = true;
    try{
      const res = await loginRemote(name, pass);
      let sections;
      if(res.role==='admin'){ sections = ['maintenance','cameras','pos','inventory','finance']; }
      else {
        sections = String(res.sections||'').split(',').map(s=>s.trim()).filter(Boolean);
        if(sections.length===0) sections = ['maintenance']; // safe default so a user is never fully locked out
      }
      state.user = {name: res.name, role: res.role, sections};
      try{ localStorage.setItem('microerp_session', JSON.stringify(state.user)); }catch(e){ console.warn('localStorage unavailable', e); }
      await init();
    }catch(e){
      err.textContent = 'بيانات الدخول غير صحيحة أو تعذر الاتصال بقاعدة البيانات: '+e.message;
      btn.textContent = 'دخول'; btn.disabled = false;
    }
  };
}

/* ---------------- Main router ---------------- */
function renderMain(){
  const main = document.getElementById('main');
  if(state.tab==='settings' && state.user.role!=='admin'){ state.tab='dashboard'; }
  if(state.tab==='dashboard') return renderDashboard(main);
  if(state.tab==='new') return renderForm(main);
  if(state.tab==='archive') return renderArchive(main);
  if(state.tab==='finance') return; // moved to top-level "المالي" section
  if(state.tab==='inventory') return renderInventory(main, 'صيانة', 'المخزن (قطع الصيانة)');
  if(state.tab==='settings') return renderSettings(main);
}

/* ---------------- Dashboard ---------------- */
function renderDashboard(main){
  const r = state.receipts;
  const today = new Date().toISOString().slice(0,10);
  const inProgress = r.filter(x=>x.status==='قيد الفحص'||x.status==='الصيانة').length;
  const done = r.filter(x=>x.status==='مكتمل').length;
  const todayIncome = state.payments.filter(p=>String(p.Date||'').slice(0,10)===today).reduce((s,p)=>s+Number(p.Amount||0),0);
  const overdue = r.filter(x=>{
    if(x.status!=='مكتمل') return false;
    const d = new Date(x.updatedAt||x.date);
    return (Date.now()-d.getTime())/86400000 > 30;
  }).length;

  main.innerHTML = `
    <h2 class="page-title">لوحة التحكم</h2>
    <div class="subtitle">نظرة سريعة على حالة الصيانة اليوم</div>
    <div class="stat-grid">
      <div class="stat-card blue"><div class="num mono">${inProgress}</div><div class="lbl">أجهزة قيد الفحص/الصيانة</div></div>
      <div class="stat-card green"><div class="num mono">${done}</div><div class="lbl">أجهزة مكتملة</div></div>
      <div class="stat-card copper"><div class="num mono">${todayIncome.toLocaleString()}</div><div class="lbl">مقبوضات اليوم (ج.م)</div></div>
      <div class="stat-card red"><div class="num mono">${overdue}</div><div class="lbl">أجهزة متروكة +30 يوم</div></div>
      <div class="stat-card"><div class="num mono">${r.length}</div><div class="lbl">إجمالي الإيصالات</div></div>
    </div>
    <div class="card">
      <h3>آخر الإيصالات</h3>
      ${r.length===0 ? '<div class="empty">لا يوجد إيصالات بعد. ابدأ بإنشاء إيصال جديد.</div>' : archiveTable(r.slice(-6).reverse())}
    </div>
  `;
  attachRowActions(main);
}

/* ---------------- New receipt form (stepper) ---------------- */
function startNewDraft(){
  state.draft = newDraft();
  state.formStep = 0;
  nextReceiptNumber()
    .then(n=>{ state.draft.receiptNumber = n; renderMain(); })
    .catch(e=>{ console.error('nextReceiptNumber failed', e); state.draft.receiptNumber = 'MT-'+Date.now(); renderMain(); });
}

const STEPS = ['بيانات العميل','بيانات الجهاز','الأعطال والصيانة','المالي والتسليم','مراجعة وحفظ'];

function renderForm(main){
  if(!state.draft){ startNewDraft(); return; }
  const d = state.draft;
  main.innerHTML = `
    <h2 class="page-title">إيصال جديد</h2>
    <div class="subtitle">رقم الإيصال: <b class="mono">${d.receiptNumber}</b> — التاريخ: <b class="mono">${d.date}</b></div>
    <div class="stepper">
      ${STEPS.map((s,i)=>`<div class="step-dot ${i===state.formStep?'active':(i<state.formStep?'done':'')}" data-i="${i}">${i+1}. ${s}</div>`).join('')}
    </div>
    <div id="stepBody"></div>
  `;
  document.querySelectorAll('.step-dot').forEach(el=>el.onclick=()=>{ state.formStep = Number(el.dataset.i); renderMain(); });
  const body = document.getElementById('stepBody');
  if(state.formStep===0) return stepCustomer(body,d);
  if(state.formStep===1) return stepDevice(body,d);
  if(state.formStep===2) return stepFaults(body,d);
  if(state.formStep===3) return stepFinance(body,d);
  if(state.formStep===4) return stepReview(body,d);
}

function stepNav(body, canBack, canNext, nextLabel){
  const div = document.createElement('div');
  div.className='actions-row';
  div.innerHTML = `
    <button class="btn btn-ghost" id="backBtn" ${canBack?'':'disabled'}>السابق</button>
    <button class="btn btn-primary" id="nextBtn">${nextLabel||'التالي'}</button>
  `;
  body.appendChild(div);
  if(canBack) div.querySelector('#backBtn').onclick = ()=>{ state.formStep--; renderMain(); };
  div.querySelector('#nextBtn').onclick = canNext;
}

    </div>

      <h3>ميعاد التسليم التقديري</h3>
      <div class="chip-group" style="margin-bottom:12px;">

async function saveReceipt(d, print, sendWa){
  d.updatedBy = state.user.name;
  d.updatedAt = new Date().toISOString();
  const btns = document.querySelectorAll('#saveOnlyBtn,#savePrintBtn,#saveWaBtn');
  btns.forEach(b=>{ b.disabled = true; });
  try{
    await saveReceiptRemote(d);
    if(Number(d.deposit||0) > 0){
      try{ await savePaymentRemote(d.id, Number(d.deposit), 'دفعة عند استلام الجهاز'); }
      catch(payErr){ console.error('payment log failed', payErr); alert('تم حفظ الإيصال، لكن تعذر تسجيل الدفعة المقدمة في سجل الدفعات: '+payErr.message+'\n(تأكد من وجود ورقة Payments في قاعدة البيانات)'); }
      await refreshPayments();
    }
    if(!state.customers.find(c=>c.phone===d.customer.phone)){
      await saveCustomerRemote(d.customer);
      state.customers.push(d.customer);
    }
    state.receipts.push(d);
    state.draft = null;
    state.tab = 'archive';
    renderMain();
    if(print){ setTimeout(()=>openReceiptPrint(d,'receipt'), 300); }
    if(sendWa){ setTimeout(()=>openWhatsappChoice(d), 300); }
  }catch(e){
    alert('تعذر حفظ الإيصال في قاعدة البيانات: '+e.message);
    btns.forEach(b=>{ b.disabled = false; });
  }
}
