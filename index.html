<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ميكروERP | نظام إدارة الصيانة والمبيعات المتكامل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.12.3/JsBarcode.all.min.js"></script>
<style>
:root {
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --primary-light: #eff6ff;
  --primary-focus: rgba(37, 99, 235, 0.15);
  
  --slate-900: #0f172a;
  --slate-800: #1e293b;
  --slate-700: #334155;
  --slate-600: #475569;
  --slate-500: #64748b;
  --slate-400: #94a3b8;
  --slate-300: #cbd5e1;
  --slate-200: #e2e8f0;
  --slate-100: #f1f5f9;
  --slate-50: #f8fafc;
  
  --ink: #0f172a;
  --ink-secondary: #475569;
  --paper: #f1f5f9;
  --paper2: #ffffff;
  --paper3: #f8fafc;
  --line: #e2e8f0;
  --line-strong: #cbd5e1;
  --card-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.06), 0 1px 2px 0 rgba(0, 0, 0, 0.04);
  
  --blue: #2563eb;
  --blue-bg: #dbeafe;
  --blue-text: #1e40af;
  
  --amber: #d97706;
  --amber-bg: #fef3c7;
  --amber-text: #92400e;
  
  --red: #e11d48;
  --red-bg: #ffe4e6;
  --red-text: #9f1239;
  
  --green: #10b981;
  --green-bg: #d1fae5;
  --green-text: #065f46;
  
  --purple: #8b5cf6;
  --purple-bg: #ede9fe;
  --purple-text: #5b21b6;
  
  --radius-sm: 6px;
  --radius: 12px;
  --radius-lg: 16px;
  --radius-full: 9999px;
  
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
  --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
  
  --font-main: 'Tajawal', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: 'IBM Plex Mono', monospace, Consolas, Courier;
}

[data-theme="dark"] {
  --primary: #3b82f6;
  --primary-hover: #60a5fa;
  --primary-light: rgba(59, 130, 246, 0.18);
  --primary-focus: rgba(59, 130, 246, 0.25);
  
  --slate-900: #030712;
  --slate-800: #0b0f19;
  --slate-700: #1e293b;
  --slate-600: #334155;
  --slate-500: #94a3b8;
  --slate-400: #cbd5e1;
  --slate-300: #475569;
  --slate-200: #334155;
  --slate-100: #1e293b;
  --slate-50: #0f172a;
  
  --ink: #f8fafc;
  --ink-secondary: #94a3b8;
  --paper: #0b0f19;
  --paper2: #111827;
  --paper3: #1f2937;
  --line: #1f2937;
  --line-strong: #374151;
  --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.35);
  
  --blue-bg: rgba(37, 99, 235, 0.2);
  --blue-text: #93c5fd;
  --amber-bg: rgba(217, 119, 6, 0.2);
  --amber-text: #fcd34d;
  --red-bg: rgba(225, 29, 72, 0.2);
  --red-text: #fda4af;
  --green-bg: rgba(16, 185, 129, 0.2);
  --green-text: #6ee7b7;
  --purple-bg: rgba(139, 92, 246, 0.2);
  --purple-text: #c4b5fd;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-main);
  background: var(--paper);
  color: var(--ink);
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.2s ease, color 0.2s ease;
}
.mono { font-family: var(--font-mono); letter-spacing: -0.02em; }

#app { display: flex; min-height: 100vh; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--slate-300); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--slate-400); }

/* Sidebar */
.sidebar {
  width: 250px;
  background: var(--slate-900);
  color: #f8fafc;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  box-shadow: 4px 0 24px rgba(0,0,0,0.1);
  z-index: 20;
  transition: all 0.2s ease;
}
.brand {
  padding: 20px 18px 15px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-logo-wrap {
  width: 40px;
  height: 40px;
  background: linear-gradient(135deg, var(--primary), #38bdf8);
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 20px;
  box-shadow: 0 4px 12px rgba(37,99,235,0.35);
  flex-shrink: 0;
}
.brand-text h1 {
  font-size: 16.5px;
  font-weight: 800;
  margin: 0;
  color: #ffffff;
  letter-spacing: -0.01em;
}
.brand-text span {
  font-size: 11px;
  color: #38bdf8;
  display: block;
  margin-top: 1px;
  font-weight: 500;
}

.nav-section {
  padding: 12px 12px 4px;
  font-size: 10px;
  font-weight: 700;
  color: var(--slate-400);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.nav-item {
  margin: 3px 8px;
  padding: 9px 12px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  color: #94a3b8;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  gap: 10px;
  transition: all 0.15s ease;
  user-select: none;
}
.nav-item:hover {
  background: rgba(255,255,255,0.06);
  color: #ffffff;
  transform: translateX(-2px);
}
.nav-item.active {
  background: linear-gradient(135deg, var(--primary), var(--primary-hover));
  color: #ffffff;
  box-shadow: 0 4px 12px rgba(37,99,235,0.3);
}
.nav-item-icon {
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 20px;
}

.sidebar-foot {
  margin-top: auto;
  padding: 14px;
  background: rgba(0,0,0,0.25);
  border-top: 1px solid rgba(255,255,255,0.06);
}
.user-card {
  display: flex;
  align-items: center;
  gap: 10px;
}
.user-avatar {
  width: 34px;
  height: 34px;
  border-radius: var(--radius-full);
  background: linear-gradient(135deg, #10b981, #059669);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 13.5px;
}
.user-info {
  flex: 1;
  min-width: 0;
}
.user-name {
  font-size: 12.5px;
  font-weight: 700;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.role-badge {
  display: inline-block;
  background: rgba(37,99,235,0.25);
  color: #60a5fa;
  font-size: 9.5px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: var(--radius-full);
  margin-top: 1px;
}

/* Main Content Area */
main {
  flex: 1;
  padding: 24px 32px;
  max-width: 1400px;
  width: 100%;
  box-sizing: border-box;
}

/* Top App Header */
.top-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 14px;
}
.page-title {
  font-size: 22px;
  font-weight: 800;
  color: var(--ink);
  letter-spacing: -0.02em;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 10px;
}
.subtitle {
  color: var(--ink-secondary);
  font-size: 13px;
  margin-top: 2px;
}

/* Network Sync Indicator Pill */
.sync-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 12px;
  border-radius: var(--radius-full);
  font-size: 11.5px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s ease;
  user-select: none;
  box-shadow: var(--shadow-sm);
}
.sync-pill.online {
  background: var(--green-bg);
  color: var(--green-text);
  border: 1px solid var(--green);
}
.sync-pill.offline {
  background: var(--amber-bg);
  color: var(--amber-text);
  border: 1px solid var(--amber);
}
.sync-pill.syncing {
  background: var(--blue-bg);
  color: var(--blue-text);
  border: 1px solid var(--blue);
  animation: pulse 1.2s infinite;
}
@keyframes pulse {
  0% { opacity: 0.8; transform: scale(0.99); }
  50% { opacity: 1; transform: scale(1.01); }
  100% { opacity: 0.8; transform: scale(0.99); }
}

/* Theme Toggle Button */
.theme-toggle-btn {
  background: var(--paper2);
  border: 1px solid var(--line);
  color: var(--ink);
  padding: 7px 12px;
  border-radius: var(--radius-full);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s ease;
}
.theme-toggle-btn:hover {
  background: var(--paper3);
  border-color: var(--primary);
}

/* Cards */
.card {
  background: var(--paper2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 18px;
  box-shadow: var(--card-shadow);
  transition: box-shadow 0.2s ease, border-color 0.2s ease;
}
.card:hover {
  box-shadow: var(--shadow);
}
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  padding-bottom: 10px;
  margin-bottom: 16px;
}
.card h3 {
  margin: 0;
  font-size: 15.5px;
  font-weight: 800;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Dashboard Stat Cards */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 14px;
  margin-bottom: 22px;
}
.stat-card {
  background: var(--paper2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 18px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--card-shadow);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.stat-card::before {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  left: 0;
  height: 4px;
  background: var(--slate-300);
}
.stat-card.blue::before { background: var(--blue); }
.stat-card.green::before { background: var(--green); }
.stat-card.amber::before { background: var(--amber); }
.stat-card.red::before { background: var(--red); }
.stat-card.purple::before { background: var(--purple); }

.stat-card .top-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.stat-card .icon-box {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
}
.stat-card.blue .icon-box { background: var(--blue-bg); color: var(--blue-text); }
.stat-card.green .icon-box { background: var(--green-bg); color: var(--green-text); }
.stat-card.amber .icon-box { background: var(--amber-bg); color: var(--amber-text); }
.stat-card.red .icon-box { background: var(--red-bg); color: var(--red-text); }
.stat-card.purple .icon-box { background: var(--purple-bg); color: var(--purple-text); }

.stat-card .num {
  font-size: 26px;
  font-weight: 800;
  color: var(--ink);
  line-height: 1.2;
  margin-top: 8px;
}
.stat-card .lbl {
  font-size: 12px;
  color: var(--ink-secondary);
  font-weight: 600;
  margin-top: 3px;
}

/* Stepper */
.stepper {
  display: flex;
  gap: 8px;
  margin-bottom: 22px;
  background: var(--paper2);
  padding: 8px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  box-shadow: var(--card-shadow);
}
.step-dot {
  flex: 1;
  text-align: center;
  padding: 9px 8px;
  background: var(--paper3);
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-secondary);
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.step-dot:hover { background: var(--slate-200); }
.step-dot.active {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 2px 8px rgba(37,99,235,0.25);
}
.step-dot.done {
  background: var(--green-bg);
  color: var(--green-text);
}

/* Forms & Inputs */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.grid4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 14px; }

label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 5px;
}
input, select, textarea {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 13px;
  background: var(--paper2);
  color: var(--ink);
  outline: none;
  transition: all 0.15s ease;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-focus);
}
.field { margin-bottom: 12px; }
textarea { min-height: 75px; resize: vertical; }

/* Chips */
.chip-group { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  padding: 6px 12px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-full);
  font-size: 12px;
  cursor: pointer;
  background: var(--paper2);
  font-weight: 600;
  color: var(--ink);
  user-select: none;
  transition: all 0.15s ease;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.chip:hover {
  background: var(--paper3);
  border-color: var(--slate-400);
}
.chip.sel {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
  box-shadow: 0 2px 6px rgba(37,99,235,0.25);
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  border: none;
  font-family: inherit;
  font-weight: 700;
  font-size: 12.5px;
  cursor: pointer;
  transition: all 0.15s ease;
  user-select: none;
  text-decoration: none;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--primary); color: #fff; box-shadow: 0 2px 6px rgba(37,99,235,0.25); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-ghost { background: var(--paper2); border: 1px solid var(--line-strong); color: var(--ink); }
.btn-ghost:hover { background: var(--paper3); border-color: var(--slate-400); }
.btn-green { background: var(--green); color: #fff; }
.btn-green:hover { background: #059669; }
.btn-blue { background: #0284c7; color: #fff; }
.btn-blue:hover { background: #0369a1; }
.btn-amber { background: var(--amber); color: #fff; }
.btn-amber:hover { background: #b45309; }
.btn-red { background: var(--red); color: #fff; }
.btn-red:hover { background: #be123c; }
.btn-whatsapp { background: #25D366; color: #fff; }
.btn-whatsapp:hover { background: #1ebe57; }
.wa-icon { width: 14px; height: 14px; flex-shrink: 0; }
.btn-sm { padding: 5px 11px; font-size: 11.5px; }
.btn-xs { padding: 4px 8px; font-size: 10.5px; border-radius: 4px; }
.actions-row { display: flex; gap: 10px; justify-content: space-between; align-items: center; margin-top: 14px; }

/* Status Badges */
.status-badge {
  padding: 3px 9px;
  border-radius: var(--radius-full);
  font-size: 11px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid transparent;
}
.st-check { background: var(--blue-bg); color: var(--blue-text); border-color: #bfdbfe; }
.st-repair { background: var(--amber-bg); color: var(--amber-text); border-color: #fde68a; }
.st-done { background: var(--green-bg); color: var(--green-text); border-color: #a7f3d0; }
.st-failed { background: var(--red-bg); color: var(--red-text); border-color: #fecdd3; }
.st-rejected { background: var(--slate-200); color: var(--slate-700); border-color: var(--slate-300); }

/* Quick Status Button */
.btn-status-quick {
  background: var(--paper2);
  border: 1px solid var(--line-strong);
  padding: 3px 8px;
  border-radius: var(--radius-full);
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s ease;
  box-shadow: 0 1px 2px rgba(0,0,0,0.03);
}
.btn-status-quick:hover {
  border-color: var(--primary);
  background: var(--primary-light);
  color: var(--primary);
}

/* Tables */
.table-wrap {
  background: var(--paper2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: auto;
  box-shadow: var(--card-shadow);
}
table {
  width: 100%;
  border-collapse: collapse;
  text-align: right;
}
th, td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  font-size: 12.5px;
}
th {
  background: var(--paper3);
  font-weight: 700;
  color: var(--ink-secondary);
  font-size: 11.5px;
  white-space: nowrap;
}
tbody tr { transition: background-color 0.1s ease; }
tbody tr:hover { background-color: var(--paper3); }
tr:last-child td { border-bottom: none; }
.row-actions { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }

/* Filter Bar */
.filters-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
  align-items: center;
  background: var(--paper2);
  padding: 10px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  box-shadow: var(--card-shadow);
}
.filters-bar input, .filters-bar select {
  width: auto;
  min-width: 160px;
}

/* Chart of Accounts & Tree */
.tree-wrap { display: flex; flex-direction: column; gap: 4px; }
.tree-node {
  background: var(--paper2);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: all 0.15s ease;
  user-select: none;
}
.tree-node:hover { background: var(--paper3); border-color: var(--primary); }
.tree-node.level-1 { background: var(--paper3); font-weight: 800; border-right: 4px solid var(--primary); margin-top: 8px; }
.tree-node.level-2 { margin-right: 18px; border-right: 3px solid var(--slate-400); }
.tree-node.level-3 { margin-right: 36px; border-right: 2px solid var(--slate-300); }
.tree-node.level-4 { margin-right: 54px; }
.tree-node-title { display: flex; align-items: center; gap: 9px; flex: 1; min-width: 0; }
.account-code { background: var(--paper3); color: var(--primary); font-weight: 800; padding: 2px 7px; border-radius: 4px; font-size: 11.5px; border: 1px solid var(--line); }
.nature-pill { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: var(--radius-full); }
.nature-pill.debit { background: var(--blue-bg); color: var(--blue-text); }
.nature-pill.credit { background: var(--green-bg); color: var(--green-text); }
.journal-line-row { display: grid; grid-template-columns: 2fr 1fr 1fr 2fr 35px; gap: 8px; align-items: center; margin-bottom: 8px; }

/* Modal Windows */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.7);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 16px;
  animation: fadeIn 0.15s ease-out;

<body>
<div id="app"></div>
<div id="toastContainer"></div>

<script>
/* ---------------- Google Sheets API & Offline Sync Engine ---------------- */
const API_URL = 'https://script.google.com/macros/s/AKfycbzpi81aPJwwsvHCqUKCkUxEhT0l4NnLgcCBPab1xjvx0B3vhzamCVkwiohrOCfWkKcm/exec';

/* Local Cache Helpers */
function getCache(key, fallback){
  try {
    const d = localStorage.getItem('microerp_cache_' + key);
    return d ? JSON.parse(d) : fallback;
  } catch(e) { return fallback; }
}
function setCache(key, val){
  try { localStorage.setItem('microerp_cache_' + key, JSON.stringify(val)); } catch(e){}
}

/* Offline Sync Queue */
function getSyncQueue(){
  try { return JSON.parse(localStorage.getItem('microerp_sync_queue') || '[]'); } catch(e){ return []; }
}
function saveSyncQueue(q){
  try { localStorage.setItem('microerp_sync_queue', JSON.stringify(q)); } catch(e){}
  updateSyncStatusPill();
}
function addToSyncQueue(action, data){
  const q = getSyncQueue();
  q.push({ id: 'sync_' + Date.now() + '_' + Math.random().toString(36).slice(2,7), action, data, timestamp: new Date().toISOString() });
  saveSyncQueue(q);
}

/* Network Request Wrappers with Local Fallback */
async function apiGet(action, params){
  if(!navigator.onLine){
    // Return cached data immediately
    return getCache(action, []);
  }
  try {
    const q = new URLSearchParams({action, ...(params||{})});
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 9000);
    const res = await fetch(`${API_URL}?${q.toString()}`, { signal: controller.signal });
    clearTimeout(timeout);
    const json = await res.json();
    if(json && json.error) throw new Error(json.error);
    // Cache success
    setCache(action, json);
    return json;
  } catch(e) {
    console.warn(`apiGet failed for ${action}, falling back to local cache:`, e.message);
    return getCache(action, []);
  }
}

async function apiPost(action, data){
  if(!navigator.onLine){
    addToSyncQueue(action, data);
    return { ok: true, offline: true };
  }
  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 9000);
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({action, ...data}),
      signal: controller.signal
    });
    clearTimeout(timeout);
    const json = await res.json();
    if(json && json.error) throw new Error(json.error);
    return json;
  } catch(e) {
    console.warn(`apiPost network error on ${action}, enqueuing for background sync:`, e.message);
    addToSyncQueue(action, data);
    return { ok: true, offline: true };
  }
}

/* Background Synchronization */
let isSyncingNow = false;
async function syncOfflineQueue(){
  if(!navigator.onLine || isSyncingNow) return;
  const q = getSyncQueue();
  if(!q.length) { updateSyncStatusPill(); return; }

  isSyncingNow = true;
  updateSyncStatusPill();
  showToast(`🔄 جاري مزامنة ${q.length} عمليات مسجلة دون إنترنت...`, 'info');

  const remaining = [];
  for(const item of q){
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify({action: item.action, ...item.data})
      });
      const json = await res.json();
      if(json && json.error) throw new Error(json.error);
    } catch(err) {
      console.warn('Sync failed for item:', item, err);
      remaining.push(item);
    }
  }

  saveSyncQueue(remaining);
  isSyncingNow = false;
  updateSyncStatusPill();

  if(remaining.length === 0){
    showToast('✅ تم مزامنة كافة العمليات بنجاح مع السحابة!', 'success');
    // Refresh memory from cloud
    try {
      [state.receipts, state.customers, state.technicians, state.settings, state.payments, state.inventory, state.sales, state.quotations, state.services, state.purchases, state.suppliers, state.expenses] = await Promise.all([
        loadReceipts(), loadCustomers(), loadTechnicians(), loadSettings(), loadPayments(), loadInventory(), loadSales(), loadQuotations(), loadServices(), loadPurchases(), loadSuppliers(), loadExpenses()
      ]);
      renderMain();
    } catch(e){}
  } else {
    showToast(`⚠️ تبقى ${remaining.length} عمليات قيد المزامنة عند توفر اتصال أقوى.`, 'info');
  }
}

/* Listen to online/offline network events */
window.addEventListener('online', ()=>{
  updateSyncStatusPill();
  showToast('🌐 تم استعادة الاتصال بالإنترنت! جاري المزامنة...', 'success');
  syncOfflineQueue();
});
window.addEventListener('offline', ()=>{
  updateSyncStatusPill();
  showToast('📴 انقطع الإنترنت — النظام يعمل محلياً بكفاءة 100%', 'info');
});

function updateSyncStatusPill(){
  const pill = document.getElementById('networkSyncPill');
  if(!pill) return;
  const q = getSyncQueue();
  if(!navigator.onLine){
    pill.className = 'sync-pill offline';
    pill.innerHTML = `<span>📴 غير متصل</span>${q.length ? `<span class="mono">(${q.length} معلقة)</span>` : ''}`;
    pill.title = 'أنت تعمل حالياً في الوضع المحلي (أوفلاين)، وسيتم حفظ وتطبيق كل العمليات تلقائياً.';
  } else if(isSyncingNow){
    pill.className = 'sync-pill syncing';
    pill.innerHTML = `<span>🔄 جاري المزامنة...</span>`;
  } else if(q.length > 0){
    pill.className = 'sync-pill offline';
    pill.innerHTML = `<span>⚠️ ${q.length} عمليات معلقة</span>`;
    pill.title = 'اضغط للمزامنة الفورية مع السحابة';
  } else {
    pill.className = 'sync-pill online';
    pill.innerHTML = `<span>🟢 متصل ومتزامن</span>`;
    pill.title = 'النظام متصل بالسحابة ومتزامن بالكامل';
  }
}

/* ---- Toast Notification Utility ---- */
function showToast(msg, type='info', duration=3200){
  const container = document.getElementById('toastContainer');
  if(!container) return;
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  const icons = { success: '✅', error: '❌', info: 'ℹ️' };
  t.innerHTML = `<span>${icons[type] || 'ℹ️'}</span><span>${msg}</span>`;
  container.appendChild(t);
  setTimeout(()=>{
    t.style.opacity = '0';
    t.style.transform = 'translateY(10px)';
    t.style.transition = 'all 0.2s ease';
    setTimeout(()=>t.remove(), 200);
  }, duration);
}

/* ---- Mapping between internal shape and flat sheet rows ---- */
function receiptToRow(d){
  return {
    ID: d.id, ReceiptNumber: d.receiptNumber, Date: d.date,
    CustomerName: d.customer.name, CustomerPhone: d.customer.phone, CustomerEmail: d.customer.email,
    Category: d.device.category, Brand: d.device.brand==='أخرى' ? d.device.brandOther : d.device.brand,
    Model: d.device.model, Accessories: d.device.accessories,
    Faults: (d.faults||[]).join('، '), FaultNotes: d.faultNotes,
    Technician: d.technician, Cost: d.cost, Deposit: d.deposit, Refunded: d.refunded || 0, PartsCost: d.partsCost || 0, PartsUsed: d.partsUsed || '',
    DeliveryDate: d.deliveryDate, Status: d.status, Paid: d.paid ? 'TRUE' : 'FALSE',
    Bonus: d.bonus || '', CreatedBy: d.createdBy, UpdatedBy: d.updatedBy, UpdatedAt: d.updatedAt
  };
}
function rowToReceipt(row){
  return {
    id: row.ID, receiptNumber: row.ReceiptNumber, date: row.Date,
    customer: {name: row.CustomerName, phone: String(row.CustomerPhone||''), email: row.CustomerEmail||''},
    device: {category: row.Category, brand: row.Brand, brandOther: '', model: row.Model, accessories: row.Accessories||''},
    faults: row.Faults ? String(row.Faults).split('، ').filter(Boolean) : [],
    faultNotes: row.FaultNotes||'', technician: row.Technician||'',
    cost: row.Cost, deposit: row.Deposit, refunded: Number(row.Refunded||0), partsCost: Number(row.PartsCost||0), partsUsed: row.PartsUsed||'', deliveryDate: row.DeliveryDate,
    status: row.Status||'قيد الفحص', paid: String(row.Paid)==='TRUE', bonus: row.Bonus,
    createdBy: row.CreatedBy||'', updatedBy: row.UpdatedBy||'', updatedAt: row.UpdatedAt||''
  };
}

/* Entity Loaders */
async function loadSettings(){
  const s = await apiGet('getSettings');
  const obj = {shopName: s.shopName || 'صيانة ميكروتك', logoUrl: s.logoUrl || ''};
  setCache('settings', obj);
  return obj;
}
async function saveSettingRemote(key, value){
  state.settings[key] = value;
  setCache('settings', state.settings);
  return apiPost('saveSetting', {key, value});
}

function getReceiptPayments(r){
  if(!r) return [];
  const targetId = typeof r === 'object' ? String(r.id||'').trim() : String(r).trim();
  const targetNum = typeof r === 'object' && r.receiptNumber ? String(r.receiptNumber).trim() : '';
  return (state.payments||[]).filter(p => {
    const pId = String(p.ReceiptID||'').trim();
    return (targetId && pId === targetId) || (targetNum && pId === targetNum);
  });
}

async function loadPayments(receiptId){
  if(receiptId){
    return getReceiptPayments(receiptId);
  }
  const rows = await apiGet('getPayments');
  if(Array.isArray(rows)){
    state.payments = rows;
    setCache('payments', rows);
  }
  return state.payments;
}
async function savePaymentRemote(receiptId, amount, note){
  const payment = {
    ID: 'p_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
    ReceiptID: receiptId, Date: new Date().toISOString().slice(0,10),
    Amount: Number(amount), Note: note || '', By: state.user ? state.user.name : 'نظام'
  };
  state.payments.push(payment);
  setCache('payments', state.payments);
  // Auto Journal Entry: Dr. 1101 (الخزينة) / Cr. 4101 (إيرادات الصيانة)
  recordAutoJournalEntry(
    `تحصيل دفعة صيانة (${note || 'دفعة إيصال'})`,
    'Receipt',
    receiptId,
    [
      {AccountCode:'1101', AccountName:'الخزينة الرئيسية (النقدية)', Debit:Number(amount), Credit:0, Notes:'تحصيل نقدية بالدرج'},
      {AccountCode:'4101', AccountName:'إيرادات خدمات الصيانة', Debit:0, Credit:Number(amount), Notes:`إيصال: ${receiptId}`}
    ]
  ).catch(e=>{});
  return apiPost('savePayment', {receiptId, amount: payment.Amount, note: payment.Note, date: payment.Date, user: payment.By});
}

async function loadInventory(){
  const rows = await apiGet('getInventory');
  setCache('inventory', rows);
  return rows;
}
async function saveInventoryItemRemote(item){
  if(!item.ID) item.ID = 'inv_' + Date.now();
  const idx = state.inventory.findIndex(x=>x.ID===item.ID);
  if(idx>-1) state.inventory[idx] = item; else state.inventory.push(item);
  setCache('inventory', state.inventory);
  return apiPost('saveInventoryItem', {data:item});
}
async function deleteInventoryItemRemote(id){
  state.inventory = state.inventory.filter(x=>x.ID!==id);
  setCache('inventory', state.inventory);
  return apiPost('deleteInventoryItem', {id, role: state.user.role});
}
async function adjustInventoryQtyRemote(id, delta){
  const it = state.inventory.find(x=>x.ID===id);
  if(it) it.Quantity = Number(it.Quantity||0) + Number(delta);
  setCache('inventory', state.inventory);

async function recordAutoJournalEntry(desc, refType, refId, lines){
  const totalDebit = lines.reduce((s,l)=>s+Number(l.Debit||0),0);
  const totalCredit = lines.reduce((s,l)=>s+Number(l.Credit||0),0);
  const entry = {
    ID: 'je_' + Date.now() + '_' + Math.floor(Math.random()*1000),
    EntryNumber: 'JE-' + new Date().getFullYear() + '-' + String(Date.now()).slice(-4),
    Date: new Date().toISOString().slice(0,10),
    Description: desc,
    ReferenceType: refType,
    ReferenceID: refId || '',
    LinesJSON: JSON.stringify(lines),
    Lines: lines,
    TotalDebit: totalDebit,
    TotalCredit: totalCredit,
    By: state.user ? state.user.name : 'نظام'
  };
  return saveJournalEntryRemote(entry);
}

function getAccountStats(accountCode){
  const code = String(accountCode).trim();
  const acc = state.accounts.find(a=>String(a.Code)===code);
  const nature = acc ? acc.Nature : 'مدين';
  let totalDebit = 0;
  let totalCredit = 0;

  // Direct transactions from journal entries
  (state.journalEntries||[]).forEach(je=>{
    (je.Lines||[]).forEach(l=>{
      if(String(l.AccountCode).trim()===code){
        totalDebit += Number(l.Debit||0);
        totalCredit += Number(l.Credit||0);
      }
    });
  });

  // Also include child accounts if this is a parent category
  const children = state.accounts.filter(a=>String(a.ParentCode)===code);
  children.forEach(ch=>{
    const chStats = getAccountStats(ch.Code);
    totalDebit += chStats.totalDebit;
    totalCredit += chStats.totalCredit;
  });

  const initBal = Number(acc ? acc.Balance : 0);
  const netBalance = nature === 'مدين' ? (initBal + totalDebit - totalCredit) : (initBal + totalCredit - totalDebit);

  return { totalDebit, totalCredit, netBalance, nature };
}

async function loginRemote(name, password){
  if(!navigator.onLine){
    // Offline local auth check
    const cachedUsers = getCache('users', [
      {Name:'admin', Password:'admin', Role:'admin', Sections:'maintenance,cameras,pos,inventory,finance'}
    ]);
    const found = cachedUsers.find(u => u.Name === name && String(u.Password) === String(password));
    if(found){
      return { name: found.Name, role: found.Role, sections: found.Sections || 'maintenance,cameras,pos,inventory,finance' };
    }
    // Fallback emergency offline admin
    if(name==='admin' && password==='admin'){
      return { name:'admin', role:'admin', sections:'maintenance,cameras,pos,inventory,finance' };
    }
    throw new Error('بيانات الدخول غير صحيحة (وضع غير متصل)');
  }
  const res = await apiGet('login', {name, password});
  // Cache user credentials for future offline logins
  const users = getCache('users', []);
  const idx = users.findIndex(u=>u.Name===name);
  const userObj = {Name:name, Password:password, Role:res.role, Sections:res.sections};
  if(idx>-1) users[idx]=userObj; else users.push(userObj);
  setCache('users', users);
  return res;
}

/* ---------------- Init ---------------- */
async function init(){
  if(checkCustomerTrackingURL()) return;
  
  // Instant load from cache first for zero-wait UI
  state.receipts = getCache('receipts', state.receipts);
  state.customers = getCache('customers', state.customers);
  state.technicians = getCache('technicians', state.technicians);
  state.settings = getCache('settings', state.settings);
  state.payments = getCache('payments', state.payments);
  state.inventory = getCache('inventory', state.inventory);
  state.sales = getCache('sales', state.sales);
  state.quotations = getCache('quotations', state.quotations);
  state.services = getCache('services', state.services);
  state.purchases = getCache('purchases', state.purchases);
  state.suppliers = getCache('suppliers', state.suppliers);
  state.expenses = getCache('expenses', state.expenses);
  state.accounts = getCache('accounts', state.accounts);
  state.journalEntries = getCache('journal', state.journalEntries);

  render();
  updateSyncStatusPill();

  // If online, fetch fresh updates in background
  if(navigator.onLine){
    try {
      [state.receipts, state.customers, state.technicians, state.settings, state.payments, state.inventory, state.sales, state.quotations, state.services, state.purchases, state.suppliers, state.expenses, state.accounts, state.journalEntries] = await Promise.all([
        loadReceipts(), loadCustomers(), loadTechnicians(), loadSettings(), loadPayments(), loadInventory(), loadSales(), loadQuotations(), loadServices(), loadPurchases(), loadSuppliers(), loadExpenses(), loadAccounts(), loadJournalEntries()
      ]);
      render();
      syncOfflineQueue();
    } catch(e) {
      console.warn('Init background fetch failed, keeping local cache:', e);
    }
  }

  // Periodic heartbeat sync every 35 seconds
  setInterval(()=>{
    if(navigator.onLine && getSyncQueue().length > 0){
      syncOfflineQueue();
    }
  }, 35000);
}
async function refreshPayments(){ state.payments = await loadPayments(); }
async function refreshSales(){ state.sales = await loadSales(); }
async function refreshExpenses(){ state.expenses = await loadExpenses(); }

/* ---------------- Analytics & Charts ---------------- */
function renderMaintenanceAnalytics(main){
  const r = state.receipts;
  const totalCost = r.reduce((s,x)=>s+Number(x.cost||0),0);
  const totalParts = r.reduce((s,x)=>s+Number(x.partsCost||0),0);
  const completed = r.filter(x=>x.status==='مكتمل').length;
  const completionRate = r.length ? Math.round((completed/r.length)*100) : 0;

  // Category counts
  const catCounts = {};
  r.forEach(x=>{ const c = x.device.category||'أخرى'; catCounts[c] = (catCounts[c]||0)+1; });

  // Tech counts
  const techCounts = {};
  r.forEach(x=>{
    const t = x.technician||'غير محدد';
    if(!techCounts[t]) techCounts[t] = {total:0, done:0, income:0};
    techCounts[t].total++;
    if(x.status==='مكتمل') techCounts[t].done++;
    techCounts[t].income += Number(x.cost||0);
  });

  main.innerHTML = `

      <div>
        <h2 class="page-title">📈 التقارير والتحليلات البيانية</h2>
        <div class="subtitle">إحصائيات تفصيلية لأداء الصيانة وفئات الأجهزة وإنتاجية الفنيين</div>
      </div>

      <div class="stat-card green"><div class="num mono">${completionRate}%</div><div class="lbl">نسبة إنجاز الصيانة</div></div>
      <div class="stat-card blue"><div class="num mono">${totalCost.toLocaleString()} ج.م</div><div class="lbl">إجمالي قيمة الخدمات</div></div>
      <div class="stat-card amber"><div class="num mono">${totalParts.toLocaleString()} ج.م</div><div class="lbl">إجمالي تكلفة قطع الغيار</div></div>
      <div class="stat-card purple"><div class="num mono">${(totalCost-totalParts).toLocaleString()} ج.م</div><div class="lbl">صافي عائد الصيانة</div></div>
    </div>

/* ---------------- New Receipt Form ---------------- */
function startNewDraft(){
  state.draft = newDraft();
  state.formStep = 0;
  nextReceiptNumber()
    .then(n=>{ state.draft.receiptNumber = n; renderMain(); })
    .catch(e=>{ state.draft.receiptNumber = 'MT-'+Date.now(); renderMain(); });
}

const STEPS = ['بيانات العميل','بيانات الجهاز','الأعطال والفني','المالي والمخزن','مراجعة وحفظ'];
let currentStepCollector = null;

function renderForm(main){
  if(!state.draft){ startNewDraft(); return; }
  const d = state.draft;
  main.innerHTML = `
    <div class="top-header">
      <div>
        <h2 class="page-title">➕ إيصال استلام جهاز جديد</h2>
        <div class="subtitle">رقم الإيصال: <b class="mono" style="color:var(--primary);">${d.receiptNumber}</b> — التاريخ: <b class="mono">${d.date}</b></div>
      </div>
    </div>
    <div class="stepper">
      ${STEPS.map((s,i)=>`<div class="step-dot ${i===state.formStep?'active':(i<state.formStep?'done':'')}" data-i="${i}">
        <span>${i<state.formStep?'✓':(i+1)}</span><span>${s}</span>
      </div>`).join('')}
    </div>
    <div id="stepBody"></div>
  `;
  document.querySelectorAll('.step-dot').forEach(el=>el.onclick=()=>{
    if(typeof currentStepCollector==='function') currentStepCollector();
    state.formStep = Number(el.dataset.i); renderMain();
  });
  const body = document.getElementById('stepBody');
  if(state.formStep===0) return stepCustomer(body,d);
  if(state.formStep===1) return stepDevice(body,d);
  if(state.formStep===2) return stepFaults(body,d);
  if(state.formStep===3) return stepFinance(body,d);
  if(state.formStep===4) return stepReview(body,d);
}

function stepNav(body, canBack, canNext, nextLabel){
  const div = document.createElement('div');
  div.className='actions-row';
  div.innerHTML = `
    <button class="btn btn-ghost" id="backBtn" ${canBack?'':'disabled'}>السابق</button>
    <button class="btn btn-primary" id="nextBtn">${nextLabel||'التالي ➔'}</button>
  `;
  body.appendChild(div);
  if(canBack) div.querySelector('#backBtn').onclick = ()=>{ if(typeof currentStepCollector==='function') currentStepCollector(); state.formStep--; renderMain(); };
  div.querySelector('#nextBtn').onclick = canNext;
}

async function saveReceipt(d, printA5, sendWa, printSticker){
  d.updatedBy = state.user.name;
  d.updatedAt = new Date().toISOString();
  const btns = document.querySelectorAll('#saveOnlyBtn,#savePrintBtn,#saveWaBtn,#saveStickerBtn');
  btns.forEach(b=>{ b.disabled = true; b.textContent = 'جارٍ الحفظ...'; });
  try{
    await saveReceiptRemote(d);
    if(Number(d.deposit||0) > 0){
      try{ await savePaymentRemote(d.id, Number(d.deposit), 'دفعة مقدمة عند الاستلام'); }
      catch(payErr){ console.warn(payErr); }
      await refreshPayments();
    }
    if(!state.customers.find(c=>c.phone===d.customer.phone)){
      await saveCustomerRemote(d.customer);
      state.customers.push(d.customer);
    }
    state.draft = null;
    state.tab = 'archive';
    showToast(`تم حفظ الإيصال ${d.receiptNumber} بنجاح!`, 'success');
    renderMain();
    if(printA5){ setTimeout(()=>openReceiptPrint(d,'receipt'), 300); }
    if(printSticker){ setTimeout(()=>openStickerPrint(d), 300); }
    if(sendWa){ setTimeout(()=>openWhatsappChoice(d), 300); }
  }catch(e){
    showToast('تم حفظ الإيصال محلياً: '+e.message, 'info');
    btns.forEach(b=>{ b.disabled = false; });
  }
}

const STATUS_GROUPS = {

  active: {label:'قيد العمل ⏳', statuses:['قيد الفحص','الصيانة']},
  done: {label:'جاهزة للاستلام ✅', statuses:['مكتمل']},
  overdue: {label:'⏰ متروكة +7 أيام', statuses:null},

function renderArchive(main){
  const f = state.archiveFilter;
  if(!f.group) f.group = 'all';
  let list = [...state.receipts];

  if(f.group==='overdue'){
    list = list.filter(r=>r.status==='مكتمل' && (Date.now()-new Date(r.updatedAt||r.date).getTime())/86400000 > 7);
  } else {
    const groupStatuses = STATUS_GROUPS[f.group].statuses;
    if(groupStatuses) list = list.filter(r=>groupStatuses.includes(r.status));
  }

  if(f.q) list = list.filter(r => r.receiptNumber.includes(f.q) || r.customer.name.includes(f.q) || r.customer.phone.includes(f.q) || (r.device.model&&r.device.model.includes(f.q)));

  document.getElementById('fq').oninput = e=>{ f.q=e.target.value; renderMain(); };
  document.getElementById('fstatus').onchange = e=>{ f.status=e.target.value.replace(/^[^\s]+\s/, ''); renderMain(); };
  document.getElementById('ftech').onchange = e=>{ f.tech=e.target.value; renderMain(); };
  const clearBtn = document.getElementById('clearFiltersBtn');
  if(clearBtn) clearBtn.onclick = ()=>{ f.q=''; f.status=''; f.tech=''; f.group='all'; renderMain(); };

  attachRowActions(main);
}

function attachRowActions(root){
  root.querySelectorAll('[data-act]').forEach(btn=>{
    btn.onclick = ()=>{
      const r = state.receipts.find(x=>x.id===btn.dataset.id);
      if(!r) return;
      const act = btn.dataset.act;
      if(act==='view') openReceiptDetail(r);
      if(act==='wa') openWhatsapp(r);
      if(act==='print') openReceiptPrint(r,'receipt');
      if(act==='sticker') openStickerPrint(r);
      if(act==='del'){
        if(confirm(`هل تريد حذف الإيصال ${r.receiptNumber} نهائياً؟`)){
          deleteReceiptRemote(r.id)
            .then(()=>{ state.receipts = state.receipts.filter(x=>x.id!==r.id); showToast('تم حذف الإيصال بنجاح', 'success'); renderMain(); })
            .catch(e=>showToast('تعذر الحذف: '+e.message, 'error'));
        }
      }
    };
  });

  root.querySelectorAll('[data-quickstatus]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const r = state.receipts.find(x=>x.id===btn.dataset.quickstatus);
      if(r) openQuickStatusModal(r);
    };
  });
}

/* ---------------- WhatsApp Messaging ---------------- */
function normalizePhoneForWa(phone){
  let p = String(phone||'').replace(/[^0-9]/g,'');
  if(p.startsWith('00')) p = p.slice(2);
  if(p.startsWith('0')) p = '20' + p.slice(1);
  else if(p.length===10 && !p.startsWith('20')) p = '20'+p;
  return p;
}

function getStatusCustomMessage(r, status){
  const remaining = Number(r.cost||0)+Number(r.partsCost||0)-Number(r.deposit||0)+Number(r.refunded||0);
  const shop = state.settings.shopName || 'مركز الصيانة';
  const device = `${r.device.category} ${r.device.brand==='أخرى'?r.device.brandOther:r.device.brand} ${r.device.model||''}`.trim();
  const trackUrl = `${window.location.origin}${window.location.pathname}?track=${r.receiptNumber}`;

  if(status === 'مكتمل'){
    return `مرحبًا ${r.customer.name} 👋\nنود إبلاغكم بأنه تم الانتهاء من صيانة جهازكم (${device}) بنجاح وجاهز للاستلام الآن في ${shop} ✅\n\n📌 رقم الإيصال: ${r.receiptNumber}\n💵 المبلغ المتبقي المطلوب: ${remaining} ج.م\n🔗 تتبع جهازك مباشرة: ${trackUrl}\n\nشكراً لثقتكم بنا!`;
  }
  if(status === 'الصيانة'){
    return `مرحبًا ${r.customer.name} 👋\nنحيطكم علماً بأن جهازكم (${device}) قيد الصيانة والإصلاح حالياً في ${shop} 🛠️\nرقم الإيصال: ${r.receiptNumber}\n🔗 تتبع حالة جهازك: ${trackUrl}`;
  }
  if(status === 'قيد الفحص'){
    return `مرحبًا ${r.customer.name} 👋\nتم استلام جهازكم (${device}) وهو قيد الفحص والتشخيص الفني حالياً 🔍\nرقم الإيصال: ${r.receiptNumber}\n🔗 تتبع حالة جهازك: ${trackUrl}`;
  }
  if(status === 'overdue_reminder'){
    return `مرحبًا ${r.customer.name} 👋\nنود تذكيركم بوجود جهازكم (${device}) جاهزاً للاستلام لدينا في ${shop} بموجب الإيصال رقم ${r.receiptNumber}.\nالمتبقي: ${remaining} ج.م.\nيرجى التفضل بالاستلام خلال أوقات العمل الرسمية.`;
  }
  if(status === 'تعذرت الصيانة'){
    return `مرحبًا ${r.customer.name} 👋\nبخصوص جهازكم (${device}) بموجب الإيصال رقم ${r.receiptNumber}، نعتذر منك حيث تعذر الإصلاح لعدم توفر قطع الغيار أو طبيعة العطل. يمكنك التفضل لاستلام الجهاز في أي وقت من ${shop}.`;
  }
  if(status === 'رفض العميل'){
    return `مرحبًا ${r.customer.name} 👋\nبناءً على طلبكم، تم إلغاء الصيانة لجهازكم (${device}) بموجب الإيصال رقم ${r.receiptNumber} والجهاز جاهز للاستلام في ${shop}.`;
  }
  return `مرحبًا ${r.customer.name}، بخصوص جهازكم بموجب الإيصال رقم ${r.receiptNumber}\nالحالة الحالية: ${r.status}\nالمتبقي: ${remaining} ج.م\n${shop}`;
}

function sendWhatsappByStatus(r, status){
  const msg = getStatusCustomMessage(r, status);
  sendWhatsapp(r, msg);
}

function sendWhatsapp(r, msg){
  const phone = normalizePhoneForWa(r.customer.phone);
  if(!phone || phone.length < 10){ showToast('رقم هاتف العميل غير صالح لإرسال واتساب', 'error'); return; }
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
}

    try{

        r.deposit = Number(r.deposit||0) + remainingNow;
        await refreshPayments();
      }
      r.paid = true; r.status='مكتمل';
      await saveReceiptRemote(r);
      overlay.remove();
      showToast('تم سداد الإيصال بالكامل وتحديث الحالة إلى مكتمل ✅', 'success');
      renderMain();
    }catch(e){ showToast('تم السداد محلياً', 'info'); payBtn.disabled=false; }
  };

  const invBtn = overlay.querySelector('#invBtn');
  if(invBtn) invBtn.onclick = ()=>{ overlay.remove(); openReceiptPrint(r,'invoice'); };
  overlay.querySelector('#workOrderBtn').onclick = ()=>{ overlay.remove(); openReceiptPrint(r,'workorder'); };

}

/* ---------------- Excel Export Utility ---------------- */
function exportReceiptsToExcel(receipts){
  if(!receipts || !receipts.length){ showToast('لا توجد بيانات للتصدير', 'error'); return; }
  const headers = ['رقم الإيصال','التاريخ','الاسم','الهاتف','فئة الجهاز','الماركة','الموديل','الأعطال','الفني','التكلفة','المدفوع','قطع الغيار','المتبقي','الحالة','موعد التسليم'];
  const rows = receipts.map(r=>{
    const rem = Number(r.cost||0)+Number(r.partsCost||0)-Number(r.deposit||0)+Number(r.refunded||0);
    return [
      r.receiptNumber, cleanDate(r.date), `"${r.customer.name}"`, `"${r.customer.phone}"`,
      r.device.category, r.device.brand, `"${r.device.model||''}"`, `"${(r.faults||[]).join(' - ')}"`,
      `"${r.technician||''}"`, r.cost||0, r.deposit||0, r.partsCost||0, rem, `"${r.status}"`, r.deliveryDate||''
    ];
  });
  downloadCSV(`Receipts_Export_${new Date().toISOString().slice(0,10)}.csv`, headers, rows);
}

function exportInventoryToExcel(items){
  if(!items || !items.length){ showToast('المخزن فارغ', 'error'); return; }
  const headers = ['اسم الصنف','القسم','التصنيف الفرعي','كود القطعة SKU','الباركود','مكان الرف','الكمية المتاحة','الوحدة','حد الأمان','سعر الشراء','سعر البيع قطاعي','سعر الجملة','صافي الربح','نسبة الهامش %','شهور الضمان','الموديلات المتوافقة'];
  const rows = items.map(it=>{
    const buy = Number(it.PurchasePrice||0);
    const sell = Number(it.SellPrice||0);
    const profit = sell - buy;
    const margin = sell > 0 ? Math.round((profit/sell)*100)+'%' : '0%';
    return [
      `"${it.Name}"`, it.Category||'صيانة', `"${it.SubCategory||''}"`, `"${it.SKU||''}"`, `"${it.Barcode||''}"`,
      `"${it.ShelfLocation||''}"`, it.Quantity||0, it.Unit||'قطعة', it.MinStock||2,
      buy, sell, it.WholesalePrice||0, profit, `"${margin}"`, it.WarrantyMonths||0, `"${it.CompatibleModels||''}"`
    ];
  });
  downloadCSV(`Inventory_Export_${new Date().toISOString().slice(0,10)}.csv`, headers, rows);
}

function downloadCSV(filename, headers, rows){
  let csvContent = '\uFEFF' + headers.join(',') + '\n';
  rows.forEach(r => { csvContent += r.join(',') + '\n'; });
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  showToast('تم تصدير ملف Excel بنجاح', 'success');
}

    saveBtn.disabled = true; saveBtn.textContent = 'جارٍ الحفظ...';
    const itemsSummary = cart.map(c=>`${c.name} × ${c.qty} (${c.qty*c.price} ج.م)`).join('، ');
    const q = {
      ID:'', Date: new Date().toISOString().slice(0,10), ClientName: clientName, ClientPhone: clientPhone,
      ItemsSummary: itemsSummary, LaborCost: cart.filter(c=>c.type==='service').reduce((s,c)=>s+c.qty*c.price,0),
      Total: itemsTotal, Status:'معلق', By: state.user.name
    };
    try{
      const res = await saveQuotationRemote(q);
      showToast('تم حفظ عرض السعر بنجاح', 'success');
      openQuotationPrint(res.quotation, cart);
      state.quoCart = [];
      renderQuotationBuilder(main);
    }catch(e){ showToast('تم الحفظ محلياً: '+e.message, 'info'); }
    saveBtn.disabled = false; saveBtn.textContent = 'حفظ وطباعة عرض السعر';
  };
}

/* ---------------- Pro Inventory Master Screen (شاشة إدارة وأصناف المخزن المطورة) ---------------- */
function renderInventory(main, categoryFilter, titleOverride){
  if(!state.invSearchQ) state.invSearchQ = '';
  if(!state.invStockFilter) state.invStockFilter = 'all';

  const rawList = state.inventory || [];
  let list = categoryFilter === 'all' ? rawList : rawList.filter(it=>(it.Category||'صيانة')===categoryFilter);

  // Stock Filter (Low Stock / Out of Stock / In Stock)
  if(state.invStockFilter === 'low'){
    list = list.filter(it => Number(it.Quantity||0) <= Number(it.MinStock||2));
  } else if(state.invStockFilter === 'out'){
    list = list.filter(it => Number(it.Quantity||0) <= 0);
  } else if(state.invStockFilter === 'available'){
    list = list.filter(it => Number(it.Quantity||0) > 0);
  }

  // Text Search
  const q = state.invSearchQ.trim().toLowerCase();
  if(q){
    list = list.filter(it => 
      (it.Name||'').toLowerCase().includes(q) ||
      (it.Barcode||'').toLowerCase().includes(q) ||
      (it.SKU||'').toLowerCase().includes(q) ||
      (it.ShelfLocation||'').toLowerCase().includes(q) ||
      (it.CompatibleModels||'').toLowerCase().includes(q) ||
      (it.SubCategory||'').toLowerCase().includes(q)
    );
  }

  // Calculations & KPIs
  const totalItemsCount = rawList.length;
  const totalCostValue = rawList.reduce((s,it)=>s + (Number(it.Quantity||0) * Number(it.PurchasePrice||0)), 0);
  const totalRetailValue = rawList.reduce((s,it)=>s + (Number(it.Quantity||0) * Number(it.SellPrice||it.PurchasePrice||0)), 0);
  const lowStockCount = rawList.filter(it=>Number(it.Quantity||0) <= Number(it.MinStock||2)).length;

  main.innerHTML = `
    <div class="top-header">
      <div>
        <h2 class="page-title">📦 ${titleOverride || 'إدارة المخزن والأصناف'}</h2>
        <div class="subtitle">إدارة شاملة للمنتجات، الباركود، التسعير الذكي، ومواقع الرفوف (${list.length} صنف معروض)</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-ghost btn-sm" id="exportInvExcelBtn">📥 تصدير Excel</button>
        <button class="btn btn-ghost btn-sm" id="importInvExcelBtn">📂 استيراد من Excel</button>
        <button class="btn btn-primary btn-sm" id="addNewItemMasterBtn">➕ إضافة صنف جديد</button>
      </div>
    </div>

    <!-- Inventory KPIs -->
    <div class="stat-grid">
      <div class="stat-card blue">
        <div class="top-row"><span class="lbl">إجمالي الأصناف</span><div class="icon-box">📦</div></div>
        <div class="num mono">${totalItemsCount}</div>
      </div>
      <div class="stat-card amber">
        <div class="top-row"><span class="lbl">قيمة المخزون (تكلفة)</span><div class="icon-box">💵</div></div>
        <div class="num mono">${totalCostValue.toLocaleString()} <span style="font-size:12px;font-weight:600;">ج.م</span></div>
      </div>
      <div class="stat-card green">
        <div class="top-row"><span class="lbl">القيمة البيعية المتوقعة</span><div class="icon-box">📈</div></div>
        <div class="num mono">${totalRetailValue.toLocaleString()} <span style="font-size:12px;font-weight:600;">ج.م</span></div>
      </div>
      <div class="stat-card red">
        <div class="top-row"><span class="lbl">النواقص وحد الأمان</span><div class="icon-box">⚠️</div></div>
        <div class="num mono">${lowStockCount}</div>
      </div>
    </div>

    <!-- Filters & Quick Actions Bar -->
    <div class="filters-bar" style="margin-bottom:14px;">
      <input id="invSearchInput" placeholder="🔍 بحث بالاسم، الباركود، رقم الموديل SKU، موقع الرف، أو الأجهزة المتوافقة..." value="${state.invSearchQ}" style="flex:1;min-width:240px;">
      <select id="invStockFilterSelect" style="min-width:140px;">
        <option value="all" ${state.invStockFilter==='all'?'selected':''}>📦 كل المخزون</option>
        <option value="available" ${state.invStockFilter==='available'?'selected':''}>✅ متوفر بالمخزن</option>
        <option value="low" ${state.invStockFilter==='low'?'selected':''}>⚠️ قارب على النفاد (حد الأمان)</option>
        <option value="out" ${state.invStockFilter==='out'?'selected':''}>🚫 رصيد صفري (منتهي)</option>
      </select>
      ${(state.invSearchQ || state.invStockFilter!=='all') ? `<button class="btn btn-ghost btn-sm" id="clearInvFiltersBtn">مسح الفلاتر</button>` : ''}
    </div>

    <div class="card">
      ${list.length===0 ? '<div class="empty">لا توجد أصناف مطابقة للبحث أو الفلتر المختار.</div>' : `
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>الصنف والموديل</th>
              ${categoryFilter==='all'?'<th>القسم</th>':''}
              <th>مكان الرف</th>
              <th>الباركود</th>
              <th>الكمية المتاحة</th>
              <th>سعر الشراء</th>
              <th>سعر البيع (قطاعي)</th>
              <th>سعر الجملة</th>
              <th>هامش الربح</th>
              <th>الإجراءات</th>
            </tr>
          </thead>
          <tbody>
            ${list.map(it=>{
              const qty = Number(it.Quantity||0);
              const minStock = Number(it.MinStock||2);
              const buy = Number(it.PurchasePrice||0);
              const sell = Number(it.SellPrice||0);
              const wholesale = Number(it.WholesalePrice||0);
              const profitAmt = sell - buy;
              const profitMarginPct = sell > 0 ? Math.round((profitAmt / sell) * 100) : 0;
              const isLowStock = qty <= minStock;

              return `
                <tr style="${isLowStock ? 'background:rgba(239,68,68,0.05);' : ''}">
                  <td>
                    <div style="font-weight:800;font-size:13px;color:var(--ink);">${it.Name}</div>
                    <div style="display:flex;gap:6px;align-items:center;font-size:11px;color:var(--ink-secondary);margin-top:2px;">
                      ${it.SKU ? `<span class="mono" style="color:var(--primary);font-weight:700;">#${it.SKU}</span>` : ''}
                      ${it.SubCategory ? `<span>• ${it.SubCategory}</span>` : ''}
                      ${it.WarrantyMonths ? `<span>• 🛡️ ضمان ${it.WarrantyMonths} شهر</span>` : ''}
                    </div>
                    ${it.CompatibleModels ? `<div style="font-size:10.5px;color:var(--slate-500);margin-top:1px;">💻 متوافق: ${it.CompatibleModels}</div>` : ''}
                  </td>
                  ${categoryFilter==='all'?`<td><span class="status-badge st-check">${it.Category||'صيانة'}</span></td>`:''}
                  <td>
                    ${it.ShelfLocation ? `<span style="background:var(--paper3);border:1px solid var(--line-strong);padding:2px 7px;border-radius:4px;font-size:11px;font-weight:700;color:var(--ink);">📍 ${it.ShelfLocation}</span>` : '<span style="color:var(--slate-400);font-size:11px;">-</span>'}
                  </td>
                  <td>
                    ${it.Barcode ? `
                      <div style="display:flex;align-items:center;gap:4px;">
                        <span class="mono" style="font-size:11px;font-weight:700;color:var(--ink-secondary);">${it.Barcode}</span>
                        <button class="btn btn-xs btn-ghost" data-printsticker="${it.ID}" title="طباعة ملصق الباركود الحراري" style="padding:2px 5px;">🏷️</button>
                      </div>
                    ` : '<span style="color:var(--slate-400);font-size:11px;">بدون</span>'}
                  </td>
                  <td>
                    <div style="display:flex;align-items:center;gap:4px;">
                      <span class="mono" style="font-weight:900;font-size:13.5px;color:${isLowStock?'var(--red)':'var(--ink)'};">${qty}</span>
                      <span style="font-size:11px;color:var(--ink-secondary);">${it.Unit||'قطعة'}</span>
                      ${isLowStock ? '<span title="الكمية وصلت لحد الأمان أو نفدت" style="font-size:11px;">⚠️</span>' : ''}
                    </div>
                  </td>
                  <td class="mono font-bold">${buy.toLocaleString()} ج.م</td>
                  <td class="mono font-bold" style="color:var(--green);">${sell.toLocaleString()} ج.م</td>
                  <td class="mono">${wholesale ? wholesale.toLocaleString() + ' ج.م' : '<span style="color:var(--slate-400);">-</span>'}</td>
                  <td>
                    <span class="mono font-bold" style="color:${profitAmt>=0?'var(--green-text)':'var(--red)'};font-size:11.5px;">
                      ${profitAmt >= 0 ? '+' : ''}${profitAmt.toLocaleString()} ج.م (${profitMarginPct}%)
                    </span>
                  </td>
                  <td class="row-actions">
                    <button class="btn btn-xs btn-amber" data-printsticker="${it.ID}" title="طباعة ملصق الباركود">🏷️ ملصق</button>
                    <button class="btn btn-xs btn-ghost" data-cloneitem="${it.ID}" title="تكرار الصنف">📋 نسخ</button>
                    <button class="btn btn-xs btn-ghost" data-edititem="${it.ID}" title="تعديل">✏️</button>
                    ${state.user.role==='admin' ? `<button class="btn btn-xs btn-red" data-delitem="${it.ID}" title="حذف">🗑️</button>` : ''}
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>`}
    </div>
  `;

  // Attach search & filter handlers
  const searchInput = document.getElementById('invSearchInput');
  searchInput.oninput = (e)=>{ state.invSearchQ = e.target.value; renderInventory(main, categoryFilter, titleOverride); };
  
  const filterSelect = document.getElementById('invStockFilterSelect');
  filterSelect.onchange = (e)=>{ state.invStockFilter = e.target.value; renderInventory(main, categoryFilter, titleOverride); };

  const clearBtn = document.getElementById('clearInvFiltersBtn');
  if(clearBtn) clearBtn.onclick = ()=>{ state.invSearchQ = ''; state.invStockFilter = 'all'; renderInventory(main, categoryFilter, titleOverride); };

  document.getElementById('addNewItemMasterBtn').onclick = ()=>openInventoryItemModal(null, false, categoryFilter);
  document.getElementById('exportInvExcelBtn').onclick = ()=>exportInventoryToExcel(list);
  document.getElementById('importInvExcelBtn').onclick = ()=>openInventoryImportModal();

  // Attach row actions
  main.querySelectorAll('[data-edititem]').forEach(btn=>{
    btn.onclick = ()=>{
      const item = state.inventory.find(x=>x.ID===btn.dataset.edititem);
      if(item) openInventoryItemModal(item, false, categoryFilter);
    };
  });
  main.querySelectorAll('[data-cloneitem]').forEach(btn=>{
    btn.onclick = ()=>{
      const item = state.inventory.find(x=>x.ID===btn.dataset.cloneitem);
      if(item) openInventoryItemModal(item, true, categoryFilter);
    };
  });
  main.querySelectorAll('[data-printsticker]').forEach(btn=>{
    btn.onclick = ()=>{
      const item = state.inventory.find(x=>x.ID===btn.dataset.printsticker);
      if(item) openProductBarcodeSticker(item);
    };
  });
  main.querySelectorAll('[data-delitem]').forEach(btn=>{
    btn.onclick = async ()=>{
      const item = state.inventory.find(x=>x.ID===btn.dataset.delitem);
      if(!item) return;
      if(!confirm(`هل تريد حذف الصنف "${item.Name}" نهائياً من المخزن؟`)) return;
      try{
        await deleteInventoryItemRemote(item.ID);
        showToast('تم حذف الصنف بنجاح', 'success');
        renderInventory(main, categoryFilter, titleOverride);
      }catch(e){ showToast('تعذر الحذف: '+e.message, 'error'); }
    };
  });
}

          <div class="grid3">
            <div class="field">
              <label>سعر التكلفة / الشراء (ج.م) *</label>

            </div>
            <div class="field">
              <label>سعر البيع قطاعي للجمهور (ج.م) *</label>

            <div class="field">
              <label>سعر الجملة / للفنيين (ج.م)</label>
              <input id="mItemWholesale" type="number" step="any" value="${item.WholesalePrice||''}" placeholder="0.00">
            </div>
          </div>

          <!-- Real-Time Profit Calculation Box -->
          <div class="fin-box" id="profitCalcBox" style="margin-top:6px;">
            <div class="fin-cell">
              <div class="l">صافي الربح للقطعة</div>
              <div class="v mono" id="calcProfitAmt" style="color:var(--green-text);">0 ج.م</div>
            </div>
            <div class="fin-cell">
              <div class="l">نسبة هامش الربح (Margin %)</div>
              <div class="v mono" id="calcMarginPct">0%</div>
            </div>
            <div class="fin-cell">
              <div class="l">نسبة الزيادة (Markup %)</div>
              <div class="v mono" id="calcMarkupPct">0%</div>
            </div>
          </div>
        </div>

        <!-- Section 4: Stock Levels & Warranty -->
        <div class="card" style="padding:14px 16px;margin-bottom:14px;">
          <h3 style="font-size:13.5px;margin-bottom:10px;">📦 المخزون، حد الأمان، والضمان</h3>
          <div class="grid4">
            <div class="field">
              <label>الكمية الحالية *</label>
              <input id="mItemQty" type="number" value="${item.Quantity||0}" min="0">
            </div>
            <div class="field">
              <label>حد الأمان (تنبيه النواقص)</label>
              <input id="mItemMinStock" type="number" value="${item.MinStock||2}" min="0" title="عند وصول الكمية لهذا الحد يظهر تنبيه">
            </div>
            <div class="field">
              <label>وحدة القياس</label>
              <select id="mItemUnit">
                ${UNITS.map(u=>`<option ${u===item.Unit?'selected':''}>${u}</option>`).join('')}
              </select>
            </div>
            <div class="field">
              <label>فترة الضمان (بالأشهر)</label>
              <input id="mItemWarranty" type="number" value="${item.WarrantyMonths||0}" min="0" placeholder="0 = بدون">
            </div>
          </div>
        </div>

        <!-- Modal Actions -->
        <div class="actions-row" style="margin-top:16px;">
          <button class="btn btn-ghost" id="cancelItemModalBtn" type="button">إلغاء</button>
          <div style="display:flex;gap:8px;">
            ${!isEdit ? `<button class="btn btn-green" id="saveAndNewItemBtn" type="button">➕💾 حفظ وإضافة صنف آخر</button>` : ''}
            <button class="btn btn-primary" id="saveItemMasterBtn" type="button">💾 حفظ الصنف</button>
          </div>
        </div>
      </div>
    `;

    document.body.appendChild(overlay);

    // Close handlers
    overlay.querySelector('#closeItemModal').onclick = ()=>overlay.remove();
    overlay.querySelector('#cancelItemModalBtn').onclick = ()=>overlay.remove();

    // Category change updates subcategory datalist
    overlay.querySelector('#mItemCategory').onchange = (e)=>{
      const cat = e.target.value;
      const dl = overlay.querySelector('#subCatList');
      dl.innerHTML = (COMMON_SUBCATS[cat]||[]).map(sc=>`<option value="${sc}">`).join('');
    };

    // Random barcode generator (EAN13 format prefix 20)
    overlay.querySelector('#genRandomBarcodeBtn').onclick = ()=>{
      const rnd = '20' + String(Date.now()).slice(-8) + Math.floor(Math.random()*90+10);
      overlay.querySelector('#mItemBarcode').value = rnd;
      showToast('تم توليد كود باركود فريد للصنف 🎲', 'info');
    };

    // Live Profit & Margin Calculation
    function updateProfitCalcs(){
      const buy = Number(overlay.querySelector('#mItemBuy').value)||0;
      const sell = Number(overlay.querySelector('#mItemSell').value)||0;
      const profit = sell - buy;
      const marginPct = sell > 0 ? Math.round((profit / sell) * 100) : 0;
      const markupPct = buy > 0 ? Math.round((profit / buy) * 100) : 0;

      const pAmtEl = overlay.querySelector('#calcProfitAmt');
      const pMargEl = overlay.querySelector('#calcMarginPct');
      const pMarkEl = overlay.querySelector('#calcMarkupPct');

      pAmtEl.textContent = `${profit.toLocaleString()} ج.م`;
      pAmtEl.style.color = profit >= 0 ? 'var(--green-text)' : 'var(--red)';
      pMargEl.textContent = `${marginPct}%`;
      pMarkEl.textContent = `${markupPct}%`;
    }

    overlay.querySelector('#mItemBuy').oninput = updateProfitCalcs;
    overlay.querySelector('#mItemSell').oninput = updateProfitCalcs;
    updateProfitCalcs();

    // Print sticker preview from inside modal
    overlay.querySelector('#modalPrintStickerPreviewBtn').onclick = ()=>{
      collectFormData();
      if(!item.Name){ showToast('يرجى كتابة اسم الصنف أولاً للمعاينة', 'error'); return; }
      openProductBarcodeSticker(item);
    };

    function collectFormData(){
      item.Name = overlay.querySelector('#mItemName').value.trim();
      item.Category = overlay.querySelector('#mItemCategory').value;
      item.SubCategory = overlay.querySelector('#mItemSubCat').value.trim();
      item.SKU = overlay.querySelector('#mItemSKU').value.trim();
      item.ShelfLocation = overlay.querySelector('#mItemShelf').value.trim();
      item.CompatibleModels = overlay.querySelector('#mItemCompat').value.trim();
      item.Barcode = overlay.querySelector('#mItemBarcode').value.trim();
      item.PurchasePrice = Number(overlay.querySelector('#mItemBuy').value)||0;
      item.SellPrice = Number(overlay.querySelector('#mItemSell').value)||0;
      item.WholesalePrice = Number(overlay.querySelector('#mItemWholesale').value)||0;
      item.Quantity = Number(overlay.querySelector('#mItemQty').value)||0;
      item.MinStock = Number(overlay.querySelector('#mItemMinStock').value)||0;
      item.Unit = overlay.querySelector('#mItemUnit').value;
      item.WarrantyMonths = Number(overlay.querySelector('#mItemWarranty').value)||0;
    }

    async function handleSave(keepOpen){
      collectFormData();
      if(!item.Name){ showToast('اسم الصنف مطلوب', 'error'); return; }
      
      // Auto barcode if left empty
      if(!item.Barcode){
        item.Barcode = '20' + String(Date.now()).slice(-8) + Math.floor(Math.random()*90+10);
      }

      const saveBtn = overlay.querySelector('#saveItemMasterBtn');
      saveBtn.disabled = true; saveBtn.textContent = 'جارٍ الحفظ...';

      try{
        await saveInventoryItemRemote(item);
        showToast(`تم حفظ الصنف "${item.Name}" بنجاح ✅`, 'success');
        renderMain();

        if(keepOpen){
          // Reset form for next item
          overlay.remove();
          openInventoryItemModal(null, false, item.Category);
        } else {
          overlay.remove();
        }
      }catch(e){
        showToast('تم حفظ الصنف محلياً', 'info');
        if(!keepOpen) overlay.remove();
      }
    }

    overlay.querySelector('#saveItemMasterBtn').onclick = ()=>handleSave(false);
    const saveAndNewBtn = overlay.querySelector('#saveAndNewItemBtn');
    if(saveAndNewBtn) saveAndNewBtn.onclick = ()=>handleSave(true);
  }

  renderModalHTML();
}

/* ---------------- Print Product Barcode Sticker (50mm x 30mm) ---------------- */
function openProductBarcodeSticker(item){
  document.body.classList.add('printing-sticker');

  if(old) old.remove();
  const mount = document.createElement('div');
  mount.id='printMount';

  const barcodeVal = item.Barcode || item.SKU || item.ID;

  mount.innerHTML = `
  <div id="stickerPaper">
    <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #000;padding-bottom:1px;">
      <b style="font-size:7.5px;">${state.settings.shopName || 'ميكروERP'}</b>
      <span class="mono" style="font-size:7.5px;font-weight:800;">${item.Category||'صيانة'}</span>
    </div>
    <div style="font-size:7.5px;font-weight:900;margin:1px 0;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
      ${item.Name}
    </div>
    <div style="text-align:center;margin:1px 0;">
      <svg id="productStickerBarcode"></svg>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;font-size:8px;font-weight:900;border-top:1px solid #000;padding-top:1px;">
      <span>السعر:</span>
      <span class="mono" style="font-size:10px;">${Number(item.SellPrice||item.PurchasePrice||0).toLocaleString()} ج.م</span>
    </div>
  </div>`;

  document.body.appendChild(mount);
  if(typeof JsBarcode !== 'undefined'){
    try{
      JsBarcode('#productStickerBarcode', barcodeVal, {
        format:'CODE128',
        width: 1.15,

  setTimeout(()=>{

/* ---------------- Bulk Inventory Import Modal (استيراد جماعي من Excel/CSV) ---------------- */
function openInventoryImportModal(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';

  overlay.innerHTML = `
    <div class="modal-content" style="max-width:650px;">
      <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px;">
        <h3 style="margin:0;font-size:16px;">📂 استيراد أصناف جماعي من ملف Excel / CSV</h3>
        <button class="btn btn-ghost btn-xs" id="closeImportModal">✕</button>
      </div>

      <div style="background:var(--paper3);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;margin-bottom:16px;font-size:12.5px;line-height:1.7;">
        <b>💡 تعليمات الاستيراد:</b>
        <ol style="margin-right:18px;margin-top:4px;">
          <li>يمكنك تنزيل النموذج الجاهز وتعبئته ببيانات أصنافك.</li>
          <li>الأعمدة المطلوبة: <b>الاسم، القسم، الباركود، الكمية، سعر الشراء، سعر البيع، مكان الرف</b>.</li>
          <li>يدعم الملفات بصيغة CSV أو Excel (.csv).</li>
        </ol>
        <button class="btn btn-ghost btn-xs" id="downloadImportTemplateBtn" style="margin-top:6px;">📥 تنزيل نموذج الاستيراد الفارغ (Template)</button>
      </div>

      <div class="field">
        <label>اختر ملف CSV / Excel من جهازك</label>
        <input type="file" id="csvFileInput" accept=".csv,text/csv" style="padding:7px;">
      </div>

      <div id="importPreviewMount" style="margin-top:12px;"></div>

      <div class="actions-row" style="margin-top:16px;">
        <button class="btn btn-ghost" id="cancelImportBtn">إلغاء</button>
        <button class="btn btn-primary" id="processImportBtn" disabled>🚀 استيراد الأصناف إلى المخزن</button>
      </div>
    </div>
  `;

  document.body.appendChild(overlay);
  overlay.querySelector('#closeImportModal').onclick = ()=>overlay.remove();
  overlay.querySelector('#cancelImportBtn').onclick = ()=>overlay.remove();

  // Template download
  overlay.querySelector('#downloadImportTemplateBtn').onclick = ()=>{
    const headers = ['اسم الصنف','القسم','الباركود','الكمية','سعر الشراء','سعر البيع','سعر الجملة','مكان الرف','الموديلات المتوافقة'];
    const sampleRows = [
      ['شاشة لابتوب 15.6 LED FHD','صيانة','20260001',10,1200,1650,1450,'رف A-1','Dell G15, HP 15'],
      ['كاميرا مراقبة Hikvision 5MP','كاميرات','20260002',5,450,650,550,'رف C-3','-'],
      ['ماوس لاسلكي Logitech M170','إكسسوار','20260003',20,110,180,140,'رف E-2','-']
    ];
    downloadCSV('Inventory_Import_Template.csv', headers, sampleRows);
  };

  let parsedItems = [];
  const fileInput = overlay.querySelector('#csvFileInput');
  fileInput.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (evt)=>{
      const text = evt.target.result;
      const lines = text.split(/\r?\n/).filter(l=>l.trim());
      if(lines.length <= 1){ showToast('الملف فارغ أو لا يحتوي على بيانات كافية', 'error'); return; }

      parsedItems = [];
      for(let i=1; i<lines.length; i++){
        const cols = lines[i].split(',').map(c=>c.replace(/^["']|["']$/g,'').trim());
        if(cols[0]){
          parsedItems.push({
            ID: 'inv_' + Date.now() + '_' + i,
            Name: cols[0],
            Category: cols[1] || 'صيانة',
            Barcode: cols[2] || ('20' + String(Date.now()).slice(-8) + i),
            Quantity: Number(cols[3])||0,
            PurchasePrice: Number(cols[4])||0,
            SellPrice: Number(cols[5])||0,
            WholesalePrice: Number(cols[6])||0,
            ShelfLocation: cols[7] || '',
            CompatibleModels: cols[8] || '',
            MinStock: 2,
            Unit: 'قطعة'
          });
        }
      }

      const previewMount = overlay.querySelector('#importPreviewMount');
      previewMount.innerHTML = `
        <div style="background:var(--green-bg);color:var(--green-text);padding:8px 12px;border-radius:var(--radius-sm);font-size:12px;font-weight:700;margin-bottom:8px;">
          ✅ تم قراءة <b>${parsedItems.length}</b> صنف بنجاح وجاهز للاستيراد.
        </div>
      `;
      overlay.querySelector('#processImportBtn').disabled = parsedItems.length === 0;
    };
    reader.readAsText(file);
  };

  overlay.querySelector('#processImportBtn').onclick = async ()=>{
    const btn = overlay.querySelector('#processImportBtn');
    btn.disabled = true; btn.textContent = 'جارٍ الاستيراد...';
    for(const it of parsedItems){
      try{ await saveInventoryItemRemote(it); }catch(e){}
    }
    showToast(`تم استيراد ${parsedItems.length} صنف بنجاح إلى المخزن! 🎉`, 'success');
    overlay.remove();
    renderMain();
  };
}

/* ---------------- POS Section ---------------- */
function renderPosApp(app){
  if(!state.posTab) state.posTab = 'sell';
  app.innerHTML = `
    <div class="sidebar">
      ${brandHtml("نقطة البيع (POS)")}
      ${sectionSwitcherHtml()}
      <div class="sidebar-nav-wrap">
        <div class="nav-section">العمليات</div>
        <div class="nav-item ${state.posTab==='sell'?'active':''}" data-postab="sell"><span class="nav-item-icon">🧾</span><span>بيع جديد</span></div>
        <div class="nav-item ${state.posTab==='sales'?'active':''}" data-postab="sales"><span class="nav-item-icon">📊</span><span>سجل المبيعات</span></div>
      </div>
      ${sidebarFootHtml()}
    </div>
    <main id="main"></main>
  `;
  const sw = document.getElementById('switchSectionBtn');
  if(sw) sw.onclick = ()=>{ state.currentSection = null; render(); };
  attachSidebarHandlers();
  document.querySelectorAll('[data-postab]').forEach(el=>{
    el.onclick = ()=>{ state.posTab = el.dataset.postab; renderPosApp(app); };
  });
  const main = document.getElementById('main');
  if(state.posTab==='sell') renderPosSell(main);
  else renderPosSalesLog(main);
}

function renderPosSell(main){
  const cart = state.cart;
  const total = cart.reduce((s,c)=>s+c.qty*c.price,0);
  main.innerHTML = `
    <div class="top-header">
      <div>
        <h2 class="page-title">🧾 بيع سريع وفاتورة</h2>
        <div class="subtitle">مسح الباركود أو اختيار المنتجات لإصدار الفاتورة فورًا</div>
      </div>
    </div>
    <div class="card">
      <div class="grid2">
        <div class="field"><label>امسح أو اكتب الباركود ثم اضغط Enter</label><input id="posBarcodeInput" placeholder="امسح الباركود هنا..." autofocus></div>
        <div class="field"><label>أو ابحث عن صنف بالاسم</label><input id="posSearchInput" placeholder="اكتب اسم الصنف..."></div>
      </div>
    </div>
    <div class="card">
      <h3>السلة الحالية</h3>
      ${cart.length===0 ? '<div class="empty">السلة فارغة. ابدأ بمسح الباركود أو اختيار الأصناف.</div>' : `
      <div class="table-wrap"><table><thead><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th><th></th></tr></thead><tbody>
        ${cart.map((c,i)=>`<tr>
          <td><b>${c.name}</b></td>
          <td><input type="number" min="1" value="${c.qty}" data-cartqtyidx="${i}" style="width:70px;"></td>
          <td><input type="number" min="0" value="${c.price}" data-cartpriceidx="${i}" style="width:90px;"></td>
          <td class="mono font-bold">${c.qty*c.price} ج.م</td>
          <td><button class="btn btn-xs btn-red" data-cartidx="${i}">إزالة</button></td>
        </tr>`).join('')}
      </tbody></table></div>`}
      <div style="text-align:left;font-size:22px;font-weight:900;margin-top:14px;">الإجمالي: <span class="mono" style="color:var(--primary);">${total}</span> ج.م</div>
    </div>
    <div class="card">
      <h3>بيانات العميل والدفع</h3>
      <div class="grid2">
        <div class="field"><label>اسم العميل</label><input id="posCustName" value="عميل زائر"></div>
        <div class="field"><label>رقم الهاتف</label><input id="posCustPhone"></div>
      </div>
      <button class="btn btn-green" id="completeSaleBtn" style="width:100%;padding:12px;" ${cart.length===0?'disabled':''}>✅ إتمام عملية البيع وطباعة الفاتورة</button>
    </div>
  `;
  document.getElementById('posBarcodeInput').onkeydown = async (e)=>{
    if(e.key !== 'Enter') return;
    const code = e.target.value.trim();
    if(!code) return;
    const it = state.inventory.find(x=>String(x.Barcode||'').trim()===code);
    if(!it){ showToast('لا يوجد صنف بهذا الباركود', 'error'); e.target.value=''; return; }
    if(Number(it.Quantity)<=0){ showToast('الصنف غير متاح في المخزون', 'error'); e.target.value=''; return; }
    e.target.value = '';
    await addItemToCart(it.ID, 1, main);
  };
  main.querySelectorAll('[data-cartqtyidx]').forEach(inp=>{
    inp.onchange = ()=>{
      const idx = Number(inp.dataset.cartqtyidx);
      const newQty = Number(inp.value);
      if(!newQty || newQty<=0) return;
      cart[idx].qty = newQty;
      renderPosSell(main);
    };
  });
  main.querySelectorAll('[data-cartidx]').forEach(btn=>{
    btn.onclick = ()=>{ cart.splice(Number(btn.dataset.cartidx),1); renderPosSell(main); };
  });

  const completeBtn = document.getElementById('completeSaleBtn');
  if(completeBtn) completeBtn.onclick = async ()=>{
    const customerName = document.getElementById('posCustName').value.trim();
    const customerPhone = document.getElementById('posCustPhone').value.trim();
    completeBtn.disabled = true; completeBtn.textContent = 'جارٍ إتمام البيع...';
    try{
      for(const c of cart){ await adjustInventoryQtyRemote(c.itemId, -c.qty); }
      const itemsSummary = cart.map(c=>`${c.name} × ${c.qty} (${c.qty*c.price} ج.م)`).join('، ');
      const itemsJson = JSON.stringify(cart.map(c=>({name:c.name, qty:c.qty, price:c.price})));
      const saleRes = await saveSaleRemote(itemsSummary, itemsJson, total, customerName, customerPhone, 'نقدي', total);
      showToast('تمت عملية البيع بنجاح', 'success');
      openSalePrint(saleRes.sale, cart);
      state.cart = [];
      renderPosSell(main);
    }catch(e){ showToast('تم تسجيل البيع محلياً', 'info'); completeBtn.disabled=false; }
  };
}

async function addItemToCart(itemId, qty, main){
  const item = state.inventory.find(x=>x.ID===itemId);
  if(!item) return;
  const existing = state.cart.find(c=>c.itemId===itemId);
  if(existing){ existing.qty += qty; }
