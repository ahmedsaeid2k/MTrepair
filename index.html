<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ميكروERP | نظام إدارة الصيانة والمبيعات المتكامل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.12.3/JsBarcode.all.min.js"></script>
<style>
:root {
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --primary-light: #eef2ff;
  --primary-focus: rgba(79, 70, 229, 0.18);
  
  --slate-900: #0f172a;
  --slate-800: #1e293b;
  --slate-700: #334155;
  --slate-600: #475569;
  --slate-500: #64748b;
  --slate-400: #94a3b8;
  --slate-300: #cbd5e1;
  --slate-200: #e2e8f0;
  --slate-100: #f1f5f9;
  --slate-50: #f8fafc;
  
  --ink: #0f172a;
  --ink-secondary: #64748b;
  --paper: #f8fafc;
  --paper2: #ffffff;
  --paper3: #f1f5f9;
  --line: #e2e8f0;
  --line-strong: #cbd5e1;
  --glass-bg: rgba(255, 255, 255, 0.85);
  --glass-border: rgba(226, 232, 240, 0.8);
  --card-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05), 0 2px 6px -1px rgba(15, 23, 42, 0.03);
  --card-hover-shadow: 0 12px 28px -4px rgba(15, 23, 42, 0.09), 0 4px 10px -2px rgba(15, 23, 42, 0.04);
  
  --blue: #2563eb;
  --blue-bg: #dbeafe;
  --blue-text: #1e40af;
  
  --amber: #d97706;
  --amber-bg: #fef3c7;
  --amber-text: #92400e;
  
  --red: #e11d48;
  --red-bg: #ffe4e6;
  --red-text: #9f1239;
  
  --green: #10b981;
  --green-bg: #d1fae5;
  --green-text: #065f46;
  
  --purple: #8b5cf6;
  --purple-bg: #ede9fe;
  --purple-text: #5b21b6;

  --cyan: #06b6d4;
  --cyan-bg: #cffafe;
  --cyan-text: #155e75;
  
  --radius-xs: 4px;
  --radius-sm: 8px;
  --radius: 14px;
  --radius-lg: 20px;
  --radius-full: 9999px;
  
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
  --shadow: 0 4px 14px -1px rgba(0, 0, 0, 0.06), 0 2px 6px -2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 10px 25px -3px rgba(0, 0, 0, 0.08), 0 4px 10px -4px rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 20px 35px -5px rgba(0, 0, 0, 0.12), 0 10px 15px -6px rgba(0, 0, 0, 0.06);
  
  --font-main: 'Tajawal', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: 'IBM Plex Mono', monospace, Consolas, Courier;
}

[data-theme="dark"] {
  --primary: #6366f1;
  --primary-hover: #818cf8;
  --primary-light: rgba(99, 102, 241, 0.18);
  --primary-focus: rgba(99, 102, 241, 0.28);
  
  --slate-900: #030712;
  --slate-800: #090d16;
  --slate-700: #131b2e;
  --slate-600: #1e293b;
  --slate-500: #64748b;
  --slate-400: #94a3b8;
  --slate-300: #cbd5e1;
  --slate-200: #1e293b;
  --slate-100: #0f172a;
  --slate-50: #090d16;
  
  --ink: #f8fafc;
  --ink-secondary: #94a3b8;
  --paper: #070b12;
  --paper2: #0e1524;
  --paper3: #162035;
  --line: rgba(255, 255, 255, 0.08);
  --line-strong: rgba(255, 255, 255, 0.14);
  --glass-bg: rgba(14, 21, 36, 0.82);
  --glass-border: rgba(255, 255, 255, 0.1);
  --card-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
  --card-hover-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
  
  --blue-bg: rgba(37, 99, 235, 0.22);
  --blue-text: #93c5fd;
  --amber-bg: rgba(217, 119, 6, 0.22);
  --amber-text: #fcd34d;
  --red-bg: rgba(225, 29, 72, 0.22);
  --red-text: #fda4af;
  --green-bg: rgba(16, 185, 129, 0.22);
  --green-text: #6ee7b7;
  --purple-bg: rgba(139, 92, 246, 0.22);
  --purple-text: #c4b5fd;
  --cyan-bg: rgba(6, 182, 212, 0.22);
  --cyan-text: #67e8f9;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-variant-numeric: tabular-nums lining-nums;
  -webkit-font-feature-settings: "numr" 0, "lnum" 1, "tnum" 1;
  font-feature-settings: "numr" 0, "lnum" 1, "tnum" 1;
}
body {
  font-family: var(--font-main);
  background: var(--paper);
  color: var(--ink);
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.25s cubic-bezier(0.4, 0, 0.2, 1), color 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  font-variant-numeric: tabular-nums lining-nums;
}
.mono, input, select, textarea, td, th, .num, span, div, b, strong, p {
  font-variant-numeric: tabular-nums lining-nums;
}
.mono { font-family: var(--font-mono); letter-spacing: -0.02em; }

#app { display: flex; min-height: 100vh; flex-direction: row; }

/* Scrollbar */
::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--slate-400); border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: var(--primary); }

/* Unified Global Header */
.global-header {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 24px;
  background: var(--glass-bg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 1px 4px rgba(0,0,0,0.03);
  margin-bottom: 20px;
  border-radius: var(--radius);
}
.global-header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.global-header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}
.universal-search-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  background: var(--paper2);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-full);
  color: var(--ink-secondary);
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  min-width: 240px;
}
.universal-search-btn:hover {
  border-color: var(--primary);
  color: var(--ink);
  background: var(--paper3);
  box-shadow: 0 0 0 3px var(--primary-focus);
}
.kbd-shortcut {
  background: var(--paper3);
  border: 1px solid var(--line-strong);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 10.5px;
  font-family: var(--font-mono);
  color: var(--ink-secondary);
  margin-right: auto;
}

/* Sidebar */
.sidebar {
  width: 256px;
  background: var(--slate-900);
  color: #f8fafc;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  box-shadow: 4px 0 28px rgba(0,0,0,0.14);
  z-index: 20;
  transition: all 0.25s ease;
  border-left: 1px solid rgba(255,255,255,0.06);
}
.brand {
  padding: 20px 18px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-logo-wrap {
  width: 42px;
  height: 42px;
  background: linear-gradient(135deg, var(--primary), #38bdf8);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 22px;
  box-shadow: 0 4px 14px rgba(79,70,229,0.38);
  flex-shrink: 0;
}
.brand-text h1 {
  font-size: 16.5px;
  font-weight: 900;
  margin: 0;
  color: #ffffff;
  letter-spacing: -0.01em;
}
.brand-text span {
  font-size: 11px;
  color: #38bdf8;
  display: block;
  margin-top: 1px;
  font-weight: 600;
}

.nav-section {
  padding: 14px 14px 6px;
  font-size: 10.5px;
  font-weight: 800;
  color: #64748b;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.nav-item {
  margin: 3px 10px;
  padding: 10px 12px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 700;
  color: #94a3b8;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  gap: 10px;
  transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
  user-select: none;
}
.nav-item:hover {
  background: rgba(255,255,255,0.08);
  color: #ffffff;
  transform: translateX(-3px);
}
.nav-item.active {
  background: linear-gradient(135deg, var(--primary), var(--primary-hover));
  color: #ffffff;
  box-shadow: 0 4px 14px rgba(79,70,229,0.35);
}
.nav-item-icon {
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 20px;
}

.sidebar-foot {
  margin-top: auto;
  padding: 14px 16px;
  background: rgba(0,0,0,0.35);
  border-top: 1px solid rgba(255,255,255,0.08);
}
.user-card {
  display: flex;
  align-items: center;
  gap: 10px;
}
.user-avatar {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-full);
  background: linear-gradient(135deg, #10b981, #059669);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 13.5px;
}
.user-info {
  flex: 1;
  min-width: 0;
}
.user-name {
  font-size: 12.5px;
  font-weight: 700;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.role-badge {
  display: inline-block;
  background: rgba(37,99,235,0.25);
  color: #60a5fa;
  font-size: 9.5px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: var(--radius-full);
  margin-top: 1px;
}

/* Main Content Area */
main {
  flex: 1;
  padding: 24px 32px;
  max-width: 1400px;
  width: 100%;
  box-sizing: border-box;
}

/* Top App Header */
.top-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 14px;
}
.page-title {
  font-size: 22px;
  font-weight: 800;
  color: var(--ink);
  letter-spacing: -0.02em;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 10px;
}
.subtitle {
  color: var(--ink-secondary);
  font-size: 13px;
  margin-top: 2px;
}

/* Network Sync Indicator Pill */
.sync-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 12px;
  border-radius: var(--radius-full);
  font-size: 11.5px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s ease;
  user-select: none;
  box-shadow: var(--shadow-sm);
}
.sync-pill.online {
  background: var(--green-bg);
  color: var(--green-text);
  border: 1px solid var(--green);
}
.sync-pill.offline {
  background: var(--amber-bg);
  color: var(--amber-text);
  border: 1px solid var(--amber);
}
.sync-pill.syncing {
  background: var(--blue-bg);
  color: var(--blue-text);
  border: 1px solid var(--blue);
  animation: pulse 1.2s infinite;
}
@keyframes pulse {
  0% { opacity: 0.8; transform: scale(0.99); }
  50% { opacity: 1; transform: scale(1.01); }
  100% { opacity: 0.8; transform: scale(0.99); }
}

/* Theme Toggle Button */
.theme-toggle-btn {
  background: var(--paper2);
  border: 1px solid var(--line);
  color: var(--ink);
  padding: 7px 12px;
  border-radius: var(--radius-full);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s ease;
}
.theme-toggle-btn:hover {
  background: var(--paper3);
  border-color: var(--primary);
}

/* Cards */
.card {
  background: var(--paper2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 18px;
  box-shadow: var(--card-shadow);
  transition: box-shadow 0.2s ease, border-color 0.2s ease;
}
.card:hover {
  box-shadow: var(--shadow);
}
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  padding-bottom: 10px;
  margin-bottom: 16px;
}
.card h3 {
  margin: 0;
  font-size: 15.5px;
  font-weight: 800;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Dashboard Stat Cards */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 14px;
  margin-bottom: 22px;
}
.stat-card {
  background: var(--paper2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 18px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--card-shadow);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.stat-card::before {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  left: 0;
  height: 4px;
  background: var(--slate-300);
}
.stat-card.blue::before { background: var(--blue); }
.stat-card.green::before { background: var(--green); }
.stat-card.amber::before { background: var(--amber); }
.stat-card.red::before { background: var(--red); }
.stat-card.purple::before { background: var(--purple); }

.stat-card .top-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.stat-card .icon-box {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
}
.stat-card.blue .icon-box { background: var(--blue-bg); color: var(--blue-text); }
.stat-card.green .icon-box { background: var(--green-bg); color: var(--green-text); }
.stat-card.amber .icon-box { background: var(--amber-bg); color: var(--amber-text); }
.stat-card.red .icon-box { background: var(--red-bg); color: var(--red-text); }
.stat-card.purple .icon-box { background: var(--purple-bg); color: var(--purple-text); }

.stat-card .num {
  font-size: 26px;
  font-weight: 800;
  color: var(--ink);
  line-height: 1.2;
  margin-top: 8px;
}
.stat-card .lbl {
  font-size: 12px;
  color: var(--ink-secondary);
  font-weight: 600;
  margin-top: 3px;
}

/* Stepper */
.stepper {
  display: flex;
  gap: 8px;
  margin-bottom: 22px;
  background: var(--paper2);
  padding: 8px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  box-shadow: var(--card-shadow);
}
.step-dot {
  flex: 1;
  text-align: center;
  padding: 9px 8px;
  background: var(--paper3);
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-secondary);
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.step-dot:hover { background: var(--slate-200); }
.step-dot.active {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 2px 8px rgba(37,99,235,0.25);
}
.step-dot.done {
  background: var(--green-bg);
  color: var(--green-text);
}

/* Forms & Inputs */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.grid4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 14px; }

label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 5px;
}
input, select, textarea {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 13px;
  background: var(--paper2);
  color: var(--ink);
  outline: none;
  transition: all 0.15s ease;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-focus);
}
input[type="tel"], input.phone-input, input[id*="Phone"], input[id*="phone"], input[type="number"], input.mono {
  font-family: var(--font-mono);
  direction: ltr;
  text-align: right;
  font-variant-numeric: tabular-nums lining-nums;
  -webkit-font-feature-settings: "numr" 0, "lnum" 1, "tnum" 1;
  font-feature-settings: "numr" 0, "lnum" 1, "tnum" 1;
}
.field { margin-bottom: 12px; }
textarea { min-height: 75px; resize: vertical; }

/* Chips */
.chip-group { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  padding: 6px 12px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-full);
  font-size: 12px;
  cursor: pointer;
  background: var(--paper2);
  font-weight: 600;
  color: var(--ink);
  user-select: none;
  transition: all 0.15s ease;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.chip:hover {
  background: var(--paper3);
  border-color: var(--slate-400);
}
.chip.sel {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
  box-shadow: 0 2px 6px rgba(37,99,235,0.25);
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  border: none;
  font-family: inherit;
  font-weight: 700;
  font-size: 12.5px;
  cursor: pointer;
  transition: all 0.15s ease;
  user-select: none;
  text-decoration: none;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--primary); color: #fff; box-shadow: 0 2px 6px rgba(37,99,235,0.25); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-ghost { background: var(--paper2); border: 1px solid var(--line-strong); color: var(--ink); }
.btn-ghost:hover { background: var(--paper3); border-color: var(--slate-400); }
.btn-green { background: var(--green); color: #fff; }
.btn-green:hover { background: #059669; }
.btn-blue { background: #0284c7; color: #fff; }
.btn-blue:hover { background: #0369a1; }
.btn-amber { background: var(--amber); color: #fff; }
.btn-amber:hover { background: #b45309; }
.btn-red { background: var(--red); color: #fff; }
.btn-red:hover { background: #be123c; }
.btn-whatsapp { background: #25D366; color: #fff; }
.btn-whatsapp:hover { background: #1ebe57; }
.wa-icon { width: 14px; height: 14px; flex-shrink: 0; }
.btn-sm { padding: 5px 11px; font-size: 11.5px; }
.btn-xs { padding: 4px 8px; font-size: 10.5px; border-radius: 4px; }
.actions-row { display: flex; gap: 10px; justify-content: space-between; align-items: center; margin-top: 14px; }

/* Status Badges */
.status-badge {
  padding: 3px 9px;
  border-radius: var(--radius-full);
  font-size: 11px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid transparent;
}
.st-check { background: var(--blue-bg); color: var(--blue-text); border-color: #bfdbfe; }
.st-repair { background: var(--amber-bg); color: var(--amber-text); border-color: #fde68a; }
.st-done { background: var(--green-bg); color: var(--green-text); border-color: #a7f3d0; }
.st-delivered { background: #ede9fe; color: #6b21a8; border-color: #ddd6fe; }
.st-failed { background: var(--red-bg); color: var(--red-text); border-color: #fecdd3; }
.st-rejected { background: var(--slate-200); color: var(--slate-700); border-color: var(--slate-300); }

/* Quick Status Button */
.btn-status-quick {
  background: var(--paper2);
  border: 1px solid var(--line-strong);
  padding: 3px 8px;
  border-radius: var(--radius-full);
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s ease;
  box-shadow: 0 1px 2px rgba(0,0,0,0.03);
}
.btn-status-quick:hover {
  border-color: var(--primary);
  background: var(--primary-light);
  color: var(--primary);
}

/* Tables */
.table-wrap {
  background: var(--paper2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: auto;
  box-shadow: var(--card-shadow);
}
table {
  width: 100%;
  border-collapse: collapse;
  text-align: right;
}
th, td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  font-size: 12.5px;
}
th {
  background: var(--paper3);
  font-weight: 700;
  color: var(--ink-secondary);
  font-size: 11.5px;
  white-space: nowrap;
}
tbody tr { transition: background-color 0.1s ease; }
tbody tr:hover { background-color: var(--paper3); }
tr:last-child td { border-bottom: none; }
.row-actions { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }

/* Filter Bar */
.filters-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
  align-items: center;
  background: var(--paper2);
  padding: 10px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  box-shadow: var(--card-shadow);
}
.filters-bar input, .filters-bar select {
  width: auto;
  min-width: 160px;
}

/* Chart of Accounts & Tree */
.tree-wrap { display: flex; flex-direction: column; gap: 4px; }
.tree-node {
  background: var(--paper2);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: all 0.15s ease;
  user-select: none;
}
.tree-node:hover { background: var(--paper3); border-color: var(--primary); }
.tree-node.level-1 { background: var(--paper3); font-weight: 800; border-right: 4px solid var(--primary); margin-top: 8px; }
.tree-node.level-2 { margin-right: 18px; border-right: 3px solid var(--slate-400); }
.tree-node.level-3 { margin-right: 36px; border-right: 2px solid var(--slate-300); }
.tree-node.level-4 { margin-right: 54px; }
.tree-node-title { display: flex; align-items: center; gap: 9px; flex: 1; min-width: 0; }
.account-code { background: var(--paper3); color: var(--primary); font-weight: 800; padding: 2px 7px; border-radius: 4px; font-size: 11.5px; border: 1px solid var(--line); }
.nature-pill { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: var(--radius-full); }
.nature-pill.debit { background: var(--blue-bg); color: var(--blue-text); }
.nature-pill.credit { background: var(--green-bg); color: var(--green-text); }
.journal-line-row { display: grid; grid-template-columns: 2fr 1fr 1fr 2fr 35px; gap: 8px; align-items: center; margin-bottom: 8px; }

/* Modal Windows */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.7);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 16px;
  animation: fadeIn 0.15s ease-out;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(12px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

.modal-content {
  background: var(--paper2);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  max-width: 680px;
  width: 100%;
  max-height: 90vh;
  overflow: auto;
  padding: 22px;
  position: relative;
  animation: slideUp 0.2s ease-out;
  color: var(--ink);
}

/* Toast Notifications */
#toastContainer {
  position: fixed;
  bottom: 24px;
  left: 24px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  background: var(--slate-900);
  color: #fff;
  padding: 11px 16px;
  border-radius: var(--radius-sm);
  font-size: 12.5px;
  font-weight: 600;
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: center;
  gap: 10px;
  animation: slideInLeft 0.2s ease-out;
  min-width: 260px;
}
.toast.success { background: #065f46; border-right: 4px solid #10b981; }
.toast.error { background: #9f1239; border-right: 4px solid #f43f5e; }
.toast.info { background: #1e3a8a; border-right: 4px solid #3b82f6; }
@keyframes slideInLeft { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }

/* Executive Command Center & Smart Hub */
.command-center-wrap {
  max-width: 1280px;
  margin: 20px auto 40px;
  padding: 0 20px;
  width: 100%;
}
.hub-hero {
  background: linear-gradient(135deg, rgba(79, 70, 229, 0.08), rgba(56, 189, 248, 0.06));
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-lg);
  padding: 24px 28px;
  margin-bottom: 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  box-shadow: var(--card-shadow);
  position: relative;
  overflow: hidden;
}
.hub-hero::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -20%;
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, var(--primary-light) 0%, transparent 70%);
  opacity: 0.5;
  pointer-events: none;
}
.hub-hero-brand {
  display: flex;
  align-items: center;
  gap: 16px;
}
.hub-hero-logo {
  width: 54px;
  height: 54px;
  background: linear-gradient(135deg, var(--primary), #38bdf8);
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  color: #fff;
  box-shadow: 0 6px 20px rgba(79,70,229,0.35);
  flex-shrink: 0;
}
.hub-hero-title {
  font-size: 22px;
  font-weight: 900;
  color: var(--ink);
  letter-spacing: -0.02em;
  margin: 0;
}
.hub-hero-subtitle {
  font-size: 13px;
  color: var(--ink-secondary);
  margin-top: 3px;
  font-weight: 600;
}

/* Quick Action Power Dock */
.quick-dock {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 24px;
}
.quick-dock-btn {
  flex: 1;
  min-width: 170px;
  background: var(--paper2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  box-shadow: var(--card-shadow);
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);

}
.quick-dock-btn:hover {
  transform: translateY(-3px);
  border-color: var(--primary);
  box-shadow: var(--card-hover-shadow);
  background: var(--paper3);
}
.quick-dock-icon {
  width: 38px;
  height: 38px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.quick-dock-title {
  font-size: 13px;
  font-weight: 800;
  color: var(--ink);
}
.quick-dock-desc {
  font-size: 11px;
  color: var(--ink-secondary);
  margin-top: 1px;
}

/* Live Telemetry Bar */
.telemetry-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 14px;
  margin-bottom: 24px;
}
.telemetry-card {
  background: var(--paper2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 18px;
  box-shadow: var(--card-shadow);
  position: relative;
  overflow: hidden;
  transition: all 0.2s ease;
}
.telemetry-card:hover {
  border-color: var(--line-strong);
  box-shadow: var(--card-hover-shadow);
}
.telemetry-card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.telemetry-card-lbl {
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-secondary);
}
.telemetry-card-icon {
  font-size: 18px;
  width: 32px;
  height: 32px;
  border-radius: var(--radius-xs);
  display: flex;
  align-items: center;
  justify-content: center;
}
.telemetry-card-val {
  font-size: 24px;
  font-weight: 900;
  color: var(--ink);
  margin-top: 8px;
  line-height: 1.2;
}
.telemetry-card-sub {
  font-size: 11px;
  color: var(--ink-secondary);
  margin-top: 4px;
  display: flex;
  gap: 6px;
  align-items: center;
}

/* Smart Section Cards */
.smart-section-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
  gap: 16px;
  margin-bottom: 28px;
}
.smart-sec-card {
  background: var(--paper2);
  border: 1.5px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 22px 20px;

  box-shadow: var(--card-shadow);
  transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  overflow: hidden;
}
.smart-sec-card:hover {
  transform: translateY(-4px);
  border-color: var(--primary);
  box-shadow: var(--card-hover-shadow);
}
.smart-sec-head {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  margin-bottom: 14px;
}
.smart-sec-icon-box {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  background: var(--paper3);
  transition: all 0.2s ease;
  flex-shrink: 0;
}
.smart-sec-card:hover .smart-sec-icon-box {
  transform: scale(1.08);
  background: var(--primary-light);
}
.smart-sec-title {
  font-size: 16px;
  font-weight: 900;
  color: var(--ink);
  line-height: 1.3;
}
.smart-sec-desc {
  font-size: 11.5px;
  color: var(--ink-secondary);
  margin-top: 3px;
  line-height: 1.4;
}
.smart-sec-meta {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.smart-sec-badge {
  font-size: 11px;
  font-weight: 800;
  padding: 3px 8px;
  border-radius: var(--radius-full);
  background: var(--paper3);

}
.smart-sec-arrow {
  font-size: 13px;
  color: var(--primary);
  font-weight: 800;
  transition: transform 0.2s ease;
}
.smart-sec-card:hover .smart-sec-arrow {
  transform: translateX(-4px);
}

/* Command Palette Universal Search Modal */
.cmd-palette-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 15, 25, 0.75);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 9999;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 60px 16px 20px;
  animation: fadeIn 0.15s ease-out;
}
.cmd-palette-box {
  background: var(--paper2);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 660px;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  overflow: hidden;
  animation: slideUp 0.18s ease-out;
  display: flex;
  flex-direction: column;
  max-height: 80vh;
}
.cmd-palette-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);
  background: var(--paper3);
}
.cmd-palette-input {
  flex: 1;
  border: none;
  background: transparent;
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);

  padding: 0;
  box-shadow: none !important;
}
.cmd-palette-results {
  overflow-y: auto;
  padding: 10px;
  max-height: 480px;
}
.cmd-group-title {
  font-size: 11px;
  font-weight: 800;

  text-transform: uppercase;
  padding: 8px 12px 4px;
}
.cmd-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.12s ease;
  user-select: none;
}
.cmd-item:hover, .cmd-item.selected {
  background: var(--primary-light);
  color: var(--primary);
}
.cmd-item-left {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}
.cmd-item-icon {
  font-size: 16px;
  width: 28px;
  height: 28px;
  border-radius: 6px;
  background: var(--paper3);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.cmd-item:hover .cmd-item-icon {
  background: #fff;
}
.cmd-item-title {
  font-weight: 800;
  font-size: 13px;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cmd-item-sub {
  font-size: 11.5px;
  color: var(--ink-secondary);
  margin-top: 1px;
}
.cmd-item-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  background: var(--paper3);
}

<script>
/* ---------------- Universal Western Digits Enforcer (0-9) ---------------- */
function toEngDigits(str){
  if(str == null) return '';
  return String(str)
    .replace(/[٠-٩]/g, d => '0123456789'['٠١٢٣٤٥٦٧٨٩'.indexOf(d)])
    .replace(/[۰-۹]/g, d => '0123456789'['۰۱۲۳۴۵۶۷۸۹'.indexOf(d)]);
}

// Global Real-time Auto-converter for Phone and Numeric Inputs
document.addEventListener('input', function(e) {
  const target = e.target;
  if (!target || (target.tagName !== 'INPUT' && target.tagName !== 'TEXTAREA')) return;

  const isPhone = target.type === 'tel' || 
                  (target.id && /phone|tel|mobile|هاتف|جوال/i.test(target.id)) ||
                  (target.name && /phone|tel|mobile|هاتف|جوال/i.test(target.name)) ||
                  (target.placeholder && /هاتف|تليفون|موبايل|phone|01/i.test(target.placeholder));

  const isNumeric = target.type === 'number' || 
                    target.inputMode === 'numeric' || 
                    target.inputMode === 'decimal' ||
                    isPhone ||
                    (target.id && /cost|price|deposit|amt|amount|qty|quantity|rem|bonus|total|barcode|rate|tax|credit|debit|discount/i.test(target.id)) ||
                    (target.className && /mono/i.test(target.className));

  if (isPhone) {
    target.dir = 'ltr';
    target.style.textAlign = 'right';
    target.style.fontFamily = 'var(--font-mono)';
    const originalVal = target.value;
    const converted = toEngDigits(originalVal).replace(/[^0-9+\-\s()]/g, '');
    if (originalVal !== converted) {
      const cursor = target.selectionStart;
      target.value = converted;
      try { target.setSelectionRange(cursor, cursor); } catch(err){}
    }
  } else if (isNumeric) {
    const originalVal = target.value;
    const converted = toEngDigits(originalVal);
    if (originalVal !== converted) {
      const cursor = target.selectionStart;
      target.value = converted;
      try { target.setSelectionRange(cursor, cursor); } catch(err){}
    }
  }
}, true);

// Override Number.prototype.toLocaleString to guarantee English numbers everywhere
const _origNumberToLocaleString = Number.prototype.toLocaleString;
Number.prototype.toLocaleString = function(locales, options) {
  return _origNumberToLocaleString.call(this, 'en-US', options);
};

// Override Date formatting
const _origDateToLocaleTimeString = Date.prototype.toLocaleTimeString;
Date.prototype.toLocaleTimeString = function(locales, options) {
  return toEngDigits(_origDateToLocaleTimeString.call(this, 'en-GB', options));
};
const _origDateToLocaleDateString = Date.prototype.toLocaleDateString;
Date.prototype.toLocaleDateString = function(locales, options) {
  return toEngDigits(_origDateToLocaleDateString.call(this, 'en-CA', options));
};

/* ---------------- Google Sheets API & Offline Sync Engine ---------------- */
const API_URL = 'https://script.google.com/macros/s/AKfycbzpi81aPJwwsvHCqUKCkUxEhT0l4NnLgcCBPab1xjvx0B3vhzamCVkwiohrOCfWkKcm/exec';

/* Local Cache Helpers */
function getCache(key, fallback){
  try {
    const d = localStorage.getItem('microerp_cache_' + key);
    return d ? JSON.parse(d) : fallback;
  } catch(e) { return fallback; }
}
function setCache(key, val){
  try { localStorage.setItem('microerp_cache_' + key, JSON.stringify(val)); } catch(e){}
}

/* Offline Sync Queue */
function getSyncQueue(){
  try { return JSON.parse(localStorage.getItem('microerp_sync_queue') || '[]'); } catch(e){ return []; }
}
function saveSyncQueue(q){
  try { localStorage.setItem('microerp_sync_queue', JSON.stringify(q)); } catch(e){}
  updateSyncStatusPill();
}
function addToSyncQueue(action, data){
  const q = getSyncQueue();
  q.push({ id: 'sync_' + Date.now() + '_' + Math.random().toString(36).slice(2,7), action, data, timestamp: new Date().toISOString() });
  saveSyncQueue(q);
}

/* Network Request Wrappers with Local Fallback */
async function apiGet(action, params){
  if(!navigator.onLine){
    // Return cached data immediately
    return getCache(action, []);
  }
  try {
    const q = new URLSearchParams({action, ...(params||{})});
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 9000);
    const res = await fetch(`${API_URL}?${q.toString()}`, { signal: controller.signal });
    clearTimeout(timeout);
    const json = await res.json();
    if(json && json.error) throw new Error(json.error);
    // Cache success
    setCache(action, json);
    return json;
  } catch(e) {
    console.warn(`apiGet failed for ${action}, falling back to local cache:`, e.message);
    return getCache(action, []);
  }
}

async function apiPost(action, data){
  if(!navigator.onLine){
    addToSyncQueue(action, data);
    return { ok: true, offline: true };
  }
  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 9000);
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({action, ...data}),
      signal: controller.signal
    });
    clearTimeout(timeout);
    const json = await res.json();
    if(json && json.error) throw new Error(json.error);
    return json;
  } catch(e) {
    console.warn(`apiPost network error on ${action}, enqueuing for background sync:`, e.message);
    addToSyncQueue(action, data);
    return { ok: true, offline: true };
  }
}

/* Background Synchronization */
let isSyncingNow = false;
async function syncOfflineQueue(){
  if(!navigator.onLine || isSyncingNow) return;
  const q = getSyncQueue();
  if(!q.length) { updateSyncStatusPill(); return; }

  isSyncingNow = true;
  updateSyncStatusPill();
  showToast(`🔄 جاري مزامنة ${q.length} عمليات مسجلة دون إنترنت...`, 'info');

  const remaining = [];
  for(const item of q){
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify({action: item.action, ...item.data})
      });
      const json = await res.json();
      if(json && json.error) throw new Error(json.error);
    } catch(err) {
      console.warn('Sync failed for item:', item, err);
      remaining.push(item);
    }
  }

  saveSyncQueue(remaining);
  isSyncingNow = false;
  updateSyncStatusPill();

  if(remaining.length === 0){
    showToast('✅ تم مزامنة كافة العمليات بنجاح مع السحابة!', 'success');
    // Refresh memory from cloud
    try {
      [state.receipts, state.customers, state.technicians, state.settings, state.payments, state.inventory, state.sales, state.quotations, state.services, state.purchases, state.suppliers, state.expenses] = await Promise.all([
        loadReceipts(), loadCustomers(), loadTechnicians(), loadSettings(), loadPayments(), loadInventory(), loadSales(), loadQuotations(), loadServices(), loadPurchases(), loadSuppliers(), loadExpenses()
      ]);
      renderMain();
    } catch(e){}
  } else {
    showToast(`⚠️ تبقى ${remaining.length} عمليات قيد المزامنة عند توفر اتصال أقوى.`, 'info');
  }
}

/* Listen to online/offline network events */
window.addEventListener('online', ()=>{
  updateSyncStatusPill();
  showToast('🌐 تم استعادة الاتصال بالإنترنت! جاري المزامنة...', 'success');
  syncOfflineQueue();
});
window.addEventListener('offline', ()=>{
  updateSyncStatusPill();
  showToast('📴 انقطع الإنترنت — النظام يعمل محلياً بكفاءة 100%', 'info');
});

function updateSyncStatusPill(){
  const pill = document.getElementById('networkSyncPill');
  if(!pill) return;
  const q = getSyncQueue();
  if(!navigator.onLine){
    pill.className = 'sync-pill offline';
    pill.innerHTML = `<span>📴 غير متصل</span>${q.length ? `<span class="mono">(${q.length} معلقة)</span>` : ''}`;
    pill.title = 'أنت تعمل حالياً في الوضع المحلي (أوفلاين)، وسيتم حفظ وتطبيق كل العمليات تلقائياً.';
  } else if(isSyncingNow){
    pill.className = 'sync-pill syncing';
    pill.innerHTML = `<span>🔄 جاري المزامنة...</span>`;
  } else if(q.length > 0){
    pill.className = 'sync-pill offline';
    pill.innerHTML = `<span>⚠️ ${q.length} عمليات معلقة</span>`;
    pill.title = 'اضغط للمزامنة الفورية مع السحابة';
  } else {
    pill.className = 'sync-pill online';
    pill.innerHTML = `<span>🟢 متصل ومتزامن</span>`;
    pill.title = 'النظام متصل بالسحابة ومتزامن بالكامل';
  }
}

/* ---- Toast Notification Utility ---- */
function showToast(msg, type='info', duration=3200){
  const container = document.getElementById('toastContainer');
  if(!container) return;
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  const icons = { success: '✅', error: '❌', info: 'ℹ️' };
  t.innerHTML = `<span>${icons[type] || 'ℹ️'}</span><span>${msg}</span>`;
  container.appendChild(t);
  setTimeout(()=>{
    t.style.opacity = '0';
    t.style.transform = 'translateY(10px)';
    t.style.transition = 'all 0.2s ease';
    setTimeout(()=>t.remove(), 200);
  }, duration);
}

/* ---- Mapping between internal shape and flat sheet rows ---- */
function receiptToRow(d){
  return {
    ID: d.id, ReceiptNumber: d.receiptNumber, Date: d.date,
    CustomerName: d.customer.name, CustomerPhone: d.customer.phone, CustomerEmail: d.customer.email,
    Category: d.device.category, Brand: d.device.brand==='أخرى' ? d.device.brandOther : d.device.brand,
    Model: d.device.model, Accessories: d.device.accessories,
    Faults: (d.faults||[]).join('، '), FaultNotes: d.faultNotes,
    Technician: d.technician, Cost: d.cost, Deposit: d.deposit, Refunded: d.refunded || 0, PartsCost: d.partsCost || 0, PartsUsed: d.partsUsed || '',
    DeliveryDate: d.deliveryDate, Status: d.status, Paid: d.paid ? 'TRUE' : 'FALSE',
    Bonus: d.bonus || '', CreatedBy: d.createdBy, UpdatedBy: d.updatedBy, UpdatedAt: d.updatedAt
  };
}
function rowToReceipt(row){
  return {
    id: row.ID, receiptNumber: row.ReceiptNumber, date: row.Date,
    customer: {name: row.CustomerName, phone: String(row.CustomerPhone||''), email: row.CustomerEmail||''},
    device: {category: row.Category, brand: row.Brand, brandOther: '', model: row.Model, accessories: row.Accessories||''},
    faults: row.Faults ? String(row.Faults).split('، ').filter(Boolean) : [],
    faultNotes: row.FaultNotes||'', technician: row.Technician||'',
    cost: row.Cost, deposit: row.Deposit, refunded: Number(row.Refunded||0), partsCost: Number(row.PartsCost||0), partsUsed: row.PartsUsed||'', deliveryDate: row.DeliveryDate,
    status: row.Status||'قيد الفحص', paid: String(row.Paid)==='TRUE', bonus: row.Bonus,
    createdBy: row.CreatedBy||'', updatedBy: row.UpdatedBy||'', updatedAt: row.UpdatedAt||''
  };
}

/* Entity Loaders */
async function loadSettings(){
  const s = await apiGet('getSettings');
  const obj = {shopName: s.shopName || 'صيانة ميكروتك', logoUrl: s.logoUrl || ''};
  setCache('settings', obj);
  return obj;
}
async function saveSettingRemote(key, value){
  state.settings[key] = value;
  setCache('settings', state.settings);
  return apiPost('saveSetting', {key, value});
}

function getReceiptPayments(r){
  if(!r) return [];
  const targetId = typeof r === 'object' ? String(r.id||'').trim() : String(r).trim();
  const targetNum = typeof r === 'object' && r.receiptNumber ? String(r.receiptNumber).trim() : '';
  return (state.payments||[]).filter(p => {
    const pId = String(p.ReceiptID||'').trim();
    return (targetId && pId === targetId) || (targetNum && pId === targetNum);
  });
}

async function loadPayments(receiptId){
  if(receiptId){
    return getReceiptPayments(receiptId);
  }
  const rows = await apiGet('getPayments');
  if(Array.isArray(rows)){
    state.payments = rows;
    setCache('payments', rows);
  }
  return state.payments;

async function saveExpenseRemote(exp){
  if(!exp.ID) exp.ID = 'exp_' + Date.now();
  if(!exp.Date) exp.Date = new Date().toISOString().slice(0,10);
  exp.By = state.user ? state.user.name : 'نظام';
  const idx = state.expenses.findIndex(x=>x.ID===exp.ID);
  if(idx>-1) state.expenses[idx] = exp; else state.expenses.push(exp);
  setCache('expenses', state.expenses);

  // Auto Journal
  const isIncome = exp.Type === 'in' || exp.Type === 'income';
  const isDraw = exp.Type === 'out' || exp.Category === 'مسحوبات شخصية' || exp.Category === 'جاري الشركاء';
  const isPetty = exp.Type === 'petty' || exp.Category === 'بوفيه ونثريات' || exp.Category === 'نثريات';

  if(isIncome){
    recordAutoJournalEntry(
      `إيداع وارد: ${exp.Title}`,
      'CashIn',
      exp.ID,
      [
        {AccountCode:'1101', AccountName:'الخزينة الرئيسية (النقدية)', Debit:Number(exp.Amount), Credit:0, Notes:exp.Title},
        {AccountCode:'4102', AccountName:'إيرادات أخرى متنوعة', Debit:0, Credit:Number(exp.Amount), Notes:exp.Notes||exp.Title}
      ]
    ).catch(e=>{});
  } else if(isDraw){
    recordAutoJournalEntry(
      `منصرف مسحوبات: ${exp.Title}`,
      'CashOut',
      exp.ID,
      [
        {AccountCode:'3103', AccountName:'جاري الشركاء والمسحوبات', Debit:Number(exp.Amount), Credit:0, Notes:exp.Title},
        {AccountCode:'1101', AccountName:'الخزينة الرئيسية (النقدية)', Debit:0, Credit:Number(exp.Amount), Notes:exp.Notes||exp.Title}
      ]
    ).catch(e=>{});
  } else {
    const expAccCode = EXPENSE_ACCOUNT_MAP[exp.Category] || (isPetty ? '5203' : '52');
    const expAcc = state.accounts.find(a=>a.Code===expAccCode) || {Name: isPetty ? 'بوفيه ونثريات وضيافة' : 'المصروفات التشغيلية'};
    recordAutoJournalEntry(
      `${isPetty?'نثريات':'مصروف'}: ${exp.Title} (${exp.Category})`,
      'Expense',
      exp.ID,
      [
        {AccountCode:expAccCode, AccountName:expAcc.Name, Debit:Number(exp.Amount), Credit:0, Notes:exp.Notes||exp.Title},
        {AccountCode:'1101', AccountName:'الخزينة الرئيسية (النقدية)', Debit:0, Credit:Number(exp.Amount), Notes:'سداد نقدي من الدرج'}
      ]
    ).catch(e=>{});
  }

  return apiPost('saveExpense', {data: exp, user: exp.By});
}

async function recordAutoJournalEntry(desc, refType, refId, lines){
  const totalDebit = lines.reduce((s,l)=>s+Number(l.Debit||0),0);
  const totalCredit = lines.reduce((s,l)=>s+Number(l.Credit||0),0);
  const entry = {
    ID: 'je_' + Date.now() + '_' + Math.floor(Math.random()*1000),
    EntryNumber: 'JE-' + new Date().getFullYear() + '-' + String(Date.now()).slice(-4),
    Date: new Date().toISOString().slice(0,10),
    Description: desc,
    ReferenceType: refType,
    ReferenceID: refId || '',
    LinesJSON: JSON.stringify(lines),
    Lines: lines,
    TotalDebit: totalDebit,
    TotalCredit: totalCredit,
    By: state.user ? state.user.name : 'نظام'
  };
  return saveJournalEntryRemote(entry);
}

function getAccountStats(accountCode){
  const code = String(accountCode).trim();
  const acc = state.accounts.find(a=>String(a.Code)===code);
  const nature = acc ? acc.Nature : 'مدين';
  let totalDebit = 0;
  let totalCredit = 0;

  // Direct transactions from journal entries
  (state.journalEntries||[]).forEach(je=>{
    (je.Lines||[]).forEach(l=>{
      if(String(l.AccountCode).trim()===code){
        totalDebit += Number(l.Debit||0);
        totalCredit += Number(l.Credit||0);
      }
    });
  });

  // Also include child accounts if this is a parent category
  const children = state.accounts.filter(a=>String(a.ParentCode)===code);
  children.forEach(ch=>{
    const chStats = getAccountStats(ch.Code);
    totalDebit += chStats.totalDebit;
    totalCredit += chStats.totalCredit;
  });

  const initBal = Number(acc ? acc.Balance : 0);
  const netBalance = nature === 'مدين' ? (initBal + totalDebit - totalCredit) : (initBal + totalCredit - totalDebit);

  return { totalDebit, totalCredit, netBalance, nature };
}

async function loadUsers(){
  let localUsers = getCache('users', null);
  if(!localUsers || !localUsers.length){
    try {
      const perm = localStorage.getItem('microerp_users_permanent');
      if(perm) localUsers = JSON.parse(perm);
    } catch(e){}
  }
  if(!localUsers || !localUsers.length){
    localUsers = [...DEFAULT_USERS];
  } else {
    // Ensure default admin exists
    if(!localUsers.some(u => u.Name && u.Name.toLowerCase() === 'admin')){
      localUsers.unshift(DEFAULT_USERS[0]);
    }
  }

  state.users = localUsers;
  setCache('users', state.users);

  if(navigator.onLine){
    try {
      const rows = await apiGet('getUsers');
      if(rows && Array.isArray(rows) && rows.length > 0){
        rows.forEach(r => {
          if(!r || !r.Name) return;
          const idx = state.users.findIndex(u => (u.ID && u.ID === r.ID) || (u.Name && u.Name.toLowerCase() === r.Name.toLowerCase()));
          if(idx > -1){
            state.users[idx] = { ...state.users[idx], ...r };
          } else {
            state.users.push(r);
          }
        });
        setCache('users', state.users);
        try { localStorage.setItem('microerp_users_permanent', JSON.stringify(state.users)); } catch(e){}
      }
    } catch(e){
      console.warn('getUsers cloud fetch error, keeping local users:', e);
    }
  }
  return state.users;
}

async function saveUserRemote(usr){
  if(!usr.ID) usr.ID = 'usr_' + Date.now();
  if(!state.users) state.users = [];
  const idx = state.users.findIndex(u => (u.ID && u.ID === usr.ID) || (u.Name && u.Name.trim().toLowerCase() === usr.Name.trim().toLowerCase()));
  if(idx > -1) {
    state.users[idx] = { ...state.users[idx], ...usr };
  } else {
    state.users.push(usr);
  }
  setCache('users', state.users);
  try { localStorage.setItem('microerp_users_permanent', JSON.stringify(state.users)); } catch(e){}
  
  if(navigator.onLine){
    try {
      await apiPost('saveUser', {data: usr, role: state.user ? state.user.role : 'admin'});
    } catch(e){
      console.warn('saveUser remote sync failed:', e);
    }
  }
  return usr;
}

async function deleteUserRemote(userId){
  state.users = state.users.filter(u => u.ID !== userId && u.Name !== userId);
  setCache('users', state.users);
  try { localStorage.setItem('microerp_users_permanent', JSON.stringify(state.users)); } catch(e){}
  if(navigator.onLine){
    try {
      await apiPost('deleteUser', {id: userId, role: state.user ? state.user.role : 'admin'});
    } catch(e){}
  }
  return true;
}

async function loginRemote(name, password){
  const cleanName = String(name||'').trim();
  const cleanPass = String(password||'').trim();

  const cachedUsers = getCache('users', DEFAULT_USERS);
  const found = cachedUsers.find(u => u.Name.toLowerCase() === cleanName.toLowerCase() && String(u.Password) === cleanPass);

  if(!navigator.onLine){
    if(found){
      return { name: found.Name, role: found.Role, sections: found.Sections };
    }
    if(cleanName==='admin' && cleanPass==='admin'){
      return { name:'admin', role:'admin', sections:'daily,maintenance,invoices,pos,inventory,cameras,finance,users' };
    }
    throw new Error('بيانات الدخول غير صحيحة (وضع غير متصل)');
  }

  try {
    const res = await apiGet('login', {name: cleanName, password: cleanPass});
    if(res && !res.error && res.name){
      const users = getCache('users', DEFAULT_USERS);
      const idx = users.findIndex(u=>u.Name.toLowerCase() === cleanName.toLowerCase());
      const userObj = {
        ID: (found && found.ID) || ('usr_' + Date.now()),
        Name: res.name,
        Password: cleanPass,
        Role: res.role,
        Sections: res.sections || (found && found.Sections) || 'daily,maintenance,invoices,pos,inventory,cameras,finance,users'
      };
      if(idx > -1) users[idx] = userObj; else users.push(userObj);
      setCache('users', users);
      return res;
    }
  } catch(e){}

  if(found){
    return { name: found.Name, role: found.Role, sections: found.Sections };
  }
  if(cleanName==='admin' && cleanPass==='admin'){
    return { name:'admin', role:'admin', sections:'daily,maintenance,invoices,pos,inventory,cameras,finance,users' };
  }
  throw new Error('اسم المستخدم أو كلمة المرور غير صحيحة');
}

function applyThemeAndAppearance(){
  const t = state.theme || 'light';
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('microerp_theme', t);

  const primary = (state.settings && state.settings.primaryColor) || '#4f46e5';
  document.documentElement.style.setProperty('--primary', primary);
  document.documentElement.style.setProperty('--primary-hover', adjustColorBrightness(primary, -15));

  const fSize = (state.settings && state.settings.fontSize) || 'normal';
  if(fSize === 'compact'){
    document.documentElement.style.fontSize = '13px';
  } else if(fSize === 'large'){
    document.documentElement.style.fontSize = '15.5px';
  } else {
    document.documentElement.style.fontSize = '14px';
  }
}

function adjustColorBrightness(hex, percent) {
  let num = parseInt(hex.replace('#',''), 16),
      amt = Math.round(2.55 * percent),
      R = (num >> 16) + amt,
      G = (num >> 8 & 0x00FF) + amt,
      B = (num & 0x0000FF) + amt;
  return '#' + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 + (G<255?G<1?0:G:255)*0x100 + (B<255?B<1?0:B:255)).toString(16).slice(1);
}

function applyTheme(t){
  state.theme = t;
  applyThemeAndAppearance();
}

/* ---------------- Init ---------------- */
async function init(){
  if(checkCustomerTrackingURL()) return;
  
  // Instant load from cache first for zero-wait UI
  state.users = getCache('users', state.users);
  state.receipts = getCache('receipts', state.receipts);
  state.customers = getCache('customers', state.customers);
  state.technicians = getCache('technicians', state.technicians);
  state.settings = getCache('settings', state.settings);
  state.payments = getCache('payments', state.payments);
  state.inventory = getCache('inventory', state.inventory);
  state.sales = getCache('sales', state.sales);
  state.quotations = getCache('quotations', state.quotations);
  state.services = getCache('services', state.services);
  state.purchases = getCache('purchases', state.purchases);
  state.suppliers = getCache('suppliers', state.suppliers);
  state.expenses = getCache('expenses', state.expenses);
  state.accounts = getCache('accounts', state.accounts);
  state.journalEntries = getCache('journal', state.journalEntries);
  state.invoices = getCache('invoices', state.invoices);

  render();
  updateSyncStatusPill();

  // If online, fetch fresh updates in background
  if(navigator.onLine){
    try {
      [state.users, state.receipts, state.customers, state.technicians, state.settings, state.payments, state.inventory, state.sales, state.quotations, state.services, state.purchases, state.suppliers, state.expenses, state.accounts, state.journalEntries, state.invoices] = await Promise.all([
        loadUsers(), loadReceipts(), loadCustomers(), loadTechnicians(), loadSettings(), loadPayments(), loadInventory(), loadSales(), loadQuotations(), loadServices(), loadPurchases(), loadSuppliers(), loadExpenses(), loadAccounts(), loadJournalEntries(), loadInvoices()
      ]);
      render();
      syncOfflineQueue();
    } catch(e) {
      console.warn('Init background fetch failed, keeping local cache:', e);
    }
  }

  // Periodic heartbeat sync every 35 seconds
  setInterval(()=>{
    if(navigator.onLine && getSyncQueue().length > 0){
      syncOfflineQueue();
    }
  }, 35000);
}
async function refreshPayments(){ state.payments = await loadPayments(); }
async function refreshSales(){ state.sales = await loadSales(); }
async function refreshExpenses(){ state.expenses = await loadExpenses(); }

function normalizeUserSections(u){
  if(!u) return;
  const allSections = ['maintenance', 'pos', 'inventory', 'cameras', 'barcode', 'daily', 'invoices', 'finance', 'users', 'settings'];
  if(u.role === 'admin'){
    u.sections = allSections;
  } else {
    let secs = Array.isArray(u.sections) ? u.sections : String(u.sections||'').split(',').map(s=>s.trim()).filter(Boolean);
    if(!secs.length) secs = allSections;
    if(!secs.includes('settings')) secs.push('settings');
    if(!secs.includes('barcode')) secs.push('barcode');
    u.sections = secs;
  }
}

/* ---------------- Render Root ---------------- */
function render(){
  const app = document.getElementById('app');
  if(!state.user){ app.innerHTML = loginScreen(); attachLogin(); return; }
  normalizeUserSections(state.user);
  if(!state.currentSection){
    return renderSectionPicker(app);
  }
  if(state.currentSection==='maintenance') return renderMaintenanceApp(app);
  if(state.currentSection==='pos') return renderPosApp(app);
  if(state.currentSection==='inventory') return renderInventoryHubApp(app);
  if(state.currentSection==='cameras') return renderCamerasApp(app);
  if(state.currentSection==='barcode') return renderBarcodeStudioApp(app);
  if(state.currentSection==='daily') return renderDailyJournalSectionApp(app);
  if(state.currentSection==='invoices') return renderInvoicesSectionApp(app);
  if(state.currentSection==='finance') return renderFinanceSectionApp(app);
  if(state.currentSection==='users') return renderUsersSectionApp(app);
  if(state.currentSection==='settings') return renderSettingsSectionApp(app);
  renderSectionPicker(app);
}

function openCommandPalette(initialQuery=''){

    }

  function attachCmdClicks(){
    resultsBox.querySelectorAll('[data-cmd]').forEach(item => {
      item.onclick = ()=>{
        const cmd = item.dataset.cmd;
        overlay.remove();
        if(cmd === 'act_new_receipt'){
          state.currentSection = 'maintenance';
          state.tab = 'new';
          render();
          startNewDraft();
        } else if(cmd === 'act_pos'){
          state.currentSection = 'pos';
          render();
        } else if(cmd === 'act_barcode'){
          state.currentSection = 'barcode';
          render();
        } else if(cmd === 'act_new_daily'){
          state.currentSection = 'daily';
          render();
          openDailyEntryModal();
        } else if(cmd === 'act_new_invoice'){
          state.currentSection = 'invoices';
          render();
          openInvoiceModal();
        } else if(cmd === 'act_new_item'){
          state.currentSection = 'inventory';
          render();
          openItemModal();
        } else if(cmd === 'goto_sec'){
          state.currentSection = item.dataset.sec;
          render();
        } else if(cmd === 'open_receipt'){
          const r = state.receipts.find(x => x.id === item.dataset.id);
          if(r){
            state.currentSection = 'maintenance';
            render();
            openViewModal(r);
          }
        } else if(cmd === 'open_invoice'){
          const inv = state.invoices.find(x => x.id === item.dataset.id);
          if(inv){
            openInvoicePrint(inv, 'invoice');
          }
        } else if(cmd === 'open_item'){
          state.currentSection = 'inventory';
          render();
        } else if(cmd === 'act_settings'){
          state.currentSection = 'settings';
          render();
        }
      };
    });
  }

  input.oninput = (e)=>performSearch(e.target.value);
  performSearch(initialQuery);

function renderExecutiveCommandCenter(app){
  normalizeUserSections(state.user);

  // Compute live operational telemetry
  const todayIncome = (state.payments || []).filter(p => String(p.Date||'').slice(0,10) === today).reduce((s,p) => s + Number(p.Amount||0), 0);
  const todayExpenses = (state.expenses || []).filter(e => String(e.Date||'').slice(0,10) === today).reduce((s,e) => s + Number(e.Amount||0), 0);
  const netCashToday = todayIncome - todayExpenses;

  const inProgressRepairs = (state.receipts || []).filter(r => r.status === 'قيد الفحص' || r.status === 'الصيانة').length;
  const readyRepairs = (state.receipts || []).filter(r => r.status === 'مكتمل').length;
  const deliveredToday = (state.receipts || []).filter(r => r.status === 'تم التسليم' && String(r.updatedAt||r.date||'').slice(0,10) === today).length;
  const overdueRepairs = (state.receipts || []).filter(r => r.status === 'مكتمل' && (Date.now()-new Date(r.updatedAt||r.date).getTime())/86400000 > 7).length;

  const todaySales = (state.sales || []).filter(s => String(s.Date||'').slice(0,10) === today);
  const todaySalesTotal = todaySales.reduce((s,x) => s + Number(x.Total||0), 0);

  const lowStockCount = (state.inventory || []).filter(i => Number(i.Quantity||0) <= 2).length;
  const unpaidInvoices = (state.invoices || []).filter(i => !i.isPaid).length;

  // Group sections by cluster

/* ---------------- Main Router ---------------- */
function renderMain(){
  const main = document.getElementById('main');
  if((state.tab==='settings' || state.tab==='users') && state.user.role!=='admin'){ state.tab='dashboard'; }
  if(state.tab==='dashboard') return renderDashboard(main);
  if(state.tab==='new') return renderForm(main);
  if(state.tab==='archive') return renderArchive(main);
  if(state.tab==='invoices') return renderInvoicesPage(main);
  if(state.tab==='analytics') return renderMaintenanceAnalytics(main);
  if(state.tab==='inventory') return renderInventory(main, 'صيانة', 'مخزن قطع الغيار');
  if(state.tab==='users') return renderUsersManagementPage(main);
  if(state.tab==='settings') return renderSettings(main);
}

/* ---------------- Analytics & Charts ---------------- */
function renderMaintenanceAnalytics(main){
  const r = state.receipts;
  const totalCost = r.reduce((s,x)=>s+Number(x.cost||0),0);
  const totalParts = r.reduce((s,x)=>s+Number(x.partsCost||0),0);
  const completed = r.filter(x=>x.status==='مكتمل'||x.status==='تم التسليم').length;
  const completionRate = r.length ? Math.round((completed/r.length)*100) : 0;

  // Category counts
  const catCounts = {};
  r.forEach(x=>{ const c = x.device.category||'أخرى'; catCounts[c] = (catCounts[c]||0)+1; });

  // Tech counts
  const techCounts = {};
  r.forEach(x=>{
    const t = x.technician||'غير محدد';
    if(!techCounts[t]) techCounts[t] = {total:0, done:0, income:0};
    techCounts[t].total++;
    if(x.status==='مكتمل'||x.status==='تم التسليم') techCounts[t].done++;
    techCounts[t].income += Number(x.cost||0);
  });

  main.innerHTML = `
    <div class="top-header">
      <div>
        <h2 class="page-title">📈 التقارير والتحليلات البيانية</h2>
        <div class="subtitle">إحصائيات تفصيلية لأداء الصيانة وفئات الأجهزة وإنتاجية الفنيين</div>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-card green"><div class="num mono">${completionRate}%</div><div class="lbl">نسبة إنجاز الصيانة</div></div>
      <div class="stat-card blue"><div class="num mono">${totalCost.toLocaleString()} ج.م</div><div class="lbl">إجمالي قيمة الخدمات</div></div>
      <div class="stat-card amber"><div class="num mono">${totalParts.toLocaleString()} ج.م</div><div class="lbl">إجمالي تكلفة قطع الغيار</div></div>
      <div class="stat-card purple"><div class="num mono">${(totalCost-totalParts).toLocaleString()} ج.م</div><div class="lbl">صافي عائد الصيانة</div></div>
    </div>

    <div class="grid2">
      <div class="card">
        <h3>💻 فئات الأجهزة الأكثر استلاماً</h3>
        <div style="margin-top:14px;">
          ${Object.entries(catCounts).sort((a,b)=>b[1]-a[1]).map(([cat,count])=>{
            const pct = Math.round((count/r.length)*100);
            return `<div style="margin-bottom:12px;">
              <div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:4px;">
                <span>${cat}</span><span class="mono">${count} جهاز (${pct}%)</span>
              </div>
              <div style="background:var(--paper3);border-radius:4px;height:8px;overflow:hidden;">
                <div style="background:var(--primary);width:${pct}%;height:100%;border-radius:4px;"></div>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>

      <div class="card">
        <h3>👨‍🔧 إنتاجية وكفاءة الفنيين</h3>
        <div class="table-wrap" style="margin-top:12px;">
          <table>
            <thead><tr><th>الفني</th><th>المسند</th><th>المكتمل</th><th>نسبة النجاح</th><th>عائد الخدمات</th></tr></thead>
            <tbody>
              ${Object.entries(techCounts).map(([tech,stat])=>{
                const rate = stat.total ? Math.round((stat.done/stat.total)*100) : 0;
                return `<tr>
                  <td><b>${tech}</b></td>
                  <td class="mono">${stat.total}</td>
                  <td class="mono font-bold" style="color:var(--green);">${stat.done}</td>
                  <td class="mono">${rate}%</td>
                  <td class="mono font-bold">${stat.income.toLocaleString()} ج.م</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

/* ---------------- New Receipt Form ---------------- */
function startNewDraft(){
  state.draft = newDraft();
  state.formStep = 0;
  nextReceiptNumber()
    .then(n=>{ state.draft.receiptNumber = n; renderMain(); })
    .catch(e=>{ state.draft.receiptNumber = 'MT-'+Date.now(); renderMain(); });
}

const STEPS = ['بيانات العميل','بيانات الجهاز','الأعطال والفني','المالي والمخزن','مراجعة وحفظ'];
let currentStepCollector = null;

function renderForm(main){
  if(!state.draft){ startNewDraft(); return; }
  const d = state.draft;
  main.innerHTML = `
    <div class="top-header">
      <div>
        <h2 class="page-title">➕ إيصال استلام جهاز جديد</h2>
        <div class="subtitle">رقم الإيصال: <b class="mono" style="color:var(--primary);">${d.receiptNumber}</b> — التاريخ: <b class="mono">${d.date}</b></div>
      </div>
    </div>
    <div class="stepper">
      ${STEPS.map((s,i)=>`<div class="step-dot ${i===state.formStep?'active':(i<state.formStep?'done':'')}" data-i="${i}">
        <span>${i<state.formStep?'✓':(i+1)}</span><span>${s}</span>
      </div>`).join('')}
    </div>
    <div id="stepBody"></div>
  `;
  document.querySelectorAll('.step-dot').forEach(el=>el.onclick=()=>{
    if(typeof currentStepCollector==='function') currentStepCollector();
    state.formStep = Number(el.dataset.i); renderMain();
  });
  const body = document.getElementById('stepBody');
  if(state.formStep===0) return stepCustomer(body,d);
  if(state.formStep===1) return stepDevice(body,d);
  if(state.formStep===2) return stepFaults(body,d);
  if(state.formStep===3) return stepFinance(body,d);
  if(state.formStep===4) return stepReview(body,d);
}

function stepNav(body, canBack, canNext, nextLabel){
  const div = document.createElement('div');
  div.className='actions-row';
  div.innerHTML = `
    <button class="btn btn-ghost" id="backBtn" ${canBack?'':'disabled'}>السابق</button>
    <button class="btn btn-primary" id="nextBtn">${nextLabel||'التالي ➔'}</button>
  `;
  body.appendChild(div);
  if(canBack) div.querySelector('#backBtn').onclick = ()=>{ if(typeof currentStepCollector==='function') currentStepCollector(); state.formStep--; renderMain(); };
  div.querySelector('#nextBtn').onclick = canNext;
}

function stepFinance(body,d){
  body.innerHTML = `
    <div class="card">
      <h3>💰 التكلفة والجانب المالي</h3>

        <div class="field"><label>تكلفة الصيانة والخدمة (ج.م)</label><input id="finCost" type="number" value="${d.cost}" placeholder="0"></div>

      <h3>📦 استخدام قطع غيار من المخزن (اختياري)</h3>
      <div id="draftPartsUsedList" style="font-size:13px;margin-bottom:12px;color:var(--ink);">${d.partsUsed ? d.partsUsed : '<span style="color:var(--ink-secondary);">لم تُضف قطع غيار بعد.</span>'}</div>

        <div class="field" style="flex:2;margin-bottom:0;"><label>الصنف من المخزن</label>
          <select id="draftInvPickItem">
            <option value="">-- اختر صنف --</option>
            ${state.inventory.filter(it=>(it.Category||'صيانة')==='صيانة').map(it=>`<option value="${it.ID}" ${Number(it.Quantity)<=0?'disabled':''}>${it.Name} (متاح: ${it.Quantity}) - سعر الشراء: ${it.PurchasePrice} ج.م</option>`).join('')}
          </select>
        </div>
        <div class="field" style="flex:1;margin-bottom:0;"><label>الكمية</label><input id="draftInvPickQty" type="number" value="1" min="1"></div>

      </div>
    </div>
    <div class="card">
      <h3>📅 موعد التسليم التقديري</h3>
      <div class="chip-group" style="margin-bottom:12px;">
        <div class="chip" data-days="0">اليوم</div>
        <div class="chip" data-days="1">غداً</div>
        <div class="chip" data-days="2">بعد يومين</div>
        <div class="chip" data-days="7">أسبوع</div>
        <div class="chip" data-days="-1">غير محدد</div>
      </div>
      <div class="field"><label>أو حدد تاريخ التسليم</label><input id="finDate" type="date" value="${d.deliveryDate}"></div>
    </div>
  `;
  document.querySelectorAll('[data-days]').forEach(c=>{
    c.onclick = ()=>{
      const days = Number(c.dataset.days);
      if(days<0){ document.getElementById('finDate').value=''; }
      else { const dt = new Date(); dt.setDate(dt.getDate()+days); document.getElementById('finDate').value = dt.toISOString().slice(0,10); }
    };
  });
  document.getElementById('draftUsePartBtn').onclick = async ()=>{
    const itemId = document.getElementById('draftInvPickItem').value;
    const qty = Number(document.getElementById('draftInvPickQty').value);
    if(!itemId){ showToast('اختر صنف من المخزن أولاً', 'error'); return; }
    if(!qty || qty<=0){ showToast('أدخل كمية صحيحة', 'error'); return; }
    const item = state.inventory.find(x=>x.ID===itemId);
    if(!item || qty > Number(item.Quantity)){ showToast('الكمية غير متاحة بالمخزن', 'error'); return; }
    const btn = document.getElementById('draftUsePartBtn');
    btn.disabled = true; btn.textContent = '...';

      d.partsUsed = (d.partsUsed ? d.partsUsed + '، ' : '') + `${item.Name} × ${qty}`;

    btn.disabled = false; btn.textContent = 'خصم من المخزن';
  };
  currentStepCollector = ()=>{
    d.cost = document.getElementById('finCost').value;
    d.deposit = document.getElementById('finDep').value;
    d.deliveryDate = document.getElementById('finDate').value;
  };
  stepNav(body, true, ()=>{
    currentStepCollector();
    state.formStep=4; renderMain();
  }, 'مراجعة وحفظ ➔');
}

async function saveReceipt(d, printA5, sendWa, printSticker){
  d.updatedBy = state.user.name;
  d.updatedAt = new Date().toISOString();
  const btns = document.querySelectorAll('#saveOnlyBtn,#savePrintBtn,#saveWaBtn,#saveStickerBtn');
  btns.forEach(b=>{ b.disabled = true; b.textContent = 'جارٍ الحفظ...'; });
  try{
    await saveReceiptRemote(d);
    if(Number(d.deposit||0) > 0){
      try{ await savePaymentRemote(d.id, Number(d.deposit), 'دفعة مقدمة عند الاستلام'); }
      catch(payErr){ console.warn(payErr); }
      await refreshPayments();
    }
    if(!state.customers.find(c=>c.phone===d.customer.phone)){
      await saveCustomerRemote(d.customer);
      state.customers.push(d.customer);
    }
    state.draft = null;
    state.tab = 'archive';
    showToast(`تم حفظ الإيصال ${d.receiptNumber} بنجاح!`, 'success');
    renderMain();
    if(printA5){ setTimeout(()=>openReceiptPrint(d,'receipt'), 300); }
    if(printSticker){ setTimeout(()=>openStickerPrint(d), 300); }
    if(sendWa){ setTimeout(()=>openWhatsappChoice(d), 300); }
  }catch(e){
    showToast('تم حفظ الإيصال محلياً: '+e.message, 'info');
    btns.forEach(b=>{ b.disabled = false; });
  }
}

function renderArchive(main){

function attachRowActions(root){
  root.querySelectorAll('[data-act]').forEach(btn=>{
    btn.onclick = ()=>{
      const r = state.receipts.find(x=>x.id===btn.dataset.id);
      if(!r) return;
      const act = btn.dataset.act;
      if(act==='invoice') convertReceiptToInvoice(r.id);
      if(act==='view') openReceiptDetail(r);
      if(act==='wa') openWhatsapp(r);
      if(act==='print') openReceiptPrint(r,'receipt');
      if(act==='sticker') openStickerPrint(r);
      if(act==='del'){
        if(confirm(`هل تريد حذف الإيصال ${r.receiptNumber} نهائياً؟`)){
          deleteReceiptRemote(r.id)
            .then(()=>{ state.receipts = state.receipts.filter(x=>x.id!==r.id); showToast('تم حذف الإيصال بنجاح', 'success'); renderMain(); })
            .catch(e=>showToast('تعذر الحذف: '+e.message, 'error'));
        }
      }
    };
  });

  root.querySelectorAll('[data-quickstatus]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const r = state.receipts.find(x=>x.id===btn.dataset.quickstatus);
      if(r) openQuickStatusModal(r);
    };
  });
}

/* ---------------- WhatsApp Messaging ---------------- */
function normalizePhoneForWa(phone){
  let p = String(phone||'').replace(/[^0-9]/g,'');
  if(p.startsWith('00')) p = p.slice(2);
  if(p.startsWith('0')) p = '20' + p.slice(1);
  else if(p.length===10 && !p.startsWith('20')) p = '20'+p;
  return p;
}

function getStatusCustomMessage(r, status){
  const remaining = Number(r.cost||0)+Number(r.partsCost||0)-Number(r.deposit||0)+Number(r.refunded||0);
  const shop = (state.settings && state.settings.shopName) || 'مركز الصيانة';
  const device = `${r.device.category} - ${r.device.brand==='أخرى'?r.device.brandOther:r.device.brand} ${r.device.model||''}`.trim();
  const trackUrl = `${window.location.origin}${window.location.pathname}?track=${r.receiptNumber}`;

  let key = 'check';
  if(status === 'مكتمل') key = 'done';
  else if(status === 'تم التسليم') key = 'delivered';
  else if(status === 'الصيانة') key = 'repair';
  else if(status === 'قيد الفحص') key = 'check';
  else if(status === 'overdue_reminder') key = 'overdue';
  else if(status === 'تعذرت الصيانة') key = 'unrepairable';
  else if(status === 'رفض العميل') key = 'rejected';

  let tmpl = getWaTemplate(key);
  if(!tmpl) tmpl = DEFAULT_WA_TEMPLATES[key] || '';

  // Replace placeholders
  return tmpl
    .replace(/{customer_name}/g, (r.customer && r.customer.name) || 'عميلنا العزيز')
    .replace(/{receipt_no}/g, r.receiptNumber || '')
    .replace(/{date}/g, cleanDate(r.date))
    .replace(/{device}/g, device)
    .replace(/{faults}/g, (r.faults||[]).join('، ')||'-')
    .replace(/{status}/g, r.status || '')
    .replace(/{cost}/g, (Number(r.cost||0)+Number(r.partsCost||0)).toLocaleString())
    .replace(/{deposit}/g, Number(r.deposit||0).toLocaleString())
    .replace(/{remaining}/g, remaining.toLocaleString())
    .replace(/{track_url}/g, trackUrl)
    .replace(/{shop_name}/g, shop)
    .replace(/{shop_phone}/g, (state.settings && state.settings.shopPhone) || '')
    .replace(/{shop_address}/g, (state.settings && state.settings.shopAddress) || '');
}

function sendWhatsappByStatus(r, status){
  const msg = getStatusCustomMessage(r, status);
  sendWhatsapp(r, msg);
}

function sendWhatsapp(r, msg){
  const phone = normalizePhoneForWa(r.customer.phone);
  if(!phone || phone.length < 10){ showToast('رقم هاتف العميل غير صالح لإرسال واتساب', 'error'); return; }
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
}

        <button class="btn btn-amber btn-xs" id="detailStickerBtn">🏷️ ملصق باركود</button>
        <button class="btn btn-ghost btn-xs" id="workOrderBtn">أمر شغل</button>
      </div>
      <div style="display:flex;gap:6px;">
        <button class="btn btn-ghost btn-sm" id="closeModalBtn">إلغاء</button>
        <button class="btn btn-primary btn-sm" id="saveEditBtn">💾 حفظ التعديلات</button>
      </div>
    </div>
  </div>`;

  document.body.appendChild(overlay);

  function renderPaymentsList(){
    const box = overlay.querySelector('#paymentsList');
    const payments = getReceiptPayments(r);
    if(!payments.length){
      box.innerHTML = '<span style="color:var(--ink-secondary);">لا توجد دفعات مسجلة لهذا الإيصال بعد.</span>';
      return;
    }
    box.innerHTML = payments.map(p=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);">
      <span><b class="mono" style="font-size:11.5px;color:var(--ink-secondary);">${cleanDate(p.Date)}</b> ${p.Note?'— '+p.Note:''} <span style="color:var(--slate-400);font-size:11px;">(${p.By||'نظام'})</span></span>
      <span class="mono" style="font-weight:800;color:var(--green-text);">${p.Amount} ج.م</span>
    </div>`).join('');
  }
  renderPaymentsList();

  overlay.querySelectorAll('#editFaultChips .chip').forEach(c=>{
    c.onclick = ()=>{
      const f = c.dataset.f;
      const idx = r.faults.indexOf(f);
      if(idx>-1) r.faults.splice(idx,1); else r.faults.push(f);
      c.classList.toggle('sel');
    };
  });

  overlay.querySelector('#closeDetailBtn').onclick = ()=>overlay.remove();
  overlay.querySelector('#closeModalBtn').onclick = ()=>overlay.remove();

  function collectEdits(){
    r.customer.name = overlay.querySelector('#eName').value.trim();
    r.customer.phone = overlay.querySelector('#ePhone').value.trim();
    r.device.category = overlay.querySelector('#eCat').value.trim();
    r.device.brand = overlay.querySelector('#eBrand').value.trim();
    r.device.model = overlay.querySelector('#eModel').value.trim();
    r.faultNotes = overlay.querySelector('#eFaultNotes').value.trim();
    r.technician = overlay.querySelector('#eTech').value;
    r.status = overlay.querySelector('#eStatus').value.replace(/^[^\s]+\s/, '');
    r.cost = overlay.querySelector('#eCost').value;
    r.updatedBy = state.user.name;
    r.updatedAt = new Date().toISOString();
  }

  overlay.querySelector('#saveEditBtn').onclick = async ()=>{
    collectEdits();
    const btn = overlay.querySelector('#saveEditBtn');
    btn.disabled = true; btn.textContent = 'جارٍ الحفظ...';
    try{
      await saveReceiptRemote(r);
      overlay.remove();
      showToast('تم حفظ التعديلات بنجاح', 'success');
      renderMain();
    }catch(err){
      showToast('تم الحفظ محلياً: '+err.message, 'info');
      btn.disabled = false;
    }
  };

  overlay.querySelector('#addPayBtn').onclick = async ()=>{
    const amt = Number(overlay.querySelector('#newPayAmt').value);
    const note = overlay.querySelector('#newPayNote').value.trim();
    if(!amt || amt<=0){ showToast('أدخل مبلغاً صحيحاً', 'error'); return; }
    try{
      await savePaymentRemote(r.id, amt, note);
      r.deposit = Number(r.deposit||0) + amt;
      const newRem = Number(r.cost||0) + Number(r.partsCost||0) - Number(r.deposit||0) + Number(r.refunded||0);
      const remInp = overlay.querySelector('#eRem');
      if(remInp) remInp.value = newRem;
      overlay.querySelector('#newPayAmt').value = '';
      overlay.querySelector('#newPayNote').value = '';
      await saveReceiptRemote(r);
      renderPaymentsList();
      await refreshPayments();
      showToast('تم تسجيل الدفعة بنجاح', 'success');
      renderMain();
    }catch(e){ showToast('تم تسجيل الدفعة محلياً', 'info'); }
  };

  const payBtn = overlay.querySelector('#payBtn');
  if(payBtn) payBtn.onclick = async ()=>{
    const remainingNow = Number(r.cost||0) + Number(r.partsCost||0) - Number(r.deposit||0) + Number(r.refunded||0);
    payBtn.disabled = true;
    try{
      if(remainingNow > 0){
        await savePaymentRemote(r.id, remainingNow, 'سداد المتبقي بالكامل');
        r.deposit = Number(r.deposit||0) + remainingNow;
        await refreshPayments();
      }
      r.paid = true; r.status='مكتمل';
      await saveReceiptRemote(r);
      overlay.remove();
      showToast('تم سداد الإيصال بالكامل وتحديث الحالة إلى مكتمل ✅', 'success');
      renderMain();
    }catch(e){ showToast('تم السداد محلياً', 'info'); payBtn.disabled=false; }
  };

  const convInvBtn = overlay.querySelector('#convertReceiptToInvoiceBtn');
  if(convInvBtn) convInvBtn.onclick = ()=>{ overlay.remove(); convertReceiptToInvoice(r.id); };

  const invBtn = overlay.querySelector('#invBtn');
  if(invBtn) invBtn.onclick = ()=>{ overlay.remove(); openReceiptPrint(r,'invoice'); };
  overlay.querySelector('#workOrderBtn').onclick = ()=>{ overlay.remove(); openReceiptPrint(r,'workorder'); };
  overlay.querySelector('#detailStickerBtn').onclick = ()=>{ overlay.remove(); openStickerPrint(r); };
}
