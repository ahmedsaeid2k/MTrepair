const STATUS_GROUPS = {
  all: {label:'الكل', statuses:null},
  active: {label:'قيد العمل', statuses:['قيد الفحص','الصيانة']},
  done: {label:'مكتملة', statuses:['مكتمل']},
  rejected: {label:'مرفوضة / متعذرة', statuses:['رفض العميل','تعذرت الصيانة']}
};

function renderArchive(main){
  const f = state.archiveFilter;
  if(!f.group) f.group = 'all';
  let list = [...state.receipts];
  const groupStatuses = STATUS_GROUPS[f.group].statuses;
  if(groupStatuses) list = list.filter(r=>groupStatuses.includes(r.status));
  if(f.q) list = list.filter(r => r.receiptNumber.includes(f.q) || r.customer.name.includes(f.q) || r.customer.phone.includes(f.q));
  if(f.status) list = list.filter(r=>r.status===f.status);
  if(f.tech) list = list.filter(r=>r.technician===f.tech);

  main.innerHTML = `
    <h2 class="page-title">الأرشيف</h2>
    <div class="subtitle">${list.length} إيصال</div>
    <div class="chip-group" id="groupTabs" style="margin-bottom:14px;">
      ${Object.entries(STATUS_GROUPS).map(([k,g])=>`<div class="chip ${f.group===k?'sel':''}" data-g="${k}">${g.label}</div>`).join('')}
    </div>
    <div class="filters">
      <input id="fq" placeholder="بحث برقم الإيصال / اسم العميل / الهاتف" value="${f.q}">
      <select id="fstatus"><option value="">كل الحالات</option>${STATUSES.map(s=>`<option ${f.status===s.v?'selected':''}>${s.v}</option>`).join('')}</select>
      <select id="ftech"><option value="">كل الفنيين</option>${state.technicians.map(t=>`<option ${f.tech===t?'selected':''}>${t}</option>`).join('')}</select>
    </div>
    ${list.length===0 ? '<div class="empty">لا توجد نتائج مطابقة.</div>' : archiveTable(list.slice().reverse())}
  `;
  document.querySelectorAll('#groupTabs .chip').forEach(c=>{ c.onclick = ()=>{ f.group = c.dataset.g; renderMain(); }; });
  document.getElementById('fq').oninput = e=>{ f.q=e.target.value; renderMain(); };
  document.getElementById('fstatus').onchange = e=>{ f.status=e.target.value; renderMain(); };
  document.getElementById('ftech').onchange = e=>{ f.tech=e.target.value; renderMain(); };
  attachRowActions(main);
}

function attachRowActions(root){
  root.querySelectorAll('[data-act]').forEach(btn=>{
    btn.onclick = ()=>{
      const r = state.receipts.find(x=>x.id===btn.dataset.id);
      if(!r) return;
      const act = btn.dataset.act;
      if(act==='view') openReceiptDetail(r);
      if(act==='wa') openWhatsapp(r);
      if(act==='print') openReceiptPrint(r,'receipt');
      if(act==='workorder') openReceiptPrint(r,'workorder');
      if(act==='del'){
        if(confirm('حذف هذا الإيصال نهائياً؟ (Admin فقط)')){
          deleteReceiptRemote(r.id)
            .then(()=>{ state.receipts = state.receipts.filter(x=>x.id!==r.id); renderMain(); })
            .catch(e=>alert('تعذر الحذف من قاعدة البيانات: '+e.message));
        }
      }
    };
  });
}

function normalizePhoneForWa(phone){
  let p = String(phone||'').replace(/[^0-9]/g,'');
  if(p.startsWith('00')) p = p.slice(2);
  if(p.startsWith('0')) p = '20' + p.slice(1);           // 010... -> 2010...
  else if(p.length===10 && !p.startsWith('20')) p = '20'+p; // 10 digits without leading 0
  return p;
}
function waStatusMessage(r){
  const remaining = Number(r.cost||0)+Number(r.partsCost||0)-Number(r.deposit||0)+Number(r.refunded||0);
  return `مرحباً ${r.customer.name}، بخصوص إيصال الصيانة رقم ${r.receiptNumber}\nحالة الجهاز: ${r.status}\nالمبلغ المتبقي: ${remaining} ج.م\nشكراً لثقتكم بنا.`;
}
function waFullReceiptMessage(r){
  const remaining = Number(r.cost||0)+Number(r.partsCost||0)-Number(r.deposit||0)+Number(r.refunded||0);
  return `مرحباً ${r.customer.name} 👋\n*إيصال صيانة رقم:* ${r.receiptNumber}\n*التاريخ:* ${cleanDate(r.date)}\n*الجهاز:* ${r.device.category} - ${r.device.brand==='أخرى'?r.device.brandOther:r.device.brand} ${r.device.model}\n*الأعطال:* ${r.faults.join('، ')||'-'}\n*الحالة الحالية:* ${r.status}\n*التكلفة:* ${Number(r.cost||0)} ج.م\n*المدفوع:* ${Number(r.deposit||0)} ج.م\n${Number(r.refunded||0)>0?`*المسترجع:* ${Number(r.refunded)} ج.م\n`:''}*المتبقي:* ${remaining} ج.م\n*ميعاد التسليم:* ${r.deliveryDate||'غير محدد'}\n\n${state.settings.shopName}`;
}
function sendWhatsapp(r, msg){
  const phone = normalizePhoneForWa(r.customer.phone);
  if(!phone || phone.length < 10){ alert('رقم هاتف العميل غير صالح لإرسال واتساب: '+r.customer.phone); return; }
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
}
function openWhatsapp(r){ openWhatsappChoice(r); }
function openWhatsappChoice(r){
  const win = document.createElement('div');
  win.style = 'position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px;';
  win.innerHTML = `<div style="background:#fff;padding:22px;border-radius:10px;max-width:380px;width:100%;">
    <h3 style="margin-top:0;">إرسال واتساب للعميل</h3>
    <p style="font-size:12.5px;color:#666;">اختر نوع الرسالة اللي عايز تبعتها لـ ${r.customer.name}:</p>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px;">
      <button class="btn btn-whatsapp" id="waQuick">${WA_ICON} رسالة سريعة (الحالة والمتبقي فقط)</button>
      <button class="btn btn-whatsapp" id="waFull">${WA_ICON} تفاصيل الإيصال كاملة</button>
      <button class="btn btn-ghost" id="waCancel">إلغاء</button>
    </div>
    <div class="hint" style="margin-top:10px;">ملاحظة: واتساب بيفتح برسالة نصية جاهزة فقط، ومينفعش يرفق صورة الإيصال أو ملف تلقائيًا — لازم ترفقها يدوي لو حابب.</div>
  </div>`;
  document.body.appendChild(win);
  win.querySelector('#waQuick').onclick = ()=>{ sendWhatsapp(r, waStatusMessage(r)); win.remove(); };
  win.querySelector('#waFull').onclick = ()=>{ sendWhatsapp(r, waFullReceiptMessage(r)); win.remove(); };
  win.querySelector('#waCancel').onclick = ()=>win.remove();
}

async function openReceiptDetail(r){
  const remaining = Number(r.cost||0)+Number(r.partsCost||0)-Number(r.deposit||0)+Number(r.refunded||0);
  const win = document.createElement('div');
  win.style = 'position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;';
  win.innerHTML = `<div style="background:#fff;padding:22px;border-radius:10px;max-width:640px;width:100%;max-height:88vh;overflow:auto;">
    <h3 style="margin-top:0;">تعديل الإيصال ${r.receiptNumber}</h3>

    <div class="grid2">
      <div class="field"><label>اسم العميل</label><input id="eName" value="${r.customer.name}"></div>
      <div class="field"><label>هاتف العميل</label><input id="ePhone" value="${r.customer.phone}"></div>
    </div>
    <div class="grid3">
      <div class="field"><label>فئة الجهاز</label><input id="eCat" value="${r.device.category}"></div>
      <div class="field"><label>الماركة</label><input id="eBrand" value="${r.device.brand}"></div>
      <div class="field"><label>الموديل</label><input id="eModel" value="${r.device.model}"></div>
    </div>
    <div class="field"><label>الأعطال / التشخيص</label>
      <div class="chip-group" id="editFaultChips">
        ${COMMON_FAULTS.map(f=>`<div class="chip ${r.faults.includes(f)?'sel':''}" data-f="${f}">${f}</div>`).join('')}
      </div>
    </div>
    <div class="field"><label>ملاحظات التشخيص</label><textarea id="eFaultNotes">${r.faultNotes||''}</textarea></div>
    <div class="grid2">
      <div class="field"><label>الفني المسؤول</label>
        <select id="eTech"><option value="">--</option>${state.technicians.map(t=>`<option ${t===r.technician?'selected':''}>${t}</option>`).join('')}</select>
      </div>
      <div class="field"><label>الحالة</label>
        <select id="eStatus">${STATUSES.map(s=>`<option ${s.v===r.status?'selected':''}>${s.v}</option>`).join('')}</select>
      </div>
    </div>
    <div class="grid3">
      <div class="field"><label>التكلفة (ج.م)</label><input id="eCost" type="number" value="${r.cost||0}"></div>
      <div class="field"><label>إجمالي المدفوع (ج.م)</label><input id="eDeposit" type="number" value="${r.deposit||0}" disabled style="background:#eee;"></div>
      <div class="field"><label>إجمالي المسترجع (ج.م)</label><input id="eRefunded" type="number" value="${r.refunded||0}" disabled style="background:#eee;"></div>
    </div>
    <div class="grid3">
      <div class="field"><label>تكلفة قطع الغيار (ج.م)</label><input id="ePartsCost" type="number" value="${r.partsCost||0}"></div>
      <div class="field"><label>ميعاد التسليم</label><input id="eDelivery" type="date" value="${r.deliveryDate||''}"></div>
      <div></div>
    </div>
    <div class="card" style="margin-top:6px;background:#faf8f2;">
      <h3 style="margin-bottom:8px;">قطع غيار من المخزن</h3>
      <div id="partsUsedList" style="font-size:12.5px;margin-bottom:10px;">${r.partsUsed ? r.partsUsed : '<span style="color:#999;">لم تُستخدم قطع من المخزن بعد.</span>'}</div>
      <div style="display:flex;gap:8px;align-items:flex-end;">
        <div class="field" style="flex:2;margin-bottom:0;"><label>الصنف</label>
          <select id="invPickItem">
            <option value="">-- اختر صنف --</option>
            ${state.inventory.filter(it=>(it.Category||'صيانة')==='صيانة').map(it=>`<option value="${it.ID}" ${Number(it.Quantity)<=0?'disabled':''}>${it.Name} (متاح: ${it.Quantity})</option>`).join('')}
          </select>
        </div>
        <div class="field" style="flex:1;margin-bottom:0;"><label>الكمية</label><input id="invPickQty" type="number" value="1" min="1"></div>
        <button class="btn btn-green btn-sm" id="usePartBtn">خصم من المخزن</button>
      </div>
      ${state.inventory.length===0 ? '<div class="hint">لا توجد أصناف في المخزن بعد — أضفها من تبويب "المخزن".</div>' : ''}
    </div>
    <div class="card" style="margin-top:6px;background:#faf8f2;">
      <h3 style="margin-bottom:8px;">سجل الدفعات</h3>
      <div id="paymentsList" style="font-size:12.5px;margin-bottom:10px;">جارٍ التحميل...</div>
      <div style="display:flex;gap:8px;align-items:flex-end;">
        <div class="field" style="flex:1;margin-bottom:0;"><label>مبلغ دفعة جديدة</label><input id="newPayAmt" type="number" placeholder="0"></div>
        <div class="field" style="flex:2;margin-bottom:0;"><label>ملاحظة (اختياري)</label><input id="newPayNote" placeholder="دفعة عند الاستلام..."></div>
        <button class="btn btn-green btn-sm" id="addPayBtn">تسجيل الدفعة</button>
      </div>
    </div>

    <p style="font-size:12px;color:#888;">آخر تعديل: ${r.updatedBy||r.createdBy} — ${r.updatedAt?new Date(r.updatedAt).toLocaleString('ar-EG'):''}</p>

    <div class="actions-row" style="flex-wrap:wrap;">
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-red btn-sm" id="refundBtn">إرجاع مبلغ للعميل</button>
        ${!r.paid ? `<button class="btn btn-green btn-sm" id="payBtn">تسجيل السداد الكامل</button>` : `<button class="btn btn-blue btn-sm" id="invBtn">طباعة الفاتورة النهائية</button>`}
        <button class="btn btn-ghost btn-sm" id="workOrderBtn">طباعة أمر شغل</button>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost btn-sm" id="closeBtn">إغلاق</button>
        <button class="btn btn-primary btn-sm" id="saveEditBtn">حفظ التعديلات</button>
      </div>
    </div>
  </div>`;
  document.body.appendChild(win);

  function renderPaymentsList(payments){
    const box = win.querySelector('#paymentsList');
    if(!payments.length){ box.innerHTML = '<span style="color:#999;">لا توجد دفعات مسجلة بعد.</span>'; return; }
    box.innerHTML = payments.map(p=>`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #eee;">
      <span>${p.Date} ${p.Note?'— '+p.Note:''} <span style="color:#999;">(${p.By})</span></span>
      <span class="mono" style="font-weight:700;">${p.Amount} ج.م</span>
    </div>`).join('');
  }
  loadPayments(r.id).then(renderPaymentsList);

  document.querySelectorAll('#editFaultChips .chip').forEach(c=>{
    c.onclick = ()=>{
      const f = c.dataset.f;
      const idx = r.faults.indexOf(f);
      if(idx>-1) r.faults.splice(idx,1); else r.faults.push(f);
      c.classList.toggle('sel');
    };
  });

  win.querySelector('#closeBtn').onclick = ()=>win.remove();

  function collectEdits(){
    r.customer.name = document.getElementById('eName').value.trim();
    r.customer.phone = document.getElementById('ePhone').value.trim();
    r.device.category = document.getElementById('eCat').value.trim();
    r.device.brand = document.getElementById('eBrand').value.trim();
    r.device.model = document.getElementById('eModel').value.trim();
    r.faultNotes = document.getElementById('eFaultNotes').value.trim();
    r.technician = document.getElementById('eTech').value;
    r.status = document.getElementById('eStatus').value;
    r.cost = document.getElementById('eCost').value;
    r.partsCost = document.getElementById('ePartsCost').value;
    r.deliveryDate = document.getElementById('eDelivery').value;
    r.updatedBy = state.user.name;
    r.updatedAt = new Date().toISOString();
  }

  async function persist(closeAfter){
    collectEdits();
    try{
      await saveReceiptRemote(r);
      if(closeAfter) win.remove();
      renderMain();
    }catch(err){ alert('تعذر حفظ التعديل في قاعدة البيانات: '+err.message); }
  }

  document.getElementById('saveEditBtn').onclick = ()=>persist(true);

  document.getElementById('addPayBtn').onclick = async ()=>{
    const amt = Number(document.getElementById('newPayAmt').value);
    const note = document.getElementById('newPayNote').value.trim();
    if(!amt || amt<=0){ alert('من فضلك أدخل مبلغ صحيح أكبر من صفر'); return; }
    const btn = document.getElementById('addPayBtn');
    btn.disabled = true; btn.textContent = '...';
    try{
      await savePaymentRemote(r.id, amt, note);
      r.deposit = Number(r.deposit||0) + amt;
      document.getElementById('eDeposit').value = r.deposit;
      document.getElementById('newPayAmt').value = '';
      document.getElementById('newPayNote').value = '';
      await saveReceiptRemote(r); // keep Deposit total on the receipt row in sync
      const payments = await loadPayments(r.id);
      renderPaymentsList(payments);
      await refreshPayments();
      renderMain();
    }catch(e){ alert('تعذر تسجيل الدفعة: '+e.message); }
    btn.disabled = false; btn.textContent = 'تسجيل الدفعة';
  };

  document.getElementById('usePartBtn').onclick = async ()=>{
    const itemId = document.getElementById('invPickItem').value;
    const qty = Number(document.getElementById('invPickQty').value);
    if(!itemId){ alert('اختر صنف من المخزن أولاً'); return; }
    if(!qty || qty<=0){ alert('أدخل كمية صحيحة أكبر من صفر'); return; }
    const item = state.inventory.find(x=>x.ID===itemId);
    if(!item){ alert('الصنف غير موجود'); return; }
    if(qty > Number(item.Quantity)){ alert('الكمية المطلوبة أكبر من المتاح في المخزن ('+item.Quantity+')'); return; }
    const btn = document.getElementById('usePartBtn');
    btn.disabled = true; btn.textContent = '...';
    try{
      const availSerials = await loadSerials(itemId, 'In Stock');
      let pickedSerials = [];
      if(availSerials.length>0){ pickedSerials = await pickSerialsGeneric(item.Name, qty, availSerials); }
      await adjustInventoryQtyRemote(itemId, -qty);
      item.Quantity = Number(item.Quantity) - qty;
      const cost = qty * Number(item.PurchasePrice||0);
      r.partsCost = Number(r.partsCost||0) + cost;
      const snSuffix = pickedSerials.length ? ` [SN: ${pickedSerials.map(s=>s.Serial).join(',')}]` : '';
      r.partsUsed = (r.partsUsed ? r.partsUsed + '، ' : '') + `${item.Name} × ${qty}${snSuffix}`;
      document.getElementById('ePartsCost').value = r.partsCost;
      document.getElementById('partsUsedList').innerHTML = r.partsUsed;
      await saveReceiptRemote({...r, updatedBy: state.user.name, updatedAt: new Date().toISOString()});
      for(const sn of pickedSerials){ await markSerialSoldRemote(sn.ID, r.id).catch(()=>{}); }
      renderMain();
    }catch(e){ alert('تعذر خصم الصنف من المخزن: '+e.message); }
    btn.disabled = false; btn.textContent = 'خصم من المخزن';
  };

  document.getElementById('refundBtn').onclick = ()=>{
    const amt = prompt('أدخل المبلغ المراد إرجاعه للعميل (ج.م):', '0');
    if(amt === null) return;
    const n = Number(amt);
    if(isNaN(n) || n<=0){ alert('من فضلك أدخل رقم صحيح أكبر من صفر'); return; }
    r.refunded = Number(r.refunded||0) + n;
    document.getElementById('eRefunded').value = r.refunded;
    persist(false);
  };

  const payBtn = win.querySelector('#payBtn');
  if(payBtn) payBtn.onclick = async ()=>{
    const remainingNow = Number(r.cost||0) + Number(r.partsCost||0) - Number(r.deposit||0) + Number(r.refunded||0);
    payBtn.disabled = true; payBtn.textContent = '...';
    try{
      if(remainingNow > 0){
        await savePaymentRemote(r.id, remainingNow, 'سداد المتبقي بالكامل');
        r.deposit = Number(r.deposit||0) + remainingNow;
        document.getElementById('eDeposit').value = r.deposit;
        await refreshPayments();
      }
      r.paid = true; r.status='مكتمل';
      document.getElementById('eStatus').value = 'مكتمل';
      await persist(true);
    }catch(e){ alert('تعذر تسجيل السداد: '+e.message); payBtn.disabled=false; payBtn.textContent='تسجيل السداد الكامل'; }
  };
  const invBtn = win.querySelector('#invBtn');
  if(invBtn) invBtn.onclick = ()=>{ win.remove(); openReceiptPrint(r,'invoice'); };
  win.querySelector('#workOrderBtn').onclick = ()=>{ win.remove(); openReceiptPrint(r,'workorder'); };
}

function openReceiptPrint(r, kind){
  const remaining = Number(r.cost||0)+Number(r.partsCost||0)-Number(r.deposit||0)+Number(r.refunded||0);
  const old = document.getElementById('printMount');
  if(old) old.remove();
  const mount = document.createElement('div');
  mount.id='printMount';

  const titles = {receipt:'إيصال استلام جهاز للصيانة', invoice:'فاتورة صيانة نهائية', workorder:'أمر شغل - داخلي للفني'};
  const financeSection = `
    <div class="section-title">البيان المالي</div>
    <div class="fin-box">
      <div class="fin-cell"><div class="l">تكلفة الخدمة</div><div class="v">${Number(r.cost||0)}</div></div>
      ${Number(r.partsCost||0)>0 ? `<div class="fin-cell"><div class="l">قطع الغيار</div><div class="v">${Number(r.partsCost)}</div></div>` : ''}
      <div class="fin-cell"><div class="l">دفعة مقدمة</div><div class="v">${Number(r.deposit||0)}</div></div>
      ${Number(r.refunded||0)>0 ? `<div class="fin-cell"><div class="l">مسترجع</div><div class="v">${Number(r.refunded)}</div></div>` : ''}
      <div class="fin-cell hi"><div class="l">المتبقي</div><div class="v">${remaining}</div></div>
    </div>`;
  const termsSection = kind==='workorder' ? '' : `<div class="terms">${TERMS}</div>`;
  const signSection = kind==='workorder'
    ? `<div class="sign-row"><div>توقيع الفني المستلم</div><div>ملاحظات الإدارة</div></div>`
    : `<div class="sign-row"><div>توقيع العميل</div><div>توقيع الموظف (${r.updatedBy||r.createdBy||state.user.name})</div></div>`;

  mount.innerHTML = `
  <div id="receiptPaper">
    <div class="r-head">
      <div>${state.settings.logoUrl ? `<img src="${state.settings.logoUrl}" style="max-height:28px;max-width:120px;object-fit:contain;margin-bottom:2px;">` : ''}<h4>${state.settings.shopName}</h4><div class="r-sub">${titles[kind]}</div></div>
      <div style="text-align:left;">
        <div class="r-badge mono" style="font-size:16px;padding:6px 16px;">${r.receiptNumber}</div>
        <div class="r-meta">التاريخ: ${cleanDate(r.date)}</div>
        <svg id="printBarcode" style="margin-top:4px;"></svg>
      </div>
    </div>

    <div class="section-title">بيانات العميل</div>
    <table>
      <tr><td class="k">الاسم</td><td>${r.customer.name}</td><td class="k">الهاتف</td><td>${r.customer.phone}</td></tr>
    </table>

    <div class="section-title">بيانات الجهاز</div>
    <table>
      <tr><td class="k">النوع</td><td>${r.device.category} — ${r.device.brand==='أخرى'?r.device.brandOther:r.device.brand} ${r.device.model}</td>
          <td class="k">الملحقات</td><td>${r.device.accessories||'بدون'}</td></tr>
      <tr><td class="k">الأعطال</td><td colspan="3">${r.faults.join('، ')||'-'}${r.faultNotes?' — '+r.faultNotes:''}</td></tr>
      <tr><td class="k">الفني</td><td>${r.technician||'-'}</td><td class="k">الحالة</td><td>${r.status}</td></tr>
      <tr><td class="k">التسليم</td><td colspan="3">${r.deliveryDate||'غير محدد'}</td></tr>
    </table>

    ${financeSection}
    ${termsSection}
    ${signSection}
  </div>`;
  document.body.appendChild(mount);
  if(typeof JsBarcode !== 'undefined'){
    try{
      JsBarcode('#printBarcode', r.receiptNumber, {format:'CODE128', width:1.4, height:34, displayValue:false, margin:0});
    }catch(e){ console.error('barcode render failed', e); }
  } else {
    console.warn('JsBarcode لم يتم تحميلها (تحقق من الاتصال بالإنترنت) — لن يظهر باركود في الطباعة.');
  }
  setTimeout(()=>{ window.print(); mount.remove(); }, 200);
}

/* ---------------- Bonuses ---------------- */
function renderFinanceSectionApp(app){
  if(!state.financeTab) state.financeTab = 'overview';
  app.innerHTML = `
    <div class="sidebar">
      ${brandHtml("القسم المالي")}
      ${sectionSwitcherHtml()}
      ${[
        ['overview','نظرة عامة'],
        ['income','تقرير دخل الصيانة'],
        ['customers','حسابات العملاء'],
        ['suppliers','حسابات الموردين'],
        ['bonus','مكافآت الفنيين']
      ].map(([k,label])=>`<div class="nav-item ${state.financeTab===k?'active':''}" data-fintab="${k}">${label}</div>`).join('')}
      ${sidebarFootHtml()}
    </div>
    <main id="main"></main>
  `;
  const sw = document.getElementById('switchSectionBtn');
  if(sw) sw.onclick = ()=>{ state.currentSection = null; render(); };
  attachLogoutHandler();
  document.querySelectorAll('[data-fintab]').forEach(el=>{
    el.onclick = ()=>{ state.financeTab = el.dataset.fintab; renderFinanceSectionApp(app); };
  });
  const main = document.getElementById('main');
  if(state.financeTab==='overview') renderFinanceOverview(main);
  else if(state.financeTab==='income') renderFinanceReportPage(main);
  else if(state.financeTab==='customers') renderCustomerAccounts(main);
  else if(state.financeTab==='suppliers') renderSupplierAccounts(main);
  else renderBonusPage(main);
}

function renderFinanceOverview(main){
  const totalIncomeAllTime = state.payments.reduce((s,p)=>s+Number(p.Amount||0),0);
  const posDebts = state.sales.reduce((s,sale)=>s+Math.max(0, Number(sale.Total||0)-Number(sale.AmountPaid!=null?sale.AmountPaid:sale.Total)),0);
  const maintenanceDue = state.receipts.reduce((s,r)=>{
    const remaining = Number(r.cost||0)+Number(r.partsCost||0)-Number(r.deposit||0)+Number(r.refunded||0);
    return s + Math.max(0, remaining);
  },0);
  const totalReceivables = posDebts + maintenanceDue;
  const totalPayables = state.purchases.reduce((s,p)=>s+Math.max(0, Number(p.Total||0)-Number(p.AmountPaid!=null?p.AmountPaid:p.Total)),0);
  const netPosition = totalReceivables - totalPayables;
  main.innerHTML = `
    <h2 class="page-title">نظرة عامة على الحسابات</h2>
    <div class="subtitle">صورة سريعة لكل الجوانب المالية في الشركة</div>
    <div class="stat-grid">
      <div class="stat-card green"><div class="num mono">${totalIncomeAllTime.toLocaleString()}</div><div class="lbl">إجمالي المقبوضات (كل الوقت)</div></div>
      <div class="stat-card amber"><div class="num mono">${totalReceivables.toLocaleString()}</div><div class="lbl">مستحقات لنا على العملاء (آجل + متبقي صيانة)</div></div>

  body.innerHTML = `
    <div class="filters">
      <input id="finFrom" type="date" value="${f.from}"> <label style="align-self:center;margin-left:4px;">من</label>

    <div id="finResult"></div>

  document.getElementById('finFrom').onchange = e=>{ f.from=e.target.value; renderFinanceReportResult(); };
  document.getElementById('finTo').onchange = e=>{ f.to=e.target.value; renderFinanceReportResult(); };

function renderFinanceReportResult(){
  const f = state.financeFilter;
  const box = document.getElementById('finResult');
  if(!box) return;

  let payments = [...state.payments];
  if(f.from) payments = payments.filter(p=>String(p.Date||'').slice(0,10) >= f.from);
  if(f.to) payments = payments.filter(p=>String(p.Date||'').slice(0,10) <= f.to);
  const totalIncome = payments.reduce((s,p)=>s+Number(p.Amount||0),0);

  let receipts = [...state.receipts];
  if(f.from) receipts = receipts.filter(r=>String(r.date||'').slice(0,10) >= f.from);
  if(f.to) receipts = receipts.filter(r=>String(r.date||'').slice(0,10) <= f.to);
  const totalRefunds = receipts.reduce((s,r)=>s+Number(r.refunded||0),0);
  const totalParts = receipts.reduce((s,r)=>s+Number(r.partsCost||0),0);
  const netRevenue = totalIncome - totalRefunds - totalParts;

  box.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card green"><div class="num mono">${totalIncome.toLocaleString()}</div><div class="lbl">إجمالي المقبوضات (ج.م)</div></div>
      <div class="stat-card red"><div class="num mono">${totalRefunds.toLocaleString()}</div><div class="lbl">إجمالي المسترجع للعملاء</div></div>
      <div class="stat-card blue"><div class="num mono">${totalParts.toLocaleString()}</div><div class="lbl">تكلفة قطع الغيار</div></div>
      <div class="stat-card copper"><div class="num mono">${netRevenue.toLocaleString()}</div><div class="lbl">صافي الإيراد (ج.م)</div></div>
    </div>
    <div class="card">
      <h3>الإيصالات ضمن الفترة (${receipts.length})</h3>
      ${receipts.length===0 ? '<div class="empty">لا توجد إيصالات في هذه الفترة.</div>' : `
      <table><thead><tr><th>رقم الإيصال</th><th>التاريخ</th><th>العميل</th><th>تكلفة الخدمة</th><th>قطع الغيار</th><th>إجمالي على العميل</th><th>المسترجع</th><th>صافي الربح (خدمة فقط)</th></tr></thead><tbody>
        ${receipts.map(r=>{
          const net = Number(r.cost||0) - Number(r.refunded||0);
          const totalBilled = Number(r.cost||0) + Number(r.partsCost||0);
          return `<tr><td class="mono" style="font-weight:900;color:var(--copper-dark);">${r.receiptNumber}</td><td>${cleanDate(r.date)}</td><td>${r.customer.name}</td>
          <td class="mono">${Number(r.cost||0)}</td><td class="mono">${Number(r.partsCost||0)}</td><td class="mono">${totalBilled}</td><td class="mono">${Number(r.refunded||0)}</td>
          <td class="mono" style="font-weight:700;">${net}</td></tr>`;
        }).join('')}
      </tbody></table>`}
    </div>
  `;
}

function renderBonusResult(){

  const box = document.getElementById('bonusResult');

  let list = state.receipts.filter(r=>r.technician===f.tech);
  if(f.from) list = list.filter(r=>String(r.date||'').slice(0,10) >= f.from);
  if(f.to) list = list.filter(r=>String(r.date||'').slice(0,10) <= f.to);

  let total = 0;
  box.innerHTML = `<table><thead><tr><th>رقم الإيصال</th><th>التاريخ</th><th>الجهاز</th><th>الحالة</th><th>مكافأة (ج.م)</th></tr></thead><tbody>
    ${list.map(r=>{
      const val = state.bonusValues[r.id] !== undefined ? state.bonusValues[r.id] : (r.bonus||'');
      return `<tr><td class="mono" style="font-weight:900;color:var(--copper-dark);">${r.receiptNumber||'—'}</td><td>${cleanDate(r.date)}</td><td>${r.device.category}</td><td>${r.status}</td>
      <td><input type="number" style="width:90px" data-bid="${r.id}" value="${val}"></td></tr>`;
    }).join('')}
  </tbody></table>
  <div class="actions-row"><div></div><button class="btn btn-primary" id="saveBonusBtn">حفظ المكافآت</button></div>
  ${list.length===0?'<div class="empty">لا توجد إيصالات لهذا الفني في الفترة المحددة.</div>':''}`;

  box.querySelectorAll('[data-bid]').forEach(inp=>{
    inp.oninput = ()=>{ state.bonusValues[inp.dataset.bid] = inp.value; };
  });
  const saveBtn = document.getElementById('saveBonusBtn');
  if(saveBtn) saveBtn.onclick = async ()=>{
    saveBtn.disabled = true; saveBtn.textContent = 'جارٍ الحفظ...';
    try{
      const toSave = list.filter(r=>state.bonusValues[r.id]!==undefined);
      for(const r of toSave){ r.bonus = Number(state.bonusValues[r.id])||0; await saveReceiptRemote(r); }
      alert('تم حفظ المكافآت في قاعدة البيانات.');
    }catch(e){ alert('تعذر حفظ المكافآت: '+e.message); }
    saveBtn.disabled = false; saveBtn.textContent = 'حفظ المكافآت';
  };
}

function renderInventory(main, categoryFilter, titleOverride){

  const catValue = cat === 'all' ? 'صيانة' : cat;
  main.innerHTML = `
    <h2 class="page-title">${titleOverride || 'المخزن'}</h2>
    <div class="subtitle">إدارة الأصناف المتاحة، كمياتها، وأسعارها</div>

      <h3>إضافة صنف جديد</h3>
      <div class="grid3">
        <div class="field"><label>اسم الصنف</label><input id="invName" placeholder="مثال: شاشة لابتوب HP 15.6"></div>
        <div class="field"><label>الكمية</label><input id="invQty" type="number" value="0"></div>
        <div class="field"><label>سعر الشراء (تكلفة)</label><input id="invBuy" type="number" value="0"></div>
      </div>
      <div class="grid3">
        <div class="field"><label>سعر البيع المقترح (اختياري)</label><input id="invSell" type="number" value="0"></div>
        <div class="field"><label>التصنيف</label>
          <select id="invCategory">${INVENTORY_CATEGORIES.map(c=>`<option ${c===catValue?'selected':''}>${c}</option>`).join('')}</select>
        </div>
        <div class="field"><label>الباركود (اختياري)</label><input id="invBarcode" placeholder="امسح أو اكتب الباركود"></div>
      </div>
      <button class="btn btn-primary btn-sm" id="addInvBtn">إضافة الصنف</button>
    </div>
    <div class="card">
      <h3>الأصناف المتاحة (${list.length})</h3>
      ${list.length===0 ? '<div class="empty">لا توجد أصناف بعد.</div>' : `
      <table><thead><tr><th>الصنف</th>${categoryFilter==='all'?'<th>التصنيف</th>':''}<th>الباركود</th><th>الكمية</th><th>سعر الشراء</th><th>سعر البيع</th><th>إجراءات</th></tr></thead><tbody>
        ${list.map(it=>`<tr>
          <td>${it.Name}</td>
          ${categoryFilter==='all'?`<td>${it.Category||'صيانة'}</td>`:''}
          <td class="mono" style="font-size:11px;color:#888;">${it.Barcode||'-'}</td>
          <td class="mono" style="font-weight:${Number(it.Quantity)<=2?'900':'400'};color:${Number(it.Quantity)<=2?'var(--red)':'inherit'};">${it.Quantity}</td>
          <td class="mono">${it.PurchasePrice}</td>
          <td class="mono">${it.SellPrice||'-'}</td>
          <td class="row-actions">
            <button class="btn btn-sm btn-ghost" data-invact="edit" data-id="${it.ID}">تعديل</button>
            <button class="btn btn-sm btn-red" data-invact="del" data-id="${it.ID}">حذف</button>
          </td>
        </tr>`).join('')}
      </tbody></table>
      <div class="hint">الأصناف اللي كميتها 2 أو أقل بتظهر باللون الأحمر كتنبيه لقرب النفاد.</div>`}
    </div>
  `;
  document.getElementById('addInvBtn').onclick = async ()=>{
    const name = document.getElementById('invName').value.trim();
    const qty = Number(document.getElementById('invQty').value)||0;
    const buy = Number(document.getElementById('invBuy').value)||0;
    const sell = Number(document.getElementById('invSell').value)||0;
    const category = document.getElementById('invCategory').value;
    const barcode = document.getElementById('invBarcode').value.trim();
    if(!name){ alert('اكتب اسم الصنف'); return; }
    const btn = document.getElementById('addInvBtn'); btn.disabled = true;
    try{
      await saveInventoryItemRemote({ID:'', Name:name, Category:category, Barcode:barcode, Quantity:qty, PurchasePrice:buy, SellPrice:sell});
      await refreshInventory();
      renderMain();
    }catch(e){ alert('تعذر إضافة الصنف: '+e.message); }
    btn.disabled = false;
  };
  main.querySelectorAll('[data-invact]').forEach(btn=>{
    btn.onclick = async ()=>{
      const item = state.inventory.find(x=>x.ID===btn.dataset.id);
      if(!item) return;
      if(btn.dataset.invact==='del'){
        if(!confirm(`حذف الصنف "${item.Name}" نهائيًا؟`)) return;
        try{ await deleteInventoryItemRemote(item.ID); await refreshInventory(); renderMain(); }
        catch(e){ alert('تعذر الحذف: '+e.message); }
      }
      if(btn.dataset.invact==='edit'){
        openInventoryEditModal(item);
      }
    };
  });
}

function openInventoryEditModal(item){
  const win = document.createElement('div');
  win.style = 'position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px;';
  win.innerHTML = `<div style="background:#fff;padding:22px;border-radius:10px;max-width:420px;width:100%;">
    <h3 style="margin-top:0;">تعديل الصنف</h3>
    <div class="field"><label>اسم الصنف</label><input id="editInvName" value="${item.Name}"></div>
    <div class="field"><label>التصنيف</label>
      <select id="editInvCategory">${INVENTORY_CATEGORIES.map(c=>`<option ${c===(item.Category||'صيانة')?'selected':''}>${c}</option>`).join('')}</select>
    </div>
    <div class="field"><label>الباركود (اختياري)</label><input id="editInvBarcode" value="${item.Barcode||''}"></div>
    <div class="grid3">
      <div class="field"><label>الكمية</label><input id="editInvQty" type="number" value="${item.Quantity}"></div>
      <div class="field"><label>سعر الشراء</label><input id="editInvBuy" type="number" value="${item.PurchasePrice}"></div>
      <div class="field"><label>سعر البيع</label><input id="editInvSell" type="number" value="${item.SellPrice||0}"></div>

    <div class="actions-row">
      <button class="btn btn-ghost btn-sm" id="editInvCancel">إلغاء</button>
      <button class="btn btn-primary btn-sm" id="editInvSave">حفظ التعديلات</button>
    </div>
  </div>`;
  document.body.appendChild(win);
  win.querySelector('#editInvCancel').onclick = ()=>win.remove();
  win.querySelector('#editInvSave').onclick = async ()=>{
    const name = document.getElementById('editInvName').value.trim();
    const category = document.getElementById('editInvCategory').value;
    const barcode = document.getElementById('editInvBarcode').value.trim();
    const qty = Number(document.getElementById('editInvQty').value);
    const buy = Number(document.getElementById('editInvBuy').value);
    const sell = Number(document.getElementById('editInvSell').value);
    if(!name){ alert('اكتب اسم الصنف'); return; }
    const btn = win.querySelector('#editInvSave'); btn.disabled = true; btn.textContent = '...';
    try{
      await saveInventoryItemRemote({ID:item.ID, Name:name, Category:category, Barcode:barcode, Quantity:qty, PurchasePrice:buy, SellPrice:sell});
      await refreshInventory();
      win.remove();
      renderMain();
    }catch(e){ alert('تعذر حفظ التعديل: '+e.message); btn.disabled=false; btn.textContent='حفظ التعديلات'; }
  };
}

  `;
  function renderTechList(){
    document.getElementById('techList').innerHTML = state.technicians.map(t=>`<div class="chip sel">${t}</div>`).join('')
      + '<div class="hint" style="width:100%;">الحذف من قائمة الفنيين يتم مباشرة من ورقة Technicians في قاعدة البيانات حالياً.</div>';
  }
  renderTechList();
  function renderServicesList(){
    const box = document.getElementById('servicesList');
    if(state.services.length===0){ box.innerHTML = '<div class="hint">لا توجد خدمات مضافة بعد.</div>'; return; }
    box.innerHTML = `<table><thead><tr><th>الخدمة</th><th>السعر الافتراضي</th></tr></thead><tbody>
      ${state.services.map(s=>`<tr><td>${s.Name}</td><td class="mono">${s.DefaultPrice}</td></tr>`).join('')}
    </tbody></table>`;
  }
  renderServicesList();
  document.getElementById('addServiceBtn').onclick = async ()=>{
    const name = document.getElementById('newServiceName').value.trim();
    const price = Number(document.getElementById('newServicePrice').value)||0;
    if(!name) return;
    const btn = document.getElementById('addServiceBtn'); btn.disabled = true;
    try{
      await saveServiceRemote({Name:name, DefaultPrice:price, Notes:''});
      state.services = await loadServices();
      document.getElementById('newServiceName').value=''; document.getElementById('newServicePrice').value='';
      renderServicesList();
    }catch(e){ alert('تعذر إضافة الخدمة: '+e.message); }
    btn.disabled = false;
  };
  document.getElementById('saveShopNameBtn').onclick = async ()=>{
    const v = document.getElementById('shopNameInput').value.trim();
    if(!v) return;
    const btn = document.getElementById('saveShopNameBtn');
    btn.disabled = true; btn.textContent = '...';
    try{ await saveSettingRemote('shopName', v); state.settings.shopName = v; render(); }
    catch(e){ alert('تعذر حفظ اسم الصيانة: '+e.message); btn.disabled=false; btn.textContent='حفظ'; }
  };
  document.getElementById('saveLogoBtn').onclick = async ()=>{
    const v = document.getElementById('logoUrlInput').value.trim();
    const btn = document.getElementById('saveLogoBtn');
    btn.disabled = true; btn.textContent = '...';
    try{ await saveSettingRemote('logoUrl', v); state.settings.logoUrl = v; render(); }
    catch(e){ alert('تعذر حفظ اللوجو: '+e.message); btn.disabled=false; btn.textContent='حفظ'; }
  };
  document.getElementById('addTechBtn').onclick = async ()=>{
    const v = document.getElementById('newTech').value.trim();
    if(!v || state.technicians.includes(v)) return;
    const btn = document.getElementById('addTechBtn');
    btn.disabled = true;
    try{
      await saveTechnicianRemote(v);
      state.technicians.push(v);
      document.getElementById('newTech').value='';
      renderTechList();
    }catch(e){ alert('تعذر إضافة الفني في قاعدة البيانات: '+e.message); }
    btn.disabled = false;
  };
}

(function restoreSession(){
  try{
    const saved = localStorage.getItem('microerp_session');
    if(saved) state.user = JSON.parse(saved);
  }catch(e){ console.warn('localStorage unavailable', e); }
})();
init();
</script>
</body>
</html>
