/* ---------------- Excel Export Utility ---------------- */
function exportReceiptsToExcel(receipts){
  if(!receipts || !receipts.length){ showToast('لا توجد بيانات للتصدير', 'error'); return; }
  const headers = ['رقم الإيصال','التاريخ','الاسم','الهاتف','فئة الجهاز','الماركة','الموديل','الأعطال','الفني','التكلفة','المدفوع','قطع الغيار','المتبقي','الحالة','موعد التسليم'];
  const rows = receipts.map(r=>{
    const rem = Number(r.cost||0)+Number(r.partsCost||0)-Number(r.deposit||0)+Number(r.refunded||0);
    return [
      r.receiptNumber, cleanDate(r.date), `"${r.customer.name}"`, `"${r.customer.phone}"`,
      r.device.category, r.device.brand, `"${r.device.model||''}"`, `"${(r.faults||[]).join(' - ')}"`,
      `"${r.technician||''}"`, r.cost||0, r.deposit||0, r.partsCost||0, rem, `"${r.status}"`, r.deliveryDate||''
    ];
  });
  downloadCSV(`Receipts_Export_${new Date().toISOString().slice(0,10)}.csv`, headers, rows);
}

function exportInventoryToExcel(items){
  if(!items || !items.length){ showToast('المخزن فارغ', 'error'); return; }
  const headers = ['اسم الصنف','القسم','التصنيف الفرعي','كود القطعة SKU','الباركود','مكان الرف','الكمية المتاحة','الوحدة','حد الأمان','سعر الشراء','سعر البيع قطاعي','سعر الجملة','صافي الربح','نسبة الهامش %','شهور الضمان','الموديلات المتوافقة'];
  const rows = items.map(it=>{
    const buy = Number(it.PurchasePrice||0);
    const sell = Number(it.SellPrice||0);
    const profit = sell - buy;
    const margin = sell > 0 ? Math.round((profit/sell)*100)+'%' : '0%';
    return [
      `"${it.Name}"`, it.Category||'صيانة', `"${it.SubCategory||''}"`, `"${it.SKU||''}"`, `"${it.Barcode||''}"`,
      `"${it.ShelfLocation||''}"`, it.Quantity||0, it.Unit||'قطعة', it.MinStock||2,
      buy, sell, it.WholesalePrice||0, profit, `"${margin}"`, it.WarrantyMonths||0, `"${it.CompatibleModels||''}"`
    ];
  });
  downloadCSV(`Inventory_Export_${new Date().toISOString().slice(0,10)}.csv`, headers, rows);
}

function downloadCSV(filename, headers, rows){
  let csvContent = '\uFEFF' + headers.join(',') + '\n';
  rows.forEach(r => { csvContent += r.join(',') + '\n'; });
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  showToast('تم تصدير ملف Excel بنجاح', 'success');
}

function exportInvoicesToExcel(invoices){
  if(!invoices || !invoices.length){ showToast('لا توجد فواتير للتصدير', 'error'); return; }
  const headers = ['رقم الفاتورة','التاريخ','تاريخ الاستحقاق','اسم العميل','الهاتف','الرقم الضريبي','المرجع','الإجمالي قبل الضريبة','الضريبة','الخصم','الإجمالي النهائي','المدفوع','المتبقي','الحالة','طريقة الدفع','محرر الفاتورة'];
  const rows = invoices.map(inv=>[
    inv.InvoiceNumber||inv.ID, cleanDate(inv.Date), cleanDate(inv.DueDate),
    `"${inv.CustomerName||''}"`, `"${inv.CustomerPhone||''}"`, `"${inv.CustomerTaxNumber||''}"`,
    `"${inv.ReferenceType ? (inv.ReferenceType + ': ' + inv.ReferenceID) : 'حر'}"`,
    inv.Subtotal||0, inv.TaxAmount||0, inv.Discount||0, inv.Total||0,
    inv.AmountPaid||0, inv.Remaining||0, `"${inv.Status||''}"`, `"${inv.PaymentMethod||''}"`, `"${inv.By||''}"`
  ]);
  downloadCSV(`Invoices_Export_${new Date().toISOString().slice(0,10)}.csv`, headers, rows);
}

/* ============================================================
   Invoicing System & Receipt-To-Invoice Conversion (منظومة الفواتير)
   ============================================================ */

function convertReceiptToInvoice(receiptId){
  const r = state.receipts.find(x=>x.id===receiptId);
  if(!r){ showToast('تعذر العثور على الإيصال المطلوب', 'error'); return; }

  // Check if this receipt already has an invoice issued
  const existing = state.invoices.find(inv => inv.ReferenceType==='Receipt' && (inv.ReferenceID===r.receiptNumber || inv.ReferenceID===r.id));
  if(existing){
    if(confirm(`تم إصدار فاتورة سابقة لهذا الإيصال برقم (${existing.InvoiceNumber}). هل ترغب في فتح الفاتورة المسجلة؟`)){
      openInvoiceModal(existing);
      return;
    }
  }

  // Calculate items and finances from receipt
  const totalCost = Number(r.cost||0);
  const partsCost = Number(r.partsCost||0);
  const laborCost = Math.max(0, totalCost - partsCost);

  const payments = getReceiptPayments(r);
  const totalPayments = payments.reduce((s,p)=>s+Number(p.Amount||0),0);
  const totalDeposit = Number(r.deposit||0);
  const totalPaid = totalPayments > 0 ? totalPayments : totalDeposit;

  const brandName = r.device.brand==='أخرى' ? r.device.brandOther : r.device.brand;
  const faultsDesc = (r.faults && r.faults.length) ? r.faults.join('، ') : (r.faultNotes || 'صيانة عامة');

  const items = [];
  // Item 1: Service Labor
  items.push({
    Name: `أجور وخدمات صيانة ${r.device.category} ${brandName} ${r.device.model||''} (عطل: ${faultsDesc})`,
    Qty: 1,
    Price: laborCost > 0 ? laborCost : totalCost,
    Total: laborCost > 0 ? laborCost : totalCost
  });

  // Item 2: Parts (if any)
  if(partsCost > 0){
    items.push({
      Name: `قطع غيار مستخدمة: ${r.partsUsed || 'مستلزمات صيانة وقطع مستبدلة'}`,
      Qty: 1,
      Price: partsCost,
      Total: partsCost
    });
  }

  const subtotal = items.reduce((s,it)=>s+Number(it.Total||0),0);
  const remaining = Math.max(0, subtotal - totalPaid);

  const prefilledInvoice = {
    ID: 'inv_' + Date.now(),
    InvoiceNumber: 'INV-' + new Date().getFullYear() + '-' + String(Date.now()).slice(-4),
    Date: cleanDate(r.date) || new Date().toISOString().slice(0,10),
    DueDate: cleanDate(r.deliveryDate) || new Date().toISOString().slice(0,10),
    CustomerName: r.customer.name || '',
    CustomerPhone: r.customer.phone || '',
    CustomerTaxNumber: '',
    CustomerAddress: '',
    Items: items,
    ItemsSummary: items.map(i=>i.Name).join(' + '),
    Subtotal: subtotal,
    TaxPercent: 0,
    TaxAmount: 0,
    Discount: 0,
    Total: subtotal,
    AmountPaid: totalPaid,
    Remaining: remaining,
    Status: remaining <= 0 ? 'مدفوعة بالكامل' : (totalPaid > 0 ? 'مدفوعة جزئياً' : 'غير مدفوعة (آجلة)'),
    PaymentMethod: 'نقدي',
    ReferenceType: 'Receipt',
    ReferenceID: r.receiptNumber || r.id,
    Notes: `فاتورة صادرة عن إيصال صيانة رقم #${r.receiptNumber} (${r.device.category} ${brandName} ${r.device.model||''})`
  };

  openInvoiceModal(prefilledInvoice, true);
}

function openInvoiceModal(existingInv, isFromReceipt=false){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const isEdit = !!existingInv && !isFromReceipt;

  const inv = existingInv ? {
    ...existingInv,
    Items: Array.isArray(existingInv.Items) ? [...existingInv.Items] : (JSON.parse(existingInv.ItemsJSON||'[]'))
  } : {
    ID: 'inv_' + Date.now(),
    InvoiceNumber: 'INV-' + new Date().getFullYear() + '-' + String(Date.now()).slice(-4),
    Date: new Date().toISOString().slice(0,10),
    DueDate: new Date().toISOString().slice(0,10),
    CustomerName: '',
    CustomerPhone: '',
    CustomerTaxNumber: '',
    CustomerAddress: '',
    Items: [{ Name: '', Qty: 1, Price: 0, Total: 0 }],
    Subtotal: 0,
    TaxPercent: 0,
    TaxAmount: 0,
    Discount: 0,
    Total: 0,
    AmountPaid: 0,
    Remaining: 0,
    Status: 'مدفوعة بالكامل',
    PaymentMethod: 'نقدي',
    ReferenceType: '',
    ReferenceID: '',
    Notes: ''
  };

  if(!inv.Items.length) inv.Items = [{ Name: '', Qty: 1, Price: 0, Total: 0 }];

  function renderModal(){
    // Calculate sums
    let sub = 0;
    inv.Items.forEach(it => {
      it.Total = Number(it.Qty||1) * Number(it.Price||0);
      sub += it.Total;
    });
    inv.Subtotal = sub;
    inv.TaxAmount = Math.round((inv.Subtotal * (Number(inv.TaxPercent||0) / 100)) * 100) / 100;
    inv.Total = Math.max(0, inv.Subtotal + inv.TaxAmount - Number(inv.Discount||0));
    inv.Remaining = Math.max(0, inv.Total - Number(inv.AmountPaid||0));
    if(inv.Remaining <= 0){ inv.Status = 'مدفوعة بالكامل'; }
    else if(inv.AmountPaid > 0){ inv.Status = 'مدفوعة جزئياً'; }
    else { inv.Status = 'غير مدفوعة (آجلة)'; }

    overlay.innerHTML = `
      <div class="modal-content" style="max-width:840px;">
        <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px;">
          <div>
            <h3 style="margin:0;font-size:18px;font-weight:900;color:var(--primary);">
              ${isFromReceipt ? `📄 إصدار فاتورة رسمية من إيصال صيانة (#${inv.ReferenceID})` : (isEdit ? `✏️ تعديل فاتورة: ${inv.InvoiceNumber}` : `➕ إصدار فاتورة ضريبية / رسمية جديدة`)}
            </h3>
            <div style="font-size:12px;color:var(--ink-secondary);margin-top:2px;">
              رقم المستند: <span class="mono font-bold">${inv.InvoiceNumber}</span>
              ${inv.ReferenceType ? ` | مرجع: <span class="status-badge st-check" style="font-size:10px;">${inv.ReferenceType==='Receipt'?'إيصال صيانة':inv.ReferenceType} #${inv.ReferenceID}</span>` : ''}
            </div>
          </div>
          <button class="btn btn-ghost btn-xs" id="closeInvModal">✕ إغلاق</button>
        </div>

        <div class="card" style="padding:14px 16px;background:var(--paper3);margin-bottom:14px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
            <h3 style="font-size:13.5px;margin:0;display:flex;align-items:center;gap:6px;"><span>👤 بيانات العميل</span></h3>
            <div style="display:flex;gap:6px;align-items:center;">
              <button class="btn btn-xs btn-ghost" id="quickWalkInCustBtn" type="button">🚶‍♂️ عميل زائر</button>
              <button class="btn btn-xs btn-blue" id="quickNewCustBtn" type="button">➕ عميل جديد</button>
            </div>
          </div>
          <div class="field" style="margin-bottom:12px;">
            <select id="invCustomerSelect" style="width:100%;font-weight:600;">
              <option value="">-- اضغط لاختيار عميل مسجل (${state.customers.length} عميل) --</option>
              <option value="__WALKIN__" ${inv.CustomerName==='عميل زائر'?'selected':''}>🚶‍♂️ عميل زائر (نقدي / Walk-in)</option>
              <option value="__NEW__">➕ عميل جديد</option>
              ${state.customers.length ? `
                <optgroup label="قائمة العملاء">
                  ${state.customers.map(c=>`<option value="${c.name}" ${inv.CustomerName===c.name?'selected':''}>${c.name} - ${c.phone||'بدون هاتف'}</option>`).join('')}
                </optgroup>
              ` : ''}
            </select>
          </div>
          <div class="grid3">
            <div class="field"><label>اسم العميل / الشركة *</label><input id="invCustName" value="${inv.CustomerName||''}"></div>
            <div class="field"><label>رقم هاتف العميل</label><input id="invCustPhone" class="mono" value="${inv.CustomerPhone||''}"></div>
            <div class="field"><label>الرقم الضريبي</label><input id="invCustTax" class="mono" value="${inv.CustomerTaxNumber||''}"></div>
          </div>
          <div class="grid3">
            <div class="field"><label>تاريخ المستند *</label><input id="invDate" type="date" value="${cleanDate(inv.Date)}"></div>
            <div class="field"><label>تاريخ الاستحقاق</label><input id="invDueDate" type="date" value="${cleanDate(inv.DueDate)}"></div>
            <div class="field"><label>العنوان</label><input id="invCustAddr" value="${inv.CustomerAddress||''}"></div>
          </div>
        </div>

        <div class="card" style="padding:14px 16px;margin-bottom:14px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <h3 style="font-size:13.5px;margin:0;">📦 بنود الفاتورة / بيان السعر</h3>
            <div style="display:flex;gap:6px;">
              <button class="btn btn-ghost btn-xs" id="addFromInventoryBtn" type="button">➕ من المخزن</button>
              <button class="btn btn-primary btn-xs" id="addInvLineBtn" type="button">➕ سطر جديد</button>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>بيان الصنف أو الخدمة</th><th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th><th></th></tr></thead>
              <tbody id="invoiceLinesTableBody">
                ${inv.Items.map((it, idx)=>`
                  <tr>
                    <td><input value="${it.Name||''}" data-linefield="Name" data-idx="${idx}" style="width:100%;"></td>
                    <td><input type="number" class="mono" min="1" value="${it.Qty||1}" data-linefield="Qty" data-idx="${idx}" style="width:100%;text-align:center;"></td>
                    <td><input type="number" class="mono" step="any" value="${it.Price||0}" data-linefield="Price" data-idx="${idx}" style="width:100%;text-align:center;"></td>
                    <td class="mono font-bold" style="color:var(--primary);">${(Number(it.Qty||1) * Number(it.Price||0)).toLocaleString()} ج.م</td>
                    <td style="text-align:center;"><button class="btn btn-xs btn-red" data-delline="${idx}">✕</button></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>

        <div class="grid2">
          <div class="card" style="padding:14px 16px;background:var(--paper3);">
            <h3 style="font-size:13.5px;margin-bottom:10px;">💳 السداد والحالة</h3>
            <div class="grid2">
              <div class="field"><label>طريقة السداد</label><select id="invPaymentMethod">${['نقدي','فيزا / كارت','تحويل بنكي','فودافون كاش','آجل'].map(m=>`<option ${m===inv.PaymentMethod?'selected':''}>${m}</option>`).join('')}</select></div>
              <div class="field"><label>المبلغ المدفوع (ج.م)</label><input id="invPaidInput" type="number" class="mono" value="${inv.AmountPaid||0}"></div>
            </div>
            <div class="field"><label>ملاحظات وشروط</label><textarea id="invNotesText">${inv.Notes||''}</textarea></div>
          </div>
          <div class="card" style="padding:14px 16px;">
            <h3 style="font-size:13.5px;margin-bottom:10px;">💰 الملخص المالي</h3>
            <div style="display:flex;flex-direction:column;gap:8px;">
              <div style="display:flex;justify-content:space-between;"><span>المجموع الفرعي:</span><span class="mono font-bold">${inv.Subtotal.toLocaleString()} ج.م</span></div>
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <div style="display:flex;align-items:center;gap:6px;"><span>ضريبة (VAT):</span><select id="invTaxPercentSelect" style="width:70px;"><option value="0" ${Number(inv.TaxPercent)===0?'selected':''}>0%</option><option value="14" ${Number(inv.TaxPercent)===14?'selected':''}>14%</option></select></div>
                <span class="mono font-bold" style="color:var(--blue);">${inv.TaxAmount.toLocaleString()} ج.م</span>
              </div>
              <div style="display:flex;justify-content:space-between;"><span>الخصم:</span><input id="invDiscountInput" type="number" value="${inv.Discount||0}" style="width:90px;text-align:center;" class="mono"></div>
              <div style="display:flex;justify-content:space-between;font-size:14.5px;font-weight:900;border-top:1px solid #ccc;padding-top:6px;"><span>الإجمالي المستحق:</span><span class="mono" style="color:var(--primary);">${inv.Total.toLocaleString()} ج.م</span></div>
              <div style="display:flex;justify-content:space-between;color:var(--green-text);"><span>المدفوع:</span><span class="mono">${(inv.AmountPaid||0).toLocaleString()} ج.م</span></div>
              <div style="display:flex;justify-content:space-between;color:${inv.Remaining>0?'var(--red)':'var(--green-text)'};font-weight:900;"><span>المتبقي:</span><span class="mono">${inv.Remaining.toLocaleString()} ج.م</span></div>
            </div>
          </div>
        </div>

        <div class="actions-row" style="margin-top:16px;">
          <button class="btn btn-ghost" id="cancelInvModalBtn" type="button">إلغاء</button>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn btn-ghost" id="saveAndPrintQuoteBtn" type="button">📑 حفظ وطباعة بيان سعر</button>
            <button class="btn btn-blue" id="saveAndPrintInvBtn" type="button">🖨️ حفظ وطباعة فاتورة رسمية</button>
            <button class="btn btn-primary" id="saveInvOnlyBtn" type="button">💾 حفظ فقط</button>
          </div>
        </div>
      </div>
    `;

    overlay.querySelector('#closeInvModal').onclick = ()=>overlay.remove();
    overlay.querySelector('#cancelInvModalBtn').onclick = ()=>overlay.remove();

    const custSelect = overlay.querySelector('#invCustomerSelect');
    if(custSelect){
      custSelect.onchange = (e)=>{
        const val = e.target.value;
        const nameInp = overlay.querySelector('#invCustName');
        const phoneInp = overlay.querySelector('#invCustPhone');
        const taxInp = overlay.querySelector('#invCustTax');
        const addrInp = overlay.querySelector('#invCustAddr');
        if(val === '__WALKIN__'){
          nameInp.value = 'عميل زائر'; phoneInp.value = '0000000000'; taxInp.value = ''; addrInp.value = '';
        } else if(val === '__NEW__'){
          nameInp.value = ''; phoneInp.value = ''; taxInp.value = ''; addrInp.value = ''; nameInp.focus();
        } else if(val){
          const found = state.customers.find(c => c.name === val);
          if(found){ nameInp.value = found.name; phoneInp.value = found.phone || ''; taxInp.value = found.taxNumber || ''; addrInp.value = found.address || ''; }
        }
      };
    }

    overlay.querySelector('#quickWalkInCustBtn').onclick = ()=>{ custSelect.value = '__WALKIN__'; custSelect.dispatchEvent(new Event('change')); };
    overlay.querySelector('#quickNewCustBtn').onclick = ()=>{ custSelect.value = '__NEW__'; custSelect.dispatchEvent(new Event('change')); };

    overlay.querySelectorAll('[data-linefield]').forEach(inp => {
      inp.oninput = (e)=>{
        const idx = Number(inp.dataset.idx);
        const fld = inp.dataset.linefield;
        inv.Items[idx][fld] = fld==='Name' ? e.target.value : Number(e.target.value)||0;
      };
      inp.onblur = ()=>renderModal();
    });

    overlay.querySelectorAll('[data-delline]').forEach(btn => {
      btn.onclick = ()=>{
        if(inv.Items.length<=1){ showToast('يجب وجود بند واحد على الأقل', 'error'); return; }
        inv.Items.splice(Number(btn.dataset.delline), 1);
        renderModal();
      };
    });

    overlay.querySelector('#addInvLineBtn').onclick = ()=>{ inv.Items.push({ Name: '', Qty: 1, Price: 0, Total: 0 }); renderModal(); };

    overlay.querySelector('#addFromInventoryBtn').onclick = ()=>{
      openInventoryPickerModal((pickedItem)=>{
        inv.Items.push({
          Name: pickedItem.Name,
          Qty: 1,
          Price: Number(pickedItem.SellPrice||pickedItem.PurchasePrice||0),
          Total: Number(pickedItem.SellPrice||pickedItem.PurchasePrice||0)
        });
        renderModal();
      });
    };

    overlay.querySelector('#invTaxPercentSelect').onchange = (e)=>{ inv.TaxPercent = Number(e.target.value); renderModal(); };
    overlay.querySelector('#invDiscountInput').oninput = (e)=>{ inv.Discount = Number(e.target.value)||0; };
    overlay.querySelector('#invDiscountInput').onblur = ()=>renderModal();
    overlay.querySelector('#invPaidInput').oninput = (e)=>{ inv.AmountPaid = Number(e.target.value)||0; };
    overlay.querySelector('#invPaidInput').onblur = ()=>renderModal();

    function collectData(){
      inv.CustomerName = overlay.querySelector('#invCustName').value.trim();
      inv.CustomerPhone = overlay.querySelector('#invCustPhone').value.trim();
      inv.CustomerTaxNumber = overlay.querySelector('#invCustTax').value.trim();
      inv.CustomerAddress = overlay.querySelector('#invCustAddr').value.trim();
      inv.Date = overlay.querySelector('#invDate').value;
      inv.DueDate = overlay.querySelector('#invDueDate').value;
      inv.PaymentMethod = overlay.querySelector('#invPaymentMethod').value;
      inv.Notes = overlay.querySelector('#invNotesText').value.trim();
      inv.ItemsSummary = inv.Items.map(i=>i.Name).filter(Boolean).join(' + ');
      inv.ItemsJSON = JSON.stringify(inv.Items);
    }

    async function handleSave(andPrint, docType='invoice'){
      collectData();
      if(!inv.CustomerName){ showToast('يرجى اختيار اسم العميل', 'error'); return; }
      if(!inv.Items.length || !inv.Items[0].Name){ showToast('يرجى إضافة بنود للفاتورة', 'error'); return; }
      try{
        await saveInvoiceRemote(inv);
        showToast(`تم حفظ ${docType==='quote'?'عرض السعر':'الفاتورة'} بنجاح (${inv.InvoiceNumber})`, 'success');
        overlay.remove();
        renderMain();
        if(andPrint) openInvoicePrint(inv, docType);
      }catch(e){
        showToast('خطأ في حفظ البيانات', 'error');
      }
    }

    overlay.querySelector('#saveInvOnlyBtn').onclick = ()=>handleSave(false);
    overlay.querySelector('#saveAndPrintInvBtn').onclick = ()=>handleSave(true, 'invoice');
    overlay.querySelector('#saveAndPrintQuoteBtn').onclick = ()=>handleSave(true, 'quote');
  }

  document.body.appendChild(overlay);
  renderModal();
}

function openInventoryPickerModal(onSelect){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-content" style="max-width:550px;">
      <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px;">
        <h3 style="margin:0;font-size:16px;">📦 اختر صنف من المخزن</h3>
        <button class="btn btn-ghost btn-xs" id="closeInvPicker">✕</button>
      </div>
      <div class="field" style="margin-bottom:10px;">
        <input id="pickerSearch" placeholder="🔍 بحث باسم الصنف أو الباركود..." autofocus>
      </div>
      <div id="pickerListMount" style="max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;"></div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#closeInvPicker').onclick = ()=>overlay.remove();

  function renderList(q=''){
    const box = overlay.querySelector('#pickerListMount');
    let list = state.inventory || [];
    if(q){
      list = list.filter(it => it.Name.toLowerCase().includes(q.toLowerCase()) || String(it.Barcode||'').includes(q));
    }
    if(!list.length){
      box.innerHTML = '<div class="empty">لا توجد أصناف مطابقة.</div>';
      return;
    }
    box.innerHTML = list.map(it => `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--paper3);border-radius:var(--radius-sm);border:1px solid var(--line);cursor:pointer;" data-pickid="${it.ID}">
        <div>
          <div style="font-weight:800;font-size:13px;">${it.Name}</div>
          <div class="mono" style="font-size:11px;color:var(--ink-secondary);">باركود: ${it.Barcode||'-'} | المتاح: <b>${it.Quantity}</b></div>
        </div>
        <div class="mono font-bold" style="color:var(--green);font-size:13.5px;">${Number(it.SellPrice||it.PurchasePrice||0).toLocaleString()} ج.م</div>
      </div>
    `).join('');

    box.querySelectorAll('[data-pickid]').forEach(el => {
      el.onclick = ()=>{
        const found = state.inventory.find(x=>x.ID===el.dataset.pickid);
        if(found){ onSelect(found); overlay.remove(); }
      };
    });
  }

  renderList();
  overlay.querySelector('#pickerSearch').oninput = (e)=>renderList(e.target.value.trim());
}

/* ---------------- Invoices Management Screen View (شاشة إدارة الفواتير العامة) ---------------- */
function renderInvoicesPage(main){
  if(!state.invoiceSearchQ) state.invoiceSearchQ = '';
  if(!state.invoiceStatusFilter) state.invoiceStatusFilter = 'all';

  const rawList = state.invoices || [];
  let list = [...rawList];

  // Status Filter
  if(state.invoiceStatusFilter === 'paid'){
    list = list.filter(i => i.Status === 'مدفوعة بالكامل');
  } else if(state.invoiceStatusFilter === 'partial'){
    list = list.filter(i => i.Status === 'مدفوعة جزئياً');
  } else if(state.invoiceStatusFilter === 'unpaid'){
    list = list.filter(i => i.Status === 'غير مدفوعة (آجلة)' || Number(i.Remaining||0) > 0);
  }

  // Text search
  const q = state.invoiceSearchQ.trim().toLowerCase();
  if(q){
    list = list.filter(i => 
      (i.InvoiceNumber||'').toLowerCase().includes(q) ||
      (i.CustomerName||'').toLowerCase().includes(q) ||
      (i.CustomerPhone||'').includes(q) ||
      (i.ReferenceID||'').includes(q) ||
      (i.ItemsSummary||'').toLowerCase().includes(q)
    );
  }

  // Financial KPIs
  const totalInvoicesCount = rawList.length;
  const totalInvoicedSum = rawList.reduce((s,i)=>s+Number(i.Total||0),0);
  const totalPaidSum = rawList.reduce((s,i)=>s+Number(i.AmountPaid||0),0);
  const totalRemainingSum = rawList.reduce((s,i)=>s+Number(i.Remaining||0),0);

  main.innerHTML = `
    <div class="top-header">
      <div>
        <h2 class="page-title">📄 الفواتير الضريبية والرسمية</h2>
        <div class="subtitle">إصدار ومتابعة فواتير الصيانة والمبيعات، ومتابعة التحصيل والمستحقات (${list.length} فاتورة معروضة)</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost btn-sm" id="exportInvoicesExcelBtn">📥 تصدير الفواتير Excel</button>
        <button class="btn btn-primary btn-sm" id="addNewInvoiceBtn">➕ إصدار فاتورة جديدة</button>
      </div>
    </div>

    <!-- KPIs -->
    <div class="stat-grid">
      <div class="stat-card blue">
        <div class="top-row"><span class="lbl">إجمالي الفواتير الصادرة</span><div class="icon-box">📄</div></div>
        <div class="num mono">${totalInvoicesCount}</div>
      </div>
      <div class="stat-card purple">
        <div class="top-row"><span class="lbl">إجمالي قيمة الفواتير</span><div class="icon-box">💵</div></div>
        <div class="num mono">${totalInvoicedSum.toLocaleString()} <span style="font-size:12px;font-weight:600;">ج.م</span></div>
      </div>
      <div class="stat-card green">
        <div class="top-row"><span class="lbl">إجمالي المحصل الفعلي</span><div class="icon-box">✅</div></div>
        <div class="num mono">${totalPaidSum.toLocaleString()} <span style="font-size:12px;font-weight:600;">ج.م</span></div>
      </div>
      <div class="stat-card red">
        <div class="top-row"><span class="lbl">المستحقات المتبقية (آجل)</span><div class="icon-box">⏳</div></div>
        <div class="num mono">${totalRemainingSum.toLocaleString()} <span style="font-size:12px;font-weight:600;">ج.م</span></div>
      </div>
    </div>

    <!-- Filters Bar -->
    <div class="filters-bar" style="margin-bottom:14px;">
      <input id="invSearchInp" placeholder="🔍 بحث برقم الفاتورة، اسم العميل، الهاتف، أو رقم إيصال الصيانة..." value="${state.invoiceSearchQ}" style="flex:1;min-width:240px;">
      <select id="invStatusFilterSelect" style="min-width:150px;">
        <option value="all" ${state.invoiceStatusFilter==='all'?'selected':''}>كل الحالات</option>
        <option value="paid" ${state.invoiceStatusFilter==='paid'?'selected':''}>✅ مدفوعة بالكامل</option>
        <option value="partial" ${state.invoiceStatusFilter==='partial'?'selected':''}>⚡ مدفوعة جزئياً</option>
        <option value="unpaid" ${state.invoiceStatusFilter==='unpaid'?'selected':''}>⏳ متبقي مستحق (آجل)</option>
      </select>
      ${(state.invoiceSearchQ || state.invoiceStatusFilter!=='all') ? `<button class="btn btn-ghost btn-sm" id="clearInvFilters">مسح الفلاتر</button>` : ''}
    </div>

    <div class="card">
      ${list.length===0 ? '<div class="empty">لا توجد فواتير مطابقة للبحث أو الفلتر المختار.</div>' : `
      <div class="table-wrap">
        <table>

              <th>التاريخ</th>
              <th>العميل</th>
              <th>المرجع</th>

              <th>المدفوع</th>
              <th>المتبقي</th>

              <th>الإجراءات</th>
            </tr>
          </thead>
          <tbody>
            ${list.slice().reverse().map(inv=>{
              const isPaid = inv.Status === 'مدفوعة بالكامل' || Number(inv.Remaining||0) <= 0;
              const isPartial = inv.Status === 'مدفوعة جزئياً';

              return `

                  <td>

                  <td style="font-size:11.5px;color:var(--ink-secondary);">

                  <td>

                  </td>
                  <td class="mono font-bold" style="font-size:13px;">${Number(inv.Total||0).toLocaleString()} ج.م</td>
                  <td class="mono font-bold" style="color:var(--green);">${Number(inv.AmountPaid||0).toLocaleString()} ج.م</td>
                  <td class="mono font-bold" style="color:${Number(inv.Remaining||0)>0?'var(--red)':'var(--ink)'};">${Number(inv.Remaining||0).toLocaleString()} ج.م</td>
                  <td>
                    <span class="status-badge ${isPaid?'st-done':(isPartial?'st-repair':'st-failed')}">
                      ${isPaid?'✅ مدفوعة':(isPartial?'⚡ جزئي':'⏳ آجل')}
                    </span>
                  </td>
                  <td class="row-actions">
                    <button class="btn btn-xs btn-blue" data-invact="print" data-invid="${inv.ID}" title="طباعة فاتورة ضريبية رسمية">🖨️ فاتورة</button>
                    <button class="btn btn-xs btn-ghost" data-invact="printquote" data-invid="${inv.ID}" title="طباعة بيان سعر وعرض أسعار رسمي">📑 بيان سعر</button>
                    <button class="btn btn-xs btn-whatsapp" data-invact="wa" data-invid="${inv.ID}" title="إرسال الفاتورة عبر واتساب">${WA_ICON}</button>
                    <button class="btn btn-xs btn-ghost" data-invact="edit" data-invid="${inv.ID}" title="تعديل الفاتورة">✏️</button>
                    ${state.user.role==='admin' ? `<button class="btn btn-xs btn-red" data-invact="del" data-invid="${inv.ID}" title="حذف">🗑️</button>` : ''}
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>`}
    </div>
  `;

  // Filter bindings
  const searchInput = document.getElementById('invSearchInp');
  searchInput.oninput = (e)=>{ state.invoiceSearchQ = e.target.value; renderInvoicesPage(main); };
  const statusSel = document.getElementById('invStatusFilterSelect');
  statusSel.onchange = (e)=>{ state.invoiceStatusFilter = e.target.value; renderInvoicesPage(main); };
  const clearBtn = document.getElementById('clearInvFilters');
  if(clearBtn) clearBtn.onclick = ()=>{ state.invoiceSearchQ = ''; state.invoiceStatusFilter = 'all'; renderInvoicesPage(main); };

  document.getElementById('addNewInvoiceBtn').onclick = ()=>openInvoiceModal();
  document.getElementById('exportInvoicesExcelBtn').onclick = ()=>exportInvoicesToExcel(list);

  // Row action bindings
  main.querySelectorAll('[data-invact]').forEach(btn => {
    btn.onclick = async ()=>{
      const inv = state.invoices.find(x=>x.ID===btn.dataset.invid);
      if(!inv) return;
      const act = btn.dataset.invact;
      if(act==='print'){
        openInvoicePrint(inv, 'invoice');
      }
      if(act==='printquote'){
        openInvoicePrint(inv, 'quote');
      }
      if(act==='edit'){
        openInvoiceModal(inv);
      }
      if(act==='wa'){
        const phone = (inv.CustomerPhone||'').replace(/\D/g,'');
        const phoneFormatted = phone.startsWith('0') ? '2'+phone : phone;
        const msg = `مرحبًا ${inv.CustomerName}،\nفاتورة / بيان سعر رقم: ${inv.InvoiceNumber}\nإجمالي المستحق: ${inv.Total} ج.م\nالمدفوع: ${inv.AmountPaid} ج.م\nالمتبقي: ${inv.Remaining} ج.م\nشكرًا لتعاملكم مع ${state.settings.shopName || 'ميكروتك'}.`;
        window.open(`https://wa.me/${phoneFormatted}?text=${encodeURIComponent(msg)}`, '_blank');
      }
      if(act==='del'){
        if(!confirm(`هل تريد حذف الفاتورة (${inv.InvoiceNumber}) نهائياً؟`)) return;
        try{
          await deleteInvoiceRemote(inv.ID);
          showToast('تم حذف الفاتورة بنجاح', 'success');
          renderInvoicesPage(main);
        }catch(e){ showToast('تعذر الحذف: '+e.message, 'error'); }
      }
    };
  });
}

/* ============================================================
   Daily Cash Journal & Cash Register (منظومة اليومية وحركة الخزينة العامة)
   ============================================================ */

function getUnifiedDailyTransactions(){
  const transactions = [];

  // 1. Maintenance Payments (Inflow)
  (state.payments || []).forEach(p => {
    const r = state.receipts.find(x => x.id === p.ReceiptID || x.receiptNumber === p.ReceiptNumber);
    const custName = r ? r.customer.name : '';
    transactions.push({
      id: 'pay_' + (p.ID || p.ReceiptID),
      date: cleanDate(p.Date) || new Date().toISOString().slice(0,10),
      rawTime: p.Time || '',
      type: 'in',
      sourceType: 'maintenance',
      sourceIcon: '🛠️',
      category: 'مقبوضات صيانة',
      title: `تحصيل صيانة: ${custName ? custName + ' — ' : ''}${p.Note || 'دفعة إيصال'}`,
      reference: p.ReceiptNumber ? `إيصال #${p.ReceiptNumber}` : `إيصال صيانة`,
      in: Number(p.Amount || 0),
      out: 0,
      by: p.By || 'نظام',
      method: 'نقدي بالدرج',
      notes: p.Note || '',
      canDelete: false
    });
  });

  // 2. POS Cash Sales (Inflow)
  (state.sales || []).forEach(s => {
    const paidAmt = Number(s.AmountPaid != null ? s.AmountPaid : s.Total);
    transactions.push({
      id: 'sale_' + s.ID,
      date: cleanDate(s.Date) || new Date().toISOString().slice(0,10),
      rawTime: '',
      type: 'in',
      sourceType: 'pos',
      sourceIcon: '🧾',
      category: 'مبيعات نقدية (POS)',
      title: `مبيعات كاشير: ${s.CustomerName || 'عميل زائر'} — ${(s.ItemsSummary||'مبيعات POS')}`,
      reference: `مبيعات #${s.ID.slice(-8)}`,
      in: paidAmt,
      out: 0,
      by: state.user ? state.user.name : 'كاشير',
      method: s.PaymentMethod || 'نقدي',
      notes: s.CustomerName || '',
      canDelete: false
    });
  });

  // 3. Direct Tax Invoices (Inflow for invoices that are not from POS or Receipt to avoid double counting)
  (state.invoices || []).forEach(inv => {
    if(!inv.ReferenceType || (inv.ReferenceType !== 'Receipt' && inv.ReferenceType !== 'POS')){
      const paidAmt = Number(inv.AmountPaid || 0);
      if(paidAmt > 0){
        transactions.push({
          id: 'inv_' + inv.ID,
          date: cleanDate(inv.Date) || new Date().toISOString().slice(0,10),
          rawTime: '',
          type: 'in',
          sourceType: 'invoice',
          sourceIcon: '📄',
          category: 'مقبوضات فواتير',
          title: `تحصيل فاتورة: ${inv.InvoiceNumber} — ${inv.CustomerName}`,
          reference: `فاتورة ${inv.InvoiceNumber}`,
          in: paidAmt,
          out: 0,
          by: inv.By || 'نظام',
          method: inv.PaymentMethod || 'نقدي',
          notes: inv.CustomerName,
          canDelete: false
        });
      }
    }
  });

  // 4. Supplier Purchases (Outflow)
  (state.purchases || []).forEach(pur => {
    const paidAmt = Number(pur.AmountPaid != null ? pur.AmountPaid : pur.Total);
    if(paidAmt > 0){
      transactions.push({
        id: 'pur_' + pur.ID,
        date: cleanDate(pur.Date) || new Date().toISOString().slice(0,10),
        rawTime: '',
        type: 'out',
        sourceType: 'purchase',
        sourceIcon: '📥',
        category: 'مشتريات موردين',
        title: `سداد مشتريات: ${pur.Supplier} (${pur.ItemsSummary || 'بضاعة/قطع غيار'})`,
        reference: `شراء #${pur.ID}`,
        in: 0,
        out: paidAmt,
        by: pur.By || 'نظام',
        method: 'نقدي بالدرج',
        notes: pur.Supplier,
        canDelete: false
      });
    }
  });

  // 5. Maintenance Refunds (Outflow)
  (state.receipts || []).forEach(r => {
    if(Number(r.refunded || 0) > 0){
      transactions.push({
        id: 'ref_' + r.id,
        date: cleanDate(r.updatedAt || r.date) || new Date().toISOString().slice(0,10),
        rawTime: '',
        type: 'out',
        sourceType: 'refund',
        sourceIcon: '↩️',
        category: 'استرداد صيانة',
        title: `استرداد مبالغ صيانة للعميل: ${r.customer.name}`,
        reference: `إيصال #${r.receiptNumber}`,
        in: 0,
        out: Number(r.refunded),
        by: r.updatedBy || r.createdBy || 'نظام',
        method: 'نقدي',
        notes: 'مبالغ مستردة',
        canDelete: false
      });
    }
  });

  // 6. Expenses, Petty Cash, Manual Inflows, and Manual Outflows
  (state.expenses || []).forEach(ex => {
    const isIncome = ex.Type === 'in' || ex.Type === 'income';
    const isDraw = ex.Type === 'out' || ex.Category === 'مسحوبات شخصية' || ex.Category === 'جاري الشركاء';
    const isPetty = ex.Type === 'petty' || ex.Category === 'بوفيه ونثريات' || ex.Category === 'نثريات';

    let tType = 'out';
    let sIcon = '💸';
    let sCat = ex.Category || 'مصروفات تشغيلية';
    let sRef = 'مصروف';

    if(isIncome){
      tType = 'in';
      sIcon = '🟢';
      sCat = ex.Category || 'وارد / إيداع';
      sRef = 'وارد يدوي';
    } else if(isPetty){
      tType = 'petty';
      sIcon = '☕';
      sCat = 'نثريات وبوفيه';
      sRef = 'نثريات';
    } else if(isDraw){
      tType = 'out';
      sIcon = '📤';
      sCat = 'مسحوبات شركاء';
      sRef = 'مسحوبات';
    }

    transactions.push({
      id: ex.ID,
      rawExpId: ex.ID,
      date: cleanDate(ex.Date) || new Date().toISOString().slice(0,10),
      rawTime: '',
      type: tType,
      sourceType: isIncome ? 'manual_in' : (isPetty ? 'petty' : 'expense'),
      sourceIcon: sIcon,
      category: sCat,
      title: ex.Title,
      reference: sRef,
      in: isIncome ? Number(ex.Amount || 0) : 0,
      out: isIncome ? 0 : Number(ex.Amount || 0),
      by: ex.By || 'نظام',
      method: ex.PaymentMethod || 'نقدي بالدرج',
      notes: ex.Notes || '',
      canDelete: true
    });
  });

  // Sort chronologically
  transactions.sort((a, b) => {
    const dateComp = a.date.localeCompare(b.date);
    if(dateComp !== 0) return dateComp;
    return (a.rawTime || '').localeCompare(b.rawTime || '');
  });

  // Calculate Running Balance
  let running = 0;
  transactions.forEach(t => {
    running += (t.in - t.out);
    t.runningBalance = running;
  });

  return transactions;
}

        <div class="field">
          <label>البيان / الوصف *</label>
          <input id="txTitle" placeholder="${curType==='in'?'مثال: إيداع نقدي إضافي، إيراد صيانة سابقة...':(curType==='petty'?'مثال: شاي وسكر وبوفيه، مستلزمات نظافة...':(curType==='out'?'مثال: مسحوبات شخصية، سلفة...':'مثال: فاتورة كهرباء، إيجار ورشة...'))}" autofocus>
        </div>

        <div class="grid2">
          <div class="field">
            <label>المبلغ (ج.م) *</label>
            <input id="txAmount" type="number" class="mono font-bold" placeholder="0" style="font-size:16px;">
          </div>
          <div class="field">
            <label>التاريخ *</label>
            <input id="txDate" type="date" value="${new Date().toISOString().slice(0,10)}">
          </div>
        </div>

        <div class="grid2">
          <div class="field">
            <label>بند المعاملة / التصنيف</label>
            <select id="txCategory">
              ${curType==='in' ? `
                <option>إيداع وتمويل خزينة</option>
                <option>إيرادات متنوعة</option>
                <option>سداد دفعات عميل</option>
                <option>أخرى</option>
              ` : (curType==='petty' ? `
                <option>بوفيه ونثريات</option>
                <option>ضيافة ومشروبات</option>
                <option>مستلزمات نظافة ومقر</option>
                <option>أدوات صغيرة ومواصلات</option>
              ` : (curType==='out' ? `
                <option>مسحوبات شخصية</option>
                <option>جاري الشركاء</option>
                <option>سداد التزامات</option>
                <option>أخرى</option>
              ` : `
                ${EXPENSE_CATEGORIES.map(c=>`<option>${c}</option>`).join('')}
              `))}
            </select>
          </div>
          <div class="field">
            <label>طريقة الدفع / الصندوق</label>
            <select id="txPaymentMethod">
              <option>نقدي بالدرج</option>
              <option>حساب البنك</option>
              <option>فودافون كاش / إنستاباي</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label>ملاحظات إضافية</label>
          <input id="txNotes" placeholder="تفاصيل إضافية...">
        </div>

        <div class="actions-row" style="margin-top:16px;">
          <button class="btn btn-ghost" id="cancelTxModal">إلغاء</button>
          <button class="btn ${cfg.btnCls}" id="saveTxModalBtn">💾 ${cfg.submitTxt}</button>
        </div>
      </div>
    `;

    overlay.querySelector('#closeTxModal').onclick = ()=>overlay.remove();
    overlay.querySelector('#cancelTxModal').onclick = ()=>overlay.remove();

    overlay.querySelectorAll('[data-txtype]').forEach(btn => {
      btn.onclick = ()=>{ curType = btn.dataset.txtype; renderModal(); };
    });

    overlay.querySelector('#saveTxModalBtn').onclick = async ()=>{
      const title = overlay.querySelector('#txTitle').value.trim();
      const amount = Number(overlay.querySelector('#txAmount').value);
      const date = overlay.querySelector('#txDate').value;
      const category = overlay.querySelector('#txCategory').value;
      const method = overlay.querySelector('#txPaymentMethod').value;
      const notes = overlay.querySelector('#txNotes').value.trim();

      if(!title || !amount || amount<=0){
        showToast('يرجى كتابة البيان وتحديد المبلغ بشكل صحيح', 'error');
        return;
      }

      const saveBtn = overlay.querySelector('#saveTxModalBtn');
      saveBtn.disabled = true; saveBtn.textContent = 'جارٍ الحفظ...';

      try{
        await saveExpenseRemote({
          ID: 'exp_' + Date.now(),
          Date: date,
          Title: title,
          Amount: amount,
          Category: category,
          Type: curType,
          PaymentMethod: method,
          Notes: notes
        });
        showToast('تم تسجيل الحركة بنجاح في دفتر اليومية ✅', 'success');
        overlay.remove();
        renderMain();
      }catch(e){
        showToast('تم الحفظ محلياً', 'info');
        overlay.remove();
        renderMain();
      }
    };
  }

  document.body.appendChild(overlay);
  renderModal();
}

function exportDailyJournalToExcel(transactions, stats){
  if(!transactions || !transactions.length){ showToast('لا توجد حركات للتصدير', 'error'); return; }
  const headers = ['التاريخ','البيان / المعاملة','المرجع / القسم','التصنيف','وارد (مدين)','منصرف (دائن)','الرصيد اللحظي','المسؤول','طريقة الدفع','ملاحظات'];
  const rows = transactions.map(t=>[
    cleanDate(t.date),
    `"${(t.title||'').replace(/"/g, '""')}"`,
    `"${t.reference||''}"`,
    `"${t.category||''}"`,
    t.in||0,
    t.out||0,
    t.runningBalance||0,
    `"${t.by||''}"`,
    `"${t.method||''}"`,
    `"${(t.notes||'').replace(/"/g, '""')}"`
  ]);
  downloadCSV(`Daily_Cash_Journal_${new Date().toISOString().slice(0,10)}.csv`, headers, rows);
}

/* ---------------- Daily Journal Page View (شاشة اليومية وحركة الخزينة العامة) ---------------- */
function renderDailyJournalPage(main){
  if(!state.dailyDateFilter) state.dailyDateFilter = 'today'; // 'today' | 'yesterday' | 'week' | 'month' | 'all' | 'custom'
  if(!state.dailyCustomDate) state.dailyCustomDate = new Date().toISOString().slice(0,10);
  if(!state.dailyTypeFilter) state.dailyTypeFilter = 'all'; // 'all' | 'in' | 'out' | 'petty' | 'maintenance' | 'pos' | 'invoice' | 'expense'
  if(!state.dailySearchQ) state.dailySearchQ = '';

  const allTx = getUnifiedDailyTransactions();
  const todayStr = new Date().toISOString().slice(0,10);

  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  const yesterdayStr = yesterday.toISOString().slice(0,10);

  const weekAgo = new Date();
  weekAgo.setDate(weekAgo.getDate() - 7);
  const weekAgoStr = weekAgo.toISOString().slice(0,10);

  const monthStartStr = todayStr.slice(0,7) + '-01';

  // Apply Date Filter
  let filtered = allTx;
  if(state.dailyDateFilter === 'today'){
    filtered = filtered.filter(t => t.date === todayStr);
  } else if(state.dailyDateFilter === 'yesterday'){
    filtered = filtered.filter(t => t.date === yesterdayStr);
  } else if(state.dailyDateFilter === 'week'){
    filtered = filtered.filter(t => t.date >= weekAgoStr);
  } else if(state.dailyDateFilter === 'month'){
    filtered = filtered.filter(t => t.date >= monthStartStr);
  } else if(state.dailyDateFilter === 'custom'){
    filtered = filtered.filter(t => t.date === state.dailyCustomDate);
  }

  // Apply Type Filter
  if(state.dailyTypeFilter === 'in'){
    filtered = filtered.filter(t => t.in > 0);
  } else if(state.dailyTypeFilter === 'out'){
    filtered = filtered.filter(t => t.out > 0);
  } else if(state.dailyTypeFilter === 'petty'){
    filtered = filtered.filter(t => t.type === 'petty' || t.category.includes('نثريات'));
  } else if(state.dailyTypeFilter === 'maintenance'){
    filtered = filtered.filter(t => t.sourceType === 'maintenance' || t.sourceType === 'refund');
  } else if(state.dailyTypeFilter === 'pos'){
    filtered = filtered.filter(t => t.sourceType === 'pos');
  } else if(state.dailyTypeFilter === 'invoice'){
    filtered = filtered.filter(t => t.sourceType === 'invoice');
  } else if(state.dailyTypeFilter === 'expense'){
    filtered = filtered.filter(t => t.sourceType === 'expense' || t.sourceType === 'purchase');
  }

  // Apply Search
  const q = (state.dailySearchQ||'').trim().toLowerCase();
  if(q){
    filtered = filtered.filter(t =>
      (t.title||'').toLowerCase().includes(q) ||
      (t.reference||'').toLowerCase().includes(q) ||
      (t.category||'').toLowerCase().includes(q) ||
      (t.by||'').toLowerCase().includes(q) ||
      (t.notes||'').toLowerCase().includes(q)
    );
  }

  // KPIs
  const totalIn = filtered.reduce((s,t)=>s+Number(t.in||0), 0);
  const totalOut = filtered.reduce((s,t)=>s+Number(t.out||0), 0);
  const totalPetty = filtered.filter(t=>t.type==='petty'||t.category.includes('نثريات')).reduce((s,t)=>s+Number(t.out||0), 0);
  const netCash = totalIn - totalOut;

  // Overall Cash Balance in Drawer (from all time)
  const currentTotalCashInDrawer = allTx.length ? allTx[allTx.length - 1].runningBalance : 0;

  main.innerHTML = `
    <div class="top-header">
      <div>
        <h2 class="page-title">📔 دفتر اليومية وحركة الخزينة العامة</h2>
        <div class="subtitle">تصب فيه آلياً كافة مقبوضات الصيانة، مبيعات POS، الفواتير، المشتريات، والمصروفات والنثريات (${filtered.length} حركة)</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-ghost btn-sm" id="exportDailyExcelBtn">📥 تصدير Excel</button>
        <button class="btn btn-blue btn-sm" id="printDailyCloseBtn">🖨️ طباعة تقفيل الخزينة</button>
        <button class="btn btn-green btn-sm" id="recordManualInBtn">➕ تسجيل وارد</button>
        <button class="btn btn-amber btn-sm" id="recordManualOutBtn">➖ تسجيل منصرف</button>
        <button class="btn btn-red btn-sm" id="recordExpenseBtn">💸 مصروف</button>
        <button class="btn btn-primary btn-sm" id="recordPettyBtn">☕ نثريات</button>
      </div>
    </div>

    <!-- KPIs Grid -->
    <div class="stat-grid">
      <div class="stat-card green">
        <div class="top-row"><span class="lbl">إجمالي الوارد (مقبوضات)</span><div class="icon-box">📥</div></div>
        <div class="num mono">${totalIn.toLocaleString()} <span style="font-size:12px;font-weight:600;">ج.م</span></div>
      </div>
      <div class="stat-card red">
        <div class="top-row"><span class="lbl">إجمالي المنصرف (مدفوعات)</span><div class="icon-box">📤</div></div>
        <div class="num mono">${totalOut.toLocaleString()} <span style="font-size:12px;font-weight:600;">ج.م</span></div>
      </div>
      <div class="stat-card amber">
        <div class="top-row"><span class="lbl">النثريات والبوفيه</span><div class="icon-box">☕</div></div>
        <div class="num mono">${totalPetty.toLocaleString()} <span style="font-size:12px;font-weight:600;">ج.م</span></div>
      </div>
      <div class="stat-card purple">
        <div class="top-row"><span class="lbl">صافي رصيد الخزينة بالدرج</span><div class="icon-box">💰</div></div>

      <div class="chip ${state.dailyDateFilter==='custom'?'sel':''}" data-dchip="custom">تاريخ مخصص 📆</div>
    </div>

    <div class="filters-bar" style="margin-bottom:14px;flex-wrap:wrap;">
      ${state.dailyDateFilter==='custom' ? `

                  </td>
                  <td>
                    <span class="status-badge st-check" style="font-size:10.5px;">${t.sourceIcon} ${t.reference}</span>
                  </td>
                  <td>
                    <span style="font-size:11.5px;color:var(--ink-secondary);">${t.category}</span>
                  </td>
                  <td class="mono font-bold" style="text-align:center;color:var(--green);font-size:13px;">
                    ${t.in > 0 ? `+${Number(t.in).toLocaleString()} ج.م` : '-'}

                    ${(t.runningBalance||0).toLocaleString()} ج.م
                  </td>
                  <td style="font-size:11.5px;">${t.by}</td>
                  <td style="text-align:center;">
                    ${t.canDelete && state.user.role==='admin' ? `
                      <button class="btn btn-xs btn-red" data-txdel="${t.rawExpId}" title="حذف القيد اليدوي">🗑️</button>
                    ` : ''}
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>`}
    </div>
  `;

  // Bindings
  document.querySelectorAll('#dailyDateChips .chip').forEach(c => {
    c.onclick = ()=>{
      state.dailyDateFilter = c.dataset.dchip;
      renderDailyJournalPage(main);

  const customDateInp = document.getElementById('dailyCustomDateInp');
  if(customDateInp){
    customDateInp.onchange = (e)=>{ state.dailyCustomDate = e.target.value; renderDailyJournalPage(main); };
  }

  const typeSel = document.getElementById('dailyTypeFilterSelect');
  if(typeSel){
    typeSel.onchange = (e)=>{ state.dailyTypeFilter = e.target.value; renderDailyJournalPage(main); };

  const searchInp = document.getElementById('dailySearchInp');
  if(searchInp){

  const clearBtn = document.getElementById('clearDailyFilters');
  if(clearBtn){

      state.dailyDateFilter = 'today';

      state.dailySearchQ = '';
      renderDailyJournalPage(main);
    };
  }

  // Action Buttons
  document.getElementById('recordManualInBtn').onclick = ()=>openRecordTransactionModal('in');
  document.getElementById('recordManualOutBtn').onclick = ()=>openRecordTransactionModal('out');

  document.getElementById('exportDailyExcelBtn').onclick = ()=>exportDailyJournalToExcel(filtered, { totalIn, totalOut, totalPetty, netCash });

    const curDateStr = state.dailyDateFilter === 'custom' ? state.dailyCustomDate : (state.dailyDateFilter==='yesterday'?yesterdayStr:todayStr);
    openDailyClosePrint(curDateStr, { totalIn, totalOut, totalPetty, netCash }, filtered);
  };

  // Row Delete
  main.querySelectorAll('[data-txdel]').forEach(btn => {
    btn.onclick = async ()=>{
      if(!confirm('هل تريد حذف هذا المصروف / القيد اليدوي نهائياً؟')) return;

        await deleteExpenseRemote(btn.dataset.txdel);

        renderDailyJournalPage(main);
      }catch(e){ showToast('تعذر الحذف: '+e.message, 'error'); }
    };
  });
}

      Total: itemsTotal, Status:'معلق', By: state.user.name

      showToast('تم حفظ عرض السعر بنجاح', 'success');
      openQuotationPrint(res.quotation, cart);
      state.quoCart = [];

    saveBtn.disabled = false; saveBtn.textContent = 'حفظ وطباعة عرض السعر';

/* ---------------- Pro Inventory Master Screen (شاشة إدارة وأصناف المخزن المطورة) ---------------- */
function renderInventory(main, categoryFilter, titleOverride){
  if(!state.invSearchQ) state.invSearchQ = '';
  if(!state.invStockFilter) state.invStockFilter = 'all';

  const rawList = state.inventory || [];
  let list = categoryFilter === 'all' ? rawList : rawList.filter(it=>(it.Category||'صيانة')===categoryFilter);

  // Stock Filter (Low Stock / Out of Stock / In Stock)
  if(state.invStockFilter === 'low'){
    list = list.filter(it => Number(it.Quantity||0) <= Number(it.MinStock||2));
  } else if(state.invStockFilter === 'out'){
    list = list.filter(it => Number(it.Quantity||0) <= 0);
  } else if(state.invStockFilter === 'available'){
    list = list.filter(it => Number(it.Quantity||0) > 0);
  }

  // Text Search
  const q = state.invSearchQ.trim().toLowerCase();
  if(q){
    list = list.filter(it => 
      (it.Name||'').toLowerCase().includes(q) ||
      (it.Barcode||'').toLowerCase().includes(q) ||
      (it.SKU||'').toLowerCase().includes(q) ||
      (it.ShelfLocation||'').toLowerCase().includes(q) ||
      (it.CompatibleModels||'').toLowerCase().includes(q) ||
      (it.SubCategory||'').toLowerCase().includes(q)
    );
  }

  // Calculations & KPIs
  const totalItemsCount = rawList.length;
  const totalCostValue = rawList.reduce((s,it)=>s + (Number(it.Quantity||0) * Number(it.PurchasePrice||0)), 0);
  const totalRetailValue = rawList.reduce((s,it)=>s + (Number(it.Quantity||0) * Number(it.SellPrice||it.PurchasePrice||0)), 0);
  const lowStockCount = rawList.filter(it=>Number(it.Quantity||0) <= Number(it.MinStock||2)).length;

  main.innerHTML = `
    <div class="top-header">
      <div>
        <h2 class="page-title">📦 ${titleOverride || 'إدارة المخزن والأصناف'}</h2>
        <div class="subtitle">إدارة شاملة للمنتجات، الباركود، التسعير الذكي، ومواقع الرفوف (${list.length} صنف معروض)</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-ghost btn-sm" id="exportInvExcelBtn">📥 تصدير Excel</button>
        <button class="btn btn-ghost btn-sm" id="importInvExcelBtn">📂 استيراد من Excel</button>
        <button class="btn btn-primary btn-sm" id="addNewItemMasterBtn">➕ إضافة صنف جديد</button>
      </div>
    </div>

    <!-- Inventory KPIs -->
    <div class="stat-grid">
      <div class="stat-card blue">
        <div class="top-row"><span class="lbl">إجمالي الأصناف</span><div class="icon-box">📦</div></div>
        <div class="num mono">${totalItemsCount}</div>
      </div>
      <div class="stat-card amber">
        <div class="top-row"><span class="lbl">قيمة المخزون (تكلفة)</span><div class="icon-box">💵</div></div>
        <div class="num mono">${totalCostValue.toLocaleString()} <span style="font-size:12px;font-weight:600;">ج.م</span></div>
      </div>
      <div class="stat-card green">
        <div class="top-row"><span class="lbl">القيمة البيعية المتوقعة</span><div class="icon-box">📈</div></div>
        <div class="num mono">${totalRetailValue.toLocaleString()} <span style="font-size:12px;font-weight:600;">ج.م</span></div>
      </div>
      <div class="stat-card red">
        <div class="top-row"><span class="lbl">النواقص وحد الأمان</span><div class="icon-box">⚠️</div></div>
        <div class="num mono">${lowStockCount}</div>
      </div>
    </div>

    <!-- Filters & Quick Actions Bar -->
    <div class="filters-bar" style="margin-bottom:14px;">
      <input id="invSearchInput" placeholder="🔍 بحث بالاسم، الباركود، رقم الموديل SKU، موقع الرف، أو الأجهزة المتوافقة..." value="${state.invSearchQ}" style="flex:1;min-width:240px;">
      <select id="invStockFilterSelect" style="min-width:140px;">
        <option value="all" ${state.invStockFilter==='all'?'selected':''}>📦 كل المخزون</option>
        <option value="available" ${state.invStockFilter==='available'?'selected':''}>✅ متوفر بالمخزن</option>
        <option value="low" ${state.invStockFilter==='low'?'selected':''}>⚠️ قارب على النفاد (حد الأمان)</option>
        <option value="out" ${state.invStockFilter==='out'?'selected':''}>🚫 رصيد صفري (منتهي)</option>
      </select>
      ${(state.invSearchQ || state.invStockFilter!=='all') ? `<button class="btn btn-ghost btn-sm" id="clearInvFiltersBtn">مسح الفلاتر</button>` : ''}
    </div>

    <div class="card">
      ${list.length===0 ? '<div class="empty">لا توجد أصناف مطابقة للبحث أو الفلتر المختار.</div>' : `
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>الصنف والموديل</th>
              ${categoryFilter==='all'?'<th>القسم</th>':''}
              <th>مكان الرف</th>
              <th>الباركود</th>
              <th>الكمية المتاحة</th>
              <th>سعر الشراء</th>
              <th>سعر البيع (قطاعي)</th>
              <th>سعر الجملة</th>
              <th>هامش الربح</th>
              <th>الإجراءات</th>
            </tr>
          </thead>
          <tbody>
            ${list.map(it=>{
              const qty = Number(it.Quantity||0);
              const minStock = Number(it.MinStock||2);
              const buy = Number(it.PurchasePrice||0);
              const sell = Number(it.SellPrice||0);
              const wholesale = Number(it.WholesalePrice||0);
              const profitAmt = sell - buy;
              const profitMarginPct = sell > 0 ? Math.round((profitAmt / sell) * 100) : 0;
              const isLowStock = qty <= minStock;

              return `
                <tr style="${isLowStock ? 'background:rgba(239,68,68,0.05);' : ''}">
                  <td>
                    <div style="font-weight:800;font-size:13px;color:var(--ink);">${it.Name}</div>
                    <div style="display:flex;gap:6px;align-items:center;font-size:11px;color:var(--ink-secondary);margin-top:2px;">
                      ${it.SKU ? `<span class="mono" style="color:var(--primary);font-weight:700;">#${it.SKU}</span>` : ''}
                      ${it.SubCategory ? `<span>• ${it.SubCategory}</span>` : ''}
                      ${it.WarrantyMonths ? `<span>• 🛡️ ضمان ${it.WarrantyMonths} شهر</span>` : ''}
                    </div>
                    ${it.CompatibleModels ? `<div style="font-size:10.5px;color:var(--slate-500);margin-top:1px;">💻 متوافق: ${it.CompatibleModels}</div>` : ''}
                  </td>
                  ${categoryFilter==='all'?`<td><span class="status-badge st-check">${it.Category||'صيانة'}</span></td>`:''}
                  <td>
                    ${it.ShelfLocation ? `<span style="background:var(--paper3);border:1px solid var(--line-strong);padding:2px 7px;border-radius:4px;font-size:11px;font-weight:700;color:var(--ink);">📍 ${it.ShelfLocation}</span>` : '<span style="color:var(--slate-400);font-size:11px;">-</span>'}
                  </td>
                  <td>
                    ${it.Barcode ? `
                      <div style="display:flex;align-items:center;gap:4px;">
                        <span class="mono" style="font-size:11px;font-weight:700;color:var(--ink-secondary);">${it.Barcode}</span>
                        <button class="btn btn-xs btn-ghost" data-printsticker="${it.ID}" title="طباعة ملصق الباركود الحراري" style="padding:2px 5px;">🏷️</button>
                      </div>
                    ` : '<span style="color:var(--slate-400);font-size:11px;">بدون</span>'}
                  </td>
                  <td>
                    <div style="display:flex;align-items:center;gap:4px;">
                      <span class="mono" style="font-weight:900;font-size:13.5px;color:${isLowStock?'var(--red)':'var(--ink)'};">${qty}</span>
                      <span style="font-size:11px;color:var(--ink-secondary);">${it.Unit||'قطعة'}</span>
                      ${isLowStock ? '<span title="الكمية وصلت لحد الأمان أو نفدت" style="font-size:11px;">⚠️</span>' : ''}
                    </div>
                  </td>
                  <td class="mono font-bold">${buy.toLocaleString()} ج.م</td>
                  <td class="mono font-bold" style="color:var(--green);">${sell.toLocaleString()} ج.م</td>
                  <td class="mono">${wholesale ? wholesale.toLocaleString() + ' ج.م' : '<span style="color:var(--slate-400);">-</span>'}</td>
                  <td>
                    <span class="mono font-bold" style="color:${profitAmt>=0?'var(--green-text)':'var(--red)'};font-size:11.5px;">
                      ${profitAmt >= 0 ? '+' : ''}${profitAmt.toLocaleString()} ج.م (${profitMarginPct}%)
                    </span>
                  </td>
                  <td class="row-actions">
                    <button class="btn btn-xs btn-amber" data-printsticker="${it.ID}" title="طباعة ملصق الباركود">🏷️ ملصق</button>
                    <button class="btn btn-xs btn-ghost" data-cloneitem="${it.ID}" title="تكرار الصنف">📋 نسخ</button>
                    <button class="btn btn-xs btn-ghost" data-edititem="${it.ID}" title="تعديل">✏️</button>
                    ${state.user.role==='admin' ? `<button class="btn btn-xs btn-red" data-delitem="${it.ID}" title="حذف">🗑️</button>` : ''}
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>`}
    </div>
  `;

  // Attach search & filter handlers
  const searchInput = document.getElementById('invSearchInput');
  searchInput.oninput = (e)=>{ state.invSearchQ = e.target.value; renderInventory(main, categoryFilter, titleOverride); };
  
  const filterSelect = document.getElementById('invStockFilterSelect');
  filterSelect.onchange = (e)=>{ state.invStockFilter = e.target.value; renderInventory(main, categoryFilter, titleOverride); };

  const clearBtn = document.getElementById('clearInvFiltersBtn');
  if(clearBtn) clearBtn.onclick = ()=>{ state.invSearchQ = ''; state.invStockFilter = 'all'; renderInventory(main, categoryFilter, titleOverride); };

  document.getElementById('addNewItemMasterBtn').onclick = ()=>openInventoryItemModal(null, false, categoryFilter);
  document.getElementById('exportInvExcelBtn').onclick = ()=>exportInventoryToExcel(list);
  document.getElementById('importInvExcelBtn').onclick = ()=>openInventoryImportModal();

  // Attach row actions
  main.querySelectorAll('[data-edititem]').forEach(btn=>{
    btn.onclick = ()=>{
      const item = state.inventory.find(x=>x.ID===btn.dataset.edititem);
      if(item) openInventoryItemModal(item, false, categoryFilter);
    };
  });
  main.querySelectorAll('[data-cloneitem]').forEach(btn=>{
    btn.onclick = ()=>{
      const item = state.inventory.find(x=>x.ID===btn.dataset.cloneitem);
      if(item) openInventoryItemModal(item, true, categoryFilter);
    };
  });
  main.querySelectorAll('[data-printsticker]').forEach(btn=>{
    btn.onclick = ()=>{
      const item = state.inventory.find(x=>x.ID===btn.dataset.printsticker);
      if(item) openProductBarcodeSticker(item);
    };
  });
  main.querySelectorAll('[data-delitem]').forEach(btn=>{
    btn.onclick = async ()=>{
      const item = state.inventory.find(x=>x.ID===btn.dataset.delitem);
      if(!item) return;
      if(!confirm(`هل تريد حذف الصنف "${item.Name}" نهائياً من المخزن؟`)) return;
      try{
        await deleteInventoryItemRemote(item.ID);
        showToast('تم حذف الصنف بنجاح', 'success');
        renderInventory(main, categoryFilter, titleOverride);
      }catch(e){ showToast('تعذر الحذف: '+e.message, 'error'); }
    };
  });
}

/* ---------------- Pro Inventory Item Master Modal (نافذة إدخال وتعديل الصنف الاحترافية) ---------------- */
function openInventoryItemModal(editItem, cloneMode=false, defaultCategory='صيانة'){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const isEdit = !!editItem && !cloneMode;
  const isClone = cloneMode;

  const item = editItem ? {
    ID: isClone ? ('inv_' + Date.now()) : editItem.ID,
    Name: isClone ? `${editItem.Name} (نسخة)` : (editItem.Name || ''),
    Category: editItem.Category || defaultCategory || 'صيانة',
    SubCategory: editItem.SubCategory || '',
    SKU: isClone ? '' : (editItem.SKU || ''),
    Barcode: isClone ? '' : (editItem.Barcode || ''),
    ShelfLocation: editItem.ShelfLocation || '',
    Quantity: isClone ? 0 : (editItem.Quantity || 0),
    MinStock: editItem.MinStock != null ? editItem.MinStock : 2,
    Unit: editItem.Unit || 'قطعة',
    PurchasePrice: editItem.PurchasePrice || 0,
    SellPrice: editItem.SellPrice || 0,
    WholesalePrice: editItem.WholesalePrice || 0,
    WarrantyMonths: editItem.WarrantyMonths || 0,
    CompatibleModels: editItem.CompatibleModels || '',
    ImageURL: editItem.ImageURL || ''
  } : {
    ID: 'inv_' + Date.now(),
    Name: '',
    Category: defaultCategory && defaultCategory!=='all' ? defaultCategory : 'صيانة',
    SubCategory: '',
    SKU: '',
    Barcode: '',
    ShelfLocation: '',
    Quantity: 0,
    MinStock: 2,
    Unit: 'قطعة',
    PurchasePrice: 0,
    SellPrice: 0,
    WholesalePrice: 0,
    WarrantyMonths: 0,
    CompatibleModels: '',
    ImageURL: ''
  };

  const UNITS = ['قطعة', 'طقم / Set', 'متر', 'رول', 'كرتونة', 'علبة', 'حبة'];
  const COMMON_SUBCATS = {
    'صيانة': ['شاشات لابتوب', 'بطاريات لابتوب', 'شواحن وكابلات', 'كيبورد ومفصلات', 'سوكت شحن وباور', 'هاردات SSD/HDD', 'رامات RAM', 'أدوات وصيانة', 'أخرى'],
    'كاميرات': ['كاميرات مراقبة خارجية', 'كاميرات داخلية', 'أجهزة تسجيل DVR/NVR', 'هارد ديسك مراقبة', 'باور سبلاي وسويتشات', 'كابلات وإكسسوار', 'أخرى'],
    'كمبيوتر': ['أجهزة كمبيوتر كاملة', 'لابتوب', 'شاشات عرض', 'كروت شاشة GPU', 'لوحات أم Motherboard', 'معالجات CPU', 'كيسات وباور سبلاي', 'أخرى'],
    'إكسسوار': ['ماوس وكيبورد', 'سماعات وهيدسيت', 'فلاشات وكروت ميموري', 'مشتركات ووصلات', 'حقائب وجرابات', 'أخرى']
  };

  function renderModalHTML(){
    overlay.innerHTML = `
      <div class="modal-content" style="max-width:760px;">
        <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px;">
          <div>
            <h3 style="margin:0;font-size:17px;font-weight:900;">
              ${isEdit ? '✏️ تعديل بيانات الصنف' : (isClone ? '📋 استنساخ صنف جديد' : '➕ إضافة صنف جديد للمخزن')}
            </h3>
            <div style="font-size:12px;color:var(--ink-secondary);margin-top:2px;">
              ${isEdit ? `كود الصنف: <span class="mono font-bold" style="color:var(--primary);">${item.ID}</span>` : 'أدخل المواصفات والأسعار وموقع الرف وحد الأمان'}
            </div>
          </div>
          <button class="btn btn-ghost btn-xs" id="closeItemModal">✕ إغلاق</button>
        </div>

        <!-- Section 1: Basic Product Identity -->
        <div class="card" style="padding:14px 16px;background:var(--paper3);border-color:var(--line-strong);margin-bottom:14px;">
          <h3 style="font-size:13.5px;margin-bottom:10px;">📌 البيانات الأساسية والتصنيف</h3>
          <div class="grid3">
            <div class="field" style="grid-column: span 2;">
              <label>اسم الصنف والموديل *</label>
              <input id="mItemName" value="${item.Name}" placeholder="مثال: شاشة لابتوب 15.6 LED Slim 30 Pin FHD" autofocus>
            </div>
            <div class="field">
              <label>القسم الرئيسي *</label>
              <select id="mItemCategory">
                ${INVENTORY_CATEGORIES.map(c=>`<option ${c===item.Category?'selected':''}>${c}</option>`).join('')}
              </select>
            </div>
          </div>

          <div class="grid3">
            <div class="field">
              <label>التصنيف الفرعي / النوع</label>
              <input id="mItemSubCat" value="${item.SubCategory}" list="subCatList" placeholder="اختر أو اكتب...">
              <datalist id="subCatList">
                ${(COMMON_SUBCATS[item.Category]||[]).map(sc=>`<option value="${sc}">`).join('')}
              </datalist>
            </div>
            <div class="field">
              <label>كود القطعة / SKU (اختياري)</label>
              <input id="mItemSKU" value="${item.SKU}" placeholder="مثال: NT156FHM-N61">
            </div>
            <div class="field">
              <label>مكان التخزين والرف 📍</label>
              <input id="mItemShelf" value="${item.ShelfLocation}" placeholder="مثال: رف A-2 / درج 4">
            </div>
          </div>

          <div class="field" style="margin-bottom:0;">
            <label>الأجهزة والموديلات المتوافقة (Compatibility Notes)</label>
            <input id="mItemCompat" value="${item.CompatibleModels}" placeholder="مثال: Dell G15 5515, HP Pavilion 15-ec, Lenovo Legion 5...">
          </div>
        </div>

        <!-- Section 2: Barcode & Label -->
        <div class="card" style="padding:14px 16px;margin-bottom:14px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <h3 style="font-size:13.5px;margin:0;">🏷️ الباركود والملصقات</h3>
            <button class="btn btn-ghost btn-xs" id="genRandomBarcodeBtn" type="button">🎲 توليد باركود تلقائي</button>
          </div>
          <div class="grid2">
            <div class="field" style="margin-bottom:0;">
              <label>رقم الباركود (امسح بالليزر أو اكتب)</label>
              <input id="mItemBarcode" class="mono" value="${item.Barcode}" placeholder="6220000000000">
            </div>
            <div style="display:flex;align-items:flex-end;gap:8px;">
              <button class="btn btn-amber btn-sm" id="modalPrintStickerPreviewBtn" type="button" style="width:100%;">
                🏷️ طباعة ملصق باركود حراري
              </button>
            </div>
          </div>
        </div>

        <!-- Section 3: Smart Pricing & Profit Margin Calculator -->
        <div class="card" style="padding:14px 16px;margin-bottom:14px;background:var(--paper3);">
          <h3 style="font-size:13.5px;margin-bottom:10px;">💰 التسعير الذكي وهوامش الربح</h3>
          <div class="grid3">
            <div class="field">
              <label>سعر التكلفة / الشراء (ج.م) *</label>
              <input id="mItemBuy" type="number" step="any" value="${item.PurchasePrice||''}" placeholder="0.00">
            </div>
            <div class="field">
              <label>سعر البيع قطاعي للجمهور (ج.م) *</label>
              <input id="mItemSell" type="number" step="any" value="${item.SellPrice||''}" placeholder="0.00" style="font-weight:800;color:var(--green);">
            </div>
            <div class="field">
              <label>سعر الجملة / للفنيين (ج.م)</label>
              <input id="mItemWholesale" type="number" step="any" value="${item.WholesalePrice||''}" placeholder="0.00">
            </div>
          </div>

          <!-- Real-Time Profit Calculation Box -->
          <div class="fin-box" id="profitCalcBox" style="margin-top:6px;">
            <div class="fin-cell">
              <div class="l">صافي الربح للقطعة</div>
              <div class="v mono" id="calcProfitAmt" style="color:var(--green-text);">0 ج.م</div>
            </div>
            <div class="fin-cell">
              <div class="l">نسبة هامش الربح (Margin %)</div>
              <div class="v mono" id="calcMarginPct">0%</div>
            </div>
            <div class="fin-cell">
              <div class="l">نسبة الزيادة (Markup %)</div>
              <div class="v mono" id="calcMarkupPct">0%</div>
            </div>
          </div>
        </div>

        <!-- Section 4: Stock Levels & Warranty -->
        <div class="card" style="padding:14px 16px;margin-bottom:14px;">
          <h3 style="font-size:13.5px;margin-bottom:10px;">📦 المخزون، حد الأمان، والضمان</h3>
          <div class="grid4">
            <div class="field">
              <label>الكمية الحالية *</label>
              <input id="mItemQty" type="number" value="${item.Quantity||0}" min="0">
            </div>
            <div class="field">
              <label>حد الأمان (تنبيه النواقص)</label>
              <input id="mItemMinStock" type="number" value="${item.MinStock||2}" min="0" title="عند وصول الكمية لهذا الحد يظهر تنبيه">
            </div>
            <div class="field">
              <label>وحدة القياس</label>
              <select id="mItemUnit">
                ${UNITS.map(u=>`<option ${u===item.Unit?'selected':''}>${u}</option>`).join('')}
              </select>
            </div>
            <div class="field">
              <label>فترة الضمان (بالأشهر)</label>
              <input id="mItemWarranty" type="number" value="${item.WarrantyMonths||0}" min="0" placeholder="0 = بدون">
            </div>
          </div>
        </div>

        <!-- Modal Actions -->
        <div class="actions-row" style="margin-top:16px;">
          <button class="btn btn-ghost" id="cancelItemModalBtn" type="button">إلغاء</button>
          <div style="display:flex;gap:8px;">
            ${!isEdit ? `<button class="btn btn-green" id="saveAndNewItemBtn" type="button">➕💾 حفظ وإضافة صنف آخر</button>` : ''}
            <button class="btn btn-primary" id="saveItemMasterBtn" type="button">💾 حفظ الصنف</button>
          </div>
        </div>
      </div>
    `;

    document.body.appendChild(overlay);

    // Close handlers
    overlay.querySelector('#closeItemModal').onclick = ()=>overlay.remove();
    overlay.querySelector('#cancelItemModalBtn').onclick = ()=>overlay.remove();

    // Category change updates subcategory datalist
    overlay.querySelector('#mItemCategory').onchange = (e)=>{
      const cat = e.target.value;
      const dl = overlay.querySelector('#subCatList');
      dl.innerHTML = (COMMON_SUBCATS[cat]||[]).map(sc=>`<option value="${sc}">`).join('');
    };

    // Random barcode generator (EAN13 format prefix 20)
    overlay.querySelector('#genRandomBarcodeBtn').onclick = ()=>{
      const rnd = '20' + String(Date.now()).slice(-8) + Math.floor(Math.random()*90+10);
      overlay.querySelector('#mItemBarcode').value = rnd;
      showToast('تم توليد كود باركود فريد للصنف 🎲', 'info');
    };

    // Live Profit & Margin Calculation
    function updateProfitCalcs(){
      const buy = Number(overlay.querySelector('#mItemBuy').value)||0;
      const sell = Number(overlay.querySelector('#mItemSell').value)||0;
      const profit = sell - buy;
      const marginPct = sell > 0 ? Math.round((profit / sell) * 100) : 0;
      const markupPct = buy > 0 ? Math.round((profit / buy) * 100) : 0;

      const pAmtEl = overlay.querySelector('#calcProfitAmt');
      const pMargEl = overlay.querySelector('#calcMarginPct');
      const pMarkEl = overlay.querySelector('#calcMarkupPct');

      pAmtEl.textContent = `${profit.toLocaleString()} ج.م`;
      pAmtEl.style.color = profit >= 0 ? 'var(--green-text)' : 'var(--red)';
      pMargEl.textContent = `${marginPct}%`;
      pMarkEl.textContent = `${markupPct}%`;
    }

    overlay.querySelector('#mItemBuy').oninput = updateProfitCalcs;
    overlay.querySelector('#mItemSell').oninput = updateProfitCalcs;
    updateProfitCalcs();

    // Print sticker preview from inside modal
    overlay.querySelector('#modalPrintStickerPreviewBtn').onclick = ()=>{
      collectFormData();
      if(!item.Name){ showToast('يرجى كتابة اسم الصنف أولاً للمعاينة', 'error'); return; }
      openProductBarcodeSticker(item);
    };

    function collectFormData(){
      item.Name = overlay.querySelector('#mItemName').value.trim();
      item.Category = overlay.querySelector('#mItemCategory').value;
      item.SubCategory = overlay.querySelector('#mItemSubCat').value.trim();
      item.SKU = overlay.querySelector('#mItemSKU').value.trim();
      item.ShelfLocation = overlay.querySelector('#mItemShelf').value.trim();
      item.CompatibleModels = overlay.querySelector('#mItemCompat').value.trim();
      item.Barcode = overlay.querySelector('#mItemBarcode').value.trim();
      item.PurchasePrice = Number(overlay.querySelector('#mItemBuy').value)||0;
      item.SellPrice = Number(overlay.querySelector('#mItemSell').value)||0;
      item.WholesalePrice = Number(overlay.querySelector('#mItemWholesale').value)||0;
      item.Quantity = Number(overlay.querySelector('#mItemQty').value)||0;
      item.MinStock = Number(overlay.querySelector('#mItemMinStock').value)||0;
      item.Unit = overlay.querySelector('#mItemUnit').value;
      item.WarrantyMonths = Number(overlay.querySelector('#mItemWarranty').value)||0;
    }

    async function handleSave(keepOpen){
      collectFormData();
      if(!item.Name){ showToast('اسم الصنف مطلوب', 'error'); return; }
      
      // Auto barcode if left empty
      if(!item.Barcode){
        item.Barcode = '20' + String(Date.now()).slice(-8) + Math.floor(Math.random()*90+10);
      }

      const saveBtn = overlay.querySelector('#saveItemMasterBtn');
      saveBtn.disabled = true; saveBtn.textContent = 'جارٍ الحفظ...';

      try{
        await saveInventoryItemRemote(item);
        showToast(`تم حفظ الصنف "${item.Name}" بنجاح ✅`, 'success');
        renderMain();

        if(keepOpen){
          // Reset form for next item
          overlay.remove();
          openInventoryItemModal(null, false, item.Category);
        } else {
          overlay.remove();
        }
      }catch(e){
        showToast('تم حفظ الصنف محلياً', 'info');
        if(!keepOpen) overlay.remove();
      }
    }

    overlay.querySelector('#saveItemMasterBtn').onclick = ()=>handleSave(false);
    const saveAndNewBtn = overlay.querySelector('#saveAndNewItemBtn');
    if(saveAndNewBtn) saveAndNewBtn.onclick = ()=>handleSave(true);
  }

  renderModalHTML();
}

/* ---------------- Print Product Barcode Sticker (50mm x 30mm) ---------------- */
function openProductBarcodeSticker(item){
  document.body.classList.add('printing-sticker');
  const old = document.getElementById('printMount');
  if(old) old.remove();
  const mount = document.createElement('div');
