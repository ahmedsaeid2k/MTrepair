/* ---------------- Bulk Inventory Import Modal (استيراد جماعي من Excel/CSV) ---------------- */
function openInventoryImportModal(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';

  overlay.innerHTML = `
    <div class="modal-content" style="max-width:650px;">
      <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px;">
        <h3 style="margin:0;font-size:16px;">📂 استيراد أصناف جماعي من ملف Excel / CSV</h3>
        <button class="btn btn-ghost btn-xs" id="closeImportModal">✕</button>
      </div>

      <div style="background:var(--paper3);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;margin-bottom:16px;font-size:12.5px;line-height:1.7;">
        <b>💡 تعليمات الاستيراد:</b>
        <ol style="margin-right:18px;margin-top:4px;">
          <li>يمكنك تنزيل النموذج الجاهز وتعبئته ببيانات أصنافك.</li>
          <li>الأعمدة المطلوبة: <b>الاسم، القسم، الباركود، الكمية، سعر الشراء، سعر البيع، مكان الرف</b>.</li>
          <li>يدعم الملفات بصيغة CSV أو Excel (.csv).</li>
        </ol>
        <button class="btn btn-ghost btn-xs" id="downloadImportTemplateBtn" style="margin-top:6px;">📥 تنزيل نموذج الاستيراد الفارغ (Template)</button>
      </div>

      <div class="field">
        <label>اختر ملف CSV / Excel من جهازك</label>
        <input type="file" id="csvFileInput" accept=".csv,text/csv" style="padding:7px;">
      </div>

      <div id="importPreviewMount" style="margin-top:12px;"></div>

      <div class="actions-row" style="margin-top:16px;">
        <button class="btn btn-ghost" id="cancelImportBtn">إلغاء</button>
        <button class="btn btn-primary" id="processImportBtn" disabled>🚀 استيراد الأصناف إلى المخزن</button>
      </div>
    </div>
  `;

  document.body.appendChild(overlay);
  overlay.querySelector('#closeImportModal').onclick = ()=>overlay.remove();
  overlay.querySelector('#cancelImportBtn').onclick = ()=>overlay.remove();

  // Template download
  overlay.querySelector('#downloadImportTemplateBtn').onclick = ()=>{
    const headers = ['اسم الصنف','القسم','الباركود','الكمية','سعر الشراء','سعر البيع','سعر الجملة','مكان الرف','الموديلات المتوافقة'];
    const sampleRows = [
      ['شاشة لابتوب 15.6 LED FHD','صيانة','20260001',10,1200,1650,1450,'رف A-1','Dell G15, HP 15'],
      ['كاميرا مراقبة Hikvision 5MP','كاميرات','20260002',5,450,650,550,'رف C-3','-'],
      ['ماوس لاسلكي Logitech M170','إكسسوار','20260003',20,110,180,140,'رف E-2','-']
    ];
    downloadCSV('Inventory_Import_Template.csv', headers, sampleRows);
  };

  let parsedItems = [];
  const fileInput = overlay.querySelector('#csvFileInput');
  fileInput.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (evt)=>{
      const text = evt.target.result;
      const lines = text.split(/\r?\n/).filter(l=>l.trim());
      if(lines.length <= 1){ showToast('الملف فارغ أو لا يحتوي على بيانات كافية', 'error'); return; }

      parsedItems = [];
      for(let i=1; i<lines.length; i++){
        const cols = lines[i].split(',').map(c=>c.replace(/^["']|["']$/g,'').trim());
        if(cols[0]){
          parsedItems.push({
            ID: 'inv_' + Date.now() + '_' + i,
            Name: cols[0],
            Category: cols[1] || 'صيانة',
            Barcode: cols[2] || ('20' + String(Date.now()).slice(-8) + i),
            Quantity: Number(cols[3])||0,
            PurchasePrice: Number(cols[4])||0,
            SellPrice: Number(cols[5])||0,
            WholesalePrice: Number(cols[6])||0,
            ShelfLocation: cols[7] || '',
            CompatibleModels: cols[8] || '',
            MinStock: 2,
            Unit: 'قطعة'
          });
        }
      }

      const previewMount = overlay.querySelector('#importPreviewMount');
      previewMount.innerHTML = `
        <div style="background:var(--green-bg);color:var(--green-text);padding:8px 12px;border-radius:var(--radius-sm);font-size:12px;font-weight:700;margin-bottom:8px;">
          ✅ تم قراءة <b>${parsedItems.length}</b> صنف بنجاح وجاهز للاستيراد.
        </div>
      `;
      overlay.querySelector('#processImportBtn').disabled = parsedItems.length === 0;
    };
    reader.readAsText(file);
  };

  overlay.querySelector('#processImportBtn').onclick = async ()=>{
    const btn = overlay.querySelector('#processImportBtn');
    btn.disabled = true; btn.textContent = 'جارٍ الاستيراد...';
    for(const it of parsedItems){
      try{ await saveInventoryItemRemote(it); }catch(e){}
    }
    showToast(`تم استيراد ${parsedItems.length} صنف بنجاح إلى المخزن! 🎉`, 'success');
    overlay.remove();
    renderMain();
  };
}

function renderPosSell(main){
  const posSettings = getPosSettings();
  const cart = state.cart || [];
  if(!state.posState) {
    state.posState = {
      activeCategory: 'all',
      searchQuery: '',
      paymentMethod: 'cash',
      amountPaid: '',
      discountType: 'fixed',
      discountValue: 0,
      customerName: 'عميل زائر',
      customerPhone: '',
      notes: ''
    };
  }
  const ps = state.posState;

  // Financial calculations
  const subtotal = cart.reduce((s, c) => s + (Number(c.qty)||1) * (Number(c.price)||0), 0);
  const discountVal = Number(ps.discountValue) || 0;
  const discountAmount = ps.discountType === 'percent' 
    ? Math.round(subtotal * (discountVal / 100))
    : Math.min(subtotal, discountVal);
  const afterDiscount = Math.max(0, subtotal - discountAmount);
  const taxAmount = posSettings.enableTax ? Math.round(afterDiscount * (Number(posSettings.taxRate)||14) / 100) : 0;
  const grandTotal = afterDiscount + taxAmount;
  
  const currentPaid = ps.amountPaid !== '' ? Number(ps.amountPaid) : grandTotal;
  const changeDue = Math.max(0, currentPaid - grandTotal);

  // Filter Catalog
  const rawInventory = state.inventory || [];
  let filteredItems = [...rawInventory];

  if(ps.activeCategory === 'favorites'){

          ${[50, 100, 200, 500, 1000].filter(c => c >= grandTotal && c !== grandTotal).slice(0, 3).map(amt => `
            <button class="btn btn-ghost btn-xs pos-cash-preset-chip" data-cashamt="${amt}" style="padding:2px 8px;font-size:10.5px;">${amt} ج.م</button>
          `).join('')}

        <!-- Final Checkout Buttons -->

            <span>✅ إتمام البيع وطباعة البون السريع</span>
          </button>
          <button class="btn btn-blue" id="completeSaleWithTaxInvBtn" style="padding:9px;font-weight:800;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:6px;" ${cart.length===0?'disabled':''}>
            <span>📄 إتمام البيع وإصدار فاتورة ضريبية</span>
          </button>

      </div>

    </div>

  // Attach POS Handlers
  attachPosTerminalEvents(main, grandTotal, subtotal);
}

function attachPosTerminalEvents(main, grandTotal, subtotal){
  const ps = state.posState;
  const cart = state.cart || [];
  const posSettings = getPosSettings();

  // Category change
  main.querySelectorAll('[data-poscat]').forEach(chip => {
    chip.onclick = ()=>{
      ps.activeCategory = chip.dataset.poscat;
      renderPosSell(main);
    };
  });

  // Touch Tiles click (Regular Items)
  main.querySelectorAll('[data-positemid]').forEach(tile => {
    tile.onclick = async ()=>{
      const itemId = tile.dataset.positemid;
      const item = (state.inventory||[]).find(x => String(x.ID||x.id) === String(itemId));
      if(!item) return;

      if(Number(item.Quantity) <= 0 && !posSettings.allowNegativeStock){
        showToast(`الصنف "${item.Name}" غير متوفر حالياً بالمخزن`, 'error');
        return;
      }

      await addItemToCart(item.ID||item.id, 1, main);
      showToast(`+ ${item.Name}`, 'info');
    };
  });

  // Touch Tiles click (Quick Services)
  main.querySelectorAll('[data-quickserviceidx]').forEach(tile => {
    tile.onclick = ()=>{
      const idx = Number(tile.dataset.quickserviceidx);
      const srv = (posSettings.quickServices||[])[idx];
      if(!srv) return;

      addServiceToCart(srv.name, srv.price, main);
      showToast(`+ ${srv.name}`, 'info');
    };
  });

  // Search input & Scanner Enter
  const barcodeInp = document.getElementById('posBarcodeInput');
  if(barcodeInp){
    barcodeInp.oninput = (e)=>{
      ps.searchQuery = e.target.value;
      // Auto-filter if non-enter typing
      if(!e.target.value.endsWith('\n')){
        // Debounced or live re-render
        renderPosSell(main);
        const refoc = document.getElementById('posBarcodeInput');
        if(refoc){ refoc.focus(); refoc.setSelectionRange(refoc.value.length, refoc.value.length); }
      }
    };

    barcodeInp.onkeydown = async (e)=>{
      if(e.key === 'Enter'){
        const code = barcodeInp.value.trim();
        if(!code) return;
        
        // Exact barcode match first
        const it = (state.inventory||[]).find(x => String(x.Barcode||'').trim() === code || String(x.ID||x.id) === code);
        if(it){
          if(Number(it.Quantity) <= 0 && !posSettings.allowNegativeStock){
            showToast('الصنف غير متاح في المخزون', 'error');
            return;
          }
          ps.searchQuery = '';
          await addItemToCart(it.ID||it.id, 1, main);
          showToast(`تم مسح وإضافة: ${it.Name}`, 'success');
        } else {
          // If 1 item filtered
          const filtered = (state.inventory||[]).filter(x => (x.Name&&x.Name.toLowerCase().includes(code.toLowerCase())));
          if(filtered.length === 1){
            ps.searchQuery = '';
            await addItemToCart(filtered[0].ID||filtered[0].id, 1, main);
            showToast(`تمت إضافة: ${filtered[0].Name}`, 'success');
          } else {
            showToast('لا يوجد صنف مطابق لهذا الباركود', 'error');
          }
        }
      }
    };
  }

  const clearSearchBtn = document.getElementById('posClearSearchBtn');
  if(clearSearchBtn){
    clearSearchBtn.onclick = ()=>{
      ps.searchQuery = '';
      renderPosSell(main);
    };
  }

  // Cart Quantities & Delete Handlers
  main.querySelectorAll('[data-cartinc]').forEach(btn => {
    btn.onclick = ()=>{
      const idx = Number(btn.dataset.cartinc);
      if(cart[idx]){
        cart[idx].qty = (Number(cart[idx].qty)||1) + 1;
        renderPosSell(main);
      }
    };
  });

  main.querySelectorAll('[data-cartdec]').forEach(btn => {
    btn.onclick = ()=>{
      const idx = Number(btn.dataset.cartdec);
      if(cart[idx]){
        if(cart[idx].qty > 1){
          cart[idx].qty = Number(cart[idx].qty) - 1;
        } else {
          cart.splice(idx, 1);
        }
        renderPosSell(main);
      }
    };
  });

  main.querySelectorAll('[data-cartdel]').forEach(btn => {
    btn.onclick = ()=>{
      const idx = Number(btn.dataset.cartdel);
      cart.splice(idx, 1);
      renderPosSell(main);
    };
  });

  main.querySelectorAll('[data-cartqtyidx]').forEach(inp => {
    inp.onchange = ()=>{
      const idx = Number(inp.dataset.cartqtyidx);
      const newQty = Number(inp.value);
      if(!newQty || newQty <= 0) cart.splice(idx, 1);
      else cart[idx].qty = newQty;
      renderPosSell(main);
    };
  });

  // Customer info inputs
  const cNameInp = document.getElementById('posCustName');
  if(cNameInp) cNameInp.oninput = (e)=>{ ps.customerName = e.target.value; };
  const cPhoneInp = document.getElementById('posCustPhone');
  if(cPhoneInp) cPhoneInp.oninput = (e)=>{ ps.customerPhone = e.target.value; };

  // Discount Presets & Inputs
  main.querySelectorAll('.pos-disc-chip').forEach(chip => {
    chip.onclick = ()=>{
      ps.discountValue = Number(chip.dataset.disc);
      ps.discountType = 'percent';
      renderPosSell(main);
    };
  });

  const discInp = document.getElementById('posDiscountInput');
  if(discInp){
    discInp.oninput = (e)=>{
      ps.discountValue = Number(e.target.value) || 0;
      renderPosSell(main);
    };
  }

  const discTypeSel = document.getElementById('posDiscountType');
  if(discTypeSel){
    discTypeSel.onchange = (e)=>{
      ps.discountType = e.target.value;
      renderPosSell(main);
    };
  }

  // Payment Method Selection
  main.querySelectorAll('[data-pospaymethod]').forEach(btn => {
    btn.onclick = ()=>{
      ps.paymentMethod = btn.dataset.pospaymethod;
      renderPosSell(main);
    };
  });

  // Amount Paid input
  const amtPaidInp = document.getElementById('posAmountPaidInput');
  if(amtPaidInp){
    amtPaidInp.oninput = (e)=>{
      ps.amountPaid = e.target.value;
      renderPosSell(main);
    };
  }

  // Quick Cash Chips
  main.querySelectorAll('.pos-cash-preset-chip').forEach(chip => {
    chip.onclick = ()=>{
      ps.amountPaid = Number(chip.dataset.cashamt);
      renderPosSell(main);
    };
  });

  // Top Buttons
  const clearTopBtn = document.getElementById('posClearCartTopBtn');
  if(clearTopBtn){
    clearTopBtn.onclick = ()=>{
      if(confirm('هل تريد بالتأكيد إفراغ السلة؟')){
        state.cart = [];
        renderPosSell(main);
      }
    };
  }

  const goToSettingsBtn = document.getElementById('posGoToSettingsBtn');
  if(goToSettingsBtn){
    goToSettingsBtn.onclick = ()=>{
      state.currentSection = 'settings';
      state.settingsTab = 'pos';
      render();
    };
  }

  // Complete Sale Logic
  async function processSale(isTaxInvoice){
    if(!cart.length){ showToast('السلة فارغة', 'error'); return; }

    const customerName = (ps.customerName || 'عميل زائر').trim();
    const customerPhone = (ps.customerPhone || '').trim();
    const payMethodObj = (posSettings.paymentMethods||[]).find(p => p.id === ps.paymentMethod) || { name: 'نقدي' };
    const payMethodName = payMethodObj.name || 'نقدي';

    const btn = document.getElementById(isTaxInvoice ? 'completeSaleWithTaxInvBtn' : 'completeSaleBtn');
    if(btn){ btn.disabled = true; btn.textContent = 'جارٍ تسجيل العملية...'; }

    try {
      // Adjust inventory quantities
      for(const c of cart){
        if(c.itemId && !String(c.itemId).startsWith('srv_')){
          await adjustInventoryQtyRemote(c.itemId, -c.qty);
        }
      }

      const itemsSummary = cart.map(c => `${c.name} × ${c.qty} (${(c.qty*c.price).toLocaleString()} ج.م)`).join('، ');
      const itemsJson = JSON.stringify(cart.map(c => ({ name: c.name, qty: c.qty, price: c.price, itemId: c.itemId })));
      
      const paidAmount = ps.amountPaid !== '' ? Number(ps.amountPaid) : grandTotal;
      const saleRes = await saveSaleRemote(itemsSummary, itemsJson, grandTotal, customerName, customerPhone, payMethodName, paidAmount);
      
      showToast('تمت عملية البيع بنجاح ✅', 'success');

      const cartSnapshot = [...cart];
      const saleData = saleRes.sale || {
        ID: 's_' + Date.now(),
        Date: new Date().toISOString().slice(0,10),
        Total: grandTotal,
        AmountPaid: paidAmount,
        PaymentMethod: payMethodName,
        CustomerName: customerName,
        CustomerPhone: customerPhone
      };

      // Reset Cart and State
      state.cart = [];
      state.posState.amountPaid = '';
      state.posState.discountValue = 0;
      state.posState.searchQuery = '';
      renderPosSell(main);

      if(isTaxInvoice){
        convertSaleToInvoice(saleData.ID);
      } else {
        if(posSettings.autoPrintReceipt !== false){
          openSalePrint(saleData, cartSnapshot, { subtotal, discountAmount, taxAmount, grandTotal, paidAmount, changeDue, payMethodName });
        }
      }
    } catch(e) {
      showToast('تم تسجيل البيع محلياً', 'info');
      if(btn) btn.disabled = false;
    }
  }

  const completeBtn = document.getElementById('completeSaleBtn');
  if(completeBtn) completeBtn.onclick = ()=>processSale(false);
  const completeTaxBtn = document.getElementById('completeSaleWithTaxInvBtn');
  if(completeTaxBtn) completeTaxBtn.onclick = ()=>processSale(true);
}

async function addItemToCart(itemId, qty, main){
  if(!state.cart) state.cart = [];
  const item = (state.inventory||[]).find(x => String(x.ID||x.id) === String(itemId));
  if(!item) return;

  const existing = state.cart.find(c => String(c.itemId) === String(itemId));
  if(existing){
    existing.qty += qty;
  } else {
    state.cart.push({
      itemId: item.ID || item.id,
      name: item.Name || item.name,
      qty: qty,
      price: Number(item.SellPrice || item.PurchasePrice || item.price || 0),
      cost: Number(item.PurchasePrice || item.cost || 0)
    });
  }
  renderPosSell(main);
}

function addServiceToCart(serviceName, servicePrice, main){
  if(!state.cart) state.cart = [];
  const srvId = 'srv_' + serviceName;
  const existing = state.cart.find(c => c.itemId === srvId);
  if(existing){
    existing.qty += 1;
  } else {
    state.cart.push({
      itemId: srvId,
      name: serviceName,
      qty: 1,
      price: Number(servicePrice) || 0,
      cost: 0
    });
  }
  renderPosSell(main);
}

      <!-- Meta info -->
      <div style="display:flex;justify-content:space-between;font-size:10px;margin-top:6px;text-align:right;">

function convertSaleToInvoice(saleId){
  const s = state.sales.find(x => x.ID === saleId) || (saleId.startsWith('s_') ? { ID: saleId, Date: new Date().toISOString().slice(0,10), Total: 0 } : null);
  if(!s){ showToast('تعذر العثور على عملية البيع', 'error'); return; }

  // Check if this sale already has an invoice issued
  const existing = state.invoices.find(inv => inv.ReferenceType==='POS' && (inv.ReferenceID===s.ID || inv.ReferenceID===s.ID.slice(-8)));
  if(existing){
    if(confirm(`تم إصدار فاتورة ضريبية سابقة لهذه العملية برقم (${existing.InvoiceNumber}). هل ترغب في فتح الفاتورة المسجلة؟`)){
      openInvoiceModal(existing);
      return;
    }
  }

  // Parse items
  let items = [];
  if(s.ItemsJSON){
    try {
      const parsed = typeof s.ItemsJSON==='string' ? JSON.parse(s.ItemsJSON) : s.ItemsJSON;
      if(Array.isArray(parsed)){
        items = parsed.map(p=>({
          Name: p.name || p.Name || 'صنف مباع',
          Qty: Number(p.qty || p.Qty || 1),
          Price: Number(p.price || p.Price || 0),
          Total: Number(p.qty || p.Qty || 1) * Number(p.price || p.Price || 0)
        }));
      }
    }catch(e){}
  }
  if(!items.length && s.ItemsSummary){
    items = [{
      Name: s.ItemsSummary,
      Qty: 1,
      Price: Number(s.Total||0),
      Total: Number(s.Total||0)
    }];
  }

  const subtotal = items.reduce((sum,it)=>sum+Number(it.Total||0),0) || Number(s.Total||0);
  const paid = Number(s.AmountPaid!=null ? s.AmountPaid : s.Total);
  const remaining = Math.max(0, subtotal - paid);

  const prefilled = {
    ID: 'inv_' + Date.now(),
    InvoiceNumber: 'INV-' + new Date().getFullYear() + '-' + String(Date.now()).slice(-4),
    Date: cleanDate(s.Date) || new Date().toISOString().slice(0,10),

    CustomerName: s.CustomerName || 'عميل زائر',

    CustomerTaxNumber: '',
    CustomerAddress: '',
    Items: items,

    Subtotal: subtotal,
    TaxPercent: 0,
    TaxAmount: 0,
    Discount: 0,

    AmountPaid: paid,

}

function exportSalesToExcel(sales){
  if(!sales || !sales.length){ showToast('لا توجد مبيعات للتصدير', 'error'); return; }
  const headers = ['رقم العملية','التاريخ','اسم العميل','الهاتف','الأصناف','الإجمالي','المدفوع','طريقة الدفع'];
  const rows = sales.map(s=>[
    `"${s.ID.slice(-8)}"`, cleanDate(s.Date), `"${s.CustomerName||'عميل زائر'}"`, `"${s.CustomerPhone||''}"`,
    `"${(s.ItemsSummary||'').replace(/"/g, '""')}"`, s.Total||0, s.AmountPaid!=null?s.AmountPaid:s.Total, `"${s.PaymentMethod||'نقدي'}"`
  ]);
  downloadCSV(`POS_Sales_${new Date().toISOString().slice(0,10)}.csv`, headers, rows);
}

function renderTreeNodes(mount, filterQ){
  const accounts = [...state.accounts].sort((a,b)=>String(a.Code).localeCompare(String(b.Code), undefined, {numeric:true}));
  
  function getLevel(code){
    const len = String(code).length;
    if(len===1) return 1;
    if(len===2) return 2;
    if(len<=4) return 3;
    return 4;
  }

  let visible = accounts;
  if(filterQ){
    visible = accounts.filter(a=>String(a.Code).includes(filterQ) || a.Name.toLowerCase().includes(filterQ));
  }

  if(!visible.length){
    mount.innerHTML = '<div class="empty">لا توجد حسابات مطابقة للبحث.</div>';
    return;
  }

  mount.innerHTML = visible.map(acc=>{
    const lvl = getLevel(acc.Code);
    const stats = getAccountStats(acc.Code);
    const hasChildren = accounts.some(a=>String(a.ParentCode)===String(acc.Code));

    return `
      <div class="tree-node level-${lvl}">
        <div class="tree-node-title">
          <span style="font-size:14px;">${lvl===1?'📁':(hasChildren?'📂':'📄')}</span>
          <span class="account-code mono">${acc.Code}</span>
          <span style="font-weight:${lvl<=2?'800':'600'};font-size:13px;color:var(--ink);">${acc.Name}</span>
          <span class="nature-pill ${stats.nature==='مدين'?'debit':'credit'}">${stats.nature}</span>
          ${acc.Description ? `<span style="font-size:11px;color:var(--ink-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;">(${acc.Description})</span>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:12px;">
          <span class="mono font-bold" style="font-size:13.5px;color:${stats.netBalance<0?'var(--red)':'var(--ink)'};">${stats.netBalance.toLocaleString()} ج.م</span>
          <div style="display:flex;gap:4px;">
            <button class="btn btn-xs btn-blue" data-accledger="${acc.Code}" title="كشف الحساب">📊 كشف</button>
            <button class="btn btn-xs btn-ghost" data-accsub="${acc.Code}" title="إضافة حساب فرعي">➕ فرعي</button>
            <button class="btn btn-xs btn-ghost" data-accedit="${acc.Code}" title="تعديل">✏️</button>
            ${(!hasChildren && state.user.role==='admin') ? `<button class="btn btn-xs btn-red" data-accdel="${acc.Code}" title="حذف">🗑️</button>` : ''}
          </div>
        </div>
      </div>
    `;
  }).join('');

  mount.querySelectorAll('[data-accledger]').forEach(btn=>{
    btn.onclick = ()=>{
      const acc = state.accounts.find(a=>String(a.Code)===btn.dataset.accledger);
      if(acc) openAccountLedgerModal(acc);
    };
  });
  mount.querySelectorAll('[data-accsub]').forEach(btn=>{
    btn.onclick = ()=>{ openAccountModal(btn.dataset.accsub); };
  });
  mount.querySelectorAll('[data-accedit]').forEach(btn=>{
    btn.onclick = ()=>{
      const acc = state.accounts.find(a=>String(a.Code)===btn.dataset.accedit);
      if(acc) openAccountModal(null, acc);
    };
  });
  mount.querySelectorAll('[data-accdel]').forEach(btn=>{
    btn.onclick = async ()=>{
      if(!confirm(`هل تريد حذف الحساب (${btn.dataset.accdel})؟`)) return;
      try{
        await deleteAccountRemote(btn.dataset.accdel);
        showToast('تم حذف الحساب بنجاح', 'success');
        renderChartOfAccounts(document.getElementById('main'));
      }catch(e){ showToast('تعذر الحذف: '+e.message, 'error'); }
    };
  });
}

function openAccountModal(parentCode, editAcc){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const isEdit = !!editAcc;

  // Auto suggest next code
  let suggestedCode = '';
  let parentAcc = null;
  if(parentCode){
    parentAcc = state.accounts.find(a=>String(a.Code)===String(parentCode));
    const siblings = state.accounts.filter(a=>String(a.ParentCode)===String(parentCode));
    suggestedCode = String(parentCode) + (siblings.length < 9 ? '0' + (siblings.length+1) : (siblings.length+1));
  }

  const types = ['الأصول', 'الخصوم', 'حقوق الملكية', 'الإيرادات', 'المصروفات'];

  overlay.innerHTML = `
    <div class="modal-content" style="max-width:500px;">
      <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px;">
        <h3 style="margin:0;font-size:16px;">${isEdit ? '✏️ تعديل الحساب: '+editAcc.Name : '➕ إضافة حساب جديد للدليل'}</h3>
        <button class="btn btn-ghost btn-xs" id="closeAccModal">✕</button>
      </div>

      <div class="field"><label>الحساب الرئيسي التابع له</label>
        <select id="mAccParent" ${isEdit?'disabled':''}>
          <option value="">-- حساب جذري رئيسي --</option>
          ${state.accounts.map(a=>`<option value="${a.Code}" ${(parentCode===a.Code || (editAcc && editAcc.ParentCode===a.Code))?'selected':''}>${a.Code} - ${a.Name} (${a.Type})</option>`).join('')}
        </select>
      </div>

      <div class="grid2">
        <div class="field"><label>كود الحساب *</label><input id="mAccCode" value="${isEdit?editAcc.Code:suggestedCode}" placeholder="مثال: 1105" ${isEdit?'disabled':''}></div>
        <div class="field"><label>نوع الحساب</label>
          <select id="mAccType">
            ${types.map(t=>`<option ${(parentAcc && parentAcc.Type===t)||(editAcc && editAcc.Type===t)?'selected':''}>${t}</option>`).join('')}
          </select>
        </div>
      </div>

      <div class="field"><label>اسم الحساب *</label><input id="mAccName" value="${isEdit?editAcc.Name:''}" placeholder="مثال: البنك الأهلي المصري"></div>

      <div class="grid2">
        <div class="field"><label>طبيعة الحساب</label>
          <select id="mAccNature">
            <option value="مدين" ${(editAcc && editAcc.Nature==='مدين')?'selected':''}>مدين (Debit)</option>
            <option value="دائن" ${(editAcc && editAcc.Nature==='دائن')?'selected':''}>دائن (Credit)</option>
          </select>
        </div>
        <div class="field"><label>الرصيد الافتتاحي (ج.م)</label><input id="mAccBal" type="number" value="${isEdit?(editAcc.Balance||0):0}"></div>
      </div>

      <div class="field"><label>وصف / ملاحظات</label><input id="mAccDesc" value="${isEdit?(editAcc.Description||''):''}" placeholder="وصف الحساب أو الغرض منه..."></div>

      <div class="actions-row">
        <button class="btn btn-ghost" id="cancelAccModal">إلغاء</button>
        <button class="btn btn-primary" id="saveAccModalBtn">💾 حفظ الحساب</button>
      </div>
    </div>
  `;

  document.body.appendChild(overlay);
  overlay.querySelector('#closeAccModal').onclick = ()=>overlay.remove();
  overlay.querySelector('#cancelAccModal').onclick = ()=>overlay.remove();

  overlay.querySelector('#mAccParent').onchange = (e)=>{
    const p = state.accounts.find(a=>String(a.Code)===e.target.value);
    if(p){
      overlay.querySelector('#mAccType').value = p.Type;
      overlay.querySelector('#mAccNature').value = p.Nature;
      const sibs = state.accounts.filter(a=>String(a.ParentCode)===String(p.Code));
      overlay.querySelector('#mAccCode').value = String(p.Code) + (sibs.length < 9 ? '0' + (sibs.length+1) : (sibs.length+1));
    }
  };

  overlay.querySelector('#saveAccModalBtn').onclick = async ()=>{
    const code = overlay.querySelector('#mAccCode').value.trim();
    const name = overlay.querySelector('#mAccName').value.trim();
    const parent = overlay.querySelector('#mAccParent').value;
    const type = overlay.querySelector('#mAccType').value;
    const nature = overlay.querySelector('#mAccNature').value;
    const balance = Number(overlay.querySelector('#mAccBal').value)||0;
    const desc = overlay.querySelector('#mAccDesc').value.trim();

    if(!code || !name){ showToast('يرجى كتابة كود الحساب واسم الحساب', 'error'); return; }
    const accObj = {Code:code, Name:name, ParentCode:parent, Type:type, Nature:nature, Balance:balance, Description:desc};

    try{
      await saveAccountRemote(accObj);
      overlay.remove();
      showToast('تم حفظ الحساب بنجاح', 'success');
      renderChartOfAccounts(document.getElementById('main'));
    }catch(e){ showToast('تم الحفظ محلياً: '+e.message, 'info'); }
  };
}

/* ---------------- Account Ledger (كشف الحساب) ---------------- */
function openAccountLedgerModal(acc){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';

  // Gather all transactions
  const lines = [];
  (state.journalEntries||[]).forEach(je=>{
    (je.Lines||[]).forEach(l=>{
      if(String(l.AccountCode).trim()===String(acc.Code).trim()){
        lines.push({
          date: cleanDate(je.Date),
          entryNum: je.EntryNumber||je.ID,
          desc: l.Notes || je.Description,
          debit: Number(l.Debit||0),
          credit: Number(l.Credit||0)
        });
      }
    });
  });

  lines.sort((a,b)=>new Date(a.date) - new Date(b.date));

  let runningBal = Number(acc.Balance||0);
  const rowsWithBal = lines.map(l=>{
    if(acc.Nature==='مدين') runningBal += (l.debit - l.credit);
    else runningBal += (l.credit - l.debit);
    return {...l, runningBal};
  });

  overlay.innerHTML = `
    <div class="modal-content" style="max-width:750px;">
      <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px;">
        <div>
          <h3 style="margin:0;font-size:16px;">📊 كشف حساب: <span style="color:var(--primary);">${acc.Name}</span> (<span class="mono">${acc.Code}</span>)</h3>
          <div style="font-size:11.5px;color:var(--ink-secondary);margin-top:2px;">طبيعة الحساب: <b>${acc.Nature}</b> | الرصيد الافتتاحي: <span class="mono font-bold">${acc.Balance||0} ج.م</span></div>
        </div>
        <button class="btn btn-ghost btn-xs" id="closeLedgerModal">✕ إغلاق</button>
      </div>

      <div class="stat-grid" style="grid-template-columns: repeat(3, 1fr);margin-bottom:14px;">
        <div class="stat-card blue"><div class="num mono">${lines.reduce((s,l)=>s+l.debit,0).toLocaleString()} ج.م</div><div class="lbl">إجمالي حركات المدين</div></div>
        <div class="stat-card green"><div class="num mono">${lines.reduce((s,l)=>s+l.credit,0).toLocaleString()} ج.م</div><div class="lbl">إجمالي حركات الدائن</div></div>
        <div class="stat-card purple"><div class="num mono">${runningBal.toLocaleString()} ج.م</div><div class="lbl">الرصيد الختامي الحالي</div></div>
      </div>

      ${rowsWithBal.length===0 ? '<div class="empty">لا توجد حركات مسجلة على هذا الحساب بعد.</div>' : `
      <div class="table-wrap" style="max-height:380px;">
        <table>
          <thead><tr><th>التاريخ</th><th>رقم القيد</th><th>البيان</th><th>مدين</th><th>دائن</th><th>الرصيد التراكمي</th></tr></thead>
          <tbody>
            ${rowsWithBal.map(r=>`<tr>
              <td>${r.date}</td>
              <td class="mono font-bold" style="color:var(--primary);">${r.entryNum}</td>
              <td>${r.desc}</td>
              <td class="mono ${r.debit>0?'font-bold':''}" style="color:${r.debit>0?'var(--blue)':'inherit'};">${r.debit||'-'}</td>
              <td class="mono ${r.credit>0?'font-bold':''}" style="color:${r.credit>0?'var(--green)':'inherit'};">${r.credit||'-'}</td>
              <td class="mono font-bold">${r.runningBal.toLocaleString()} ج.م</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`}

      <div class="actions-row" style="margin-top:14px;">
        <button class="btn btn-ghost btn-sm" id="exportLedgerExcelBtn">📥 تصدير كشف الحساب Excel</button>
        <button class="btn btn-primary btn-sm" id="doneLedgerBtn">تم</button>
      </div>
    </div>
  `;

  document.body.appendChild(overlay);
  overlay.querySelector('#closeLedgerModal').onclick = ()=>overlay.remove();
  overlay.querySelector('#doneLedgerBtn').onclick = ()=>overlay.remove();
  overlay.querySelector('#exportLedgerExcelBtn').onclick = ()=>{
    const headers = ['التاريخ','رقم القيد','البيان','مدين','دائن','الرصيد'];
    const rows = rowsWithBal.map(r=>[r.date, r.entryNum, `"${r.desc}"`, r.debit, r.credit, r.runningBal]);
    downloadCSV(`Ledger_${acc.Code}_${acc.Name}.csv`, headers, rows);
  };
}

function exportAccountsToExcel(){
  const headers = ['كود الحساب','اسم الحساب','النوع','الحساب الرئيسي','الطبيعة','الرصيد الحالي','الوصف'];
  const rows = state.accounts.map(a=>{
    const stats = getAccountStats(a.Code);
    return [a.Code, `"${a.Name}"`, a.Type, a.ParentCode||'-', a.Nature, stats.netBalance, `"${a.Description||''}"`];
  });
  downloadCSV(`Chart_Of_Accounts_${new Date().toISOString().slice(0,10)}.csv`, headers, rows);
}

function openManualJournalModal(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';

  let lines = [
    {accountCode:'', debit:0, credit:0, notes:''},
    {accountCode:'', debit:0, credit:0, notes:''}
  ];

  function renderModalContent(){
    const totalDebit = lines.reduce((s,l)=>s+Number(l.debit||0),0);
    const totalCredit = lines.reduce((s,l)=>s+Number(l.credit||0),0);
    const isBalanced = totalDebit > 0 && totalDebit === totalCredit;

    overlay.innerHTML = `
      <div class="modal-content" style="max-width:760px;">
        <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px;">
          <h3 style="margin:0;font-size:16px;">➕ إضافة قيد يومية يدوي متوازن</h3>
          <button class="btn btn-ghost btn-xs" id="closeJournalModal">✕</button>
        </div>

        <div class="grid2">
          <div class="field"><label>التاريخ *</label><input id="jeDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
          <div class="field"><label>البيان العام للقيد *</label><input id="jeDesc" placeholder="مثال: تسوية جردية، سداد مصروفات نقدية..."></div>
        </div>

        <label style="margin:10px 0 6px;">بنود القيد (الطرف المدين والطرف الدائن):</label>
        <div id="journalLinesMount">
          ${lines.map((l,i)=>`
            <div class="journal-line-row">
              <select data-jacc="${i}">
                <option value="">-- اختر الحساب --</option>
                ${state.accounts.map(a=>`<option value="${a.Code}" ${l.accountCode===a.Code?'selected':''}>${a.Code} - ${a.Name}</option>`).join('')}
              </select>
              <input type="number" placeholder="مدين" value="${l.debit||''}" data-jdebit="${i}">
              <input type="number" placeholder="دائن" value="${l.credit||''}" data-jcredit="${i}">
              <input placeholder="بيان السطر..." value="${l.notes||''}" data-jnotes="${i}">
              <button class="btn btn-xs btn-red" data-jdel="${i}" style="height:34px;">✕</button>
            </div>
          `).join('')}
        </div>

        <button class="btn btn-ghost btn-xs" id="addJournalLineBtn" style="margin-top:6px;">➕ إضافة سطر جديد</button>

        <div class="fin-box" style="margin:16px 0;">
          <div class="fin-cell"><div class="l">إجمالي المدين</div><div class="v mono">${totalDebit} ج.م</div></div>
          <div class="fin-cell"><div class="l">إجمالي الدائن</div><div class="v mono">${totalCredit} ج.م</div></div>
          <div class="fin-cell"><div class="l">حالة التوازن</div><div class="v" style="color:${isBalanced?'var(--green)':'var(--red)'};font-size:12px;">${isBalanced?'✅ متوازن ومطابق':'❌ غير متوازن'}</div></div>
        </div>

        <div class="actions-row">
          <button class="btn btn-ghost" id="cancelJournalModal">إلغاء</button>
          <button class="btn btn-primary" id="saveJournalModalBtn" ${!isBalanced?'disabled':''}>💾 ترحيل وحفظ القيد</button>
        </div>
      </div>
    `;

    overlay.querySelector('#closeJournalModal').onclick = ()=>overlay.remove();
    overlay.querySelector('#cancelJournalModal').onclick = ()=>overlay.remove();

    overlay.querySelector('#addJournalLineBtn').onclick = ()=>{
      lines.push({accountCode:'', debit:0, credit:0, notes:''});
      renderModalContent();
    };

    overlay.querySelectorAll('[data-jacc]').forEach(sel=>{
      sel.onchange = (e)=>{ lines[Number(sel.dataset.jacc)].accountCode = e.target.value; };
    });
    overlay.querySelectorAll('[data-jdebit]').forEach(inp=>{
      inp.oninput = (e)=>{
        lines[Number(inp.dataset.jdebit)].debit = Number(e.target.value)||0;
        if(Number(e.target.value)>0) lines[Number(inp.dataset.jdebit)].credit = 0;
      };
      inp.onblur = ()=>renderModalContent();
    });
    overlay.querySelectorAll('[data-jcredit]').forEach(inp=>{
      inp.oninput = (e)=>{
        lines[Number(inp.dataset.jcredit)].credit = Number(e.target.value)||0;
        if(Number(e.target.value)>0) lines[Number(inp.dataset.jcredit)].debit = 0;
      };
      inp.onblur = ()=>renderModalContent();
    });
    overlay.querySelectorAll('[data-jnotes]').forEach(inp=>{
      inp.oninput = (e)=>{ lines[Number(inp.dataset.jnotes)].notes = e.target.value; };
    });
    overlay.querySelectorAll('[data-jdel]').forEach(btn=>{
      btn.onclick = ()=>{
        if(lines.length<=2){ showToast('يجب أن يحتوي القيد على سطرين على الأقل', 'error'); return; }
        lines.splice(Number(btn.dataset.jdel), 1);
        renderModalContent();
      };
    });

    const saveBtn = overlay.querySelector('#saveJournalModalBtn');
    if(saveBtn) saveBtn.onclick = async ()=>{
      const desc = overlay.querySelector('#jeDesc').value.trim();
      const date = overlay.querySelector('#jeDate').value;
      if(!desc){ showToast('اكتب بيان القيد', 'error'); return; }
      
      const formattedLines = lines.map(l=>{
        const a = state.accounts.find(x=>x.Code===l.accountCode);
        return {
          AccountCode: l.accountCode,
          AccountName: a ? a.Name : '',
          Debit: Number(l.debit||0),
          Credit: Number(l.credit||0),
          Notes: l.notes || ''
        };
      });

      try{
        await saveJournalEntryRemote({
          Date: date,
          Description: desc,
          ReferenceType: 'Manual',
          Lines: formattedLines,
          TotalDebit: totalDebit,
          TotalCredit: totalCredit
        });
        overlay.remove();
        showToast('تم ترحيل وحفظ القيد اليومي بنجاح ✅', 'success');
        renderJournalEntries(document.getElementById('main'));
      }catch(e){ showToast('تم حفظ القيد محلياً', 'info'); }
    };
  }

  document.body.appendChild(overlay);
  renderModalContent();
}

/* ---------------- Users Management & Screen Customization Engine ---------------- */
function exportUsersToExcel(list){
  const rows = (list || state.users || []).map((u, idx) => {
    const secs = Array.isArray(u.Sections) ? u.Sections : String(u.Sections||'').split(',').map(s=>s.trim()).filter(Boolean);
    const secsLabels = secs.map(s => (SECTION_INFO[s]||{}).label || s).join(' + ');
    return {
      '#': idx + 1,
      'اسم المستخدم': u.Name,
      'المسمى / الدور': u.Role === 'admin' ? 'مدير عام' : (u.Role === 'cashier' ? 'كاشير' : (u.Role === 'technician' ? 'فني صيانة' : (u.Role === 'accountant' ? 'محاسب' : (u.Role === 'storekeeper' ? 'أمين مخزن' : u.Role)))),
      'الشاشات المسموحة': secsLabels,
      'عدد الشاشات': secs.length,
      'ملاحظات': u.Notes || ''
    };
  });
  exportToExcel(rows, `Users_Permissions_${new Date().toISOString().slice(0,10)}`);
}

    { key: 'settings', icon: '⚙️', label: 'الإعدادات وتخصيص النظام', desc: 'المظهر، الثيمات، تصنيفات الأجهزة، رسائل واتساب، وبنود الضمان' }

  overlay.className = 'modal-overlay';

  overlay.innerHTML = `

      <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px;">
        <div>

            <span>${isEdit ? '✏️ تعديل المستخدم وتخصيص الصلاحيات' : '➕ إضافة مستخدم جديد وتخصيص الصلاحيات'}</span>
          </h3>
          <div style="font-size:12px;color:var(--ink-secondary);margin-top:3px;">
            تحديد بيانات الدخول وتعيين الشاشات والأقسام المسموح للمستخدم برؤيتها والعمل عليها
          </div>
        </div>
        <button class="btn btn-ghost btn-xs" id="closeUserModal">✕</button>
      </div>

      <div class="grid2" style="margin-bottom:14px;">
        <div class="field">
          <label>اسم المستخدم (لتسجيل الدخول) *</label>
          <input id="uModalName" value="${editUser ? editUser.Name : ''}" placeholder="مثال: أحمد الكاشير" autofocus ${isEdit && editUser.Name==='admin' ? 'readonly style="background:var(--paper3);"' : ''}>
        </div>
        <div class="field">
          <label>كلمة المرور *</label>
          <input id="uModalPassword" value="${editUser ? editUser.Password : ''}" placeholder="كلمة المرور">
        </div>
      </div>

      <div class="grid2" style="margin-bottom:14px;">
        <div class="field">
          <label>الدور الوظيفي / المسمى *</label>
          <select id="uModalRole">
            <option value="admin" ${editUser && editUser.Role==='admin'?'selected':''}>👑 مدير عام (كامل الصلاحيات)</option>
            <option value="cashier" ${editUser && editUser.Role==='cashier'?'selected':''}>🧾 كاشير ومبيعات (نقطة بيع)</option>
            <option value="technician" ${editUser && editUser.Role==='technician'?'selected':''}>🛠️ فني صيانة واستلام</option>
            <option value="accountant" ${editUser && editUser.Role==='accountant'?'selected':''}>💰 محاسب مالي وإداري</option>
            <option value="storekeeper" ${editUser && editUser.Role==='storekeeper'?'selected':''}>📦 أمين مخزن ومشتريات</option>
            <option value="custom" ${editUser && (!['admin','cashier','technician','accountant','storekeeper'].includes(editUser.Role))?'selected':''}>⚙️ مخصص (تحديد يدوي للشاشات)</option>
          </select>
        </div>
        <div class="field">
          <label>ملاحظات إضافية</label>
          <input id="uModalNotes" value="${editUser ? (editUser.Notes||'') : ''}" placeholder="ملاحظات حول الموظف أو الفرع">
        </div>
      </div>

      <!-- Section Permissions Box -->
      <div class="card" style="padding:14px 16px;background:var(--paper3);border:1px solid var(--line);margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
          <div>
            <h4 id="uModalSecCountTitle" style="margin:0;font-size:13.5px;font-weight:900;">🖥️ الشاشات والأقسام المسموح بها (${selectedSections.length} من 7 مفعّلة)</h4>
            <div style="font-size:11.5px;color:var(--ink-secondary);margin-top:2px;">اختر الشاشات التي ستظهر للمستخدم في شاشته الرئيسية وقوائمه</div>
          </div>
          <!-- Quick Preset Buttons -->
          <div style="display:flex;gap:4px;flex-wrap:wrap;">
            <button class="btn btn-xs btn-ghost" id="presetAllBtn" type="button" title="تحديد جميع الشاشات">👑 الكل</button>
            <button class="btn btn-xs btn-ghost" id="presetCashierBtn" type="button">🧾 كاشير</button>
            <button class="btn btn-xs btn-ghost" id="presetTechBtn" type="button">🛠️ فني</button>
            <button class="btn btn-xs btn-ghost" id="presetAccountantBtn" type="button">💰 محاسب</button>
            <button class="btn btn-xs btn-ghost" id="presetClearBtn" type="button">🧹 إلغاء الكل</button>

            return `
              <label id="secLabel_${sec.key}" style="display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--card-bg);border:1.5px solid ${isChecked ? 'var(--primary)' : 'var(--line)'};border-radius:var(--radius-sm);cursor:pointer;transition:all 0.15s ease;" class="${isChecked?'checked-sec-box':''}">
                <input type="checkbox" data-seckey="${sec.key}" ${isChecked ? 'checked' : ''} style="margin-top:3px;width:18px;height:18px;cursor:pointer;">
                <div style="flex:1;">
                  <div style="font-weight:800;font-size:13px;color:var(--ink);display:flex;align-items:center;gap:6px;">
                    <span>${sec.icon}</span> <span>${sec.label}</span>
                  </div>
                  <div style="font-size:11px;color:var(--ink-secondary);margin-top:2px;line-height:1.3;">
                    ${sec.desc}
                  </div>
                </div>
              </label>
            `;
          }).join('')}
        </div>
      </div>

      <div class="actions-row">
        <button class="btn btn-ghost" id="cancelUserModalBtn" type="button">إلغاء</button>
        <button class="btn btn-primary" id="saveUserModalBtn" type="button">💾 حفظ وتطبيق الصلاحيات</button>
      </div>
    </div>
  `;

  document.body.appendChild(overlay);

  const syncSecUI = ()=>{
    const title = overlay.querySelector('#uModalSecCountTitle');
    if(title) title.textContent = `🖥️ الشاشات والأقسام المسموح بها (${selectedSections.length} من 7 مفعّلة)`;
    allSectionsList.forEach(sec => {
      const isChecked = selectedSections.includes(sec.key);
      const chk = overlay.querySelector(`input[data-seckey="${sec.key}"]`);
      if(chk) chk.checked = isChecked;
      const lbl = overlay.querySelector(`#secLabel_${sec.key}`);
      if(lbl){
        lbl.style.borderColor = isChecked ? 'var(--primary)' : 'var(--line)';
        lbl.classList.toggle('checked-sec-box', isChecked);
      }
    });
  };

  overlay.querySelector('#closeUserModal').onclick = ()=>overlay.remove();
  overlay.querySelector('#cancelUserModalBtn').onclick = ()=>overlay.remove();

  // Checkbox toggle handlers
  overlay.querySelectorAll('input[data-seckey]').forEach(chk => {
    chk.onchange = ()=>{
      const key = chk.dataset.seckey;
      if(chk.checked){
        if(!selectedSections.includes(key)) selectedSections.push(key);
      } else {
        selectedSections = selectedSections.filter(k => k !== key);
      }
      syncSecUI();
    };
  });

  // Presets
  overlay.querySelector('#presetAllBtn').onclick = ()=>{ selectedSections = allSectionsList.map(s => s.key); syncSecUI(); };
  overlay.querySelector('#presetCashierBtn').onclick = ()=>{ selectedSections = ['pos', 'daily']; syncSecUI(); };
  overlay.querySelector('#presetTechBtn').onclick = ()=>{ selectedSections = ['maintenance']; syncSecUI(); };
  overlay.querySelector('#presetAccountantBtn').onclick = ()=>{ selectedSections = ['daily', 'invoices', 'finance', 'inventory']; syncSecUI(); };
  overlay.querySelector('#presetClearBtn').onclick = ()=>{ selectedSections = []; syncSecUI(); };

  // Role dropdown auto preset
  const roleSel = overlay.querySelector('#uModalRole');
  roleSel.onchange = ()=>{
    const val = roleSel.value;
    if(val === 'admin') selectedSections = allSectionsList.map(s => s.key);
    else if(val === 'cashier') selectedSections = ['pos', 'daily'];
    else if(val === 'technician') selectedSections = ['maintenance'];
    else if(val === 'accountant') selectedSections = ['daily', 'invoices', 'finance', 'inventory'];
    else if(val === 'storekeeper') selectedSections = ['inventory', 'pos'];
    syncSecUI();
  };

  // Save handler
  overlay.querySelector('#saveUserModalBtn').onclick = async ()=>{
    const name = overlay.querySelector('#uModalName').value.trim();
    const password = overlay.querySelector('#uModalPassword').value.trim();
    const role = overlay.querySelector('#uModalRole').value;
    const notes = overlay.querySelector('#uModalNotes').value.trim();

    if(!name){ showToast('يرجى إدخال اسم المستخدم', 'error'); return; }
    if(!password){ showToast('يرجى إدخال كلمة المرور', 'error'); return; }
    if(!selectedSections.length){ showToast('يرجى اختيار شاشة واحدة على الأقل للمستخدم', 'error'); return; }

    const userObj = {
      ID: editUser ? editUser.ID : ('usr_' + Date.now()),
      Name: name,
      Password: password,
      Role: role,
      Sections: selectedSections.join(','),
      Notes: notes
    };

    try{
      await saveUserRemote(userObj);

      // If current user modified own permissions, apply live
      if(state.user && state.user.name.toLowerCase() === name.toLowerCase()){
        state.user.role = role;
        state.user.sections = selectedSections;
        try{ localStorage.setItem('microerp_session', JSON.stringify(state.user)); }catch(e){}
      }

      showToast(`تم حفظ وتخصيص صلاحيات المستخدم (${name}) بنجاح ✅`, 'success');
      overlay.remove();
      const main = document.getElementById('main');
      if(main) renderUsersManagementPage(main);
    }catch(e){
      showToast('تم حفظ المستخدم محلياً بنجاح', 'info');
      overlay.remove();
      const main = document.getElementById('main');
      if(main) renderUsersManagementPage(main);
    }
  };
}

                      <button class="btn btn-xs btn-ghost" data-togglepass="pass_${idx}" title="إظهار / إخفاء">👁️</button>
                    </div>
                  </td>
                  <td>
                    <div style="display:flex;gap:4px;flex-wrap:wrap;max-width:360px;">
                      ${secs.length === 0 ? '<span style="color:var(--red);font-size:11px;">لا توجد شاشات</span>' : secs.map(s => {
                        const info = SECTION_INFO[s] || { label: s, icon: '📁' };
                        return `<span class="status-badge" style="background:var(--paper3);border:1px solid var(--line);font-size:10.5px;padding:2px 6px;">${info.icon} ${info.label}</span>`;
                      }).join('')}
                    </div>
                  </td>
                  <td style="font-size:11.5px;color:var(--ink-secondary);">${u.Notes || '-'}</td>
                  <td class="row-actions">
                    <button class="btn btn-xs btn-primary" data-useract="edit" data-uid="${u.ID||u.Name}">✏️ تخصيص الشاشات</button>
                    ${u.Name !== 'admin' && (!state.user || state.user.name !== u.Name) ? `
                      <button class="btn btn-xs btn-red" data-useract="del" data-uid="${u.ID||u.Name}">🗑️</button>
                    ` : ''}
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  // Toggle password view
  main.querySelectorAll('[data-togglepass]').forEach(btn => {
    btn.onclick = ()=>{
      const inp = document.getElementById(btn.dataset.togglepass);
      if(inp) inp.type = inp.type === 'password' ? 'text' : 'password';
    };
  });

  // Buttons
  document.getElementById('addNewUserBtn').onclick = ()=>openUserModal();
  document.getElementById('exportUsersExcelBtn').onclick = ()=>exportUsersToExcel(usersList);

  const importTechBtn = document.getElementById('importTechsAsUsersBtn');
  if(importTechBtn){
    importTechBtn.onclick = async ()=>{
      const techs = state.technicians || [];
      let addedCount = 0;
      for(const t of techs){
        if(!state.users.some(u => u.Name.toLowerCase() === t.toLowerCase())){
          await saveUserRemote({
            ID: 'usr_' + Date.now() + '_' + Math.floor(Math.random()*1000),
            Name: t,
            Password: '123',
            Role: 'technician',
            Sections: 'maintenance',
            Notes: 'تم استيراده تلقائياً من قائمة الفنيين'
          });
          addedCount++;
        }
      }
      if(addedCount > 0){
        showToast(`تم استيراد ${addedCount} فني كحسابات مستخدمين بنجاح ✅`, 'success');
        renderUsersManagementPage(main);
      } else {
        showToast('جميع الفنيين مسجلون بالفعل كمستخدمين', 'info');
      }
    };
  }

  // Row actions
  main.querySelectorAll('[data-useract]').forEach(btn => {
    btn.onclick = async ()=>{
      const uid = btn.dataset.uid;
      const u = state.users.find(x => (x.ID && x.ID === uid) || x.Name === uid);
      if(!u) return;
      const act = btn.dataset.useract;
      if(act === 'edit'){
        openUserModal(u);
      }
      if(act === 'del'){
        if(!confirm(`هل أنت متأكد من حذف المستخدم (${u.Name}) نهائياً؟`)) return;
        try{
          await deleteUserRemote(u.ID || u.Name);
          showToast(`تم حذف المستخدم (${u.Name}) بنجاح`, 'success');
          renderUsersManagementPage(main);
        }catch(e){
          showToast('تعذر الحذف: ' + e.message, 'error');
        }
      }
    };
  });
}

function attachSettingsQuickTabEvents(main){
  main.querySelectorAll('[data-settings-quick-tab]').forEach(chip => {
    chip.onclick = ()=>{
      state.settingsTab = chip.dataset.settingsQuickTab;
      const app = document.getElementById('app');
      if(state.currentSection === 'settings') renderSettingsSectionApp(app);
      else renderSettingsContent(main);
    };
  });
}

function renderSettingsContent(main){
  const activeTab = state.settingsTab || 'appearance';
  if(activeTab === 'appearance') return renderAppearanceSettings(main);
  if(activeTab === 'company') return renderCompanySettings(main);
  if(activeTab === 'pos') return renderPosSettings(main);
  if(activeTab === 'whatsapp') return renderWhatsappSettings(main);
  if(activeTab === 'warranty') return renderWarrantySettings(main);
  if(activeTab === 'devices') return renderDevicesSettings(main);
  if(activeTab === 'faults') return renderFaultsSettings(main);
  if(activeTab === 'sync') return renderSyncSettings(main);
  renderAppearanceSettings(main);
}

function attachPosSettingsEvents(main){
  const posSettings = getPosSettings();
  let payMethods = posSettings.paymentMethods || [];
  let quickServices = posSettings.quickServices || [];

  // Toggle Payment Methods
  main.querySelectorAll('.pay-method-toggle').forEach(chk => {
    chk.onchange = ()=>{
      const idx = Number(chk.dataset.pmidx);
      if(payMethods[idx]){
        payMethods[idx].enabled = chk.checked;
      }
    };
  });

  // Remove custom pay method
  main.querySelectorAll('.remove-custom-pm-btn').forEach(btn => {
    btn.onclick = ()=>{
      const idx = Number(btn.dataset.pmidx);
      payMethods.splice(idx, 1);
      posSettings.paymentMethods = payMethods;
      renderPosSettings(main);
    };
  });

  // Add new payment method prompt / button
  const addPmBtn = document.getElementById('addNewPayMethodBtn');
  if(addPmBtn){
    addPmBtn.onclick = ()=>{
      const name = prompt('أدخل اسم طريقة أو محفظة الدفع الجديدة (مثال: أورنج كاش / كاش بلس):');
      if(!name || !name.trim()) return;
      const icon = prompt('أدخل أيقونة لطريقة الدفع (مثال: 📱 / 💳 / ⚡):', '📱') || '📱';
      const id = 'pm_' + Date.now();
      payMethods.push({ id, name: name.trim(), icon, enabled: true });
      posSettings.paymentMethods = payMethods;
      renderPosSettings(main);
      showToast('تمت إضافة طريقة الدفع بنجاح', 'success');
    };
  }

  // Add new quick service
  const addSrvBtn = document.getElementById('addNewQuickSrvBtn');
  if(addSrvBtn){
    addSrvBtn.onclick = ()=>{
      const name = document.getElementById('newSrvName').value.trim();
      const price = Number(document.getElementById('newSrvPrice').value);
      const icon = document.getElementById('newSrvIcon').value.trim() || '⚡';
      if(!name){ showToast('يرجى كتابة اسم الخدمة', 'error'); return; }
      if(!price || price < 0){ showToast('يرجى تحديد سعر الخدمة', 'error'); return; }

      quickServices.push({ name, price, icon });
      posSettings.quickServices = quickServices;
      renderPosSettings(main);
      showToast('تمت إضافة الخدمة السريعة بنجاح', 'success');
    };
  }

  // Remove quick service
  main.querySelectorAll('.remove-quick-srv-btn').forEach(btn => {
    btn.onclick = ()=>{
      const idx = Number(btn.dataset.srvidx);
      quickServices.splice(idx, 1);
      posSettings.quickServices = quickServices;
      renderPosSettings(main);
    };
  });

  // Save all POS settings button
  const saveBtn = document.getElementById('savePosSettingsBtn');
  if(saveBtn){
    saveBtn.onclick = async ()=>{
      posSettings.receiptPaperSize = document.getElementById('posReceiptPaperSize').value;
      posSettings.receiptFooter = document.getElementById('posReceiptFooter').value.trim();
      posSettings.autoPrintReceipt = document.getElementById('posAutoPrintReceipt').checked;
      posSettings.showCashierName = document.getElementById('posShowCashierName').checked;
      posSettings.showLogoOnReceipt = document.getElementById('posShowLogoOnReceipt').checked;
      posSettings.allowNegativeStock = document.getElementById('posAllowNegativeStock').checked;
      posSettings.enableTax = document.getElementById('posEnableTax').checked;
      posSettings.taxRate = Number(document.getElementById('posTaxRate').value) || 14;
      posSettings.paymentMethods = payMethods;
      posSettings.quickServices = quickServices;

      state.settings.pos = posSettings;
      setCache('settings', state.settings);

      try {
        await saveSettingRemote('pos', JSON.stringify(posSettings));
        showToast('تم حفظ كافة إعدادات نقطة البيع وخيارات الدفع بنجاح ✅', 'success');
      } catch(e) {
        showToast('تم حفظ إعدادات الـ POS محلياً', 'info');
      }
      renderPosSettings(main);
    };
  }
}

    {k:'delivered', icon:'🤝', label:'4. تسليم الجهاز وتفعيل الضمان'},
    {k:'overdue', icon:'⏳', label:'5. تذكير بالأجهزة المتروكة (+7 أيام)'},

    {p:'{receipt_no}', label:'🔢 رقم الإيصال'},
    {p:'{device}', label:'💻 الجهاز والماركة'},
    {p:'{faults}', label:'⚠️ الأعطال'},
    {p:'{status}', label:'📌 الحالة'},
    {p:'{cost}', label:'💰 إجمالي التكلفة'},
    {p:'{deposit}', label:'💵 المدفوع مقدماً'},
    {p:'{remaining}', label:'🔴 المتبقي المطلوب'},
    {p:'{track_url}', label:'🔗 رابط التتبع المباشر'},
    {p:'{shop_name}', label:'🏪 اسم المحل'},
    {p:'{shop_phone}', label:'📞 هاتف المحل'}
  ];

  main.innerHTML = `
    ${renderSettingsNavHeader('📱 قوالب رسائل واتساب الذكية', 'تخصيص صيغ الرسائل التلقائية المرسلة للعملاء حسب حالة الصيانة مع دعم المتغيرات الفورية')}

    <div class="card">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">
        ${waKeys.map(w => `
          <button class="btn btn-sm ${w.k===activeWaKey?'btn-primary':'btn-ghost'}" data-wa-key="${w.k}">
            ${w.icon} ${w.label}
          </button>
        `).join('')}
      </div>

      <div style="margin-bottom:12px;">
        <label>إدراج متغيرات تلقائية بنقرة واحدة (Placeholders):</label>
        <div class="chip-group" style="margin-top:6px;">
          ${placeholders.map(pl => `
            <div class="chip" data-insert-placeholder="${pl.p}" title="انقر لإدراج ${pl.p} في الرسالة">
              ${pl.label} <span class="mono" style="font-size:10px;opacity:0.7;">${pl.p}</span>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="field">
        <label>نص قالب الرسالة لحالة: <b>${(waKeys.find(w=>w.k===activeWaKey)||{}).label}</b></label>
        <textarea id="waTemplateTextarea" style="min-height:160px;font-size:13.5px;line-height:1.6;font-family:inherit;">${currentContent}</textarea>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap;gap:10px;">
        <button class="btn btn-ghost btn-sm" id="resetCurrentWaBtn">↩ استعادة القالب الافتراضي لهذه الحالة</button>
        <button class="btn btn-primary" id="saveWaTemplateBtn">💾 حفظ تعديل قالب الرسالة</button>
      </div>
    </div>
  `;

  attachSettingsQuickTabEvents(main);

  main.querySelectorAll('[data-wa-key]').forEach(btn => {
    btn.onclick = ()=>{
      state.activeWaKey = btn.dataset.waKey;
      renderWhatsappSettings(main);
    };
  });

  const textarea = document.getElementById('waTemplateTextarea');

  main.querySelectorAll('[data-insert-placeholder]').forEach(chip => {
    chip.onclick = ()=>{
      const p = chip.dataset.insertPlaceholder;
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const val = textarea.value;
      textarea.value = val.substring(0, start) + p + val.substring(end);
      textarea.focus();
      textarea.setSelectionRange(start + p.length, start + p.length);
    };
  });

  document.getElementById('saveWaTemplateBtn').onclick = async ()=>{
    if(!state.settings.waTemplates) state.settings.waTemplates = {...DEFAULT_WA_TEMPLATES};
    state.settings.waTemplates[activeWaKey] = textarea.value;
    setCache('settings', state.settings);
    try {
      await saveSettingRemote('waTemplates', JSON.stringify(state.settings.waTemplates));
      showToast('تم حفظ قالب رسالة واتساب بنجاح ✅', 'success');
    } catch(e){
      showToast('تم حفظ القالب محلياً', 'info');
    }
  };

  document.getElementById('resetCurrentWaBtn').onclick = ()=>{
    if(confirm('هل تريد بالتأكيد استعادة القالب الافتراضي لهذه الحالة؟')){
      if(!state.settings.waTemplates) state.settings.waTemplates = {...DEFAULT_WA_TEMPLATES};
      state.settings.waTemplates[activeWaKey] = DEFAULT_WA_TEMPLATES[activeWaKey];
      textarea.value = DEFAULT_WA_TEMPLATES[activeWaKey];
      setCache('settings', state.settings);
      showToast('تم استعادة القالب الافتراضي', 'info');
    }
  };
}

function renderDevicesSettings(main){
  const brandsObj = getBrands();
  const categories = Object.keys(brandsObj);
  const selectedCat = state.selectedDeviceCat || categories[0] || 'لابتوب';
  const brandsList = brandsObj[selectedCat] || [];

  main.innerHTML = `
    ${renderSettingsNavHeader('🛠️ تصنيفات وماركات الأجهزة', 'إدارة فئات الأجهزة (لابتوب، موبايل، شاشات، كاميرات...) وتخصيص الماركات التابعة لكل فئة')}

      <div class="chip-group" style="margin-bottom:16px;">
        ${categories.map(cat => `
          <div class="chip ${cat===selectedCat?'sel':''}" data-select-cat="${cat}">
            ${cat}

      </div>

      <div style="display:flex;gap:10px;margin-bottom:20px;">
        <input id="newCatInput" placeholder="اسم فئة جديدة (مثال: أجهزة منزلية / بلايستيشن)" style="flex:1;">
        <button class="btn btn-primary btn-sm" id="addNewCatBtn">➕ إضافة فئة جديدة</button>
      </div>

      <hr style="border:none;border-top:1px solid var(--line);margin:18px 0;">

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h3 style="margin:0;font-size:15px;">2. الماركات والأنواع التابعة لـ: <span style="color:var(--primary);">${selectedCat}</span></h3>
        ${categories.length > 1 ? `<button class="btn btn-ghost btn-xs" id="deleteCurrentCatBtn" style="color:var(--red);">🗑️ حذف فئة "${selectedCat}"</button>` : ''}
      </div>

      <div class="chip-group" style="margin-bottom:16px;">
        ${brandsList.map(b => `
          <div class="chip sel" style="display:inline-flex;align-items:center;gap:6px;">
            <span>${b}</span>
            <span class="remove-brand-btn" data-brand="${b}" style="cursor:pointer;color:#fca5a5;font-weight:900;" title="حذف الماركة">✕</span>
          </div>
        `).join('')}
      </div>

      <div style="display:flex;gap:10px;">
        <input id="newBrandInput" placeholder="إضافة ماركة جديدة لـ ${selectedCat} (مثال: Sony / Xiaomi)" style="flex:1;">
        <button class="btn btn-primary btn-sm" id="addNewBrandBtn">➕ إضافة ماركة</button>
      </div>
    </div>
  `;

  attachSettingsQuickTabEvents(main);

  main.querySelectorAll('[data-select-cat]').forEach(chip => {
    chip.onclick = ()=>{
      state.selectedDeviceCat = chip.dataset.selectCat;
      renderDevicesSettings(main);
    };
  });

  document.getElementById('addNewCatBtn').onclick = async ()=>{
    const v = document.getElementById('newCatInput').value.trim();
    if(!v) return;
    if(brandsObj[v]){ showToast('هذه الفئة موجودة بالفعل', 'error'); return; }
    brandsObj[v] = ['أخرى'];
    state.settings.brands = brandsObj;
    state.selectedDeviceCat = v;
    setCache('settings', state.settings);
    await saveSettingRemote('brands', JSON.stringify(brandsObj));
    showToast(`تمت إضافة فئة (${v}) بنجاح`, 'success');
    renderDevicesSettings(main);
  };

  document.getElementById('addNewBrandBtn').onclick = async ()=>{
    const v = document.getElementById('newBrandInput').value.trim();
    if(!v) return;
    if(!brandsObj[selectedCat]) brandsObj[selectedCat] = [];
    if(brandsObj[selectedCat].includes(v)){ showToast('هذه الماركة مضافة مسبقاً', 'error'); return; }
    brandsObj[selectedCat].push(v);
    state.settings.brands = brandsObj;
    setCache('settings', state.settings);
    await saveSettingRemote('brands', JSON.stringify(brandsObj));
    showToast(`تمت إضافة الماركة (${v}) بنجاح`, 'success');
    renderDevicesSettings(main);
  };

  main.querySelectorAll('.remove-brand-btn').forEach(btn => {
    btn.onclick = async (e)=>{
      e.stopPropagation();
      const b = btn.dataset.brand;
      brandsObj[selectedCat] = brandsObj[selectedCat].filter(x => x !== b);
      state.settings.brands = brandsObj;
      setCache('settings', state.settings);
      await saveSettingRemote('brands', JSON.stringify(brandsObj));
      showToast(`تم حذف الماركة (${b})`, 'info');
      renderDevicesSettings(main);
    };
  });

  const delCatBtn = document.getElementById('deleteCurrentCatBtn');
  if(delCatBtn){
    delCatBtn.onclick = async ()=>{
      if(confirm(`هل تريد بالتأكيد حذف فئة الأجهزة "${selectedCat}" بكافة ماركاتها؟`)){
        delete brandsObj[selectedCat];
        state.settings.brands = brandsObj;
        state.selectedDeviceCat = Object.keys(brandsObj)[0] || 'لابتوب';
        setCache('settings', state.settings);
        await saveSettingRemote('brands', JSON.stringify(brandsObj));
        showToast(`تم حذف الفئة بنجاح`, 'info');
        renderDevicesSettings(main);
      }
    };
  }
}

    <div class="card" style="border-right:4px solid var(--red);">

      <p style="font-size:12px;color:var(--ink-secondary);margin-bottom:12px;">
        في حال واجهت أي تعليق في المتصفح، يمكنك تفريغ الذاكرة المؤقتة المحلية وإعادة تحميل أحدث نسخة من السحابة بأمان:
      </p>
      <button class="btn btn-ghost btn-sm" id="clearLocalCacheBtn" style="color:var(--red);">🗑️ تفريغ الكاش وإعادة التحميل</button>
    </div>
  `;

  attachSettingsQuickTabEvents(main);

  document.getElementById('forceSyncBtn').onclick = async ()=>{
    await syncOfflineQueue();
    renderSyncSettings(main);
  };

  document.getElementById('reloadCloudDataBtn').onclick = async ()=>{
    showToast('جاري جلب أحدث البيانات من السحابة...', 'info');
    try {
      [state.users, state.receipts, state.customers, state.technicians, state.settings, state.payments, state.inventory, state.sales, state.quotations, state.services, state.purchases, state.suppliers, state.expenses, state.accounts, state.journalEntries, state.invoices] = await Promise.all([
        loadUsers(), loadReceipts(), loadCustomers(), loadTechnicians(), loadSettings(), loadPayments(), loadInventory(), loadSales(), loadQuotations(), loadServices(), loadPurchases(), loadSuppliers(), loadExpenses(), loadAccounts(), loadJournalEntries(), loadInvoices()
      ]);
      showToast('تم تحديث البيانات من السحابة بنجاح ✅', 'success');

    } catch(e) {
      showToast('تعذر التحديث من السحابة: ' + e.message, 'error');

  };

  document.getElementById('clearLocalCacheBtn').onclick = ()=>{
    if(confirm('هل تريد بالتأكيد تفريغ الكاش المحلي؟')){
      localStorage.clear();
      showToast('تم تفريغ الكاش بنجاح، جاري إعادة التحميل...', 'info');
      setTimeout(()=>window.location.reload(), 600);
    }
  };
}
