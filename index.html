<style>
:root {
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --primary-light: #eff6ff;
  --primary-focus: rgba(37, 99, 235, 0.15);
  
  --slate-900: #0f172a;
  --slate-800: #1e293b;
  --slate-700: #334155;
  --slate-600: #475569;
  --slate-500: #64748b;
  --slate-400: #94a3b8;
  --slate-300: #cbd5e1;
  --slate-200: #e2e8f0;
  --slate-100: #f1f5f9;
  --slate-50: #f8fafc;
  
  --ink: #0f172a;
  --ink-secondary: #475569;
  --paper: #f1f5f9;
  --paper2: #ffffff;
  --paper3: #f8fafc;
  --line: #e2e8f0;
  --line-strong: #cbd5e1;
  --card-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.06), 0 1px 2px 0 rgba(0, 0, 0, 0.04);
  
  --blue: #2563eb;
  --blue-bg: #dbeafe;
  --blue-text: #1e40af;
  
  --amber: #d97706;
  --amber-bg: #fef3c7;
  --amber-text: #92400e;
  
  --red: #e11d48;
  --red-bg: #ffe4e6;
  --red-text: #9f1239;
  
  --green: #10b981;
  --green-bg: #d1fae5;
  --green-text: #065f46;
  
  --purple: #8b5cf6;
  --purple-bg: #ede9fe;
  --purple-text: #5b21b6;
  
  --radius-sm: 6px;
  --radius: 12px;
  --radius-lg: 16px;
  --radius-full: 9999px;
  
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
  --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
  
  --font-main: 'Tajawal', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
}

[data-theme="dark"] {
  --primary: #3b82f6;
  --primary-hover: #60a5fa;
  --primary-light: rgba(59, 130, 246, 0.18);
  --primary-focus: rgba(59, 130, 246, 0.25);
  
  --slate-900: #030712;
  --slate-800: #0b0f19;
  --slate-700: #1e293b;
  --slate-600: #334155;
  --slate-500: #94a3b8;
  --slate-400: #cbd5e1;
  --slate-300: #475569;
  --slate-200: #334155;
  --slate-100: #1e293b;
  --slate-50: #0f172a;
  
  --ink: #f8fafc;
  --ink-secondary: #94a3b8;
  --paper: #0b0f19;
  --paper2: #111827;
  --paper3: #1f2937;
  --line: #1f2937;
  --line-strong: #374151;
  --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.35);
  
  --blue-bg: rgba(37, 99, 235, 0.2);
  --blue-text: #93c5fd;
  --amber-bg: rgba(217, 119, 6, 0.2);
  --amber-text: #fcd34d;
  --red-bg: rgba(225, 29, 72, 0.2);
  --red-text: #fda4af;
  --green-bg: rgba(16, 185, 129, 0.2);
  --green-text: #6ee7b7;
  --purple-bg: rgba(139, 92, 246, 0.2);
  --purple-text: #c4b5fd;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-main);
  background: var(--paper);
  color: var(--ink);
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.2s ease, color 0.2s ease;
}
.mono { font-family: var(--font-mono); letter-spacing: -0.02em; }

#app { display: flex; min-height: 100vh; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--slate-300); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--slate-400); }

/* Sidebar */
.sidebar {
  width: 250px;
  background: var(--slate-900);
  color: #f8fafc;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  box-shadow: 4px 0 24px rgba(0,0,0,0.1);
  z-index: 20;
  transition: all 0.2s ease;
}
.brand {
  padding: 22px 18px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-logo-wrap {
  width: 40px;
  height: 40px;
  background: linear-gradient(135deg, var(--primary), #38bdf8);
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 20px;
  box-shadow: 0 4px 12px rgba(37,99,235,0.35);
  flex-shrink: 0;
}
.brand-text h1 {
  font-size: 16.5px;
  font-weight: 800;
  margin: 0;
  color: #ffffff;
  letter-spacing: -0.01em;
}
.brand-text span {
  font-size: 11px;
  color: #38bdf8;
  display: block;
  margin-top: 1px;
  font-weight: 500;
}

.nav-section {
  padding: 12px 12px 4px;
  font-size: 10px;
  font-weight: 700;
  color: var(--slate-400);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.nav-item {
  margin: 3px 8px;
  padding: 9px 12px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  color: #94a3b8;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  gap: 10px;
  transition: all 0.15s ease;
  user-select: none;
}
.nav-item:hover {
  background: rgba(255,255,255,0.06);
  color: #ffffff;
  transform: translateX(-2px);
}
.nav-item.active {
  background: linear-gradient(135deg, var(--primary), var(--primary-hover));
  color: #ffffff;
  box-shadow: 0 4px 12px rgba(37,99,235,0.3);
}
.nav-item-icon {
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 20px;
}

.sidebar-foot {
  margin-top: auto;
  padding: 14px;
  background: rgba(0,0,0,0.25);
  border-top: 1px solid rgba(255,255,255,0.06);
}
.user-card {
  display: flex;
  align-items: center;
  gap: 10px;
}
.user-avatar {
  width: 34px;
  height: 34px;
  border-radius: var(--radius-full);
  background: linear-gradient(135deg, #10b981, #059669);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 13.5px;
}
.user-info {
  flex: 1;
  min-width: 0;
}
.user-name {
  font-size: 12.5px;
  font-weight: 700;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.role-badge {
  display: inline-block;
  background: rgba(37,99,235,0.25);
  color: #60a5fa;
  font-size: 9.5px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: var(--radius-full);
  margin-top: 1px;
}

/* Main Content Area */
main {
  flex: 1;
  padding: 24px 32px;
  max-width: 1400px;
  width: 100%;
  box-sizing: border-box;
}

/* Top App Header */
.top-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 14px;
}
.page-title {
  font-size: 22px;
  font-weight: 800;
  color: var(--ink);
  letter-spacing: -0.02em;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 10px;
}
.subtitle {
  color: var(--ink-secondary);
  font-size: 13px;
  margin-top: 2px;
}

/* Theme Toggle Button */
.theme-toggle-btn {
  background: var(--paper2);
  border: 1px solid var(--line);
  color: var(--ink);
  padding: 7px 12px;
  border-radius: var(--radius-full);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s ease;
}
.theme-toggle-btn:hover {
  background: var(--paper3);
  border-color: var(--primary);
}

/* Cards */
.card {
  background: var(--paper2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 18px;
  box-shadow: var(--card-shadow);
  transition: box-shadow 0.2s ease, border-color 0.2s ease;
}
.card:hover {
  box-shadow: var(--shadow);
}
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  padding-bottom: 10px;
  margin-bottom: 16px;
}
.card h3 {
  margin: 0;
  font-size: 15.5px;
  font-weight: 800;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Dashboard Stat Cards */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 14px;
  margin-bottom: 22px;
}
.stat-card {
  background: var(--paper2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 18px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--card-shadow);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.stat-card::before {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  left: 0;
  height: 4px;
  background: var(--slate-300);
}
.stat-card.blue::before { background: var(--blue); }
.stat-card.green::before { background: var(--green); }
.stat-card.amber::before { background: var(--amber); }
.stat-card.red::before { background: var(--red); }
.stat-card.purple::before { background: var(--purple); }

.stat-card .top-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.stat-card .icon-box {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
}
.stat-card.blue .icon-box { background: var(--blue-bg); color: var(--blue-text); }
.stat-card.green .icon-box { background: var(--green-bg); color: var(--green-text); }
.stat-card.amber .icon-box { background: var(--amber-bg); color: var(--amber-text); }
.stat-card.red .icon-box { background: var(--red-bg); color: var(--red-text); }
.stat-card.purple .icon-box { background: var(--purple-bg); color: var(--purple-text); }

.stat-card .num {
  font-size: 26px;
  font-weight: 800;
  color: var(--ink);
  line-height: 1.2;
  margin-top: 8px;
}
.stat-card .lbl {
  font-size: 12px;
  color: var(--ink-secondary);
  font-weight: 600;
  margin-top: 3px;
}

/* Stepper */
.stepper {
  display: flex;
  gap: 8px;
  margin-bottom: 22px;
  background: var(--paper2);
  padding: 8px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  box-shadow: var(--card-shadow);
}
.step-dot {
  flex: 1;
  text-align: center;
  padding: 9px 8px;
  background: var(--paper3);
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-secondary);
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.step-dot:hover { background: var(--slate-200); }
.step-dot.active {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 2px 8px rgba(37,99,235,0.25);
}
.step-dot.done {
  background: var(--green-bg);
  color: var(--green-text);
}

/* Forms & Inputs */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.grid4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 14px; }

label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 5px;
}
input, select, textarea {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 13px;
  background: var(--paper2);
  color: var(--ink);
  outline: none;
  transition: all 0.15s ease;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-focus);
}
.field { margin-bottom: 12px; }
textarea { min-height: 75px; resize: vertical; }

/* Chips */
.chip-group { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  padding: 6px 12px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-full);
  font-size: 12px;
  cursor: pointer;
  background: var(--paper2);
  font-weight: 600;
  color: var(--ink);
  user-select: none;
  transition: all 0.15s ease;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.chip:hover {
  background: var(--paper3);
  border-color: var(--slate-400);
}
.chip.sel {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
  box-shadow: 0 2px 6px rgba(37,99,235,0.25);
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  border: none;
  font-family: inherit;
  font-weight: 700;
  font-size: 12.5px;
  cursor: pointer;
  transition: all 0.15s ease;
  user-select: none;
  text-decoration: none;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--primary); color: #fff; box-shadow: 0 2px 6px rgba(37,99,235,0.25); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-ghost { background: var(--paper2); border: 1px solid var(--line-strong); color: var(--ink); }
.btn-ghost:hover { background: var(--paper3); border-color: var(--slate-400); }
.btn-green { background: var(--green); color: #fff; }
.btn-green:hover { background: #059669; }
.btn-blue { background: #0284c7; color: #fff; }
.btn-blue:hover { background: #0369a1; }
.btn-amber { background: var(--amber); color: #fff; }
.btn-amber:hover { background: #b45309; }
.btn-red { background: var(--red); color: #fff; }
.btn-red:hover { background: #be123c; }
.btn-whatsapp { background: #25D366; color: #fff; }
.btn-whatsapp:hover { background: #1ebe57; }
.wa-icon { width: 14px; height: 14px; flex-shrink: 0; }
.btn-sm { padding: 5px 11px; font-size: 11.5px; }
.btn-xs { padding: 4px 8px; font-size: 10.5px; border-radius: 4px; }
.actions-row { display: flex; gap: 10px; justify-content: space-between; align-items: center; margin-top: 14px; }

/* Status Badges */
.status-badge {
  padding: 3px 9px;
  border-radius: var(--radius-full);
  font-size: 11px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid transparent;
}
.st-check { background: var(--blue-bg); color: var(--blue-text); border-color: #bfdbfe; }
.st-repair { background: var(--amber-bg); color: var(--amber-text); border-color: #fde68a; }
.st-done { background: var(--green-bg); color: var(--green-text); border-color: #a7f3d0; }
.st-failed { background: var(--red-bg); color: var(--red-text); border-color: #fecdd3; }
.st-rejected { background: var(--slate-200); color: var(--slate-700); border-color: var(--slate-300); }

/* Quick Status Button */
.btn-status-quick {
  background: var(--paper2);
  border: 1px solid var(--line-strong);
  padding: 3px 8px;
  border-radius: var(--radius-full);
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s ease;
  box-shadow: 0 1px 2px rgba(0,0,0,0.03);
}
.btn-status-quick:hover {
  border-color: var(--primary);
  background: var(--primary-light);
  color: var(--primary);
}

/* Tables */
.table-wrap {
  background: var(--paper2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: auto;
  box-shadow: var(--card-shadow);
}
table {
  width: 100%;
  border-collapse: collapse;
  text-align: right;
}
th, td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  font-size: 12.5px;
}
th {
  background: var(--paper3);
  font-weight: 700;
  color: var(--ink-secondary);
  font-size: 11.5px;
  white-space: nowrap;
}
tbody tr { transition: background-color 0.1s ease; }
tbody tr:hover { background-color: var(--paper3); }
tr:last-child td { border-bottom: none; }
.row-actions { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }

/* Filter Bar */
.filters-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
  align-items: center;
  background: var(--paper2);
  padding: 10px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  box-shadow: var(--card-shadow);
}
.filters-bar input, .filters-bar select {
  width: auto;
  min-width: 160px;
}

/* Modal Windows */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.7);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 16px;
  animation: fadeIn 0.15s ease-out;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(12px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

.modal-content {
  background: var(--paper2);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  max-width: 680px;
  width: 100%;
  max-height: 90vh;
  overflow: auto;
  padding: 22px;
  position: relative;
  animation: slideUp 0.2s ease-out;
  color: var(--ink);
}

/* Toast Notifications */
#toastContainer {
  position: fixed;
  bottom: 24px;
  left: 24px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  background: var(--slate-900);
  color: #fff;
  padding: 11px 16px;
  border-radius: var(--radius-sm);
  font-size: 12.5px;
  font-weight: 600;
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: center;
  gap: 10px;
  animation: slideInLeft 0.2s ease-out;
  min-width: 260px;
}
.toast.success { background: #065f46; border-right: 4px solid #10b981; }
.toast.error { background: #9f1239; border-right: 4px solid #f43f5e; }
.toast.info { background: #1e3a8a; border-right: 4px solid #3b82f6; }
@keyframes slideInLeft { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }

/* Section Picker */
.section-picker-wrap {
  max-width: 820px;
  margin: 36px auto;
  padding: 0 20px;
}
.section-card {
  background: var(--paper2);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 24px 18px;
  text-align: center;
  cursor: pointer;
  box-shadow: var(--card-shadow);
  transition: all 0.2s ease;
}
.section-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
  border-color: var(--primary);
}
.section-card-icon {
  width: 58px;
  height: 58px;
  border-radius: 16px;
  margin: 0 auto 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  background: var(--paper3);

const API_URL = 'https://script.google.com/macros/s/AKfycbzpi81aPJwwsvHCqUKCkUxEhT0l4NnLgcCBPab1xjvx0B3vhzamCVkwiohrOCfWkKcm/exec';

async function apiGet(action, params){
  const q = new URLSearchParams({action, ...(params||{})});
  const res = await fetch(`${API_URL}?${q.toString()}`);
  const json = await res.json();
  if(json && json.error) throw new Error(json.error);
  return json;
}
async function apiPost(action, data){
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({action, ...data})
  });
  const json = await res.json();
  if(json && json.error) throw new Error(json.error);
  return json;
}

/* ---- Toast Notification Utility ---- */
function showToast(msg, type='info', duration=3200){
  const container = document.getElementById('toastContainer');
  if(!container) return;
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  const icons = { success: '✅', error: '❌', info: 'ℹ️' };
  t.innerHTML = `<span>${icons[type] || 'ℹ️'}</span><span>${msg}</span>`;
  container.appendChild(t);
  setTimeout(()=>{
    t.style.opacity = '0';
    t.style.transform = 'translateY(10px)';
    t.style.transition = 'all 0.2s ease';
    setTimeout(()=>t.remove(), 200);
  }, duration);
}

/* ---------------- Init ---------------- */
async function init(){
  if(checkCustomerTrackingURL()) return;
  const main = document.getElementById('app');
  if(main) main.innerHTML = '<div class="empty" style="padding-top:100px;"><div style="font-size:32px;margin-bottom:12px;">⏳</div><div>جارٍ الاتصال بقاعدة البيانات وتحميل البيانات...</div></div>';
  try {
    [state.receipts, state.customers, state.technicians, state.settings, state.payments, state.inventory, state.sales, state.quotations, state.services, state.purchases, state.suppliers, state.expenses] = await Promise.all([
      loadReceipts(), loadCustomers(), loadTechnicians(), loadSettings(), loadPayments(), loadInventory(), loadSales(), loadQuotations(), loadServices(), loadPurchases(), loadSuppliers(), loadExpenses()
    ]);
  } catch(e) {
    console.error(e);
  }
  render();
}
async function refreshPayments(){ state.payments = await loadPayments(); }
async function refreshSales(){ state.sales = await loadSales(); }
async function refreshExpenses(){ state.expenses = await loadExpenses(); }

/* ---------------- Render Root ---------------- */
function render(){
  const app = document.getElementById('app');
  if(!state.user){ app.innerHTML = loginScreen(); attachLogin(); return; }
  const availableSections = state.user.sections || [];
  if(!state.currentSection){
    if(availableSections.length===1){ state.currentSection = availableSections[0]; }
    else { return renderSectionPicker(app); }
  }
  if(state.currentSection==='maintenance') return renderMaintenanceApp(app);
  if(state.currentSection==='cameras') return renderCamerasApp(app);
  if(state.currentSection==='pos') return renderPosApp(app);
  if(state.currentSection==='inventory') return renderInventoryHubApp(app);
  if(state.currentSection==='finance') return renderFinanceSectionApp(app);
  renderSectionPicker(app);
}

/* ---------------- Analytics & Charts ---------------- */
function renderMaintenanceAnalytics(main){
  const r = state.receipts;
  const totalCost = r.reduce((s,x)=>s+Number(x.cost||0),0);
  const totalParts = r.reduce((s,x)=>s+Number(x.partsCost||0),0);
  const completed = r.filter(x=>x.status==='مكتمل').length;
  const completionRate = r.length ? Math.round((completed/r.length)*100) : 0;

  // Category counts
  const catCounts = {};
  r.forEach(x=>{ const c = x.device.category||'أخرى'; catCounts[c] = (catCounts[c]||0)+1; });

  // Tech counts
  const techCounts = {};
  r.forEach(x=>{
    const t = x.technician||'غير محدد';
    if(!techCounts[t]) techCounts[t] = {total:0, done:0, income:0};
    techCounts[t].total++;
    if(x.status==='مكتمل') techCounts[t].done++;
    techCounts[t].income += Number(x.cost||0);
  });

  main.innerHTML = `
    <div class="top-header">
      <div>
        <h2 class="page-title">📈 التقارير والتحليلات البيانية</h2>
        <div class="subtitle">إحصائيات تفصيلية لأداء الصيانة وفئات الأجهزة وإنتاجية الفنيين</div>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-card green"><div class="num mono">${completionRate}%</div><div class="lbl">نسبة إنجاز الصيانة</div></div>
      <div class="stat-card blue"><div class="num mono">${totalCost.toLocaleString()} ج.م</div><div class="lbl">إجمالي قيمة الخدمات</div></div>
      <div class="stat-card amber"><div class="num mono">${totalParts.toLocaleString()} ج.م</div><div class="lbl">إجمالي تكلفة قطع الغيار</div></div>
      <div class="stat-card purple"><div class="num mono">${(totalCost-totalParts).toLocaleString()} ج.م</div><div class="lbl">صافي عائد الصيانة</div></div>
    </div>

    <div class="grid2">
      <div class="card">
        <h3>💻 فئات الأجهزة الأكثر استلاماً</h3>
        <div style="margin-top:14px;">
          ${Object.entries(catCounts).sort((a,b)=>b[1]-a[1]).map(([cat,count])=>{
            const pct = Math.round((count/r.length)*100);
            return `<div style="margin-bottom:12px;">
              <div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:4px;">
                <span>${cat}</span><span class="mono">${count} جهاز (${pct}%)</span>
              </div>
              <div style="background:var(--paper3);border-radius:4px;height:8px;overflow:hidden;">
                <div style="background:var(--primary);width:${pct}%;height:100%;border-radius:4px;"></div>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>

      <div class="card">
        <h3>👨‍🔧 إنتاجية وكفاءة الفنيين</h3>
        <div class="table-wrap" style="margin-top:12px;">
          <table>
            <thead><tr><th>الفني</th><th>المسند</th><th>المكتمل</th><th>نسبة النجاح</th><th>عائد الخدمات</th></tr></thead>
            <tbody>
              ${Object.entries(techCounts).map(([tech,stat])=>{
                const rate = stat.total ? Math.round((stat.done/stat.total)*100) : 0;
                return `<tr>
                  <td><b>${tech}</b></td>
                  <td class="mono">${stat.total}</td>
                  <td class="mono font-bold" style="color:var(--green);">${stat.done}</td>
                  <td class="mono">${rate}%</td>
                  <td class="mono font-bold">${stat.income.toLocaleString()} ج.م</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

/* ---------------- New Receipt Form ---------------- */
function startNewDraft(){
  state.draft = newDraft();
  state.formStep = 0;
  nextReceiptNumber()
    .then(n=>{ state.draft.receiptNumber = n; renderMain(); })
    .catch(e=>{ state.draft.receiptNumber = 'MT-'+Date.now(); renderMain(); });
}

const STEPS = ['بيانات العميل','بيانات الجهاز','الأعطال والفني','المالي والمخزن','مراجعة وحفظ'];
let currentStepCollector = null;

function renderForm(main){
  if(!state.draft){ startNewDraft(); return; }
  const d = state.draft;
  main.innerHTML = `
    <div class="top-header">
      <div>
        <h2 class="page-title">➕ إيصال استلام جهاز جديد</h2>
        <div class="subtitle">رقم الإيصال: <b class="mono" style="color:var(--primary);">${d.receiptNumber}</b> — التاريخ: <b class="mono">${d.date}</b></div>
      </div>
    </div>
    <div class="stepper">
      ${STEPS.map((s,i)=>`<div class="step-dot ${i===state.formStep?'active':(i<state.formStep?'done':'')}" data-i="${i}">
        <span>${i<state.formStep?'✓':(i+1)}</span><span>${s}</span>
      </div>`).join('')}
    </div>
    <div id="stepBody"></div>
  `;
  document.querySelectorAll('.step-dot').forEach(el=>el.onclick=()=>{
    if(typeof currentStepCollector==='function') currentStepCollector();
    state.formStep = Number(el.dataset.i); renderMain();
  });
  const body = document.getElementById('stepBody');
  if(state.formStep===0) return stepCustomer(body,d);
  if(state.formStep===1) return stepDevice(body,d);
  if(state.formStep===2) return stepFaults(body,d);
  if(state.formStep===3) return stepFinance(body,d);
  if(state.formStep===4) return stepReview(body,d);
}

function stepNav(body, canBack, canNext, nextLabel){
  const div = document.createElement('div');
  div.className='actions-row';

async function saveReceipt(d, printA5, sendWa, printSticker){
  d.updatedBy = state.user.name;
  d.updatedAt = new Date().toISOString();
  const btns = document.querySelectorAll('#saveOnlyBtn,#savePrintBtn,#saveWaBtn,#saveStickerBtn');
  btns.forEach(b=>{ b.disabled = true; b.textContent = 'جارٍ الحفظ...'; });
  try{
    await saveReceiptRemote(d);
    if(Number(d.deposit||0) > 0){
      try{ await savePaymentRemote(d.id, Number(d.deposit), 'دفعة مقدمة عند الاستلام'); }
      catch(payErr){ console.warn(payErr); }
      await refreshPayments();
    }
    if(!state.customers.find(c=>c.phone===d.customer.phone)){
      await saveCustomerRemote(d.customer);
      state.customers.push(d.customer);
    }
    state.receipts.push(d);
    state.draft = null;
    state.tab = 'archive';
    showToast(`تم حفظ الإيصال ${d.receiptNumber} بنجاح!`, 'success');
    renderMain();
    if(printA5){ setTimeout(()=>openReceiptPrint(d,'receipt'), 300); }
    if(printSticker){ setTimeout(()=>openStickerPrint(d), 300); }
    if(sendWa){ setTimeout(()=>openWhatsappChoice(d), 300); }
  }catch(e){
    showToast('تعذر حفظ الإيصال: '+e.message, 'error');
    btns.forEach(b=>{ b.disabled = false; });
  }
}

const STATUS_GROUPS = {

  done: {label:'جاهزة للاستلام ✅', statuses:['مكتمل']},
  overdue: {label:'⏰ متروكة +7 أيام', statuses:null},
  rejected: {label:'تعذرت / مرفوضة ❌', statuses:['رفض العميل','تعذرت الصيانة']}
};

function renderArchive(main){
  const f = state.archiveFilter;
  if(!f.group) f.group = 'all';
  let list = [...state.receipts];

  if(f.group==='overdue'){
    list = list.filter(r=>r.status==='مكتمل' && (Date.now()-new Date(r.updatedAt||r.date).getTime())/86400000 > 7);
  } else {
    const groupStatuses = STATUS_GROUPS[f.group].statuses;
    if(groupStatuses) list = list.filter(r=>groupStatuses.includes(r.status));
  }

  if(f.q) list = list.filter(r => r.receiptNumber.includes(f.q) || r.customer.name.includes(f.q) || r.customer.phone.includes(f.q) || (r.device.model&&r.device.model.includes(f.q)));
  if(f.status) list = list.filter(r=>r.status===f.status);
  if(f.tech) list = list.filter(r=>r.technician===f.tech);

  main.innerHTML = `
    <div class="top-header">
      <div>
        <h2 class="page-title">📁 أرشيف إيصالات الصيانة</h2>
        <div class="subtitle">البحث في الإيصالات وتحديث الحالات وتصدير البيانات (${list.length} إيصال مطابق)</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost btn-sm" id="exportArchiveExcelBtn">📥 تصدير Excel</button>

      ${Object.entries(STATUS_GROUPS).map(([k,g])=>`<div class="chip ${f.group===k?'sel':''}" data-g="${k}">${g.label}</div>`).join('')}

    <div class="filters-bar">
      <input id="fq" placeholder="🔍 بحث برقم الإيصال / اسم العميل / الهاتف / الموديل" value="${f.q}" style="flex:1;">
      <select id="fstatus"><option value="">كل الحالات</option>${STATUSES.map(s=>`<option ${f.status===s.v?'selected':''}>${s.icon} ${s.v}</option>`).join('')}</select>
      <select id="ftech"><option value="">كل الفنيين</option>${state.technicians.map(t=>`<option ${f.tech===t?'selected':''}>${t}</option>`).join('')}</select>
      ${(f.q||f.status||f.tech||f.group!=='all') ? `<button class="btn btn-ghost btn-sm" id="clearFiltersBtn">مسح الفلاتر</button>` : ''}

  `;

  document.getElementById('archNewReceiptBtn').onclick = ()=>{ state.tab='new'; startNewDraft(); };
  document.getElementById('exportArchiveExcelBtn').onclick = ()=>exportReceiptsToExcel(list);
  document.querySelectorAll('#groupTabs .chip').forEach(c=>{ c.onclick = ()=>{ f.group = c.dataset.g; renderMain(); }; });
  document.getElementById('fq').oninput = e=>{ f.q=e.target.value; renderMain(); };
  document.getElementById('fstatus').onchange = e=>{ f.status=e.target.value.replace(/^[^\s]+\s/, ''); renderMain(); };
  document.getElementById('ftech').onchange = e=>{ f.tech=e.target.value; renderMain(); };
  const clearBtn = document.getElementById('clearFiltersBtn');
  if(clearBtn) clearBtn.onclick = ()=>{ f.q=''; f.status=''; f.tech=''; f.group='all'; renderMain(); };

  attachRowActions(main);
}

function attachRowActions(root){
  root.querySelectorAll('[data-act]').forEach(btn=>{
    btn.onclick = ()=>{
      const r = state.receipts.find(x=>x.id===btn.dataset.id);
      if(!r) return;
      const act = btn.dataset.act;
      if(act==='view') openReceiptDetail(r);
      if(act==='wa') openWhatsapp(r);
      if(act==='print') openReceiptPrint(r,'receipt');
      if(act==='sticker') openStickerPrint(r);
      if(act==='del'){
        if(confirm(`هل تريد حذف الإيصال ${r.receiptNumber} نهائياً؟`)){
          deleteReceiptRemote(r.id)
            .then(()=>{ state.receipts = state.receipts.filter(x=>x.id!==r.id); showToast('تم حذف الإيصال بنجاح', 'success'); renderMain(); })
            .catch(e=>showToast('تعذر الحذف: '+e.message, 'error'));
        }
      }
    };
  });

  root.querySelectorAll('[data-quickstatus]').forEach(btn=>{
    btn.onclick = (e)=>{

/* ---------------- WhatsApp Messaging ---------------- */
function normalizePhoneForWa(phone){
  let p = String(phone||'').replace(/[^0-9]/g,'');
  if(p.startsWith('00')) p = p.slice(2);
  if(p.startsWith('0')) p = '20' + p.slice(1);
  else if(p.length===10 && !p.startsWith('20')) p = '20'+p;
  return p;
}

function getStatusCustomMessage(r, status){
  const remaining = Number(r.cost||0)+Number(r.partsCost||0)-Number(r.deposit||0)+Number(r.refunded||0);
  const shop = state.settings.shopName || 'مركز الصيانة';
  const device = `${r.device.category} ${r.device.brand==='أخرى'?r.device.brandOther:r.device.brand} ${r.device.model||''}`.trim();
  const trackUrl = `${window.location.origin}${window.location.pathname}?track=${r.receiptNumber}`;

  if(status === 'مكتمل'){
    return `مرحبًا ${r.customer.name} 👋\nنود إبلاغكم بأنه تم الانتهاء من صيانة جهازكم (${device}) بنجاح وجاهز للاستلام الآن في ${shop} ✅\n\n📌 رقم الإيصال: ${r.receiptNumber}\n💵 المبلغ المتبقي المطلوب: ${remaining} ج.م\n🔗 تتبع جهازك مباشرة: ${trackUrl}\n\nشكراً لثقتكم بنا!`;
  }
  if(status === 'الصيانة'){
    return `مرحبًا ${r.customer.name} 👋\nنحيطكم علماً بأن جهازكم (${device}) قيد الصيانة والإصلاح حالياً في ${shop} 🛠️\nرقم الإيصال: ${r.receiptNumber}\n🔗 تتبع حالة جهازك: ${trackUrl}`;
  }
  if(status === 'قيد الفحص'){
    return `مرحبًا ${r.customer.name} 👋\nتم استلام جهازكم (${device}) وهو قيد الفحص والتشخيص الفني حالياً 🔍\nرقم الإيصال: ${r.receiptNumber}\n🔗 تتبع حالة جهازك: ${trackUrl}`;
  }
  if(status === 'overdue_reminder'){
    return `مرحبًا ${r.customer.name} 👋\nنود تذكيركم بوجود جهازكم (${device}) جاهزاً للاستلام لدينا في ${shop} بموجب الإيصال رقم ${r.receiptNumber}.\nالمتبقي: ${remaining} ج.م.\nيرجى التفضل بالاستلام خلال أوقات العمل الرسمية.`;
  }
  if(status === 'تعذرت الصيانة'){
    return `مرحبًا ${r.customer.name} 👋\nبخصوص جهازكم (${device}) بموجب الإيصال رقم ${r.receiptNumber}، نعتذر منك حيث تعذر الإصلاح لعدم توفر قطع الغيار أو طبيعة العطل. يمكنك التفضل لاستلام الجهاز في أي وقت من ${shop}.`;
  }
  if(status === 'رفض العميل'){
    return `مرحبًا ${r.customer.name} 👋\nبناءً على طلبكم، تم إلغاء الصيانة لجهازكم (${device}) بموجب الإيصال رقم ${r.receiptNumber} والجهاز جاهز للاستلام في ${shop}.`;
  }
  return `مرحبًا ${r.customer.name}، بخصوص جهازكم بموجب الإيصال رقم ${r.receiptNumber}\nالحالة الحالية: ${r.status}\nالمتبقي: ${remaining} ج.م\n${shop}`;
}

function sendWhatsappByStatus(r, status){
  const msg = getStatusCustomMessage(r, status);
  sendWhatsapp(r, msg);
}

function sendWhatsapp(r, msg){
  const phone = normalizePhoneForWa(r.customer.phone);
  if(!phone || phone.length < 10){ showToast('رقم هاتف العميل غير صالح لإرسال واتساب', 'error'); return; }
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
}

/* ---------------- Excel Export Utility ---------------- */
function exportReceiptsToExcel(receipts){
  if(!receipts || !receipts.length){ showToast('لا توجد بيانات للتصدير', 'error'); return; }
  const headers = ['رقم الإيصال','التاريخ','الاسم','الهاتف','فئة الجهاز','الماركة','الموديل','الأعطال','الفني','التكلفة','المدفوع','قطع الغيار','المتبقي','الحالة','موعد التسليم'];
  const rows = receipts.map(r=>{
    const rem = Number(r.cost||0)+Number(r.partsCost||0)-Number(r.deposit||0)+Number(r.refunded||0);
    return [
      r.receiptNumber, cleanDate(r.date), `"${r.customer.name}"`, `"${r.customer.phone}"`,
      r.device.category, r.device.brand, `"${r.device.model||''}"`, `"${(r.faults||[]).join(' - ')}"`,
      `"${r.technician||''}"`, r.cost||0, r.deposit||0, r.partsCost||0, rem, `"${r.status}"`, r.deliveryDate||''
    ];
  });
  downloadCSV(`Receipts_Export_${new Date().toISOString().slice(0,10)}.csv`, headers, rows);
}

function exportInventoryToExcel(items){
  if(!items || !items.length){ showToast('المخزن فارغ', 'error'); return; }
  const headers = ['اسم الصنف','القسم','الباركود','الكمية المتاحة','سعر الشراء (تكلفة)','سعر البيع المقترح'];
  const rows = items.map(it=>[
    `"${it.Name}"`, it.Category||'صيانة', `"${it.Barcode||''}"`, it.Quantity, it.PurchasePrice, it.SellPrice||0
  ]);
  downloadCSV(`Inventory_Export_${new Date().toISOString().slice(0,10)}.csv`, headers, rows);
}

function downloadCSV(filename, headers, rows){
  let csvContent = '\uFEFF' + headers.join(',') + '\n';
  rows.forEach(r => { csvContent += r.join(',') + '\n'; });
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  showToast('تم تصدير ملف Excel بنجاح', 'success');
}

function renderInventory(main, categoryFilter, titleOverride){

      ${list.length===0 ? '<div class="empty">لا توجد أصناف في هذا القسم بعد.</div>' : `
      <div class="table-wrap"><table><thead><tr><th>الصنف</th>${categoryFilter==='all'?'<th>التصنيف</th>':''}<th>الباركود</th><th>الكمية</th><th>سعر التكلفة</th><th>سعر البيع</th><th>الإجراءات</th></tr></thead><tbody>

          <td><b>${it.Name}</b></td>

          <td class="mono" style="font-weight:800;${Number(it.Quantity)<=2?'color:var(--red);':'color:var(--ink);'}">${it.Quantity} ${Number(it.Quantity)<=2?'⚠️':''}</td>

            <button class="btn btn-xs btn-ghost" data-invact="edit" data-id="${it.ID}">تعديل</button>
            <button class="btn btn-xs btn-red" data-invact="del" data-id="${it.ID}">حذف</button>
          </td>
        </tr>`).join('')}
      </tbody></table></div>`}
    </div>

    const buy = Number(document.getElementById('invBuy').value)||0;
    const sell = Number(document.getElementById('invSell').value)||0;
    const category = document.getElementById('invCategory').value;
    const barcode = document.getElementById('invBarcode').value.trim();
    if(!name){ showToast('اكتب اسم الصنف', 'error'); return; }
    const btn = document.getElementById('addInvBtn'); btn.disabled = true;
    try{
      await saveInventoryItemRemote({ID:'', Name:name, Category:category, Barcode:barcode, ImageURL:'', Quantity:qty, PurchasePrice:buy, SellPrice:sell});

      showToast('تمت إضافة الصنف بنجاح', 'success');

function renderPosSell(main){
  const cart = state.cart;
  const total = cart.reduce((s,c)=>s+c.qty*c.price,0);
  main.innerHTML = `
    <div class="top-header">
      <div>
        <h2 class="page-title">🧾 بيع سريع وفاتورة</h2>
        <div class="subtitle">مسح الباركود أو اختيار المنتجات لإصدار الفاتورة فورًا</div>
      </div>
    </div>
    <div class="card">
      <div class="grid2">
        <div class="field"><label>امسح أو اكتب الباركود ثم اضغط Enter</label><input id="posBarcodeInput" placeholder="امسح الباركود هنا..." autofocus></div>
        <div class="field"><label>أو ابحث عن صنف بالاسم</label><input id="posSearchInput" placeholder="اكتب اسم الصنف..."></div>
      </div>
    </div>
    <div class="card">
      <h3>السلة الحالية</h3>
      ${cart.length===0 ? '<div class="empty">السلة فارغة. ابدأ بمسح الباركود أو اختيار الأصناف.</div>' : `
      <div class="table-wrap"><table><thead><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th><th></th></tr></thead><tbody>
        ${cart.map((c,i)=>`<tr>
          <td><b>${c.name}</b></td>
          <td><input type="number" min="1" value="${c.qty}" data-cartqtyidx="${i}" style="width:70px;"></td>
          <td><input type="number" min="0" value="${c.price}" data-cartpriceidx="${i}" style="width:90px;"></td>
          <td class="mono font-bold">${c.qty*c.price} ج.م</td>
          <td><button class="btn btn-xs btn-red" data-cartidx="${i}">إزالة</button></td>
        </tr>`).join('')}
      </tbody></table></div>`}
      <div style="text-align:left;font-size:22px;font-weight:900;margin-top:14px;">الإجمالي: <span class="mono" style="color:var(--primary);">${total}</span> ج.م</div>
    </div>
    <div class="card">
      <h3>بيانات العميل والدفع</h3>
      <div class="grid2">
        <div class="field"><label>اسم العميل</label><input id="posCustName" value="عميل زائر"></div>
        <div class="field"><label>رقم الهاتف</label><input id="posCustPhone"></div>
      </div>
      <button class="btn btn-green" id="completeSaleBtn" style="width:100%;padding:12px;" ${cart.length===0?'disabled':''}>✅ إتمام عملية البيع وطباعة الفاتورة</button>
    </div>
  `;
  document.getElementById('posBarcodeInput').onkeydown = async (e)=>{
    if(e.key !== 'Enter') return;
    const code = e.target.value.trim();
    if(!code) return;
    const it = state.inventory.find(x=>String(x.Barcode||'').trim()===code);
    if(!it){ showToast('لا يوجد صنف بهذا الباركود', 'error'); e.target.value=''; return; }
    if(Number(it.Quantity)<=0){ showToast('الصنف غير متاح في المخزون', 'error'); e.target.value=''; return; }
    e.target.value = '';
    await addItemToCart(it.ID, 1, main);
  };
  main.querySelectorAll('[data-cartqtyidx]').forEach(inp=>{
    inp.onchange = ()=>{
      const idx = Number(inp.dataset.cartqtyidx);
      const newQty = Number(inp.value);
      if(!newQty || newQty<=0) return;
      cart[idx].qty = newQty;
      renderPosSell(main);
    };
  });
  main.querySelectorAll('[data-cartidx]').forEach(btn=>{
    btn.onclick = ()=>{ cart.splice(Number(btn.dataset.cartidx),1); renderPosSell(main); };
  });

  const completeBtn = document.getElementById('completeSaleBtn');
  if(completeBtn) completeBtn.onclick = async ()=>{
    const customerName = document.getElementById('posCustName').value.trim();
    const customerPhone = document.getElementById('posCustPhone').value.trim();
    completeBtn.disabled = true; completeBtn.textContent = 'جارٍ إتمام البيع...';
    try{
      for(const c of cart){ await adjustInventoryQtyRemote(c.itemId, -c.qty); }
      await refreshInventory();
      const itemsSummary = cart.map(c=>`${c.name} × ${c.qty} (${c.qty*c.price} ج.م)`).join('، ');
      const itemsJson = JSON.stringify(cart.map(c=>({name:c.name, qty:c.qty, price:c.price})));
      const saleRes = await saveSaleRemote(itemsSummary, itemsJson, total, customerName, customerPhone, 'نقدي', total);
      await refreshSales();
      showToast('تمت عملية البيع بنجاح', 'success');
      openSalePrint(saleRes.sale, cart);
      state.cart = [];
      renderPosSell(main);
    }catch(e){ showToast('تعذر إتمام البيع: '+e.message, 'error'); completeBtn.disabled=false; }
  };
}

async function addItemToCart(itemId, qty, main){
  const item = state.inventory.find(x=>x.ID===itemId);
  if(!item) return;
  const existing = state.cart.find(c=>c.itemId===itemId);
  if(existing){ existing.qty += qty; }
  else { state.cart.push({itemId, name:item.Name, qty, price:Number(item.SellPrice||item.PurchasePrice||0), cost:Number(item.PurchasePrice||0)}); }
  renderPosSell(main);
}

function renderFinanceOverview(main){

  },0);
  main.innerHTML = `
    <div class="top-header"><div><h2 class="page-title">💰 النظرة المالية العامة</h2><div class="subtitle">ملخص الإيرادات والمصروفات والمستحقات المتبقية</div></div></div>
    <div class="stat-grid">
      <div class="stat-card green"><div class="num mono">${totalIncomeAllTime.toLocaleString()} ج.م</div><div class="lbl">إجمالي المقبوضات المسجلة</div></div>
      <div class="stat-card red"><div class="num mono">${totalExpAll.toLocaleString()} ج.م</div><div class="lbl">إجمالي المصروفات</div></div>
      <div class="stat-card purple"><div class="num mono">${(totalIncomeAllTime - totalExpAll).toLocaleString()} ج.م</div><div class="lbl">صافي الأرباح العام</div></div>
      <div class="stat-card amber"><div class="num mono">${maintenanceDue.toLocaleString()} ج.م</div><div class="lbl">مستحقات متبقية على إيصالات الصيانة</div></div>
    </div>
  `;
}

function renderFinanceReportPage(main){
  const totalIncome = state.payments.reduce((s,p)=>s+Number(p.Amount||0),0);
  const totalParts = state.receipts.reduce((s,r)=>s+Number(r.partsCost||0),0);
  const totalExp = state.expenses.reduce((s,x)=>s+Number(x.Amount||0),0);
  main.innerHTML = `
    <div class="top-header"><div><h2 class="page-title">📈 تقرير الدخل والأرباح</h2><div class="subtitle">تحليل شامل للمقبوضات، قطع الغيار، المصروفات، وصافي الأرباح</div></div></div>
    <div class="stat-grid">
      <div class="stat-card green"><div class="num mono">${totalIncome.toLocaleString()} ج.م</div><div class="lbl">إجمالي المقبوضات</div></div>
      <div class="stat-card blue"><div class="num mono">${totalParts.toLocaleString()} ج.م</div><div class="lbl">تكلفة قطع الغيار</div></div>
      <div class="stat-card red"><div class="num mono">${totalExp.toLocaleString()} ج.م</div><div class="lbl">المصروفات التشغيلية</div></div>
      <div class="stat-card purple"><div class="num mono">${(totalIncome - totalParts - totalExp).toLocaleString()} ج.م</div><div class="lbl">صافي الربح الفعلي</div></div>
    </div>
  `;
}

function renderBonusPage(main){
  main.innerHTML = `
    <div class="top-header"><div><h2 class="page-title">🎁 مكافآت الفنيين</h2><div class="subtitle">حساب المكافآت المستحقة لكل فني</div></div></div>
    <div class="card">
      <div class="field"><label>اختر الفني</label>
        <select id="bTech"><option value="">-- اختر فني --</option>${state.technicians.map(t=>`<option>${t}</option>`).join('')}</select>
      </div>
      <div id="bonusResult"></div>
    </div>
  `;
  document.getElementById('bTech').onchange = (e)=>{
    const tech = e.target.value;
    const list = state.receipts.filter(r=>r.technician===tech);
    const box = document.getElementById('bonusResult');
    if(!tech || !list.length){ box.innerHTML = '<div class="empty">لا توجد إيصالات منجزة لهذا الفني.</div>'; return; }
    box.innerHTML = `<div class="table-wrap" style="margin-top:12px;"><table><thead><tr><th>الإيصال</th><th>التاريخ</th><th>الجهاز</th><th>الحالة</th><th>المكافأة (ج.م)</th></tr></thead><tbody>
      ${list.map(r=>`<tr><td>${r.receiptNumber}</td><td>${cleanDate(r.date)}</td><td>${r.device.category}</td><td>${r.status}</td><td><input type="number" value="${r.bonus||0}" style="width:80px;" data-bid="${r.id}"></td></tr>`).join('')}
    </tbody></table></div>`;
  };
}

/* ---------------- Settings ---------------- */
function renderSettings(main){
  main.innerHTML = `
    <div class="top-header"><div><h2 class="page-title">⚙️ الإعدادات العامة للشركة</h2><div class="subtitle">تخصيص اسم المحل، اللوجو، الفنيين، والعملاء</div></div></div>
    <div class="card">
      <h3>🏪 اسم الشركة / الورشة</h3>
      <div style="display:flex;gap:10px;">
        <input id="shopNameInput" value="${state.settings.shopName}" style="flex:1;">
        <button class="btn btn-primary" id="saveShopNameBtn">حفظ الاسم</button>
      </div>
    </div>
    <div class="card">
      <h3>🖼️ شعار الشركة (لوجو)</h3>
      <div style="display:flex;gap:10px;align-items:center;">
        <input id="logoUrlInput" value="${state.settings.logoUrl||''}" placeholder="رابط صورة اللوجو (https://...)" style="flex:1;">
        <button class="btn btn-primary" id="saveLogoBtn">حفظ اللوجو</button>
      </div>
      ${state.settings.logoUrl ? `<div style="margin-top:12px;"><img src="${state.settings.logoUrl}" style="max-height:50px;"></div>` : ''}
    </div>
    <div class="card">
      <h3>👨‍🔧 إدارة الفنيين</h3>
      <div class="chip-group" style="margin-bottom:12px;">
        ${state.technicians.map(t=>`<div class="chip sel">${t}</div>`).join('')}
      </div>
      <div style="display:flex;gap:10px;">
        <input id="newTechName" placeholder="اسم فني جديد" style="flex:1;">
        <button class="btn btn-primary btn-sm" id="addNewTechBtn">إضافة فني</button>
      </div>
    </div>
  `;
  document.getElementById('saveShopNameBtn').onclick = async ()=>{
    const v = document.getElementById('shopNameInput').value.trim();
    if(!v) return;
    try{ await saveSettingRemote('shopName', v); state.settings.shopName = v; showToast('تم حفظ اسم المحل بنجاح', 'success'); render(); }
    catch(e){ showToast('تعذر الحفظ: '+e.message, 'error'); }
  };
  document.getElementById('saveLogoBtn').onclick = async ()=>{
    const v = document.getElementById('logoUrlInput').value.trim();
    try{ await saveSettingRemote('logoUrl', v); state.settings.logoUrl = v; showToast('تم حفظ اللوجو بنجاح', 'success'); render(); }
    catch(e){ showToast('تعذر الحفظ: '+e.message, 'error'); }
  };
  document.getElementById('addNewTechBtn').onclick = async ()=>{
    const v = document.getElementById('newTechName').value.trim();
    if(!v) return;
    try{
      await saveTechnicianRemote(v);
      state.technicians.push(v);
      showToast('تمت إضافة الفني بنجاح', 'success');
      renderSettings(main);
    }catch(e){ showToast('تعذر الإضافة: '+e.message, 'error'); }
  };
}

/* ---------------- Login Screen ---------------- */
function loginScreen(){
  return `
  <div class="login-screen">
    <div style="text-align:center;margin-bottom:20px;">
      <div style="width:46px;height:46px;background:linear-gradient(135deg,var(--primary),#38bdf8);border-radius:12px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;">⚡</div>
      <h2 style="margin:0;font-size:19px;font-weight:900;">ميكروERP</h2>
      <div class="subtitle" style="font-size:12px;">تسجيل الدخول للنظام المتكامل</div>
    </div>
    <div class="field"><label>اسم المستخدم</label><input id="loginName" placeholder="ادخل اسم المستخدم" autofocus></div>
    <div class="field"><label>كلمة المرور</label><input id="loginPass" type="password" placeholder="كلمة المرور"></div>
    <button class="btn btn-primary" id="loginBtn" style="width:100%;margin-top:8px;padding:11px;">تسجيل الدخول ➔</button>
    <div id="loginErr" style="color:var(--red);font-size:12px;margin-top:10px;text-align:center;"></div>
  </div>`;
}

function attachLogin(){
  const doLogin = async ()=>{
    const btn = document.getElementById('loginBtn');
    const name = document.getElementById('loginName').value.trim();
    const pass = document.getElementById('loginPass').value;
    const err = document.getElementById('loginErr');
    err.textContent = '';
    if(!name || !pass){ err.textContent = 'أدخل اسم المستخدم وكلمة المرور'; return; }
    btn.textContent = 'جارٍ التحقق...'; btn.disabled = true;
    try{
      const res = await loginRemote(name, pass);
      let sections;
      if(res.role==='admin'){ sections = ['maintenance','cameras','pos','inventory','finance']; }
      else {
        sections = String(res.sections||'').split(',').map(s=>s.trim()).filter(Boolean);
        if(sections.length===0) sections = ['maintenance'];
      }
      state.user = {name: res.name, role: res.role, sections};
      try{ localStorage.setItem('microerp_session', JSON.stringify(state.user)); }catch(e){}
      await init();
    }catch(e){
      err.textContent = 'بيانات الدخول غير صحيحة أو تعذر الاتصال: '+e.message;
      btn.textContent = 'تسجيل الدخول ➔'; btn.disabled = false;
    }
  };
  document.getElementById('loginBtn').onclick = doLogin;
  document.getElementById('loginPass').onkeydown = (e)=>{ if(e.key==='Enter') doLogin(); };
}

(function restoreSession(){
  try{
    const saved = localStorage.getItem('microerp_session');
    if(saved) state.user = JSON.parse(saved);
  }catch(e){}
})();

init();
</script>
